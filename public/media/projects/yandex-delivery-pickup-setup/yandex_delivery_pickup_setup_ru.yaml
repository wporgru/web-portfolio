title: Настройка Яндекс Доставки и ПВЗ в WooCommerce
tagline: "Подключил сторонний модуль доставки и помог разобрать два разных сбоя:
  отсутствие выбора пункта выдачи и неожиданный расчёт стоимости нескольких
  товаров."
year: "08.2024"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Yandex Delivery
  - Pickup points
  - Checkout
blocks:
  - type: text
    title: Задача и ограничения
    body: "Подключил сторонний модуль доставки и помог разобрать два разных сбоя:
      отсутствие выбора пункта выдачи и неожиданный расчёт стоимости нескольких
      товаров."
  - type: text
    title: Как устроено решение
    body: Настроил авторизацию и методы доставки. После первого неудачного теста
      проверил выбор ПВЗ с отключённым VPN. Вместе с клиентом и поддержкой
      разобрал, как параметры оплаты и наложенного платежа меняют расчёт, а для
      курьерской оценки нужен полный адрес.
  - type: text
    title: Результат и проверка
    body: Клиент принял настройку. Подтверждён выбор ПВЗ, а не оформление реального
      отправления или проверка всех курьерских тарифов.
