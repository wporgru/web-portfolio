blocks:
  - type: text
    title: Brief and constraints
    body: Improved phone visibility in the header and separately investigated why
      the supplier file did not produce the expected product attributes.
  - type: text
    title: How it works
    body: Moved the phone number, shared a preview and increased its size after
      feedback. Reviewed the source file, naming and import settings, explained
      the spreadsheet workflow in LibreOffice and separated store-side
      adjustments from corrections needed from the supplier.
