title: "Textili: доработка шапки и диагностика импорта"
tagline: Поправил заметность телефона в шапке и отдельно разобрал, почему файл
  поставщика не даёт нужного результата при загрузке характеристик.
year: "12.2022"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - WordPress
  - LibreOffice
  - Catalog data
blocks:
  - type: text
    title: Задача и ограничения
    body: Поправил заметность телефона в шапке и отдельно разобрал, почему файл
      поставщика не даёт нужного результата при загрузке характеристик.
  - type: text
    title: Как устроено решение
    body: Перенёс телефон, показал промежуточный результат на снимке и увеличил
      шрифт по обратной связи. По каталогу проверил входной файл, названия и
      настройки импорта, объяснил работу с таблицей в LibreOffice и отделил
      исправления в магазине от доработок, которые требовались от поставщика.
  - type: text
    title: Результат и проверка
    body: Клиент оплатил и принял правку и консультацию. Импорт всех характеристик
      не был подтверждён как завершённый.
