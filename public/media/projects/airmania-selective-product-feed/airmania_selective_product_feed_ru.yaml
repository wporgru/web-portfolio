title: "Airmania: выборочная выгрузка и поле модели"
tagline: "Подготовил выгрузку по согласованному списку: в неё должны были
  попадать позиции, выбранные для продвижения, а не весь каталог или только
  физически доступный остаток."
year: "08.2022"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - YML
  - Product feeds
  - Merchandising
blocks:
  - type: text
    title: Задача и ограничения
    body: "Подготовил выгрузку по согласованному списку: в неё должны были попадать
      позиции, выбранные для продвижения, а не весь каталог или только физически
      доступный остаток."
  - type: text
    title: Как устроено решение
    body: Настроил правила отбора, сформировал YML и передал адрес. При уточнении
      формата отделил параметр «Модель» от русского названия типа устройства и
      разобрал пограничные случаи с комплектующими. Доработку поля model
      согласовали отдельно от исходной выгрузки.
  - type: text
    title: Результат и проверка
    body: Клиентка приняла работу. Число предложений и итоговую XML-валидацию архив
      не подтверждает; маркетинговый признак отбора не равен складскому остатку.
