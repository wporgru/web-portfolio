title: "Sport-man: расследование битых партнёрских ссылок"
tagline: Admitad показывал ошибки по двум отключённым программам. Проверил, оставались ли на
  витрине источники этих переходов, прежде чем отключать импорты или переписывать карточки.
year: "10.2026"
role: Технический аудит и аналитика
stack:
  - WooCommerce
  - Admitad
  - WP All Import
  - SQL
blocks:
  - type: text
    title: Зачем искать источник до исправления
    body: Запись в партнёрском отчёте показывает, что конкретная ссылка не сработала. Но прежде
      чем менять каталог, нужно выяснить, выдаёт ли эту ссылку сайт сейчас. Иначе можно
      исправить не ту карточку, сломать действующие ссылки или потерять данные, по которым
      можно расследовать повторение.
  - type: text
    title: Что проверил в WooCommerce и WordPress
    body: "Искал совпадения по идентификаторам двух программ и доменам рекламодателей. Проверил
      адреса товаров и метаданные, тексты и анонсы записей разных статусов, настройки
      WordPress и метаданные категорий. Затем проверил 324 файла: корень сайта, темы,
      обязательные плагины, кэш модуля и файлы WP All Import. Ни в базе, ни в проверенных
      файлах искомых совпадений не было."
  - type: text
    title: Что доказал отчёт — и чего не доказал
    body: В двух строках отчёта реферер был пуст, а журнал обращений за нужную дату не нашёлся по
      проверенным путям. По документации Admitad дата относится к первому ошибочному клику, а
      не к подтверждённой загрузке свежей страницы витрины. Сохранённая ссылка, старая копия
      страницы и внешний источник остались гипотезами, а не выводом.
    links:
      - label: Что означают поля отчёта Admitad
        url: https://support.admitad.ru/article/ru/82.html
  - type: text
    title: Результат для владельца витрины
    body: "Сайт и отчёт не менял: проверка не нашла адреса для замены. Зафиксировал, какие
      источники исключены, и предложил сохранить исходный экспорт, а при повторении сравнить
      реферер, счётчик и дату с журналом сервера. Не переходил по спорным трекинговым URL,
      чтобы не создавать тестовые события в отчёте."
  - type: text
    title: Когда нужен такой аудит
    body: Если партнёрская сеть показывает старую программу или битый deeplink, пришлите домен
      витрины, период и обезличенный фрагмент отчёта. Определю, что воспроизводится сейчас,
      где искать источник и какие предложения действительно требуют исправления.
