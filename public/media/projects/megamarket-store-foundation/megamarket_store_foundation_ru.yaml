title: Подготовка магазина на WoodMart Megamarket с SSL
tagline: Клиенту нужна была основа магазина на собственном домене, которую можно
  показать на согласовании до полноценного запуска и подключения коммерческих
  функций.
year: "09.2025"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - WoodMart
  - DNS
  - SSL
blocks:
  - type: text
    title: Задача и ограничения
    body: Клиенту нужна была основа магазина на собственном домене, которую можно
      показать на согласовании до полноценного запуска и подключения
      коммерческих функций.
  - type: text
    title: Как устроено решение
    body: Начал смену DNS и установил WordPress и WoodMart. После согласования
      заменил ранее обсуждавшееся демо Marketplace на Megamarket. Настроил
      страницу реконструкции с согласованной возможностью просмотра рабочей
      версии и сообщил об установке SSL.
  - type: text
    title: Результат и проверка
    body: Клиент проверил и принял базовый этап. В результате появилась основа для
      развития магазина; платёжные тесты, подписки, LMS и отслеживание доставки
      не входили в подтверждённый объём.
