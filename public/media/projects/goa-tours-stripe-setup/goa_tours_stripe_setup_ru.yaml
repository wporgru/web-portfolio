title: Настройка Stripe для магазина Goa Tours
tagline: Подключил платёжный модуль к действующему WooCommerce. Для запуска
  требовалось развести настройки магазина и действия, которые владелец выполняет
  в собственном аккаунте Stripe.
year: "12.2021"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Stripe
  - Payment setup
blocks:
  - type: text
    title: Задача и ограничения
    body: Подключил платёжный модуль к действующему WooCommerce. Для запуска
      требовалось развести настройки магазина и действия, которые владелец
      выполняет в собственном аккаунте Stripe.
  - type: text
    title: Как устроено решение
    body: Объяснил, какие ключи нужны магазину и почему проверку аккаунта и телефона
      должен завершить владелец. Настроил модуль, показал результат и передал
      заказчику на проверку.
  - type: text
    title: Результат и проверка
    body: Заказчик принял настройку. В истории нет подтверждения успешного
      банковского списания, поэтому кейс показывает подключение, а не
      подтверждённый приём реальных платежей.
