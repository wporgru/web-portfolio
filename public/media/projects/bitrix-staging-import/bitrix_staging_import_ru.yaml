title: Перенос товаров из 1С-Битрикс в тестовый WooCommerce
tagline: При переносе каталога важно не открыть покупателям товары, скрытые в исходной системе.
  Заказчик предоставил CSV и отдельный тестовый WordPress для проверки.
year: '05.2025'
role: Веб-разработка и автоматизация
stack:
- 1C-Bitrix
- WooCommerce
- CSV
blocks:
- type: text
  title: Исходная задача
  body: Клиент подготовил CSV-выгрузку каталога 1С-Битрикс и тестовый WordPress с WooCommerce.
    Нужно было перенести товары на стенд для проверки, не публикуя автоматически позиции, выключенные
    в исходной системе. Перенос дизайна и переключение основного домена оставались за заказчиком.
- type: text
  title: Подготовка и загрузка
  body: 'Уточнил состав полей выгрузки размером около 13 МБ, дождался готовности тестового сайта,
    загрузил товары и передал ссылку для проверки. Сопоставил поле «Активность»: значения N направлялись
    в черновики, а Y — в опубликованные товары.'
- type: text
  title: Почему важны разные статусы
  body: Черновик управляет публикацией карточки, но сам по себе не означает нулевой остаток. Разъяснил
    заказчику это различие, чтобы не смешивать скрытие товара с учётом наличия и не открывать
    на витрине отключённые позиции.
- type: text
  title: Результат и ограничения
  body: 'Заказчик принял работу и оставил положительный отзыв. Это импорт на подготовленный стенд,
    не полный переезд сайта: число товаров и полнота полей отдельно не пересчитаны, а поадресное
    сохранение URL и редиректы не проверены. Потери или сохранение поискового трафика этим этапом
    не измерялись.'
