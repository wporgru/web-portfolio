title: Перенос товаров из 1С-Битрикс в тестовый WooCommerce
tagline: При переносе каталога важно не открыть покупателям товары, скрытые в
  исходной системе. Заказчик предоставил CSV и отдельный тестовый WordPress для
  проверки.
year: "05.2025"
role: Веб-разработка и автоматизация
stack:
  - 1C-Bitrix
  - WooCommerce
  - CSV
blocks:
  - type: text
    title: Задача и ограничения
    body: При переносе каталога важно не открыть покупателям товары, скрытые в
      исходной системе. Заказчик предоставил CSV и отдельный тестовый WordPress
      для проверки.
  - type: text
    title: Как устроено решение
    body: "Уточнил поля выгрузки объёмом около 13 МБ, дождался готовности стенда и
      загрузил товары. Сопоставил «Активность»: N отправляется в черновики, Y
      публикуется. Отдельно объяснил, почему статус черновика не означает
      нулевой остаток: это разные правила видимости и наличия."
  - type: text
    title: Результат и проверка
    body: Заказчик получил ссылку на стенд и принял импорт. Это тестовый перенос
      товарных данных, а не переключение основного сайта, миграция URL или
      настройка редиректов.
