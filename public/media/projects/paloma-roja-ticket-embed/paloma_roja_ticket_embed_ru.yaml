title: "Paloma Roja: билетный модуль для сайта фестиваля"
tagline: Фестивалю нужен отдельный путь к покупке билета через готовый модуль
  «Единое ПОЛЕ». Форма для заявок танцоров должна была остаться самостоятельной.
role: Веб-разработка
year: "03.2018"
stack:
  - WordPress
  - JavaScript
  - Third-party widgets
blocks:
  - type: text
    title: Задача
    body: Фестивалю нужен отдельный путь к покупке билета через готовый модуль
      «Единое ПОЛЕ». Форма для заявок танцоров должна была остаться
      самостоятельной.
  - type: text
    title: Что сделано
    body: Восстановил исходную форму танцоров, вынес билетный модуль на страницу
      покупки и сохранил оба сценария раздельными. Заказчик принял работу.
  - type: text
    title: Как решалась задача
    body: "Первое подключение заняло кнопку заявки, предназначенную для участников.
      Исправил привязку: вернул заявке её исходное назначение и подключил
      готовый скрипт поставщика на отдельной странице покупки вместо схемы.
      Вопрос о нескольких мероприятиях требовал настройки со стороны поставщика.
      Здесь не создавал собственную билетную систему; эквайринг, второе событие
      и контрольная продажа не подтверждены. Снимок ниже сделан в октябре 2026
      года и показывает более поздний вид сайта, а не модуль 2018 года."
  - type: image
    title: Публичный вид сайта
    src: /media/projects/paloma-roja-ticket-embed/site.png
    alt: Публичная версия сайта проекта
    caption: Снимок на дату проверки. Он показывает публичную версию сайта, а не
      обязательно вид на момент сдачи.
