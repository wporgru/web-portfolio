title: Русские формы числительных в каталоге WoodMart
tagline: При разных количествах товаров подпись в каталоге отображалась
  непоследовательно. Нужно было исправить перевод, а не менять тему ради одной
  строки.
year: "03.2025"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WoodMart
  - Localization
blocks:
  - type: text
    title: Задача и ограничения
    body: При разных количествах товаров подпись в каталоге отображалась
      непоследовательно. Нужно было исправить перевод, а не менять тему ради
      одной строки.
  - type: text
    title: Как устроено решение
    body: Проверил настройки темы и перевод. Первая правка не закрыла все случаи,
      поэтому сопоставил отображение для чисел 21, 22 и 25. Выяснил, что одна
      форма была заполнена, а другие отсутствовали, и дополнил нужные варианты.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил корректное отображение и принял заказ. Результат
      касается конкретной подписи и обсуждавшихся форм, а не полной локализации
      WoodMart.
