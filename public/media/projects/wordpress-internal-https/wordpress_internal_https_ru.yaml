title: Исправление внутренних HTTP-ссылок в WordPress
tagline: Страницы открывались по HTTPS, но внутренние ссылки вели на
  HTTP-адреса. Требовалось исправить переходы в существующем сайте, а не
  заказывать новую витрину или переносить домен.
year: "09.2020"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - HTTPS
  - Internal links
blocks:
  - type: text
    title: Задача и ограничения
    body: Страницы открывались по HTTPS, но внутренние ссылки вели на HTTP-адреса.
      Требовалось исправить переходы в существующем сайте, а не заказывать новую
      витрину или переносить домен.
  - type: text
    title: Как устроено решение
    body: "Уточнил целевой сайт и характер ошибки, исправил внутренние адреса и
      передал работу заказчице для проверки. Сфокусировался на ссылках из
      задания: смена хостинга, установка сертификата и полная миграция сайта не
      требовались в рамках подтверждённого объёма."
  - type: text
    title: Результат и проверка
    body: Заказчица проверила результат, приняла работу и отметила качество и
      скорость в отзыве. Точный технический способ замены и повторный обход всех
      URL не зафиксированы.
