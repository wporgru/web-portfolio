title: "Fisher Fish: импорт рыболовного каталога и категорий"
tagline: Перенести выбранные товары четырёх брендов из каталога поставщика,
  сохранив понятную структуру для выбора модели и цвета.
role: Веб-разработка
year: "02.2018"
stack:
  - WooCommerce
  - CSV
  - Product data
blocks:
  - type: text
    title: Задача
    body: Перенести выбранные товары четырёх брендов из каталога поставщика,
      сохранив понятную структуру для выбора модели и цвета.
  - type: text
    title: Что сделано
    body: По отчёту этапа добавлено 1 941 товар, после исправлений обновлены 147
      подкатегорий. Заказчик принял работу.
  - type: text
    title: Как решалась задача
    body: "Из 2 105 исходных строк исключались позиции без цены или изображения.
      Первая загрузка выявила проблемы иерархии, ссылок атрибутов и цветов.
      Вместе с заказчиком выбрали отдельные товары цветов внутри модельной
      подкатегории вместо вариативной карточки: пример и цвет в корзине были
      согласованы. Я доработал структуру, описания и очистку служебного _x000D_;
      повторные описания обрабатывались после перехода с Excel на CSV. Финальный
      лог сообщал об обновлении 147 категорий без создания и удаления. Часть
      фотографий и латинские ярлыки атрибутов исправил сам заказчик. Количества
      приведены по историческому отчёту, не по независимому пересчёту;
      корректность всех фото и откат WooCommerce не подтверждены."
