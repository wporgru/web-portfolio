title: "«Таро Практик»: шаблон блога с рубриками"
tagline: "Заказчику нужна была основа для самостоятельной публикации статей:
  общая лента на главной, страницы рубрик и понятное редактирование метаданных.
  Тексты и наполнение оставались на стороне клиента."
year: "01.2024"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Editorial workflow
  - Categories
  - On-page SEO
blocks:
  - type: text
    title: Задача и ограничения
    body: "Заказчику нужна была основа для самостоятельной публикации статей: общая
      лента на главной, страницы рубрик и понятное редактирование метаданных.
      Тексты и наполнение оставались на стороне клиента."
  - type: text
    title: Как устроено решение
    body: Собрал информационный сайт на готовой теме. Объяснил разницу между
      рубриками и метками, как выводятся материалы в общей ленте и на отдельных
      страницах рубрик. Показал редактирование Title и Description у записи,
      предложил единый формат обложек и передал запись экрана. До замены
      тестовых материалов оставил индексацию закрытой и объяснил порядок её
      включения.
  - type: text
    title: Результат и проверка
    body: Клиент принял шаблон и получил основу, которую мог наполнять сам. Архивный
      экран показывает сетку статей, рубрики и места под рекламу. Написание
      материалов, запуск рекламы и фактическая индексация в подтверждённый
      результат не входят.
  - type: text
    title: Фрагмент витрины из архива проекта
    links:
      - label: Оригинал в портфолио Kwork
        url: https://kwork.ru/portfolio/11843733
  - type: image
    src: /media/projects/taro-praktik-editorial-wordpress/archive-storefront.webp
    alt: Сетка статей «Таро Практик» и боковая колонка с рубриками
    caption: Архивный фрагмент 1400 × 1076 из карточки от 21 января 2024 года.
      Снимок показывает шаблон с тестовыми публикациями и зарезервированными
      местами под рекламу, а не наполнение или запуск монетизации.
