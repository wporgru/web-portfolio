title: Замена Shiptor на SafeRoute в WooCommerce
tagline: Перенастроил доставку существующего магазина на SafeRoute, чтобы
  покупатель снова мог выбрать способ получения в виджете оформления.
year: "01.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Shiptor
  - SafeRoute
  - Shipping
blocks:
  - type: text
    title: Почему понадобилась замена Shiptor
    body: >-
      Клиент рассматривал отдельные плагины перевозчиков, но выбрал SafeRoute с единым кабинетом и договором агрегатора. Задача заключалась в подключении нового виджета к действующему checkout WooCommerce, а не в перестройке магазина.
  - type: text
    title: Восстановил сайт и доработал виджет
    body: >-
      После сбоя восстановил работу сайта и проверил появление нового блока доставки. По обратной связи изменил отображение и убрал лишнюю строку. Клиент принял работу и отметил, что настройка плагина учитывала его запросы.
  - type: text
    title: Отдельно перенастроил порог бесплатной доставки
    body: >-
      Для заказов от 5 000 ₽ настраивал условие по сумме заказа и фиксированную стоимость доставки 0 ₽. После сообщения клиента о несрабатывании перенастроил правило ещё раз. Итоговый успешный тест этого условия не подтверждён.
  - type: text
    title: Что было принято, а что требовало отдельной проверки
    body: >-
      Приёмка подтверждает этап подключения и настройки интерфейса. Она не заменяет проверку тарифов и порога на тестовых заказах, подтверждение подписания договора или фактическую отправку. Таких подтверждений в архиве нет.
