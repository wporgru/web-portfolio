title: Замена Shiptor на SafeRoute в WooCommerce
tagline: Перенастроил доставку существующего магазина на SafeRoute, чтобы
  покупатель снова мог выбрать способ получения в виджете оформления.
year: "01.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Shiptor
  - SafeRoute
  - Shipping
blocks:
  - type: text
    title: Задача и ограничения
    body: Перенастроил доставку существующего магазина на SafeRoute, чтобы
      покупатель снова мог выбрать способ получения в виджете оформления.
  - type: text
    title: Как устроено решение
    body: Восстановил работу сайта после сбоя и проверил появление виджета. По
      обратной связи убрал лишнюю строку и доработал внешний вид блока. Отдельно
      перенастраивал бесплатную доставку через условия суммы заказа и
      фиксированную стоимость 0.
  - type: text
    title: Результат и проверка
    body: Клиент принял настройку виджета. Окончательный успешный тест бесплатной
      доставки, подписание договора и реальное отправление в архиве не
      подтверждены.
