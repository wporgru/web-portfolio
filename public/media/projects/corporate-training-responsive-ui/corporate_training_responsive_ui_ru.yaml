title: "Сайт корпоративного обучения: шапка, команда и форма"
tagline: "Доработать существующий сайт учебного центра: контакты, меню, блок
  команды и форму заявки на разных ширинах."
role: Веб-разработка
year: "03.2018"
stack:
  - Responsive design
  - Website UI
  - Forms
blocks:
  - type: text
    title: Задача
    body: "Доработать существующий сайт учебного центра: контакты, меню, блок
      команды и форму заявки на разных ширинах."
  - type: text
    title: Что сделано
    body: Увеличил контакты, поправил мобильные отступы и наложение формы, добавил
      подписи команды и переработал блок заявки.
  - type: text
    title: Как решалась задача
    body: Уточнил отображение шапки и подвала на экранах уже 1280 px, сделал
      контакты заметнее и добавил подписи сотрудников. Сократил форму, убрав
      поле темы, и устранил наложение блока на текст на мобильном.
      Первоначальная обработка фона иллюстрации не удалась, поэтому переработал
      блок заявки; клиенту понравился итоговый вариант. Заказ закрылся
      автоматически, позднее получен положительный отзыв. Все устройства и
      фактическая доставка заявки не проверены, домен в сохранённых материалах
      не установлен.
