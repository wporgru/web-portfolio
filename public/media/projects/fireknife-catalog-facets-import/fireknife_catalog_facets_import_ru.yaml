title: "Fireknife: перенос ножей и подготовка фильтров"
tagline: Перенёс выбранные ножи в WooCommerce. У разных моделей отличались
  характеристики, поэтому прямой импорт не давал единообразных карточек и
  фильтра по длине клинка.
year: "11.2021"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Product attributes
  - Catalog migration
  - CSV
blocks:
  - type: text
    title: Задача и ограничения
    body: Перенёс выбранные ножи в WooCommerce. У разных моделей отличались
      характеристики, поэтому прямой импорт не давал единообразных карточек и
      фильтра по длине клинка.
  - type: text
    title: Как устроено решение
    body: Пересогласовал модели и категории, подготовил таблицу вручную и обновил
      инструменты импорта и транслитерации. На десяти тестовых товарах перевёл
      длину клинка из индивидуального поля в глобальный атрибут. После настройки
      структуры и хлебных крошек запустил основной импорт.
  - type: text
    title: Результат и проверка
    body: Клиент проверил каталог и принял заказ. Десять товаров — тестовая партия,
      не итоговое число импортированных карточек.
