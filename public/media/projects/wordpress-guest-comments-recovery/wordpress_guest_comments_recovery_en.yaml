title: Restoring WordPress comments for logged-out visitors
tagline: Restored the comments section for logged-out readers. The issue first
  looked mobile-specific but also affected desktop visitors who were not signed
  in.
year: "01.2024"
role: Web development and automation
stack:
  - WordPress
  - Comments
  - Guest QA
  - Mobile QA
blocks:
  - type: text
    title: Brief and constraints
    body: Restored the comments section for logged-out readers. The issue first
      looked mobile-specific but also affected desktop visitors who were not
      signed in.
  - type: text
    title: How it works
    body: "Separated screen size from login state: the key scenario was a logged-out
      visit, not merely a mobile layout. Demonstrated the restored section and
      its mobile appearance and explained which setting had to remain enabled
      for the comments extension."
  - type: text
    title: Result and verification
    body: The client confirmed the fix and accepted the work. The exact setting name
      was not preserved, so the case does not attribute the issue to caching or
      a specific plugin without evidence.
