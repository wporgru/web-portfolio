title: Возврат комментариев для гостей WordPress
tagline: Восстановил блок комментариев для незарегистрированных читателей.
  Сначала сбой выглядел как мобильный, но без авторизации проявлялся и на
  компьютере.
year: "01.2024"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Comments
  - Guest QA
  - Mobile QA
blocks:
  - type: text
    title: Задача и ограничения
    body: Восстановил блок комментариев для незарегистрированных читателей. Сначала
      сбой выглядел как мобильный, но без авторизации проявлялся и на
      компьютере.
  - type: text
    title: Как устроено решение
    body: "Отделил размер экрана от состояния входа: проверять нужно было именно
      гостевой сценарий, а не только мобильную вёрстку. Показал исправленное
      отображение, отдельно продемонстрировал мобильный вариант и объяснил,
      какую настройку не следует отключать, чтобы используемый модуль
      комментариев продолжал работать."
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил восстановление и принял работу. Точное название
      настройки в архиве не сохранилось; кейс не приписывает сбой кэшу или
      конкретному плагину без подтверждения.
