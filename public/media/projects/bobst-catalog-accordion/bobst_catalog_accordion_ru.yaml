title: "BOB-ST: плитки каталога и меню-аккордеон"
tagline: Переработал каталог BOB-ST так, чтобы разделы были доступны и через
  плитки на главной, и через раскрывающееся боковое меню.
year: "12.2022"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Visual Composer
  - Catalog UX
  - CSS
blocks:
  - type: text
    title: Задача и ограничения
    body: Переработал каталог BOB-ST так, чтобы разделы были доступны и через плитки
      на главной, и через раскрывающееся боковое меню.
  - type: text
    title: Как устроено решение
    body: "Доработал меню-аккордеон, порядок разделов и плитки с изображениями 300 ×
      300. Передал пояснения по клонированию плиток и пошагово разобрал
      добавление категории: создание раздела, привязку товаров и вывод в обеих
      точках навигации. При сдаче также сообщил о работах по ускорению."
  - type: text
    title: Результат и проверка
    body: Владелец положительно оценил оформление и оставил отзыв. Замены Visual
      Composer и числового выигрыша производительности в кейсе не заявляю.
