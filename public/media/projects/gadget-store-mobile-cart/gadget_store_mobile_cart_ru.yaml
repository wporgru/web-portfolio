title: Мобильное меню и корзина магазина гаджетов
tagline: Магазину требовалось развести товарные группы в меню и подвале, а на
  телефонах убрать лишний отступ и вернуть удобный доступ к корзине.
year: "07.2025"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - WoodMart
  - Mobile layout
blocks:
  - type: text
    title: Задача и ограничения
    body: Магазину требовалось развести товарные группы в меню и подвале, а на
      телефонах убрать лишний отступ и вернуть удобный доступ к корзине.
  - type: text
    title: Как устроено решение
    body: Пересобрал пункты шапки и сгруппировал ссылки подвала по линейкам
      гаджетов. После уточнения переделал нужную область, подготовил графический
      элемент и запросил SVG для оставшихся размытыми значков. На следующей
      итерации исправил мобильный отступ, меню и корзину, затем вернулся к
      закреплению шапки.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил готовность и принял заказ. Полную проверку чекаута и
      исправление всех растровых значков без исходников не приписываю этому
      этапу.
