title: "SMD: сайт услуг на WordPress из материалов Wix"
tagline: Нужна отдельная витрина сервисной компании на WordPress. Из Wix
  следовало взять материалы о направлениях работы и блог, но не переносить
  магазин. Услуги, сведения о компании и контакты должны были быть доступны по
  отдельным разделам.
year: "03.2021"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Wix
  - WoodMart
  - Content migration
blocks:
  - type: text
    title: Задача и ограничения
    body: Нужна отдельная витрина сервисной компании на WordPress. Из Wix следовало
      взять материалы о направлениях работы и блог, но не переносить магазин.
      Услуги, сведения о компании и контакты должны были быть доступны по
      отдельным разделам.
  - type: text
    title: Как устроено решение
    body: "Разобрал, какие материалы брать из каждого источника: услуги и блог — из
      Wix, сведения о компании и контакты — из согласованного сайта клиента.
      Собрал витрину на WoodMart: услуги, раздел о компании, блог и контакты,
      без Shop. Адаптировал ширину контента и поиска, добавил границы тёмным
      карточкам и настроил закреплённую шапку."
  - type: text
    title: Результат и проверка
    body: "Клиент принял работу. Перенос на dme.kz отложили отдельно: витрина SMD и
      опубликованный англоязычный сайт DME не считаются одной сдачей. Исходные
      48 страниц и статей и 21 товар — результат разбора Wix-источника, а не
      итоговый объём сайта. Полный пересчёт перенесённых материалов и SEO-аудит
      не подтверждены."
  - type: text
    title: Связанный проект
    links:
      - label: "Отдельный проект: англоязычный сайт DME"
        url: /showcase/dme-english-service-site/
