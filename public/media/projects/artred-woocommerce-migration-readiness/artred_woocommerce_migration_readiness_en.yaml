  - type: text
    title: What the evidence supports
    body: The milestone compared 107 URLs on each version and found no missing headings, links
      or videos in 43 checked articles. A separate desktop and mobile check was saved
      after publication. These results document technical verification, not retention of
      search rankings or the absence of errors in every order and integration.
