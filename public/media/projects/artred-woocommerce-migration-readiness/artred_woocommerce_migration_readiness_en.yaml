title: "ARTRED: preparing a WooCommerce site replacement"
tagline: "Prepared a replacement website for a scrubber-dryer manufacturer. The migration
  had to preserve more than the design: catalog and article access, embedded videos and
  links, and protection against premature indexing of the staging site."
year: 08–09.2026
role: Web development and automation
stack:
  - WordPress
  - WooCommerce
  - GeneratePress
  - Bash
  - SEO migration
blocks:
  - type: text
    title: "The brief: replace the site without losing working URLs"
    body: A manufacturer’s website migration is more than a visual redesign. Catalog pages,
      articles, videos and existing links need to remain available after the domain
      switch, while staging must not be indexed prematurely. I separated staging
      preparation, URL checks, cutover and production verification.
  - type: text
    title: Comparing the catalog and content
    body: At the verification milestone I compared 107 sitemap URLs on each version. I
      separately checked the structure of 43 articles for headings, links and videos, and
      reviewed product-category routes and internal links. Template issues discovered
      later were tracked separately rather than being hidden behind an earlier successful
      run.
  - type: text
    title: Performance without removing store functionality
    body: "I scoped WooCommerce script loading to the routes that needed it: shop, product,
      cart and checkout. The scripts were absent from the homepage and informational
      pages. I separately checked key interface elements and mobile navigation. This
      change did not mean disabling payment or catalog flows."
  - type: text
    title: A cutover with checks and a rollback path
    body: "I prepared cutover instructions and scripts with environment checks and explicit
      confirmation. Two negative tests stopped the script: when confirmation was missing
      and while the domain still pointed to the old directory. The process included a
      rollback plan and separate production checks; staging indexability was checked
      before the switch."
