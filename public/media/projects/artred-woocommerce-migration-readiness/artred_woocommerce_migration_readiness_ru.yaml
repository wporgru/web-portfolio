title: "ARTRED: подготовка WooCommerce к смене сайта"
tagline: "Подготовил обновлённую версию сайта производителя поломоечных машин к
  переключению домена. Нужно было перенести не только оформление: сохранить доступность
  каталога и статей, не потерять видео и ссылки и не открыть тестовую копию для индексации
  раньше времени."
year: 08–09.2026
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - GeneratePress
  - Bash
  - SEO migration
blocks:
  - type: text
    title: "Задача: заменить сайт, не потеряв работающие адреса"
    body: При обновлении сайта производителя важно не только перенести дизайн. Каталог,
      статьи, видео и действующие ссылки должны продолжить работать после переключения
      домена, а тестовая копия не должна преждевременно попасть в поиск. Заранее разделил
      подготовку стенда, контроль адресов, переключение и проверку опубликованной версии.
  - type: text
    title: Сверка каталога и материалов
    body: "На контрольном этапе сравнил по 107 URL из карт старой и тестовой версии. Для 43
      статей отдельно проверил структуру: заголовки, ссылки и видео. Сверил маршруты
      товарных категорий и внутренние ссылки. Позднее найденные проблемы шаблонов
      учитывались отдельно и не исчезали из отчёта только потому, что ранний прогон
      прошёл."
  - type: text
    title: Производительность без потери функций магазина
    body: "Ограничил загрузку WooCommerce-скриптов теми маршрутами, где они нужны: магазином,
      товарами, корзиной и оформлением. На главной и информационных страницах они не
      загружались. Отдельно проверил основные элементы интерфейса и мобильное меню. Это
      изменение не означает отключение платёжных или товарных сценариев."
  - type: text
    title: Переключение с проверками и возможностью возврата
    body: "Подготовил инструкцию и скрипты переключения с проверкой окружения и явным
      подтверждением. В двух отрицательных сценариях скрипт отказался продолжать: без
      подтверждения и пока домен указывал на прежнюю директорию. Для переноса предусмотрел
      план возврата и отдельные проверки после публикации; до боевого переключения
      проверялась и закрытость стенда от индексации."
  - type: image
    src: /media/projects/metform-replacement/later-homepage.webp
    title: Главная после запуска
    alt: Полностраничный снимок сайта ARTRED
    caption: Публичная версия от 25 октября 2026 года, без обрезки. Снимок показывает более
      поздний вид; оформление заказа и позиции в поиске им не проверяются.
  - type: image
    src: /media/projects/artred-woocommerce-migration-readiness/archive-viewport.webp
    alt: Главная ARTRED после переключения, архивный вид в браузере
    caption: Сохранённый десктопный вид главной на основном домене от 7 сентября 2026 года.
      Снимок области окна 1440 × 1000, не всей страницы.
  - type: text
    title: Другой этап этого проекта
    links:
      - label: "Связанная работа: каталог техники и консультации"
        url: /showcase/artred-b2b-equipment-catalog/
  - type: text
    title: Что подтверждают проверки
    body: В контрольном прогоне сравнивались 107 URL каждой версии, а в 43 статьях не
      обнаружено потери заголовков, ссылок и видео. После публикации сохранена отдельная
      проверка основного домена на компьютере и телефоне. Эти результаты показывают
      проведённые технические проверки, но не доказывают сохранение поисковых позиций или
      отсутствие ошибок во всех заказах и интеграциях.
