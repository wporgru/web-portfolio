title: "ARTRED: подготовка WooCommerce к смене сайта"
tagline: "Подготовил обновлённую версию сайта производителя поломоечных машин к
  переключению домена. Нужно было перенести не только оформление: сохранить
  доступность каталога и статей, не потерять видео и ссылки и не открыть
  тестовую копию для индексации раньше времени."
year: 08–09.2026
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - GeneratePress
  - Bash
  - SEO migration
blocks:
  - type: text
    title: Задача и ограничения
    body: "Подготовил обновлённую версию сайта производителя поломоечных машин к
      переключению домена. Нужно было перенести не только оформление: сохранить
      доступность каталога и статей, не потерять видео и ссылки и не открыть
      тестовую копию для индексации раньше времени."
  - type: text
    title: Как устроено решение
    body: "Сверил адреса из карт сайта и внутренние ссылки, проверил старые маршруты
      товарных категорий и сравнил структуру 43 статей. Отдельно ограничил
      загрузку WooCommerce-скриптов: они нужны в магазине, но не на главной и
      информационных страницах. Подготовил процедуру переключения с проверкой
      окружения, явным подтверждением и планом возврата. В двух контрольных
      сценариях скрипт отказался продолжать, когда подтверждения не было или
      домен ещё указывал на прежний каталог."
  - type: text
    title: Результат и проверка
    body: В контрольном прогоне 25 августа сравнил по 107 URL старого сайта и
      тестовой копии; проверка структуры 43 статей не нашла потерь заголовков,
      ссылок и видео. Перед переключением продолжал находить и отделять
      отдельные проблемы шаблонов от результатов раннего прогона. После
      публикации сохранил отдельную проверку production на мобильном и десктопе.
      Эти проверки не подтверждают сохранение позиций в выдаче.
  - type: image
    src: /media/projects/artred-woocommerce-migration-readiness/archive-viewport.webp
