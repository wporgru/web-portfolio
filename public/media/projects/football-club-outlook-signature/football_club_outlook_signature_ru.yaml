title: HTML-подпись Outlook для футбольного клуба
tagline: Собрал фирменную HTML-подпись по логотипу и эскизу заказчика,
  подготовил иконки из переданных изображений и передал вариант для Outlook.
year: "11.2023"
role: Вёрстка почтовых интерфейсов
stack:
  - HTML
  - CSS
  - Outlook
blocks:
  - type: text
    title: Задача
    body: Нужна была подпись с именем, должностью, email, сайтом и социальными
      ссылками. Логотип и эскиз предоставил заказчик.
  - type: text
    title: Что сделал
    body: Подготовил иконки из переданных материалов и сверстал подпись в
      согласованном оформлении с тёмно-синим цветом и Open Sans Condensed.
      Передал готовый вариант.
  - type: text
    title: Приёмка
    body: Клиент принял работу до полного самостоятельного тестирования. Отдельная
      проверка Outlook на macOS и iOS не проводилась; единый вид во всех
      клиентах не подтверждён.
