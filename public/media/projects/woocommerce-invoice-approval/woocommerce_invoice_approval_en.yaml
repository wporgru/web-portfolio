title: Automatic WooCommerce invoices and order approval
tagline: "Set up WooCommerce invoicing and explained the next step to customers:
  an order still needed manager approval rather than being treated as paid."
year: "11.2023"
role: Web development and automation
stack:
  - WooCommerce
  - PDF invoices
  - QR
  - Transactional email
blocks:
  - type: text
    title: Brief and constraints
    body: "Set up WooCommerce invoicing and explained the next step to customers: an
      order still needed manager approval rather than being treated as paid."
  - type: text
    title: How it works
    body: Prepared the invoice, corrected the customer address and showed where to
      edit the approval instructions. Explained the built-in account page as an
      alternative to a separate registration extension. Used a static QR code,
      with the amount entered by the invoice recipient rather than generated by
      the store.
  - type: text
    title: Result and verification
    body: The client accepted the setup. Per-invoice dynamic QR codes and automatic
      bank reconciliation were not part of the verified delivery.
