title: Автоматический счёт и согласование заказа
tagline: "Настроил выставление счёта из WooCommerce и пояснения для покупателя:
  после оформления заказ нужно согласовать с менеджером, а не считать
  оплаченным."
year: "11.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - PDF invoices
  - QR
  - Transactional email
blocks:
  - type: text
    title: Задача и ограничения
    body: "Настроил выставление счёта из WooCommerce и пояснения для покупателя:
      после оформления заказ нужно согласовать с менеджером, а не считать
      оплаченным."
  - type: text
    title: Как устроено решение
    body: "Подготовил счёт, поправил адрес заказчика и показал, где редактировать
      сообщение о согласовании. Вместо отдельного регистрационного расширения
      объяснил использование штатной страницы кабинета. В счёте использовал
      статический QR: сумму вводит получатель счёта, а не генерирует магазин."
  - type: text
    title: Результат и проверка
    body: Клиент принял работу. Динамические QR-коды и автоматическая сверка
      поступлений не входили в подтверждённую настройку.
