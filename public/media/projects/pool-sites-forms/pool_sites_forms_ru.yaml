title: Доработка форм и интерфейса сети бассейновых сайтов
tagline: На нескольких связанных сайтах требовалось привести в порядок заявки,
  шапку и уведомления, не меняя редакционные и юридические материалы клиента.
year: "06.2025"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - HTML
  - CSS
  - Forms
blocks:
  - type: text
    title: Задача и ограничения
    body: На нескольких связанных сайтах требовалось привести в порядок заявки,
      шапку и уведомления, не меняя редакционные и юридические материалы
      клиента.
  - type: text
    title: Как устроено решение
    body: Разобрал сбой оформления, связанный с незакрытой разметкой в виджете
      шапки. Переработал формы, добавил форму на главную одного из сайтов и
      продолжил исправления после сообщений о потерянных заявках и невидимых
      полях. Отдельно настроил уведомления и отключение комментариев по
      согласованию.
  - type: text
    title: Результат и проверка
    body: После повторной клиентской проверки заказчик подтвердил, что заявки
      приходят и поля отображаются нормально. Подготовка юридических текстов и
      независимая проверка всех форм сети в результат не входят.
