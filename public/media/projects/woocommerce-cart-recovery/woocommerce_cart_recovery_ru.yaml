title: Восстановление корзины и чекаута WooCommerce
tagline: Когда перестали работать корзина и оформление, задачей было вернуть
  путь к заказу. Обновление дизайна обсуждалось отдельно и не должно было
  задерживать ремонт.
year: "02.2024"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Checkout
  - Troubleshooting
blocks:
  - type: text
    title: Задача и ограничения
    body: Когда перестали работать корзина и оформление, задачей было вернуть путь к
      заказу. Обновление дизайна обсуждалось отдельно и не должно было
      задерживать ремонт.
  - type: text
    title: Как устроено решение
    body: Осмотрел проблемный сценарий, сохранил прежние фрагменты кода для
      возможного возврата и передал исправленный функционал на проверку.
      Отдельно обозначил, какие вопросы относятся к внешнему виду, чтобы не
      смешивать их с восстановлением работы.
  - type: text
    title: Результат и проверка
    body: Клиент оформил заказ после ремонта и принял результат. Это восстановление
      корзины и оформления, не подтверждение реального списания денег, полный
      резервный архив или новый дизайн.
