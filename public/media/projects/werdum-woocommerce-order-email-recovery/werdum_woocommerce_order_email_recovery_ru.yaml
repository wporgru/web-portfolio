title: "Werdum: восстановление писем о заказах WooCommerce"
tagline: "После оформления заказа уведомления не получали ни покупатель, ни
  владелец магазина. Клиент повторил проверку с разными почтовыми адресами.
  Нужно было вернуть оба канала: подтверждение покупки для клиента и сигнал о
  новом заказе для менеджера."
year: "08.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Order notifications
  - Email troubleshooting
blocks:
  - type: text
    title: Задача и ограничения
    body: "После оформления заказа уведомления не получали ни покупатель, ни
      владелец магазина. Клиент повторил проверку с разными почтовыми адресами.
      Нужно было вернуть оба канала: подтверждение покупки для клиента и сигнал
      о новом заказе для менеджера."
  - type: text
    title: Как устроено решение
    body: Восстановил уведомления и передал результат на проверку владельцу
      магазина. В сохранённой переписке остались жалоба, подтверждение после
      правки и приёмка. Техническое вложение недоступно, поэтому нельзя назвать
      конкретный SMTP-плагин, почтового провайдера или причину ошибки.
  - type: text
    title: Результат и проверка
    body: После проверки клиент подтвердил, что уведомления заработали, и принял
      заказ. Это подтверждение клиента по выполненному ремонту, не независимый
      тест по всем почтовым сервисам или текущая проверка доставки писем.
