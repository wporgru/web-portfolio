title: Ремонт корзины WooCommerce и подключение ПВЗ
tagline: "Восстановил покупку в действующем магазине: корзина не должна падать
  при добавлении товара, а покупателю нужен выбор пункта выдачи с расчётом
  доставки."
year: "12.2022"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - CDEK
  - Pickup points
  - Transactional email
blocks:
  - type: text
    title: Задача и ограничения
    body: "Восстановил покупку в действующем магазине: корзина не должна падать при
      добавлении товара, а покупателю нужен выбор пункта выдачи с расчётом
      доставки."
  - type: text
    title: Как устроено решение
    body: Исправил сбой при добавлении товара, доработал всплывающую корзину и
      сохранил существующие кнопки. На компьютере ограничил ширину кнопки
      покупки и поправил отступы. Подключил расчёт СДЭК и выбор ПВЗ, заменил
      ссылку у согласия на страницу политики конфиденциальности и проверил
      прохождение заказа и получение письма на временный адрес.
  - type: text
    title: Результат и проверка
    body: Клиент проверил результат и принял работу. Тест подтверждает прохождение
      заказа и уведомление, но не реальную отправку или сверку всех тарифов.
