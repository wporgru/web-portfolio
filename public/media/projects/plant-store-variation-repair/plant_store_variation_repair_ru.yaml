title: Ремонт вариаций и регистрации магазина растений
tagline: В магазине растений перестало нормально работать редактирование
  вариативных товаров. Отдельно клиент столкнулся с ботами при регистрации и
  ограничением исходящей почты на хостинге.
year: "01.2024"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - PHP
  - CAPTCHA
blocks:
  - type: text
    title: Задача и ограничения
    body: В магазине растений перестало нормально работать редактирование
      вариативных товаров. Отдельно клиент столкнулся с ботами при регистрации и
      ограничением исходящей почты на хостинге.
  - type: text
    title: Как устроено решение
    body: Разобрал совместимость окружения и уточнил наличие резервных копий перед
      обновлениями. Показал изменение цены конкретной вариации и установленный
      логотип. После запроса клиента добавил CAPTCHA в регистрацию, чтобы
      проверка проходила до создания учётной записи.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил работу редактирования и принял защиту регистрации.
      Восстановление отправки почты хостингом и эффективность CAPTCHA под
      нагрузкой отдельно не подтверждены.
