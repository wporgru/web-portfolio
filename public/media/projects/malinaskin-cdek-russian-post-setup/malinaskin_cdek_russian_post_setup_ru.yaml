title: "Malinaskin: подключение СДЭК и Почты России"
tagline: Магазину косметики требовались две согласованные службы доставки в
  одном WooCommerce-магазине. В объём входила работа с кабинетами перевозчиков,
  а не новый дизайн оформления заказа.
year: "06.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - CDEK
  - Russian Post
  - Shipping integrations
blocks:
  - type: text
    title: Задача и ограничения
    body: Магазину косметики требовались две согласованные службы доставки в одном
      WooCommerce-магазине. В объём входила работа с кабинетами перевозчиков, а
      не новый дизайн оформления заказа.
  - type: text
    title: Как устроено решение
    body: "Подключил СДЭК и Почту России с предоставленными заказчиком доступами к
      соответствующим кабинетам и сдал настройку. Дополнительную скидку на
      доставку вынесли в отдельный заказ: базовое подключение и коммерческое
      правило не смешивал."
  - type: text
    title: Результат и проверка
    body: Клиент принял настройку обеих служб и подтвердил решение задачи в отзыве.
      Конкретные тарифы, покрытие городов и реальные отправления по архиву не
      проверены.
