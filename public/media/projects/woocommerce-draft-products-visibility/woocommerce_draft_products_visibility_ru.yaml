title: Возврат скрытых товаров на витрину WooCommerce
tagline: Восстановил показ товаров, которые были доступны редактору в админке,
  но отсутствовали на публичной витрине.
year: "02.2020"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Product visibility
  - WordPress
blocks:
  - type: text
    title: Задача и ограничения
    body: Восстановил показ товаров, которые были доступны редактору в админке, но
      отсутствовали на публичной витрине.
  - type: text
    title: Как устроено решение
    body: Проверил статус карточек и обнаружил, что товары оставались черновиками.
      Восстановил видимость публикацией и объяснил владельцу, чем статус товара
      отличается от настроек обычных записей и оформления карточек в теме.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил решение и принял работу. Количество опубликованных
      карточек не сохранилось; это восстановление видимости, а не создание
      магазина заново.
