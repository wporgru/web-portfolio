title: Восстановление галереи-магазина WooCommerce в Романово
tagline: Вернул отображение товаров, разобравшись, почему редактор видел карточки
  в админке, а покупатель не находил их на витрине.
year: "02.2020"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Product visibility
  - WordPress
blocks:
  - type: text
    title: "Задача: вернуть покупателям товары галереи"
    body: В феврале 2020 года владелец сайта artdom-romanovo.ru обратился из-за
      пропавших товаров галереи-магазина. В административной части карточки
      оставались доступны, но на публичной витрине посетители их не видели.
      Требовалось быстро вернуть существующие позиции в каталог, не подменяя
      задачу созданием нового магазина или полной переделкой сайта.
  - type: text
    title: Диагностика и восстановление
    body: "Проверил не только оформление витрины, но и состояние самих карточек в
      WooCommerce. Причина оказалась в статусе публикации: товары сохранялись как
      черновики, поэтому редактор видел их в панели, а обычный посетитель — нет.
      Перевёл нужные позиции в опубликованное состояние и пояснил владельцу
      разницу между публикацией товара, настройками обычной записи и визуальным
      оформлением карточек, которое зависит от темы. Такой порядок помог
      устранить источник проблемы, а не менять шаблон страницы вслепую."
  - type: text
    title: Результат и границы работ
    body: "Клиент подтвердил, что задача решена, поблагодарил и принял заказ. В
      отзыве отметил: «сделано быстро и то что было нужно». Точное число
      опубликованных позиций не зафиксировано, поэтому не добавляю к кейсу
      выдуманные объёмы. Это восстановление видимости товаров и консультация по
      управлению WooCommerce — не разработка магазина с нуля и не восстановление
      всего сайта. Современная главная сайта уже изменилась, поэтому её нельзя
      выдавать за исторический вид галереи на дату заказа."
    links:
      - label: Исходный заказ и отзыв на Kwork
        url: https://kwork.ru/track?id=9004583
  - type: text
    title: Почему товары могли исчезнуть
    body: В WooCommerce карточки имеют собственный статус публикации. Наличие
      товара в административном списке ещё не означает, что он опубликован и
      доступен посетителям. Перед редизайном или заменой темы полезно проверить
      статусы товаров, их видимость в каталоге и настройки самой витрины — это
      позволяет сначала восстановить нужное содержимое, а затем отдельно
      решать вопросы оформления.
