title: Вёрстка почтовой подписи из DOCX в HTML
tagline: Перевёл одну подпись из DOCX в HTML. После неудачной первой проверки
  передал исправленный файл, который клиент принял.
year: "07.2023"
role: Вёрстка почтовых интерфейсов
stack:
  - HTML
  - DOCX
blocks:
  - type: text
    title: Одна подпись вместо всего комплекта
    body: У заказчика был документ с семью примерами. Договорились сверстать один
      HTML-вариант; остальные клиент планировал подготовить самостоятельно.
  - type: text
    title: Повторная проверка у клиента
    body: Первый файл не заработал у заказчика. Я передал исправленный вариант,
      после чего клиент подтвердил работу и принял заказ.
  - type: text
    title: Границы результата
    body: Подтверждена одна подпись, не комплект. Исходные вложения истекли, поэтому
      версию почтового клиента и совместимость нельзя подтвердить повторно.
