title: Обновление объявлений недвижимости из Zipal каждые 6 часов
tagline: Агентству нужно было чаще обновлять объявления на сайте, чтобы новые
  объекты не ждали следующей суточной загрузки. Ошибки исходных данных при этом
  нельзя было исправить одной сменой расписания.
year: "11.2018"
role: Веб-разработка и автоматизация
stack:
  - XML
  - Scheduled imports
  - Real estate
blocks:
  - type: text
    title: Задача и ограничения
    body: Агентству нужно было чаще обновлять объявления на сайте, чтобы новые
      объекты не ждали следующей суточной загрузки. Ошибки исходных данных при
      этом нельзя было исправить одной сменой расписания.
  - type: text
    title: Как устроено решение
    body: Перенастроил импорт XML-фида Яндекс.Недвижимости на четыре запуска в
      сутки. Проверил первый прогон и отдельно подтвердил срабатывания в 06:00 и
      12:00. При неверном числе комнат сверил поле rooms в исходном XML и
      объяснил заказчику, где внести исправление, чтобы оно пришло при следующем
      обновлении.
  - type: text
    title: Результат и проверка
    body: Первый проверенный прогон занял 1 минуту 36 секунд, обновил 38 и добавил 7
      объявлений. Клиент подтвердил работу и принял заказ. Эти цифры относятся к
      одному историческому запуску.
