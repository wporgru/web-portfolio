title: Исправление размеров фото товаров в мобильной витрине
tagline: После основного этапа настройки второго магазина заказчик отдельно
  заметил проблему с размерами товарных фото на телефоне. Нужно было исправить
  именно мобильное представление.
year: "04.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Mobile layout
blocks:
  - type: text
    title: Задача и ограничения
    body: После основного этапа настройки второго магазина заказчик отдельно заметил
      проблему с размерами товарных фото на телефоне. Нужно было исправить
      именно мобильное представление.
  - type: text
    title: Как устроено решение
    body: "Уточнил мобильную правку, изменил отображение размеров фото и передал
      исправление на проверку. Работы предыдущего магазина не переношу в этот
      кейс: здесь результатом была отдельная правка второй витрины."
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил отображение и принял работу. Десктопный снимок главной
      не выдаётся за повторный тест мобильного исправления.
