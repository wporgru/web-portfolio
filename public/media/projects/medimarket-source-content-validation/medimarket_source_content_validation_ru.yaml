title: "MediMarket24: восстановление данных 140 карточек"
tagline: У части карточек не хватало справочных разделов. Требовалось
  восстановить исходные данные для точной позиции, а не дописывать текст до
  условной нормы или брать описание похожего товара.
year: "10.2026"
role: Веб-разработка и автоматизация
stack:
  - Astro
  - JavaScript
  - Data provenance
  - Catalog QA
  - Node.js
blocks:
  - type: text
    title: Задача и ограничения
    body: У части карточек не хватало справочных разделов. Требовалось восстановить
      исходные данные для точной позиции, а не дописывать текст до условной
      нормы или брать описание похожего товара.
  - type: text
    title: Как устроено решение
    body: Собрал очередь из 144 позиций и разделил успешные сопоставления и
      отсутствие материала. Сохранял адрес источника, время получения и SHA-256;
      проверял идентификатор товара и соответствие упаковки. Сборка возвращает
      подтверждённые разделы в карточку. Тесты отсекают неверные упаковки и не
      дают автоматически дополнять вопросы неподтверждёнными ответами.
  - type: text
    title: Результат и проверка
    body: Протокол зафиксировал 140 применённых записей и четыре позиции без
      подходящего материала. Проверка сгенерированного HTML охватила 744
      карточки; пять контрольных URL на опубликованном сайте ответили HTTP 200.
      Это проверка импорта, происхождения данных и вёрстки, не медицинская
      экспертиза содержания.
  - type: text
    title: Другой этап этого проекта
