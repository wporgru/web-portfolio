title: "Kubachi Silver Shop: товарная выгрузка YML"
tagline: Новому магазину серебряных изделий нужен был отдельный адрес выгрузки
  для Яндекса. До настройки уточнил, что товарные цены должны быть заполнены.
year: "09.2022"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - YML
  - Product exports
blocks:
  - type: text
    title: Задача и ограничения
    body: Новому магазину серебряных изделий нужен был отдельный адрес выгрузки для
      Яндекса. До настройки уточнил, что товарные цены должны быть заполнены.
  - type: text
    title: Как устроено решение
    body: "Настроил генерацию YML и передал клиенту адрес XML-файла. Когда клиент
      упомянул предупреждение о дате по первому фиду, запросил точный текст и
      снимок: переписка не подтверждает, что предупреждение относилось к новому
      файлу."
  - type: text
    title: Результат и проверка
    body: Клиент принял настройку. Подтверждена передача рабочего адреса по отчёту о
      сдаче, а не число предложений, устранение предупреждения или успешная
      модерация.
