    body: Updated an auto service website and investigated a certificate renewal
      request by checking what was already active before recommending a
      purchase.
  - type: text
    title: How it works
    body: Checked HTTPS and found an active Let’s Encrypt certificate. Explained why
      an additional certificate was unnecessary and addressed a separate hosting
      notice on backups. Handed over the content updates for review.
