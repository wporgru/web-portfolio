title: "9000 RPM: обновление сайта и проверка SSL"
tagline: "Обновил информацию на сайте автосервиса и разобрал запрос на продление
  сертификата: прежде чем покупать новый, нужно было проверить, что уже
  настроено на хостинге."
year: "11.2022"
role: Веб-разработка и автоматизация
stack:
  - Website maintenance
  - Let’s Encrypt
  - TLS
  - Hosting
blocks:
  - type: text
    title: Задача и ограничения
    body: "Обновил информацию на сайте автосервиса и разобрал запрос на продление
      сертификата: прежде чем покупать новый, нужно было проверить, что уже
      настроено на хостинге."
  - type: text
    title: Как устроено решение
    body: Проверил действующий HTTPS и обнаружил, что сайт уже использует Let’s
      Encrypt. Объяснил владельцу, почему дополнительный сертификат не нужен, и
      отдельно разобрал уведомление хостинга о резервном копировании. Передал
      информационные правки на проверку.
  - type: text
    title: Результат и проверка
    body: Клиент принял работу и в отзыве отметил, что избежал лишних расходов на
      сертификат. Получение письма из формы обратного звонка отдельно не
      подтверждено.
