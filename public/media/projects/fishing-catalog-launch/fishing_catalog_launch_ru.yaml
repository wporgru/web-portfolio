title: Запуск каталога рыболовных товаров из прайса
tagline: Заказчику нужен был не просто загруженный прайс, а витрина, с которой
  покупатель сразу может перейти к нужной категории.
year: "02.2026"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Data import
  - PHP
blocks:
  - type: text
    title: Задача и ограничения
    body: Заказчику нужен был не просто загруженный прайс, а витрина, с которой
      покупатель сразу может перейти к нужной категории.
  - type: text
    title: Как устроено решение
    body: Подготовил данные и продолжил загрузку после ошибок 504, когда клиент
      согласовал временное расширение тарифа. Скорректировал доступные настройки
      PHP, настроил размеры товарных изображений, назначил изображения
      категориям и сделал каталог главной страницей магазина.
  - type: text
    title: Результат и проверка
    body: Клиент одобрил оформление и принял заказ. Около 90 позиций,
      преимущественно подсаки, загрузились без фотографий из-за проблем на
      сервере изображений; это не выдаётся за полную комплектацию каталога.
