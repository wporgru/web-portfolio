title: Оптимизация изображений и настройка WebP
tagline: Снизил нагрузку от крупных исходных фотографий и настроил порядок
  подготовки новых изображений, чтобы оптимизация не заканчивалась разовой
  обработкой медиатеки.
year: "09.2023"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WebP
  - XnView
  - Image optimization
blocks:
  - type: text
    title: Задача и ограничения
    body: Снизил нагрузку от крупных исходных фотографий и настроил порядок
      подготовки новых изображений, чтобы оптимизация не заканчивалась разовой
      обработкой медиатеки.
  - type: text
    title: Как устроено решение
    body: Уменьшил крупные фотографии, настроил Robin Image Optimizer и WebP
      Express. Ограничил ширину новых оригиналов до 1920 px и отключил генерацию
      ненужных размеров 1536 и 2048. Показал, как готовить изображения в XnView.
      После конвертации проверил пример WebP и сбросил кэши, чтобы не оценивать
      старую выдачу.
  - type: text
    title: Результат и проверка
    body: В архиве показан пример WebP около 29 КБ. Это размер конкретного файла, не
      среднее по медиатеке и не доказательство роста PageSpeed.
