title: WordPress image optimization and WebP delivery
tagline: Reduced the burden of oversized originals and set up a repeatable
  preparation workflow so optimization would not end after a one-off media
  cleanup.
year: "09.2023"
role: Web development and automation
stack:
  - WordPress
  - WebP
  - XnView
  - Image optimization
blocks:
  - type: text
    title: Brief and constraints
    body: Reduced the burden of oversized originals and set up a repeatable
      preparation workflow so optimization would not end after a one-off media
      cleanup.
  - type: text
    title: How it works
    body: Reduced oversized photos and configured Robin Image Optimizer and WebP
      Express. Limited new originals to 1920 px wide and disabled unnecessary
      1536 and 2048 variants. Demonstrated preparation in XnView, checked a
      converted WebP and cleared caches to avoid reviewing stale output.
  - type: text
    title: Result and verification
    body: The archive shows one WebP at about 29 KB. That is a single file size, not
      a media-library average or proof of a PageSpeed gain.
