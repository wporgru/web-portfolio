title: SEO-метаданные магазина кровельных материалов
tagline: Подготовил поисковое оформление товаров и категорий отдельного магазина
  кровельных материалов, не смешивая работу с основным сайтом компании.
year: "07.2024"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Technical SEO
  - XML Sitemap
  - Metadata
blocks:
  - type: text
    title: Задача и ограничения
    body: Подготовил поисковое оформление товаров и категорий отдельного магазина
      кровельных материалов, не смешивая работу с основным сайтом компании.
  - type: text
    title: Как устроено решение
    body: В отчёте зафиксировал настройку Title и Description для товаров и
      категорий, передал карту сайта и показал раздел контактов. Доработал
      настройки темы. Вопросы о смене SEO-плагина на основном сайте, объединении
      площадок и редиректах оставил за рамками этой сдачи.
  - type: text
    title: Результат и проверка
    body: Заказчик принял настройку магазина. Передача карты сайта не доказывает
      индексацию, а влияние правок на позиции и продажи не измерялось.
