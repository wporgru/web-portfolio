title: Витрина плитки на WoodMart и форма заказа
tagline: "Магазину плитки требовался первый рабочий этап витрины: понятные
  категории, карточки и сценарий обращения к менеджеру."
year: "03.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - WoodMart
  - Metrica
blocks:
  - type: text
    title: Задача и ограничения
    body: "Магазину плитки требовалось запустить первый этап WooCommerce-витрины на готовой WoodMart Megamarket. Каталог формировался из данных 1С, а продавец хотел получать обращения через форму менеджеру, не запуская в этом этапе обычную онлайн-покупку. Дополнительный тяжёлый визуальный редактор заказчик не хотел — для дальнейшего редактирования выбрали стандартный Gutenberg."
  - type: text
    title: Как устроено решение
    body: Подготовил главную страницу, шапку и подвал, структуру категорий и шаблон товарной карточки. Сформировал отдельный сценарий заявки менеджеру, чтобы витрина принимала запросы без незаявленного в этой фазе чекаута и онлайн-оплаты. После уточнения требуемого счётчика заменил проблемную прежнюю интеграцию Яндекс Метрики на согласованный прямой код; восстановление старых аналитических данных и настройка целей не подтверждены. Во время проверки каталога выявил неполные описания и неудачные названия в передаваемых из 1С данных и объяснил, что исправлять в источнике. Заполнение карточек в 1С выполнял заказчик.
  - type: text
    title: Результат и проверка
    body: 14 марта 2026 года клиент явно принял первый этап и положительно оценил шаблон как подходящее решение для WordPress-магазина. Работа дала основу витрины и путь обращения к менеджеру; коммерческие страницы об оплате, доставке и акциях, полный аудит товарных записей и завершённая автоматизация всего обмена 1С в приёмку этого этапа не входили. Мобильный слайдер вызывал замечание; независимый итоговый тест всех устройств не сохранён. Последующие доработки описываются отдельными этапами, а не приписываются этой сдаче.
