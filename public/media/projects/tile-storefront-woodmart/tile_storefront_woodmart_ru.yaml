blocks:
  - type: text
    title: Задача и ограничения
    body: "Магазину плитки требовался первый рабочий этап витрины: понятные
      категории, карточки и сценарий обращения к менеджеру."
  - type: text
    title: Как устроено решение
    body: Подготовил главную, шапку, подвал, категории и шаблон карточки. Настроил
      форму заказа, отдельно от сценария онлайн-покупки. Заменил проблемное
      подключение Метрики на согласованный прямой код и разобрал, какие названия
      и описания нужно исправлять в исходных данных 1С.
  - type: text
    title: Результат и проверка
    body: Заказчик принял первый этап. Часть коммерческих страниц и полное
      исправление исходных карточек остались за рамками этой сдачи.
