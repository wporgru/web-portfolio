title: Адаптация витрины WooCommerce на теме Altr
tagline: "Адаптировал готовую тему под существующий магазин: сохранил нужные
  страницы и подвал, собрал навигацию по категориям и доработал мобильное
  отображение."
year: "04.2024"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - Elementor
  - Altr
blocks:
  - type: text
    title: Задача и ограничения
    body: "Адаптировал готовую тему под существующий магазин: сохранил нужные
      страницы и подвал, собрал навигацию по категориям и доработал мобильное
      отображение."
  - type: text
    title: Как устроено решение
    body: Настроил боковое меню, блоки новинок и популярных товаров, зону логотипа и
      кнопки. Исправил мобильные отступы, положение фильтров, отображение части
      данных товара и ссылки FAQ и гарантии. Добавил загрузку следующей порции
      товаров и объяснил, как вернуть обычную пагинацию. Скрывал лишние данные с
      витрины, не удаляя их из каталога.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил правки и принял работу. Передал инструкции по
      редактированию главной, каруселей, шапки и подвала, чтобы поддерживать
      оформление без разработчика.
