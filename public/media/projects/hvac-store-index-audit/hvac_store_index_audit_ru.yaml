title: Техническое SEO магазина климатической техники
tagline: Разобрал, почему в обход магазина попадали ошибочные страницы
  пагинации, лишние архивы и URL фильтрации. Задача состояла в настройке
  источников дублей, а не в массовой правке текстов.
year: "11.2024"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Yoast SEO
  - Technical SEO
  - XML Sitemap
blocks:
  - type: text
    title: Задача и ограничения
    body: Разобрал, почему в обход магазина попадали ошибочные страницы пагинации,
      лишние архивы и URL фильтрации. Задача состояла в настройке источников
      дублей, а не в массовой правке текстов.
  - type: text
    title: Как устроено решение
    body: Сверил чек-лист с настройками темы и SEO-плагина, отключил дублирующие
      расширения и оставил карту сайта в Yoast. По согласованной схеме настроил
      canonical пагинации и обработку несуществующих страниц архивов. Исключил
      архивы меток и атрибутов из карты сайта и индексации; для параметров темы
      добавил Clean-param.
  - type: text
    title: Результат и проверка
    body: Заказчик подтвердил этап и получил отчёт с примерами и рекомендациями.
      Решения по пагинации относились к этому проекту; рост трафика и позиций не
      измерялся.
