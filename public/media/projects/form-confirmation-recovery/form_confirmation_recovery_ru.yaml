title: Восстановление подтверждения отправки форм WordPress
tagline: После обновления плагина у клиента пропало сообщение об успешной
  отправке. Пользователь мог отправить заявку, но не понимал, сработало ли
  действие.
year: "09.2025"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - JavaScript
  - Forms
blocks:
  - type: text
    title: Задача и ограничения
    body: После обновления плагина у клиента пропало сообщение об успешной отправке.
      Пользователь мог отправить заявку, но не понимал, сработало ли действие.
  - type: text
    title: Как устроено решение
    body: Уточнил расположение форм и проверил общее ручное подключение скрипта.
      Исправил способ подключения после обновления и проверил на одной форме,
      что сообщение появляется. Отдельно предложил проверить аналитику, не
      выдавая её за часть ремонта интерфейса.
  - type: text
    title: Результат и проверка
    body: Клиент повторил проверку первой формы, подтвердил результат и принял
      работу. Полный обход всех форм, почтовых каналов и целей аналитики не
      выполнялся.
