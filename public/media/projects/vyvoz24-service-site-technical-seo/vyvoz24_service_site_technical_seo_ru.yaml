blocks:
  - type: text
    title: Задача и ограничения
    body: "Доработал сайт услуг по техническому отчёту: от заголовков и метаданных
      до навигации, карты сайта и загрузки ресурсов."
  - type: text
    title: Как устроено решение
    body: Исправил H1 и лишние сквозные подзаголовки, настроил шаблоны Yoast SEO.
      Подготовил robots.txt, XML-карту и HTML-страницу карты сайта. В отчёте
      зафиксировал разметку списка услуг, предложений и хлебных крошек. Настроил
      модерацию отзывов и браузерное кэширование; доработал подвал, логотип и
      favicon.
  - type: text
    title: Результат и проверка
    body: Заказчик принял работы и оставил положительный отзыв. Сравнимого замера
      скорости и данных о росте поисковых позиций нет.
