blocks:
  - type: text
    title: Brief and constraints
    body: Updated part of a furniture catalog and prepared imagery for the future
      INSTORIA rebrand, working with prices, descriptions, model differences and
      client-supplied material.
  - type: text
    title: How it works
    body: Clarified categories by model, agreed on the logo and spacing and updated
      prices and descriptions from the supplied documents. Processed images
      across several furniture groups and prepared some files as WebP. An
      archived pair shows one bed without large marks and with INSTORIA
      branding.
  - type: text
    title: Result and verification
    body: The stage was accepted automatically. The sample confirms branding work on
      one image, not the complete media batch, a backup or a domain change.
