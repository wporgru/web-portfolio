title: Мебельный каталог и подготовка фото к ребрендингу
tagline: Обновил часть мебельного каталога и подготовил изображения для будущего
  ребрендинга INSTORIA. Работал с ценами, описаниями, различиями моделей и
  материалами от заказчика.
year: "07.2022"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - WebP
  - Image processing
  - Catalog content
blocks:
  - type: text
    title: Задача и ограничения
    body: Обновил часть мебельного каталога и подготовил изображения для будущего
      ребрендинга INSTORIA. Работал с ценами, описаниями, различиями моделей и
      материалами от заказчика.
  - type: text
    title: Как устроено решение
    body: Уточнял категории по моделям, согласовал логотип и отступы, обновлял цены
      и описания по документам. Обработал фотографии нескольких групп мебели и
      подготовил часть файлов в WebP. Историческая пара изображений показывает
      одну кровать без крупных знаков и с брендированием INSTORIA.
  - type: text
    title: Результат и проверка
    body: Этап приняли автоматически. Образец подтверждает работу с брендированием
      одного изображения, но не полный пакет фотографий, резервное копирование
      или смену домена.
