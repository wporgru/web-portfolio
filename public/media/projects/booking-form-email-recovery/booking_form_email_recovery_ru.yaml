title: Восстановление писем из форм бронирования
tagline: Восстановил получение заявок из форм бронирования и проверил результат
  несколькими различимыми отправками, а не одним тестовым письмом.
year: "01.2024"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Booking forms
  - Email notifications
  - QA
blocks:
  - type: text
    title: Задача и ограничения
    body: После первой успешной отправки следующие заявки на бронирование экскурсий перестали стабильно доходить. Нужно было проверить путь уведомлений, не ограничиваясь письмом «на тест», и отдельно поправить ссылку VK в подвале сайта. Домен и конкретный плагин форм в доступной истории не названы.
  - type: text
    title: Как устроено решение
    body: "Последовательно проверил конфигурацию уведомлений и адрес отправителя, восстановил адрес административного получателя и создал три различимые контрольные заявки. Для проверки не считал достаточным собственный факт отправки: попросил заказчика подтвердить получение каждого письма в своей почте. В ходе той переписки клиент также переключил PHP на 7.4 по тогдашней рекомендации; сохранённые материалы не доказывают, что смена версии была первопричиной или единственным исправлением. Отдельно поправил ссылку VK в подвале и записал короткое видео проверки."
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил получение всех трёх контрольных писем, проверил переход из ссылки VK и явно принял заказ с отзывом «Быстро и грамотно. Спасибо за работу». Это подтверждает несколько успешных заявок в момент сдачи, но не длительный мониторинг доставки. Не заявляются настройка SMTP, SPF/DKIM/DMARC, внедрение почтового сервиса или исправление логики бронирования. Вторая VK-кнопка отдельно не подтверждена, а адрес сайта по сохранённым материалам установить не удалось.
