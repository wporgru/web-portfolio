title: Восстановление писем из форм бронирования
tagline: Восстановил получение заявок из форм бронирования и проверил результат
  несколькими различимыми отправками, а не одним тестовым письмом.
year: "01.2024"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Booking forms
  - Email notifications
  - QA
blocks:
  - type: text
    title: Задача и ограничения
    body: Восстановил получение заявок из форм бронирования и проверил результат
      несколькими различимыми отправками, а не одним тестовым письмом.
  - type: text
    title: Как устроено решение
    body: Проверил настройки уведомлений и отправителя, вернул административного
      получателя и отправил три контрольные заявки. Попросил заказчика сверить
      все три в почте. Дополнительно исправил переход в VK из подвала и передал
      видео проверки.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил получение всех трёх писем и исправление ссылки.
      Настройки доменной почты и долговременная доставляемость отдельно не
      проверялись.
