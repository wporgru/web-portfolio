blocks:
  - type: text
    title: Brief and constraints
    body: Restored booking enquiries and verified delivery with several
      distinguishable submissions rather than one test message.
  - type: text
    title: How it works
    body: Reviewed notification and sender settings, restored the administrative
      recipient and sent three control submissions. Asked the client to confirm
      each in the inbox. Also repaired the footer’s VK link and shared a
      verification video.
  - type: text
    title: Result and verification
    body: The client confirmed all three messages and the repaired link. Domain
      email authentication and long-term deliverability were not independently
      assessed.
