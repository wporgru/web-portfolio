title: "BGT Group: technical SEO and site performance"
tagline: Repaired internal links and the sitemap for BGT Group and worked on
  homepage performance. Archived PageSpeed reports show 37 to 86 on mobile and
  63 to 92 on desktop.
year: "02.2024"
role: Web development and automation
stack:
  - WordPress
