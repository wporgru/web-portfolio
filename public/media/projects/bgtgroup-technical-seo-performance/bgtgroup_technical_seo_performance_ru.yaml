blocks:
  - type: text
    title: Задача и ограничения
    body: "Исправил внутренние ссылки и карту сайта BGT Group и провёл работы по
      производительности главной. В сохранённых отчётах PageSpeed: 37 → 86 на
      телефоне и 63 → 92 на компьютере."
  - type: text
    title: Как устроено решение
    body: Переключил сайт на актуальный индекс карт, разобрал ошибочные адреса в
      старой карте и заменил внутренние ссылки через редиректы прямыми адресами.
      Проверил ответы в Screaming Frog. Для изображений, используемых как
      ссылки, добавил текстовые альтернативы; существующие доступные подписи
      иконок в подвале сохранил.
  - type: text
    title: Результат и проверка
    body: Клиент проверил работу и принял заказ. По сохранённым лабораторным замерам
      от 7–8 февраля итоговый LCP составил 3,5 с на телефоне и 1,4 с на
      компьютере. Это исторические отчёты, не текущие данные реальных
      посетителей или оценка роста поисковых позиций.
  - type: text
    title: Связанный проект
