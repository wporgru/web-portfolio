title: "BGT Group: техническое SEO и скорость сайта"
tagline: "Исправил внутренние ссылки и карту сайта BGT Group и провёл работы по
  производительности главной. В сохранённых отчётах PageSpeed: 37 → 86 на
  телефоне и 63 → 92 на компьютере."
year: "02.2024"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Screaming Frog
