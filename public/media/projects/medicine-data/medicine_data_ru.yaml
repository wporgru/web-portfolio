title: Медицинские справочники и нормализация в Directus
tagline: Один препарат может встречаться в реестрах и каталогах под разными
  обозначениями. Нужна структура, которая различает действующее вещество,
  зарегистрированный препарат и товарную упаковку.
year: "2026"
role: Веб-разработка и автоматизация
stack:
  - Directus
  - SQLite
  - Python
  - ETL
blocks:
  - type: text
    title: Задача и ограничения
    body: Один препарат может встречаться в реестрах и каталогах под разными
      обозначениями. Нужна структура, которая различает действующее вещество,
      зарегистрированный препарат и товарную упаковку.
  - type: text
    title: Как устроено решение
    body: Спроектировал слои данных и связи, подготовил импорт справочников и
      проверку сопоставлений. Разделил МНН, ATC, карточку препарата и SKU;
      оставил возможность хранить источник каждого значения и разбирать
      неоднозначные совпадения отдельно.
  - type: text
    title: Результат и проверка
    body: В репозитории есть схема Directus, импортные скрипты и проверки. Это
      разработка основы и инструментов валидации, не заявление о запущенном
      медицинском сервисе или готовом OCR всех инструкций.
