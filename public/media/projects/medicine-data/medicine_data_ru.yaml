title: Медицинские справочники и нормализация в Directus
tagline: Один препарат может встречаться в реестрах и каталогах под разными обозначениями.
  Нужна структура, которая различает действующее вещество, зарегистрированный препарат и
  товарную упаковку.
year: "2026"
role: Веб-разработка и автоматизация
stack:
  - Directus
  - SQLite
  - Python
  - ETL
blocks:
  - type: text
    title: Зачем разделять записи
    body: Один и тот же препарат встречается в регистрационных данных, каталогах и прайсах под
      разными обозначениями. Названия товара недостаточно, чтобы считать совпадающими
      действующее вещество, регистрацию, дозировку и конкретную упаковку. Задача —
      подготовить структуру данных, в которой эти уровни можно хранить и проверять
      раздельно.
  - type: text
    title: Модель данных и происхождение
    body: Подготовил схему Directus и связи для справочников, ATC, зарегистрированных
      препаратов и товарных вариантов. Такая структура позволяет не записывать сведения об
      упаковке поверх данных о веществе и учитывать источник поля. Снимок схемы хранится
      отдельно, чтобы её можно было применять и проверять независимо от наполнения.
  - type: text
    title: Проверка сопоставлений
    body: "Для исследования подготовлены Python-скрипты: один разбирает строки действующих
      веществ, в том числе комбинации, и сравнивает компоненты с эталонным справочником;
      другой сопоставляет товарные записи с реестром по регистрационному номеру и отдельно
      учитывает наличие штрихкода. Несовпавшие примеры выводятся для разбора. Совпадение
      по одному номеру не доказывает идентичность дозировки и упаковки: перед объединением
      требуется проверка варианта."
  - type: text
    title: Что готово и что остаётся
    body: В рабочем проекте есть снимок схемы Directus для SQLite, скрипты импорта и
      исследовательские проверки нормализации. Это основа для дальнейшей интеграции
      данных, а не подтверждение запуска медицинского сервиса, полного OCR инструкций или
      корректности всех сопоставлений. Перед массовым обновлением витрины нужны отдельные
      правила источников, обработка неоднозначностей и проверка результата на выборке.
  - type: text
    title: Обсудить задачу с данными
    body: Если несколько источников называют один товар по-разному, пришлите обезличенный
      пример записей, доступные идентификаторы и описание результата. Сначала определим
      единицу сопоставления и исключения, затем подготовим проверяемый пилот без массовой
      перезаписи.
