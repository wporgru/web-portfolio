title: "Карточки мебели: варианты, фотографии и заявки"
tagline: Доработал карточки мебели, где число сочетаний тканей и размеров делало
  обычные вариации неудобными. Параллельно подготовил часть ассортимента к
  загрузке.
year: "08.2021"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Product options
  - Image compression
  - Catalog data
blocks:
  - type: text
    title: Задача и ограничения
    body: Доработал карточки мебели, где число сочетаний тканей и размеров делало
      обычные вариации неудобными. Параллельно подготовил часть ассортимента к
      загрузке.
  - type: text
    title: Как устроено решение
    body: На примерах Carina Nova и Feraha разобрал цвет и размер, убрал лишние
      элементы карточки и проверил альтернативу сотням вариаций. Настроил кнопку
      заявки на уточнение и получил подтверждение клиента. Из фотоархивов
      подготовил таблицу на 35 товаров, сжал материалы и показал пример галереи.
  - type: text
    title: Результат и проверка
    body: Клиент принял этап. Каталог тканей и полный конфигуратор не были
      завершены; 35 товаров — объём подготовленной таблицы, а не пересчёт всех
      опубликованных карточек.
