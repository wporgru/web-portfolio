title: WooCommerce рядом с витриной Digiseller
tagline: Подготовил отдельный магазин внутри существующего WordPress, не заменяя
  действующую витрину Digiseller. Владелец хотел сначала проверить новый путь
  заказа на одном товаре.
year: "11.2018"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - Digiseller
  - Transactional email
blocks:
  - type: text
    title: Задача и ограничения
    body: Подготовил отдельный магазин внутри существующего WordPress, не заменяя
      действующую витрину Digiseller. Владелец хотел сначала проверить новый
      путь заказа на одном товаре.
  - type: text
    title: Как устроено решение
    body: Установил WooCommerce, создал тестовый товар и передал ссылки на магазин и
      карточку. Сообщил о полученном тестовом письме заказа. Объяснил, как
      развести две витрины и переходы к ним на главной, затем вывел категории
      WooCommerce в боковой колонке.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил появление категорий и принял этап. Общий ассортимент,
      единая корзина и синхронизация по API не входили в выполненную настройку.
