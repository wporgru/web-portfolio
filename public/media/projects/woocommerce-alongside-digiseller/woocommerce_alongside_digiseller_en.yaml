title: Setting up WooCommerce alongside Digiseller
tagline: Set up a separate store within an existing WordPress site without
  replacing its Digiseller storefront. The owner wanted to try the new order
  flow on one product first.
year: "11.2018"
role: Web development and automation
stack:
  - WordPress
  - WooCommerce
  - Digiseller
  - Transactional email
blocks:
  - type: text
    title: Brief and constraints
    body: Set up a separate store within an existing WordPress site without
      replacing its Digiseller storefront. The owner wanted to try the new order
      flow on one product first.
  - type: text
    title: How it works
    body: Installed WooCommerce, added a test product and shared the store and
      product URLs. Reported receiving a test order email. Explained how to keep
      the two storefronts and their homepage entry points separate, then added
      WooCommerce categories to the sidebar.
  - type: text
    title: Result and verification
    body: The client confirmed the categories appeared and accepted the stage.
      Shared inventory, a common cart and API synchronization were not
      delivered.
