title: Фильтры WooCommerce с чекбоксами по категориям
tagline: Покупателям нужно было выбирать несколько характеристик и видеть
  количество товаров. При этом длинное дерево в боковом меню не совпадало с
  реальными товарными категориями, а полный список характеристик не помогал в
  узком разделе.
year: "06.2024"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Product attributes
  - Catalog filters
  - Taxonomies
blocks:
  - type: text
    title: Задача и ограничения
    body: Покупателям нужно было выбирать несколько характеристик и видеть
      количество товаров. При этом длинное дерево в боковом меню не совпадало с
      реальными товарными категориями, а полный список характеристик не помогал
      в узком разделе.
  - type: text
    title: Как устроено решение
    body: "Настроил чекбоксы для содержательных характеристик, исключив пустые и
      бесполезные поля. Разделил общий каталог и категории: на общей странице
      набор шире, в разделе показываются признаки его товаров. На примере
      показал категорию с четырьмя доступными атрибутами и объяснил, почему меню
      само по себе не задаёт структуру WooCommerce."
  - type: text
    title: Результат и проверка
    body: Клиент принял настройку. В результате фильтры не повторяли полный список
      характеристик на каждой странице. Перестройка дерева категорий осталась
      рекомендацией; скорость, все счётчики и комбинации не выдаю за независимо
      проверенные.
