title: Adapting WoodMart for an equipment store
tagline: Adapted a WoodMart storefront for equipment after its demo import
  stalled and the stock navigation and content did not fit the catalog.
year: "01.2024"
role: Web development and automation
stack:
  - WordPress
  - WooCommerce
  - WoodMart
  - PHP
blocks:
  - type: text
    title: Brief and constraints
    body: Adapted a WoodMart storefront for equipment after its demo import stalled
      and the stock navigation and content did not fit the catalog.
  - type: text
    title: How it works
    body: Checked PHP limits and isolated plugins during troubleshooting, then
      completed the stalled theme import step. Restored the category menu in the
      sidebar, prepared hero imagery including Kärcher equipment, removed the
      purchase button from the banner and hid unnecessary demo blocks and posts.
  - type: text
    title: Result and verification
    body: The client accepted the storefront adaptation. The engagement covered
      theme setup, navigation and display content, not an original theme build
      or a full product migration.
