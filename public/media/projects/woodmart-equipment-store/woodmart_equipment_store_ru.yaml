title: Адаптация WoodMart для магазина техники
tagline: Подготовил оформление магазина техники на WoodMart, когда стандартный
  импорт прерывался, а демоблоки и навигация не подходили ассортименту.
year: "01.2024"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - WoodMart
  - PHP
blocks:
  - type: text
    title: Задача и ограничения
    body: Подготовил оформление магазина техники на WoodMart, когда стандартный
      импорт прерывался, а демоблоки и навигация не подходили ассортименту.
  - type: text
    title: Как устроено решение
    body: Проверил ограничения PHP и влияние активных расширений, затем завершил
      проблемный шаг импорта оформления. Вернул меню товарных категорий в
      боковую колонку. Подготовил изображения для верхнего слайдера, в том числе
      с техникой Kärcher, убрал кнопку покупки из баннера и скрыл часть лишних
      демоблоков и статей.
  - type: text
    title: Результат и проверка
    body: Клиент принял адаптацию оформления. Это работа с темой, навигацией и
      контентом витрины, а не заявка на разработку темы с нуля или перенос всего
      товарного каталога.
