title: Каталог анкет с самостоятельным наполнением
tagline: Собрал WordPress-каталог анкет так, чтобы владелец мог пополнять его
  сам, а посетитель — искать записи и открывать галереи с телефона.
year: "05.2022"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Directory
  - Mobile search
  - Editorial workflow
blocks:
  - type: text
    title: Задача и ограничения
    body: Собрал WordPress-каталог анкет так, чтобы владелец мог пополнять его сам,
      а посетитель — искать записи и открывать галереи с телефона.
  - type: text
    title: Как устроено решение
    body: Подготовил четыре демонстрационные анкеты, показал мобильный поиск и
      настроил вывод 16 последних записей на главной. Добавил дублирование
      записей для наполнения, объяснил настройку галерей и рекомендаций и
      записал инструкцию по подготовке фотографий 420 × 600.
  - type: text
    title: Результат и проверка
    body: Клиент протестировал каталог и принял работу. Саморегистрация, платежи,
      CRM и геопоиск не входили в подтверждённый объём.
