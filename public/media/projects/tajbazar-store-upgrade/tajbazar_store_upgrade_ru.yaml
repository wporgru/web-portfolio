title: Обновление магазина Taj Bazar без смены оформления
tagline: Обновить техническую основу магазина, разобрать ошибки доставки и
  уведомлений, но не менять оформление действующей витрины.
year: "08.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - PHP
  - CDEK
blocks:
  - type: text
    title: Задача и ограничения
    body: Обновить техническую основу магазина, разобрать ошибки доставки и
      уведомлений, но не менять оформление действующей витрины.
  - type: text
    title: Как устроено решение
    body: По отчёту обновил PHP до 8.5 и плагины, включил автоматические обновления.
      Проверил конфликт вокруг дублирующего модуля СДЭК и оставил дубль
      отключённым. Тему не обновлял, чтобы сохранить витрину. После сообщения об
      ошибке проверил письмо о заказе и исправил имя и адрес отправителя.
  - type: text
    title: Результат и проверка
    body: Клиент принял работу. Обновление MySQL было запрошено у хостинга, но его
      исполнение не подтверждено; проверка одного письма не равна тесту всех
      заказов.
