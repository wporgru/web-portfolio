title: WatchDivision homepage and mega menu redesign
tagline: Updated the homepage and mega menu of an existing watch store using
  client materials and a design mockup, with separate attention to the mobile
  header.
year: "03.2023"
role: Web development and automation
stack:
  - WooCommerce
  - WoodMart
  - Figma
  - Responsive design
blocks:
  - type: text
    title: Brief and constraints
    body: Updated the homepage and mega menu of an existing watch store using client
      materials and a design mockup, with separate attention to the mobile
      header.
  - type: text
    title: How it works
    body: Built the revised menu and homepage, refined the mobile logo, product
      titles and prices, button background and cart. After a second review,
      reapplied the mobile header settings and explained the contrast between
      light icons and the background.
  - type: text
    title: Result and verification
    body: The client accepted the redesign and confirmed it met the brief. Later
      product sliders were a separate engagement, and the current storefront is
      not used as historical evidence of this redesign.
