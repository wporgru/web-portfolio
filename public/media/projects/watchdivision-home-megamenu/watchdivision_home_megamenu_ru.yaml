title: "WatchDivision: редизайн главной и мегаменю"
tagline: Обновил главную и мегаменю действующего магазина часов по клиентским
  материалам и макету, отдельно проработав элементы мобильной шапки.
year: "03.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - WoodMart
  - Figma
  - Responsive design
blocks:
  - type: text
    title: Задача и ограничения
    body: Обновил главную и мегаменю действующего магазина часов по клиентским
      материалам и макету, отдельно проработав элементы мобильной шапки.
  - type: text
    title: Как устроено решение
    body: Собрал меню и главную, доработал мобильный логотип, оформление названий и
      цен, фон кнопки и корзину. После повторной проверки пересохранил мобильную
      шапку и объяснил, как контраст светлых иконок связан с фоном.
  - type: text
    title: Результат и проверка
    body: Клиент принял результат и подтвердил соответствие заданию. Дальнейшие
      товарные слайдеры обсуждались отдельным заказом, а текущая витрина не
      используется как исторический снимок редизайна.
