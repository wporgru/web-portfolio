title: Основа мультвендорного магазина Le Fontan
tagline: Подготовил первый этап магазина, в котором ассортимент должны пополнять
  не только администраторы, но и сторонние продавцы. На этом этапе требовалась
  основа для дальнейшей проверки продавцами, а не готовая площадка с продажами.
year: "12.2022"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - Multivendor
  - Seller onboarding
blocks:
  - type: text
    title: Задача и ограничения
    body: Подготовил первый этап магазина, в котором ассортимент должны пополнять не
      только администраторы, но и сторонние продавцы. На этом этапе требовалась
      основа для дальнейшей проверки продавцами, а не готовая площадка с
      продажами.
  - type: text
    title: Как устроено решение
    body: Уточнил хостинг и домен, развернул магазин и передал результат на
      проверку. Когда клиент отдельно поднял вопрос мультвендорности, объяснил
      процесс регистрации продавца и размещения им товара, чтобы владелец мог
      проверить именно этот сценарий, а не только внешний вид витрины.
  - type: text
    title: Результат и проверка
    body: Первый этап закрыт по истечении срока проверки. Отдельного теста продавца
      нет; полноценная испанская локализация, приём оплаты и выплаты продавцам
      не подтверждены.
