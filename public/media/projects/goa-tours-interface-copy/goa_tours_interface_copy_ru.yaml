blocks:
  - type: text
    title: Задача и ограничения
    body: "Адаптировал интерфейс магазина под экскурсии: стандартные тексты
      WooCommerce называли предложения товарами, а общий список категорий
      отвлекал от поиска тура."
  - type: text
    title: Как устроено решение
    body: Заменил подсказку поля поиска на текст для Goa Tours и убрал лишнюю строку
      с общим выбором категорий. Сообщение пустой корзины переписал для туров.
      Показал результат на контрольных изображениях при сдаче.
  - type: text
    title: Результат и проверка
    body: Клиент принял интерфейсные правки. Это отдельная задача по текстам, не
      разработка системы бронирования или настройка оплаты.
