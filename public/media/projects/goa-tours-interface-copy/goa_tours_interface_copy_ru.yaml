title: "Goa Tours: тексты поиска и пустой корзины"
tagline: Адаптировал англоязычные надписи интернет-магазина под экскурсии, чтобы
  интерфейс говорил о турах, а не о стандартных товарах WooCommerce.
year: "07.2022"
role: Веб-разработка и UX-тексты
stack:
  - WordPress
  - WooCommerce
  - UX writing
  - Локализация интерфейса
blocks:
  - type: text
    title: Убрал расхождение между магазином и услугой
    body: >-
      Сайт продавал экскурсии, но стандартный интерфейс WooCommerce называл их
      товарами и предлагал общий список категорий. Такое несоответствие мешало
      быстро понять, что искать. В задаче были конкретные правки для goa.tours:
      заменить подсказку поиска на «Search Goa Tours...», убрать строку «All
      Categories» и дублирующую первую строку поиска.
  - type: text
    title: Переписал поиск и пустое состояние корзины
    body: >-
      Привёл надписи в соответствие с языком туристического сервиса: в пустой
      корзине текст «No products in the cart.» заменён на «No tours in the cart.».
      Вместо общего каталожного выбора оставлен более прямой сценарий поиска тура.
      Это небольшая по объёму доработка, но она устраняет продуктовую терминологию
      из пользовательского пути покупки экскурсии.
  - type: text
    title: Передал результат на проверку
    body: >-
      Сообщил о выполнении и приложил изображения для приёмки; позднее ссылки на
      вложения истекли и сами файлы результата не удалось повторно проверить.
      Заказчик принял этап. Исторические материалы подтверждают согласованные
      тексты, но не позволяют заявить о конверсии, росте бронирований или
      самостоятельной проверке всех экранов сайта.
  - type: text
    title: Границы задачи
    body: >-
      Это настройка отдельных надписей и элементов поиска в существующем магазине,
      а не создание туристического сайта, системы бронирования или платежной
      интеграции. Отдельный этап настройки Stripe описан в связанном кейсе.
  - type: text
    title: Другой этап этого проекта
    links:
      - label: "Другой этап Goa Tours: настройка Stripe"
        url: /showcase/goa-tours-stripe-setup/
