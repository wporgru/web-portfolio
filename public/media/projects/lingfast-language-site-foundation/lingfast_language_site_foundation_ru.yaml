title: "Lingfast: основа сайта языкового проекта"
tagline: "Подготовил шаблонную основу для языкового проекта: лендинг, блог и
  редактор, в котором владелец мог заменить демонстрационные материалы своими."
year: "11.2022"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WoodMart
  - Elementor
  - Hosting
blocks:
  - type: text
    title: Задача и ограничения
    body: "Подготовил шаблонную основу для языкового проекта: лендинг, блог и
      редактор, в котором владелец мог заменить демонстрационные материалы
      своими."
  - type: text
    title: Как устроено решение
    body: Согласовал переход от первоначальной Astra к демо WoodMart Mobile App и
      Elementor. Для импорта указал, какие ограничения PHP мешали запуску, и
      продолжил после их изменения клиентом. Показал адрес карты сайта, шаги
      подключения Google Analytics и подход к будущим переводам через Polylang.
  - type: text
    title: Результат и проверка
    body: Клиент принял основу. Готовые переводы, рабочая аналитика и финальное
      наполнение не входили в подтверждённый результат.
