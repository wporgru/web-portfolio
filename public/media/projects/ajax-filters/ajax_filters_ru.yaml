title: Категорийные AJAX-фильтры по восьми параметрам
tagline: Упростить подбор товара по техническим характеристикам и дать владельцу
  возможность настраивать новые фильтры.
role: Веб-разработка
year: "11.2025"
stack:
  - WooCommerce
  - Filter Everything PRO
  - AJAX
blocks:
  - type: text
    title: Задача
    body: Упростить подбор товара по техническим характеристикам и дать владельцу
      возможность настраивать новые фильтры.
  - type: text
    title: Что сделано
    body: Настроил восемь параметров, перевёл обновление результатов на AJAX и
      записал инструкции. После разбора конфликта URL-префиксов клиент
      самостоятельно создал новый фильтр.
  - type: text
    title: Как решалась задача
    body: Начал с фильтра по числу полюсов, затем добавил остальные характеристики.
      После замечания о скачке страницы заменил полную перезагрузку на AJAX. В
      инструкциях разобрал шорткод, размещение, наборы фильтров, привязку к
      категории и перевод подписей. Для изоляторов отдельно решил конфликт
      URL-префикса; клиент затем сам создал новый фильтр.
  - type: image
    title: Публичный вид сайта
    src: /media/projects/ajax-filters/site.png
    alt: Публичная версия сайта проекта
    caption: Снимок на дату проверки. Он показывает публичную версию сайта, а не
      обязательно вид на момент сдачи.
