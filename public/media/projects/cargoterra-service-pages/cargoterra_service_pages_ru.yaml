title: "CargoTerra: структура сайта грузоперевозок"
tagline: Грузоперевозчику нужна была понятная структура услуг, в которой
  посетитель может перейти от общего предложения к своему виду перевозки.
year: "12.2021"
role: Веб-разработка и автоматизация
stack:
  - Web development
  - Service pages
  - Information architecture
blocks:
  - type: text
    title: Задача и ограничения
    body: Грузоперевозчику нужна была понятная структура услуг, в которой посетитель
      может перейти от общего предложения к своему виду перевозки.
  - type: text
    title: Как устроено решение
    body: Подготовил структуру и главную, затем оформил отдельную страницу морских и
      контейнерных перевозок. Показал главную и страницу услуги вместе, чтобы
      заказчик мог согласовать не только первый экран, но и то, как будет
      устроен переход в разделы.
  - type: text
    title: Результат и проверка
    body: Клиент согласовал представленный вариант и принял заказ. Полнота
      последующего наполнения сайта и коммерческие показатели этой сдачей не
      подтверждаются.
