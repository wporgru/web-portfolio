title: Оформление кабинета лабораторных заказов
tagline: "Доработал существующий кабинет: сотрудникам нужно было различать
  состояния кнопок и находить создание заказа на рабочих экранах."
year: "12.2019"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - CSS
  - Admin interface
  - Workflow design
blocks:
  - type: text
    title: Задача и ограничения
    body: "Доработал существующий кабинет: сотрудникам нужно было различать
      состояния кнопок и находить создание заказа на рабочих экранах."
  - type: text
    title: Как устроено решение
    body: Разделил правки между общими стилями и шаблоном шапки; второй баннер
      отключил обратимо. Доработал кнопку создания заказа и активные состояния.
      Уточнил, на каких страницах открываются отправленные и неотправленные
      заказы. Для пустого списка отдельно запросил тестовые записи, чтобы
      проверить кнопки в заполненном состоянии.
  - type: text
    title: Результат и проверка
    body: Клиент принял два этапа оформления. Состояние кнопок в пустом разделе не
      было закрыто тестом; разработка CRM и автоматическая подстановка пациента
      в объём не входили.
