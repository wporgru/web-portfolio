title: Совместимые аксессуары и доставка в WooCommerce
tagline: В карточках оборудования нужно было показывать подходящие аксессуары, а
  при заказе — корректно рассчитывать доступные варианты доставки.
year: "10.2025"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - eShopLogistic
  - Data import
blocks:
  - type: text
    title: Задача и ограничения
    body: В карточках оборудования нужно было показывать подходящие аксессуары, а
      при заказе — корректно рассчитывать доступные варианты доставки.
  - type: text
    title: Как устроено решение
    body: Собрал блок аксессуаров по категориям или меткам и оформил сопутствующие
      товары каруселью. Показал менеджеру, как задавать совместимость. В
      eShopLogistic исправил сценарий со скрытым полем страны. После ошибки
      сопоставления идентификаторов при импорте восстановил резервную копию,
      вернул три добавленные менеджером позиции и исправил правила импорта.
  - type: text
    title: Результат и проверка
    body: Заказчик подтвердил работу оформления после правки. Полное наполнение
      связей совместимости и устранение отдельной ошибки Яндекс Доставки не
      приписываю этому результату.
