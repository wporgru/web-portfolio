title: Оформление полей и кнопок корзины WooCommerce
tagline: Доработал поля и кнопки оформления по выбранному клиентом варианту.
  Изначальную проблему платёжного модуля клиент уже решил самостоятельно; здесь
  задача была в интерфейсе.
year: "01.2024"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - CSS
  - Checkout UX
  - Guest QA
blocks:
  - type: text
    title: Задача и ограничения
    body: Доработал поля и кнопки оформления по выбранному клиентом варианту.
      Изначальную проблему платёжного модуля клиент уже решил самостоятельно;
      здесь задача была в интерфейсе.
  - type: text
    title: Как устроено решение
    body: Увеличил поля, настроил верхние отступы и скругления. Когда стили
      перестали отображаться, восстановил CSS в дополнительных стилях и проверил
      оформление в другом браузере без входа. После обратной связи продолжил
      правки корзины и доставки и передал видео.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил вид checkout и принял этап после дополнительных правок.
      Платёжный шлюз и боевое списание не входили в проверку.
