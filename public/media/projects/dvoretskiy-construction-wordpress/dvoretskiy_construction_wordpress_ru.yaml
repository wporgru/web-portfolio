title: "«Дворецкий»: строительный сайт по демо-референсу"
tagline: Создать многостраничный корпоративный сайт строительной компании на
  WordPress по внешнему визуальному ориентиру.
role: Веб-разработка
year: "01.2018"
stack:
  - WordPress
  - Corporate website
  - Responsive design
blocks:
  - type: text
    title: Задача
    body: Создать многостраничный корпоративный сайт строительной компании на
      WordPress по внешнему визуальному ориентиру.
  - type: text
    title: Что сделано
    body: Настроил домен, доработал страницы проектов и услуг, форму и подвал;
      заказчик принял этап после проверки.
  - type: text
    title: Как решалась задача
    body: "Первый черновик заказчик вернул: не хватало частей страниц, подвала,
      ссылок и формы. После замечаний доработал проекты, услуги, изображения,
      подвал и форму, объяснил редактирование строками, столбцами и виджетами.
      Затем работал над внешними ссылками, новостями главной и адаптацией;
      клиент подтвердил улучшение десктопного слайдера и появление новостей.
      Заказ принят с положительным отзывом. Финальная просьба по мобильному
      кадрированию не закрыта, а неработавший подбор проектов клиент удалил. Это
      не перенос Bitrix и не утверждение о полной копии референса."
