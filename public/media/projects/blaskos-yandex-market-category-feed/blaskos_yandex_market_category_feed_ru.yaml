title: Выгрузка выбранных категорий в Яндекс Маркет
tagline: Настроил выгрузку действующего магазина для подключения к Маркету.
  Владелец хотел управлять тем, какие категории попадают в файл, не правя XML
  вручную.
year: "11.2018"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - YML
  - Yandex Market
  - Product feeds
blocks:
  - type: text
    title: Задача и ограничения
    body: Настроил выгрузку действующего магазина для подключения к Маркету.
      Владелец хотел управлять тем, какие категории попадают в файл, не правя
      XML вручную.
  - type: text
    title: Как устроено решение
    body: Донастроил установленный плагин, передал адрес YML-файла и показал, где
      менять набор категорий. Разграничил управление выгрузкой в магазине и
      обработку предложений принимающей площадкой.
  - type: text
    title: Результат и проверка
    body: Клиент принял работу и в историческом отзыве подтвердил, что один из
      товаров появился в Маркете. Текущая модерация, количество предложений и
      продажи не проверялись.
