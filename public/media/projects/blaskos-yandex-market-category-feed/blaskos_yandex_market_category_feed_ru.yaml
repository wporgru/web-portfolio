title: Выгрузка выбранных категорий в Яндекс Маркет
tagline: Настроил выгрузку действующего магазина для подключения к Маркету.
  Владелец хотел управлять тем, какие категории попадают в файл, не правя XML
  вручную.
year: "11.2018"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - YML
  - Yandex Market
  - Product feeds
blocks:
  - type: text
    title: Выгрузка не всего каталога, а выбранных категорий
    body: >-
      Магазину Blaskos требовалась товарная выгрузка для Яндекс Маркета. Вместо разработки нового экспортера я настроил уже установленный плагин. Важная часть задачи — дать владельцу возможность выбирать категории без ручного редактирования YML.
  - type: text
    title: Передал файл и объяснил редактирование
    body: >-
      Передал адрес файла ym-export.yml, показал плагин и объяснил, где менять выбор категорий. Владелец получил не только ссылку для передачи площадке, но и способ самостоятельно управлять составом выгрузки в магазине.
  - type: text
    title: Разделил выгрузку и обработку площадкой
    body: >-
      Генерация фида и появление предложений на площадке — разные этапы. Клиент принял работу и сообщил в отзыве, что товар появился в Яндекс Маркете. Это подтверждение по одному товару со слов клиента, а не сверка всего каталога.
  - type: text
    title: Граница результата
    body: >-
      Работа касалась настройки существующего плагина, а не создания магазина или собственного экспортера. Полноту полей, число обработанных предложений, последующие продажи и текущую доступность фида этот кейс не подтверждает.
