title: Импорт предзаказа ANTA из трёх таблиц
tagline: "Настроил загрузку предзаказа ANTA из трёх источников: обуви, одежды и
  аксессуаров. Нужно было сохранить названия, разделы и размерные варианты."
year: "05.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - XLSX
  - Product variants
  - Preorders
blocks:
  - type: text
    title: Задача и ограничения
    body: "Настроил загрузку предзаказа ANTA из трёх источников: обуви, одежды и
      аксессуаров. Нужно было сохранить названия, разделы и размерные варианты."
  - type: text
    title: Как устроено решение
    body: Очистил пустые верхние строки, обнаружил лишний первый лист в таблице
      аксессуаров и повторил загрузку. После замечания клиента разобрал, как
      параметры импорта влияют на включение родительской категории, и подготовил
      настройки следующего запуска.
  - type: text
    title: Результат и проверка
    body: Клиент принял этап на тестовой площадке. Ожидаемые объёмы из задания не
      считаю проверенным числом карточек; доработку фотографий клиент взял на
      себя.
