title: Перенос страниц услуг и настройка редиректов
tagline: Перенести материалы из модулей темы WordPress в записи и рубрики,
  сохранив переходы со старых адресов.
role: Веб-разработка
year: "02.2026"
stack:
  - WordPress
  - Redirects
  - SEO
blocks:
  - type: text
    title: Задача
    body: Перенести материалы из модулей темы WordPress в записи и рубрики, сохранив
      переходы со старых адресов.
  - type: text
    title: Что сделано
    body: Перенёс согласованный набор материалов, согласовал структуру рубрик и
      настроил правила переадресации на основе регулярных выражений. В отчёте
      указана проверка пяти типов старых адресов.
  - type: text
    title: Как решалась задача
    body: До переноса услуги были привязаны к специальным модулям темы. После
      перехода на записи нужно было согласовать рубрики и правила для разных
      форм старых адресов. Клиент самостоятельно убрал дубли, а я настроил
      переадресации. Проверка пяти видов URL зафиксирована в отчёте; полный
      сравнительный обход всех страниц и индексация здесь не заявлены.
  - type: image
    title: Публичный вид сайта
    src: /media/projects/megawatt-content/site.png
    alt: Публичная версия сайта проекта
    caption: Снимок на дату проверки. Он показывает публичную версию сайта, а не
      обязательно вид на момент сдачи.
