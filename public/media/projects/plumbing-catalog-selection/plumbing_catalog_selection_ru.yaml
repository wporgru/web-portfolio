title: Отбор и импорт большого каталога сантехники
tagline: В магазине нужен был выбранный ассортимент, а не копия всего каталога
  поставщика. До загрузки требовалось согласовать бренды и ценовой отбор, а
  после — дать клиенту инструменты управления категориями.
year: "05.2025"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Excel
  - Web scraping
  - Taxonomy
blocks:
  - type: text
    title: Задача и ограничения
    body: В магазине нужен был выбранный ассортимент, а не копия всего каталога
      поставщика. До загрузки требовалось согласовать бренды и ценовой отбор, а
      после — дать клиенту инструменты управления категориями.
  - type: text
    title: Как устроено решение
    body: В первом отчёте по парсингу зафиксировал 176 828 позиций. Передал Excel и
      видео для отбора; клиент сократил рабочую выборку примерно до 45 тысяч.
      Продолжил импорт после согласованного расширения тарифа, объяснил различие
      между реальными атрибутами и текстовой вкладкой. Для объединения категорий
      и назначения родителей установил Term Management Tools и записал
      инструкцию.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил отображение при переходе в категорию и принял заказ.
      Позиции без загруженных фото оставались черновиками. Числа относятся к
      этапам подготовки, а не к подтверждённому количеству опубликованных
      товаров.
