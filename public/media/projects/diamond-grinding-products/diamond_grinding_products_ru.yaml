title: Подготовка и загрузка алмазных шлифовальных головок
tagline: Производителю нужно было пополнить конкретный раздел каталога. Важно
  было заранее определить, какие поля нужны не только для показа товара, но и
  для учёта и расчёта доставки.
year: "08.2026"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Excel
  - Product data
blocks:
  - type: text
    title: Задача и ограничения
    body: Производителю нужно было пополнить конкретный раздел каталога. Важно было
      заранее определить, какие поля нужны не только для показа товара, но и для
      учёта и расчёта доставки.
  - type: text
    title: Как устроено решение
    body: "Подготовил образец Excel на основе существующих карточек: название,
      описание, цена, артикул, остаток и размеры упаковки. Объяснил, как
      добавлять строки и что временно отсутствующий товар необязательно удалять
      из каталога. Клиент заполнил артикулы и актуальные остатки; после загрузки
      передал ему прямую ссылку на раздел шлифовальных головок."
  - type: text
    title: Результат и проверка
    body: Клиент принял пополнение каталога. Помимо опубликованного раздела у него
      осталась структура таблицы, по которой можно готовить новые позиции.
      Точное число карточек в отчёте не указано.
