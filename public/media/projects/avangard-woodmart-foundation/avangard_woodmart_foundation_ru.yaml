title: Стартовая настройка магазина Avangard Plus на WoodMart
tagline: Заказчику нужна была рабочая стартовая витрина, в которую можно
  добавлять собственный ассортимент. При этом следовало убрать мешающие гостям
  демо-элементы и согласовать мобильное оформление.
year: "02.2024"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - WoodMart
blocks:
  - type: text
    title: Задача и ограничения
    body: Заказчику нужна была рабочая стартовая витрина, в которую можно добавлять
      собственный ассортимент. При этом следовало убрать мешающие гостям
      демо-элементы и согласовать мобильное оформление.
  - type: text
    title: Как устроено решение
    body: Установил выбранное демо WoodMart. По просьбе клиента оставил минимальный
      набор расширений, отключил всплывающее окно для гостей и согласовал
      элементы шапки и мобильной панели. Вопрос переключения PHP разбирался с
      поддержкой хостинга, а не выдавался за отдельную серверную миграцию.
  - type: text
    title: Результат и проверка
    body: Клиент получил основу для дальнейшего наполнения. Состав действующего
      каталога, эквайринг и текущая конфигурация сервера этой работой не
      подтверждаются.
