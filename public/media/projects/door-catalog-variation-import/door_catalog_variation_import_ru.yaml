title: Импорт дверей с выбором цвета и размера
tagline: Перенёс категории и ассортимент дверей в WooCommerce. Покупатель должен
  был выбирать исполнение одной модели, а не искать нужный цвет среди
  дублирующих карточек.
year: "12.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - YML
  - Product variations
  - Taxonomy
blocks:
  - type: text
    title: Задача и ограничения
    body: Перенёс категории и ассортимент дверей в WooCommerce. Покупатель должен
      был выбирать исполнение одной модели, а не искать нужный цвет среди
      дублирующих карточек.
  - type: text
    title: Как устроено решение
    body: После первой загрузки проверил выбор цвета и согласовал тестовую
      сгруппированную карточку. Перезапустил импорт с другой обработкой
      изображений после замечаний о фотографиях размеров. Разобрал потерю
      характеристик и согласовал их возврат при следующем проходе. Для арок и
      порталов отдельно включил вывод вариаций как самостоятельных карточек.
  - type: text
    title: Результат и проверка
    body: "Заказ приняли. В переписке указано 3 320 вариаций в источнике: это не
      число родительских карточек или независимо проверенных опубликованных
      товаров."
