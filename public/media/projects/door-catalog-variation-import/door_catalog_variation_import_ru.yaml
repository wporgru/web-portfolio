title: Импорт дверей с выбором цвета и размера
tagline: Перенёс категории и ассортимент дверей в WooCommerce. Покупатель должен был выбирать
  исполнение одной модели, а не искать нужный цвет среди дублирующих карточек.
year: '12.2023'
role: Веб-разработка и автоматизация
stack:
- WooCommerce
- YML
- Product variations
- Taxonomy
blocks:
- type: text
  title: Каталог с вариантами исполнения
  body: Заказчик хотел загрузить выбранные двери, арки и порталы поставщика в WooCommerce, сохранив
    выбор цвета, размера и стороны открывания внутри моделей. Перенос всего ассортимента поставщика
    не требовался; отдельно нужно было разобраться с форматами выгрузки и характеристиками.
- type: text
  title: Группировка и проверка карточки
  body: Импортировал категории с подкатегориями и начал загрузку товаров. После первой загрузки
    проверили выбор цвета и согласовали тестовую сгруппированную карточку, чтобы варианты одной
    модели было удобнее находить вместе.
- type: text
  title: Изображения и характеристики
  body: После замечаний о фотографиях размеров перезапустил импорт с другой обработкой изображений.
    Разобрал потерю части характеристик и согласовал их возврат на следующем проходе. Для арок
    и порталов отдельно настроил вывод вариаций как самостоятельных карточек.
- type: text
  title: Результат и границы
  body: Заказ был принят. В переписке фигурировали 3 320 вариаций источника — это не число родительских
    товаров и не независимый подсчёт всех опубликованных карточек. Точный текущий состав каталога
    этим историческим результатом не подтверждён.
