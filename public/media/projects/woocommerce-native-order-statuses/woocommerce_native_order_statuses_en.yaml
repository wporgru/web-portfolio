blocks:
  - type: text
    title: Brief and constraints
    body: Simplified order handling for managers by restoring native statuses and
      separating order state from payment confirmation.
  - type: text
    title: How it works
    body: "Removed the extra status manager with client approval. Reviewed pickup,
      bank transfer and online payment separately: the same order label does not
      establish that funds were received in every workflow."
  - type: text
    title: Result and verification
    body: The client accepted the work. Bank reconciliation, QR invoices and a new
      payment provider were outside the scope.
