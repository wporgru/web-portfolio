title: Возврат штатных статусов заказов WooCommerce
tagline: Упростил работу менеджеров с заказами, вернув штатные статусы и отделив состояние заказа
  от подтверждения поступления денег.
year: '01.2024'
role: Веб-разработка и автоматизация
stack:
- WooCommerce
- Order management
- Payment workflows
blocks:
- type: text
  title: Проблема в обработке заказов
  body: В магазине автозапчастей менеджерам было важно отличать оформление заказа от фактического
    поступления денег. Дополнительный набор статусов усложнял работу, а разные способы оплаты
    требовали отдельных пояснений.
- type: text
  title: Что сделал
  body: По согласованию с заказчиком удалил дополнительный менеджер статусов и вернул штатную
    схему WooCommerce. Показал уведомление об изменении и отдельно разобрал сценарии самовывоза,
    перевода на счёт и онлайн-оплаты в конфигурации магазина.
- type: text
  title: Какую задачу решает такой подход
  body: 'Команде проще пользоваться понятным набором состояний, когда отдельно согласовано,
    кто и каким способом подтверждает получение денег. Один и тот же статус нельзя считать универсальным
    доказательством оплаты: его смысл зависит от настроек и платёжного модуля.'
- type: text
  title: Результат и границы
  body: Клиент принял работу и оставил отзыв о повторном сотрудничестве. Автоматическая банковская
    сверка, QR-счета и внедрение нового эквайринга в подтверждённый объём не входили.
- type: text
  title: Другой этап этого проекта
