title: Возврат штатных статусов заказов WooCommerce
tagline: Упростил работу менеджеров с заказами, вернув штатные статусы и отделив
  состояние заказа от подтверждения поступления денег.
year: "01.2024"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Order management
  - Payment workflows
blocks:
  - type: text
    title: Задача и ограничения
    body: Упростил работу менеджеров с заказами, вернув штатные статусы и отделив
      состояние заказа от подтверждения поступления денег.
  - type: text
    title: Как устроено решение
    body: "Убрал дополнительный менеджер статусов по согласованию с клиентом.
      Разобрал отдельно самовывоз, перевод на счёт и онлайн-оплату: одинаковая
      метка заказа не означает, что деньги уже получены во всех сценариях."
  - type: text
    title: Результат и проверка
    body: Клиент принял работу. Банковская сверка, QR-счета и новый эквайринг не
      внедрялись.
