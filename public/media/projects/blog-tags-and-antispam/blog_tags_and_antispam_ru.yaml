title: Исправление навигации блога и антиспам для заявок
tagline: При нажатии тега записи посетителя перебрасывало на главную вместо
  нужного раздела. Отдельно требовалось настроить защиту формы и сохранить
  возможность корректировать её по итогам наблюдения.
year: "04.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Forms
  - Spam prevention
blocks:
  - type: text
    title: Задача и ограничения
    body: При нажатии тега записи посетителя перебрасывало на главную вместо нужного
      раздела. Отдельно требовалось настроить защиту формы и сохранить
      возможность корректировать её по итогам наблюдения.
  - type: text
    title: Как устроено решение
    body: Исправил переходы с тегов, обсудил оформление кнопки и обязательность
      полей. Настроил антиспам-правила и временное наблюдение за заявками, чтобы
      при необходимости уточнить настройки на реальных примерах.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил результат и принял заказ. Долгосрочного замера доли
      спама и проверки всех каналов уведомлений не было.
