title: Комплект HTML-подписей для 47 сотрудников
tagline: Подготовил персональные подписи на основе макета клиента и передал
  обновлённый комплект из 47 HTML-файлов после замечаний по версии для Outlook.
year: "02.2026"
role: Вёрстка почтовых интерфейсов
stack:
  - HTML
  - CSS
  - Outlook
blocks:
  - type: text
    title: Задача
    body: Заказчик предоставил дизайн, логотипы и данные сотрудников. Нужны были
      персональные подписи, облегчённая версия под Outlook и материалы для
      установки.
  - type: text
    title: Подготовка и передача
    body: "Передал первый комплект: 47 HTML и 47 HTM-версий с сопутствующими
      файлами. Уточнил ОС и версию Outlook, запросил исходный чёрный логотип и
      по замечаниям доработал оформление и контактные ссылки. В финальном архиве
      — 47 HTML-файлов."
  - type: text
    title: Что проверили
    body: Во всех финальных файлах проверено наличие таблиц и телефонных ссылок.
      Логотип и значок загружались по внешним адресам; в браузерном образце оба
      появились. Это не проверка всего комплекта в Outlook и не подтверждение
      корректности данных каждого сотрудника.
  - type: text
    title: Итог и границы
    body: Передача архива подтверждена. Заказ закрылся автоматически; отдельного
      подтверждения последней версии нет. Файлы с рабочими контактами и исходный
      снимок в публичный кейс не перенесены.
