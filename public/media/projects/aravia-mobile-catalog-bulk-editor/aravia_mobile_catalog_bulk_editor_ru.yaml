title: "Aravia: мобильный каталог и пакетное редактирование"
tagline: Развил существующую витрину после настройки доставки. Задача затронула
  мобильный поиск товаров, видимость остатков, корзину и редактирование
  ассортимента из админки.
year: "05.2021"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - BEAR
  - Mobile UX
  - Stock visibility
blocks:
  - type: text
    title: Задача и ограничения
    body: Развил существующую витрину после настройки доставки. Задача затронула
      мобильный поиск товаров, видимость остатков, корзину и редактирование
      ассортимента из админки.
  - type: text
    title: Как устроено решение
    body: Доработал мобильные блоки аксессуаров, перенёс новости ниже каталога,
      настроил значок фильтра и скрыл сортировку только на телефонах. Настроил
      приоритет общего наличия и снял неработающий экспериментальный фильтр.
      Исправлял изменение количества в корзине, установил BEAR и объяснил
      владельцу профили, категории и пакетное изменение цен. На этапе проверки
      оформления вернул поле индекса и стоимость доставки по замечанию клиента.
  - type: text
    title: Результат и проверка
    body: Клиент принял этап и оставил бонус. Остатки по отдельным точкам, массовые
      рекомендации и реальная оплата не входили в подтверждённый результат.
