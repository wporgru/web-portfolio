title: "Каталог медоборудования: импорт и мобильные миниатюры"
tagline: Импортировать предоставленный каталог медоборудования и исправить
  увеличивающиеся миниатюры товаров на телефонах.
role: Веб-разработка
year: "03.2018"
stack:
  - Product import
  - Responsive CSS
  - E-commerce
blocks:
  - type: text
    title: Задача
    body: Импортировать предоставленный каталог медоборудования и исправить
      увеличивающиеся миниатюры товаров на телефонах.
  - type: text
    title: Что сделано
    body: Сообщил об импорте 3 325 товаров и исправил мобильные миниатюры; заказчик
      подтвердил изменения и принял этап.
  - type: text
    title: Как решалась задача
    body: "Загрузил предоставленный файл каталога и сообщил о 3 325 товарах.
      Родительская иерархия категорий автоматически не восстановилась: после
      обсуждения заказчик согласился создать и распределить категории
      самостоятельно. Затем исправил слишком крупные миниатюры с помощью
      настроек размера и CSS для экранов до 991 px; в этом диапазоне карусель
      была скрыта. Клиент подтвердил исправление и отметил в отзыве импорт более
      3 000 товаров. Число 3 325 не пересчитано независимо, полнота товарных
      полей и оплата отдельно не проверялись."
