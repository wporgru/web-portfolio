title: "SALT SWITCH: доставка и счета для двух магазинов"
tagline: Настроил уведомления, счета и доставку для двух действующих витрин SALT
  SWITCH. Нужно было раздельно проверить письма и расчёты, не принимая неудачную
  транзакцию за сбой генерации счёта.
year: "11.2021"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Shipping zones
  - Invoices
  - Transactional email
blocks:
  - type: text
    title: Задача и ограничения
    body: Настроил уведомления, счета и доставку для двух действующих витрин SALT
      SWITCH. Нужно было раздельно проверить письма и расчёты, не принимая
      неудачную транзакцию за сбой генерации счёта.
  - type: text
    title: Как устроено решение
    body: Отключил PayPal по запросу, проверил поступление уведомления для
      французской витрины и временно использовал оплату чеком для проверки счёта
      на второй. После правки клиент подтвердил два письма. Настроил три зоны
      доставки — Францию, остальную Европу и другие страны — и согласованный
      вывод включённого налога в оформлении.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил расчёт и принял работу. Успешное списание через Viva
      Wallet архив не подтверждает, а историческая налоговая настройка не
      является проверкой всех стран.
  - type: text
    title: Другой этап этого проекта
    links:
