title: "SEO-дашборд: аналитика и история индексации"
tagline: Показатели трафика, выдачи, рерайтов и отправки на переобход хранились
  в разных сервисах. Нужен был локальный инструмент для сравнения периодов и
  диагностики просадок без записи в CMS.
year: "2026"
role: Веб-разработка и автоматизация
stack:
  - Python
  - SQLite
  - REST API
blocks:
  - type: text
    title: Задача и ограничения
    body: Показатели трафика, выдачи, рерайтов и отправки на переобход хранились в
      разных сервисах. Нужен был локальный инструмент для сравнения периодов и
      диагностики просадок без записи в CMS.
  - type: text
    title: Как устроено решение
    body: Подключил Яндекс Вебмастер, Метрику, Google Search Console и GA4. Сохранил
      снимки и историю изменений в SQLite, добавил раздельные представления для
      запросов, URL и причин исключения. Для рерайтов связал даты правок из
      таблицы с окнами наблюдения до и после.
  - type: text
    title: Результат и проверка
    body: Автоматический сбор не изменяет сайт и не отправляет страницы на
      переобход. Отправка запускается явно, с записью ответа каждого сервиса.
      При сбое старые данные не обнуляются; неполная выгрузка отмечается
      отдельно.
