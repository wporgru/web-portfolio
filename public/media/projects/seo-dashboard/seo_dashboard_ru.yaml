title: "SEO-дашборд: аналитика и история индексации"
tagline: Показатели трафика, выдачи, рерайтов и отправки на переобход хранились в разных
  сервисах. Нужен был локальный инструмент для сравнения периодов и диагностики просадок
  без записи в CMS.
year: "2026"
role: Веб-разработка и автоматизация
stack:
  - Python
  - SQLite
  - REST API
blocks:
  - type: text
    title: "Задача: свести SEO-данные без изменения сайта"
    body: Показы, запросы, состояние страниц и даты правок лежали в нескольких кабинетах и
      таблице. Нужен был локальный инструмент, который помогает сопоставлять периоды и
      видеть причины исключения страниц, не меняя WordPress и не подменяя показатели
      разных систем.
  - type: text
    title: Данные из разных сервисов — раздельно и с историей
    body: "Подключил Яндекс Вебмастер, Метрику, Google Search Console, GA4 и таблицу дат
      рерайтов. Снимки хранятся в SQLite: можно открыть ранее сохранённые дни, которые уже
      вышли из доступного окна API. Запросы, страницы и причины исключения вынесены в
      отдельные представления; показатели Google не смешиваются с Яндексом. Если API
      возвращает неполный набор, он отмечается как частичный."
  - type: text
    title: Сравнение правок без выдуманных данных
    body: Для материалов из таблицы сопоставил даты рерайта с доступными окнами наблюдения до
      и после. Если исторического снимка нет, интерфейс показывает пропуск, а не
      подставляет ноль. Средняя позиция показа из API Яндекса не выдаётся за отдельный
      региональный съём выдачи, а общий трафик Метрики — за органические переходы.
  - type: text
    title: Переобход отдельно от сбора
    body: Обычная синхронизация читает данные и не отправляет URL на переобход. Отправка
      запускается отдельным явным действием для выбранных адресов; ответы сервисов
      сохраняются раздельно. Принятое уведомление не доказывает обход или индексацию. При
      сбоях сохранённые ранее данные не обнуляются, а неполный результат не маскируется
      под полный.
  - type: text
    title: Другой этап этого проекта
    links:
      - label: "Связанный модуль: история спроса и Google Trends"
        url: /showcase/trends-search-demand-history/
  - type: text
    title: Что получает владелец сайта
    body: "Локальный инструмент объединяет историю измерений и контекст правок в одном
      интерфейсе, но не гарантирует роста позиций и не восстанавливает данные до начала
      сохранения. Если у вас расходятся отчёты поисковых систем и аналитики, пришлите
      пример вопроса, период и список используемых источников: сначала определим
      сопоставимые показатели и границы данных."
