title: "Sugarlips: меню на основе товарных категорий"
tagline: После импорта ассортимента настроил меню так, чтобы пункты открывали
  товарные разделы, а не обычные страницы с теми же названиями.
year: "12.2021"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - WordPress
  - Product taxonomy
  - Navigation
blocks:
  - type: text
    title: Задача и ограничения
    body: После импорта ассортимента настроил меню так, чтобы пункты открывали
      товарные разделы, а не обычные страницы с теми же названиями.
  - type: text
    title: Как устроено решение
    body: "Разъяснил различие между страницей WordPress и архивом товарной
      категории. Перенастроил переходы к действующим разделам WooCommerce и
      передал их на проверку. Задачу отделил от обновления ассортимента: здесь
      менялся путь от меню к товарам, а не источник данных."
  - type: text
    title: Результат и проверка
    body: Клиент проверил переходы и принял работу. Загрузку новых товаров и
      расписание обновления этот этап не менял.
  - type: text
    title: Другой этап этого проекта
    links:
      - label: "Предыдущий этап: импорт CSV поставщика"
        url: /showcase/sugarlips-supplier-csv-import/
