title: Восстановление WordPress после заражения сайта
tagline: Помимо очистки требовалось вернуть доступ к админке и объяснить
  хостингу, какие меры уже приняты. Ограничения провайдера нельзя было снять
  правками внутри WordPress.
year: "07.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - MySQL
  - Incident recovery
blocks:
  - type: text
    title: Задача и ограничения
    body: Помимо очистки требовалось вернуть доступ к админке и объяснить хостингу,
      какие меры уже приняты. Ограничения провайдера нельзя было снять правками
      внутри WordPress.
  - type: text
    title: Как устроено решение
    body: По отчёту восстановил сайт из чистой копии, обновил WordPress и уязвимые
      компоненты, удалил вредоносные файлы и скрытый плагин. Сообщил об
      обновлении MySQL до восьмой ветки и подготовил текст обращения для снятия
      блокировки.
  - type: text
    title: Результат и проверка
    body: "Административный доступ восстановлен по отчёту. Заказ закрыт
      автоматически, но на момент последнего сообщения ограничения исходящих
      соединений оставались: почта и автообновления не выдаются за
      восстановленные."
