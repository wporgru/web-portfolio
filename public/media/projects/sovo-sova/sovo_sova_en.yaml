title: "Sovo Sova: WooCommerce redesign on WoodMart"
tagline: Prepared a WooCommerce redesign on staging with a WoodMart homepage, article section
  and interface translation. The client accepted phase one without a production cutover.
role: Web development
year: "10.2025"
stack:
  - WordPress
  - WooCommerce
  - WoodMart
blocks:
  - type: text
    title: Started without switching the live store
    body: I prepared the first redesign phase on the staging copy at covocova.webtm.ru. Instead of
      a clean install, I worked with the existing products, articles and URLs under WoodMart.
      The live domain was not switched during this phase.
  - type: text
    title: Connected the catalog and editorial content
    body: I presented a new homepage, added the article section and agreed on the post order
      because the latest article lacked a cover. I replaced the icon with the Sovo Sova
      wordmark and translated visible English interface strings.
  - type: text
    title: Kept the redesign separate from SEO migration
    body: The handover reported that unnecessary plugins were disabled and existing URLs retained.
      I intentionally kept the SEO plugin until its settings migration was agreed. No complete
      before-and-after URL crawl was performed, so unchanged rankings are not claimed.
  - type: text
    title: Handed over phase one and showed how to edit pages
    body: I showed the client where to edit the pages they planned to manage. The client accepted
      the first phase and left a review. That acceptance does not establish a production
      cutover, a full SEO migration or database optimization.
