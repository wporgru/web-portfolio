blocks:
  - type: text
    title: Brief
    body: Refresh the storefront while retaining existing URLs.
  - type: text
    title: Work delivered
    body: Built a new homepage on staging, added articles and translated visible
      interface strings. The handoff reported that URLs were retained; the final
      domain switch was outside the confirmed stage.
  - type: text
    title: Implementation and scope
    body: Used a staging copy instead of a clean install so the new theme could be
      tested with existing products, articles and URLs. Added news to the
      homepage, reviewed the order of posts when the newest one lacked a cover
      and replaced the icon with a wordmark. Translated visible English strings
      and left the SEO plugin in place pending a separate decision about its
      settings. Showed the client where to edit the pages they planned to
      maintain. The client accepted phase one; production cutover and full SEO
      settings migration are outside this result.
