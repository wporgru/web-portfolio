title: "«Сово Сова»: редизайн на WoodMart"
tagline: Обновить витрину магазина с сохранением прежних ссылок.
role: Веб-разработка
year: "10.2025"
stack:
  - WordPress
  - WooCommerce
  - WoodMart
blocks:
  - type: text
    title: Задача
    body: Обновить витрину магазина с сохранением прежних ссылок.
  - type: text
    title: Что сделано
    body: Подготовил новую главную на технической копии, добавил статьи и перевёл
      видимые фразы интерфейса. При сдаче сообщил о сохранении адресов;
      окончательное переключение домена не входило в подтверждённый этап.
  - type: text
    title: Как решалась задача
    body: Взял техническую копию вместо чистой установки, чтобы проверить новую тему
      с существующими товарами, статьями и адресами. На главной добавил новости,
      согласовал порядок публикаций с учётом отсутствующей обложки у свежей
      статьи и заменил значок текстовым названием. Перевёл видимые английские
      фразы и оставил SEO-плагин до отдельного решения по его настройкам.
      Показал, где редактировать страницы, которые заказчик хотел вести сам.
      Клиент принял первый этап; финальное переключение домена и полный перенос
      SEO-настроек в этот результат не входят.
  - type: text
    title: Главная из архива проекта
    links:
      - label: Оригинал в портфолио Kwork
        url: https://kwork.ru/portfolio/19774603
  - type: image
    src: /media/projects/sovo-sova/archive-homepage.webp
    alt: "Главная «Сово Сова» на WoodMart: категории, товары, новости и подвал"
    caption: Архивная главная целиком, 1400 × 3744, опубликована 25 ноября 2025
      года. На снимке виден результат оформления витрины; адрес открытой
      страницы не установлен, поэтому снимок не подтверждает переключение
      основного домена.
  - type: image
    title: Публичный вид сайта
    src: /media/projects/sovo-sova/site.png
    alt: Публичная версия сайта проекта
    caption: Снимок на дату проверки. Он показывает публичную версию сайта, а не
      обязательно вид на момент сдачи.
