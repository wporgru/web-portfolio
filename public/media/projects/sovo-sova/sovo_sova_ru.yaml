title: "«Сово Сова»: редизайн на WoodMart"
tagline: "Подготовил редизайн WooCommerce на копии: новая главная WoodMart, блок статей и
  перевод интерфейса. Клиент принял первый этап без переключения основного домена."
role: Веб-разработка
year: "10.2025"
stack:
  - WordPress
  - WooCommerce
  - WoodMart
blocks:
  - type: text
    title: "Старт: рабочий магазин оставили на месте"
    body: Подготовил первый этап редизайна на технической копии covocova.webtm.ru. Вместо чистой
      установки проверял WoodMart на существующих товарах, статьях и адресах. Основную
      площадку на время этого этапа не переключали.
  - type: text
    title: "Главная: связал каталог и публикации"
    body: Представил новый вариант главной, добавил блок статей и согласовал порядок публикаций с
      учётом того, что у свежего материала не было обложки. Заменил значок текстовым названием
      «Сово Сова» и перевёл видимые английские надписи интерфейса.
  - type: text
    title: "Плагины и адреса: отделил обновление от миграции SEO"
    body: В отчёте о сдаче отметил отключение лишних плагинов и сохранение прежних ссылок.
      SEO-плагин оставил намеренно, пока не принято решение о переносе его настроек. Сплошного
      сравнения URL до и после не было, поэтому не заявляю отсутствие потерь позиций.
  - type: text
    title: "Приёмка: клиент получил первый этап и инструктаж"
    body: Показал, где менять страницы, которые клиент хотел вести сам. Заказчик принял первый
      этап и оставил отзыв. Переключение основного домена, полная миграция SEO и оптимизация
      базы этой приёмкой не подтверждены.
  - type: text
    title: Главная из архива проекта
    links:
      - label: Оригинал в портфолио Kwork
        url: https://kwork.ru/portfolio/19774603
  - type: image
    src: /media/projects/sovo-sova/archive-homepage.webp
    alt: "Главная «Сово Сова» на WoodMart: категории, товары, новости и подвал"
    caption: Архивная главная целиком, 1400 × 3744, опубликована 25 ноября 2025 года. На снимке
      виден результат оформления витрины; адрес открытой страницы не установлен, поэтому
      снимок не подтверждает переключение основного домена.
  - type: image
    title: Публичный вид сайта
    src: /media/projects/sovo-sova/site.png
    alt: Публичная версия сайта проекта
    caption: Снимок на дату проверки. Он показывает публичную версию сайта, а не обязательно вид
      на момент сдачи.
  - type: text
    title: "Для сравнения: комплексный редизайн действующего магазина"
    links:
