title: "«Сово Сова»: редизайн на WoodMart"
tagline: Обновить витрину магазина с сохранением прежних ссылок.
role: Веб-разработка
year: "10.2025"
stack:
  - WordPress
  - WooCommerce
  - WoodMart
blocks:
  - type: text
    title: Задача
    body: Обновить витрину магазина с сохранением прежних ссылок.
  - type: text
    title: Что сделано
    body: Подготовил новую главную на технической копии, добавил статьи и перевёл
      видимые фразы интерфейса. При сдаче сообщил о сохранении адресов;
      окончательное переключение домена не входило в подтверждённый этап.
  - type: text
    title: Как решалась задача
    body: Работал на технической копии, чтобы не менять действующую витрину до
      согласования. Добавил статьи на главную, уточнил порядок публикаций и
      заменил значок текстовым названием. Существующий SEO-плагин оставил на
      месте до отдельного решения по настройкам. Заказчик принял первый этап;
      перенос настроек и переключение домена не выдаю за выполненные работы.
  - type: image
    title: Публичный вид сайта
    src: /media/projects/sovo-sova/site.png
    alt: Публичная версия сайта проекта
    caption: Снимок на дату проверки. Он показывает публичную версию сайта, а не
      обязательно вид на момент сдачи.
