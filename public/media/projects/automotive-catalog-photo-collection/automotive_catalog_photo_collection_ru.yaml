title: Автоматический сбор фотографий каталога автотоваров
tagline: Заказчику нужен был набор товарных фотографий, пригодный для повторного
  использования. Плоский архив затруднил бы поиск изображений конкретного
  автомобиля и позиции.
year: "05.2025"
role: Веб-разработка и автоматизация
stack:
  - Catalog extraction
  - Product media
  - Data organization
blocks:
  - type: text
    title: Задача и ограничения
    body: Заказчику нужен был набор товарных фотографий, пригодный для повторного
      использования. Плоский архив затруднил бы поиск изображений конкретного
      автомобиля и позиции.
  - type: text
    title: Как устроено решение
    body: "Автоматизировал сбор фотографий и разложил их по структуре каталога:
      марка, модель, товар. Передал результат через облачную папку, после
      замечаний подготовил повторную выдачу и по запросу ещё раз предоставил
      ссылку."
  - type: text
    title: Результат и проверка
    body: Итоговая выдача принята в отдельном заказе. Количество файлов и
      сохранность облачного архива сейчас не подтверждены; работу описываю как
      сбор и систематизацию, а не фотосъёмку.
