title: Redirects and broken links on a three-language site
tagline: Refined search-facing navigation across the Polish, English and Russian
  versions of BGT Group. The goal was not to eliminate every 301 but to
  distinguish faulty links from useful URL normalization.
year: "01.2024"
role: Web development and automation
stack:
  - WordPress
  - Technical SEO
  - Redirects
