blocks:
  - type: text
    title: Brief and constraints
    body: Refined search-facing navigation across the Polish, English and Russian
      versions of BGT Group. The goal was not to eliminate every 301 but to
      distinguish faulty links from useful URL normalization.
  - type: text
    title: How it works
    body: Documented fixes for identified 404s and reviewed redirecting links
      individually. Removed author archive links after feedback. Kept the
      redirect from language URLs without a trailing slash to the agreed form
      and explained why it was intentional. Shared PageSpeed reports and a video
      walkthrough.
  - type: text
    title: Result and verification
    body: The client accepted the work. This was one multilingual website, not three
      launches. Final PageSpeed scores, a complete count of alt-text fixes and
      traffic gains were not verified.
