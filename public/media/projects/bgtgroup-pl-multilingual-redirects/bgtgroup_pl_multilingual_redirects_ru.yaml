title: Редиректы и битые ссылки трёх языковых версий
tagline: Доработал поисковую навигацию польской, английской и русской версий BGT
  Group. Задача была не убрать все ответы 301, а отличить ошибочные переходы от
  нужной нормализации адресов.
year: "01.2024"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Technical SEO
  - Redirects
  - Localization
blocks:
  - type: text
    title: Задача и ограничения
    body: Доработал поисковую навигацию польской, английской и русской версий BGT
      Group. Задача была не убрать все ответы 301, а отличить ошибочные переходы
      от нужной нормализации адресов.
  - type: text
    title: Как устроено решение
    body: По отчёту устранил обнаруженные 404 и вручную разобрал переходы через
      редиректы. После обратной связи убрал ссылки на авторские архивы. Для
      языковых адресов без завершающего слеша сохранил переход на согласованный
      вариант и объяснил его назначение. Передал ссылки на проверки PageSpeed и
      видео.
  - type: text
    title: Результат и проверка
    body: Клиент принял работу. Это один многоязычный сайт, а не три отдельных
      запуска. Итоговые баллы PageSpeed, полный список исправленных ALT и рост
      трафика не подтверждены.
  - type: text
    title: Связанный проект
    links:
      - label: "Другой сайт BGT Group: техническое SEO и скорость"
        url: /showcase/bgtgroup-technical-seo-performance/
