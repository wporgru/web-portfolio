title: Настройка кондитерского магазина на WoodMart
tagline: Подготовил основу кондитерского магазина и проверил, что заказ доходит
  до почты. Клиенту был нужен простой сценарий с оплатой при получении, без
  обязательного эквайринга.
year: "04.2021"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - WoodMart
  - Local delivery
  - Transactional email
blocks:
  - type: text
    title: Задача и ограничения
    body: Подготовил основу кондитерского магазина и проверил, что заказ доходит до
      почты. Клиенту был нужен простой сценарий с оплатой при получении, без
      обязательного эквайринга.
  - type: text
    title: Как устроено решение
    body: На первой площадке обнаружил критическую несовместимость расширения
      каталога и отключил его. Для нового проекта согласовал оформление и
      категории, настроил интерфейс и варианты получения. Когда выяснилось, что
      вместо эквайринга нужен обычный перевод, исключил онлайн-оплату из сдачи и
      проверил оформление с письмом.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил получение письма и принял основу магазина. Массовое
      наполнение, боевая оплата и проверка всех служб доставки в эту сдачу не
      входили.
