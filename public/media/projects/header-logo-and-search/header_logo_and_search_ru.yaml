title: Исправление логотипа и замена поиска в шапке сайта
tagline: Посетитель должен быстро возвращаться на главную и пользоваться поиском
  из шапки. В этом заказе требовалась точечная правка двух элементов, а не новый
  дизайн всего сайта.
year: "05.2026"
role: Веб-разработка и автоматизация
stack:
  - Web development
  - Site navigation
blocks:
  - type: text
    title: Задача и ограничения
    body: Посетитель должен быстро возвращаться на главную и пользоваться поиском из
      шапки. В этом заказе требовалась точечная правка двух элементов, а не
      новый дизайн всего сайта.
  - type: text
    title: Как устроено решение
    body: Исправил переход по логотипу и заменил поиск. Перед оформлением заказа
      предложил клиенту проверить оба действия отдельно, чтобы в приёмку входила
      работа элементов, а не только их внешний вид.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил работу двух элементов и принял заказ. Точный CSS или
      JS-механизм в архиве не раскрыт; он не додуман задним числом.
