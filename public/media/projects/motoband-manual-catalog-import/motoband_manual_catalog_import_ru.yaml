title: "Motoband: импорт мототоваров с ручным обновлением"
tagline: Перенести мототовары в WooCommerce и дать владельцу управляемое
  обновление цен, наличия и новых позиций.
role: Веб-разработка
year: "07.2018"
stack:
  - WooCommerce
  - WP All Import
  - Product feeds
blocks:
  - type: text
    title: Задача
    body: Перенести мототовары в WooCommerce и дать владельцу управляемое обновление
      цен, наличия и новых позиций.
  - type: text
    title: Что сделано
    body: Настроил импорт и ручной запуск обновления, согласовал перевод исчезнувших
      позиций в черновики и передал инструкцию.
  - type: text
    title: Как решалась задача
    body: "Подготовил шаблон WP All Import, запустил загрузку и показал заказчику
      пример карточки. После остановок импорта сообщил о завершении и согласовал
      правила повторного запуска: обновлять цены и наличие, добавлять новые
      позиции, исчезнувшие переводить в черновики. Клиент выбрал запуск примерно
      раз в неделю вручную, без cron. Передал последовательность All Import →
      Manage Imports → Run Import и ожидание Import Complete. Заказ принят.
      Обсуждавшиеся 12 000 изображений были оценкой необходимого места, а не
      финальным пересчётом; полнота данных и последующие запуски отдельно не
      подтверждены."
