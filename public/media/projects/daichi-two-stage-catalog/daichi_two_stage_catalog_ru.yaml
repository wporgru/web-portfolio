title: Импорт ассортимента Daichi через двухчастный API
tagline: Для магазина климатического оборудования требовались не только товары и
  цены, но и характеристики с изображениями. Поставщик отдавал эти данные
  раздельно, а категории нужно было согласовать со структурой магазина.
year: "04.2025"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - API integration
  - Product data
blocks:
  - type: text
    title: Задача и ограничения
    body: Для магазина климатического оборудования требовались не только товары и
      цены, но и характеристики с изображениями. Поставщик отдавал эти данные
      раздельно, а категории нужно было согласовать со структурой магазина.
  - type: text
    title: Как устроено решение
    body: "Нашёл доступный API и разобрал схему: сначала товары и цены, затем
      характеристики и изображения из второй части, в том числе с постраничной
      загрузкой. Согласовал использование изображений из API вместо клиентских
      заготовок и передал результат на проверку."
  - type: text
    title: Результат и проверка
    body: Клиент проверил результат, уточнил работу с подкатегориями и принял заказ.
      Точное число загруженных товаров, полнота всех страниц API и регулярное
      расписание не подтверждены.
