title: Редактируемая главная WordPress по макету на Astra
tagline: Клиенту требовалось перенести выбранный дизайн на WordPress, но
  сохранить возможность самостоятельно обновлять шапку, меню и содержание
  главной. Важно было отделить сквозные элементы сайта от блоков конкретной
  страницы.
year: "10.2025"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Astra
  - Responsive layout
blocks:
  - type: text
    title: Задача и ограничения
    body: Клиенту требовалось перенести выбранный дизайн на WordPress, но сохранить
      возможность самостоятельно обновлять шапку, меню и содержание главной.
      Важно было отделить сквозные элементы сайта от блоков конкретной страницы.
  - type: text
    title: Как устроено решение
    body: Собрал промежуточные варианты и согласовал, где заканчивается сквозная
      шапка и начинается первый блок страницы. После замечания о лишних пунктах
      назначил основное меню мобильной области вне холста и согласовал его с
      навигацией подвала. Показал, где редактировать шапку, подвал и мобильное
      меню в Astra и WordPress.
  - type: text
    title: Результат и проверка
    body: Клиент принял вёрстку и подтвердил соответствие выбранному виду. Результат
      — главная и редактируемый шаблон, а не разработка остальных страниц
      магазина или тест оплаты.
