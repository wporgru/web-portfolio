title: Импорт каталога курсов учебного центра из Excel
tagline: Учебному центру нужно было перенести подготовленный каталог в категории
  сайта. Источником служила большая клиентская таблица, а не готовая база LMS.
year: "05.2025"
role: Веб-разработка и автоматизация
stack:
  - Excel
  - WordPress
  - Content import
blocks:
  - type: text
    title: Задача и ограничения
    body: Учебному центру нужно было перенести подготовленный каталог в категории
      сайта. Источником служила большая клиентская таблица, а не готовая база
      LMS.
  - type: text
    title: Как устроено решение
    body: Работал с основной таблицей около 54 МБ и тестовым файлом. Подготовил
      перенос в WordPress и внёс дополнительные корректировки цены и TITLE по
      ходу согласования. На сдаче клиент получил каталог для проверки в новой
      структуре.
  - type: text
    title: Результат и проверка
    body: Клиент принял результат и отметил реакцию на правки и сдачу раньше срока.
      Число курсов не пересчитывалось; платёжная часть и доступ к урокам не
      заявляются.
