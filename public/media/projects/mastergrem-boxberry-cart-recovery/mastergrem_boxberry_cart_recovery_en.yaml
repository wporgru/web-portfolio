title: "Mastergrem: alternate delivery and add-to-cart recovery"
tagline: When CDEK was having problems, the store wanted to add Boxberry without
  losing online checkout. Products also stopped going into the cart, so
  customers could not reach shipping selection at all.
year: "05.2024"
role: Web development and automation
stack:
  - WooCommerce
  - Boxberry
  - CDEK
  - Shipping
  - Cart
blocks:
  - type: text
    title: Brief and constraints
    body: When CDEK was having problems, the store wanted to add Boxberry without
      losing online checkout. Products also stopped going into the cart, so
      customers could not reach shipping selection at all.
  - type: text
    title: How it works
    body: Configured the agreed Boxberry options and handed them over for review.
      Disabled the affected CDEK module to restore add-to-cart. Explained that
      the Boxberry setup did not reproduce the previous shipping subsidy rule,
      and that re-enabling CDEK would require a separate check.
  - type: text
    title: Result and verification
    body: The client accepted the setup. The case confirms the alternate shipping
      setup and cart recovery, not a repair of CDEK, exhaustive rate coverage, a
      real shipment or a new control payment.
