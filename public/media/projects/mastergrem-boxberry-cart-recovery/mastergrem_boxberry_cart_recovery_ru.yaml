title: "Mastergrem: резервная доставка и ремонт корзины"
tagline: При проблемах с СДЭК магазин хотел подключить Boxberry и не потерять
  онлайн-оформление. Одновременно товар перестал добавляться в корзину —
  покупатель не мог добраться даже до выбора доставки.
year: "05.2024"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Boxberry
  - CDEK
  - Shipping
  - Cart
blocks:
  - type: text
    title: Задача и ограничения
    body: При проблемах с СДЭК магазин хотел подключить Boxberry и не потерять
      онлайн-оформление. Одновременно товар перестал добавляться в корзину —
      покупатель не мог добраться даже до выбора доставки.
  - type: text
    title: Как устроено решение
    body: Настроил согласованные варианты Boxberry и передал их на проверку. Для
      восстановления добавления в корзину отключил проблемный модуль СДЭК.
      Объяснил, что использованная настройка Boxberry не повторяла прежнее
      правило компенсации доставки и что обратное включение СДЭК нужно проверять
      отдельно.
  - type: text
    title: Результат и проверка
    body: Клиент принял настройку. Кейс подтверждает смену доступного способа и
      восстановление корзины, но не ремонт СДЭК, все тарифы, реальное
      отправление или новый контрольный платёж.
