title: Новая витрина чайного магазина с объединением каталогов
tagline: Перенести ассортимент из старого WooCommerce и добавить товары
  поставщика в новый магазин.
role: Веб-разработка
year: "10.2025"
stack:
  - WordPress
  - WooCommerce
  - WoodMart
blocks:
  - type: text
    title: Задача
    body: Перенести ассортимент из старого WooCommerce и добавить товары поставщика
      в новый магазин.
  - type: text
    title: Что сделано
    body: Подобрал совместимые средства экспорта, загрузил оба ассортимента и
      разобрал дубли категорий. Передал правила редиректов для старых адресов;
      их включение на старом хостинге отдельно не подтверждено.
  - type: text
    title: Как решалась задача
    body: Старый WooCommerce ограничивал выбор экспортных инструментов, поэтому
      использовал совместимые версии вместо рискованного обновления исходника.
      При объединении каталогов обнаружились одноимённые категории с разными
      данными. После загрузки убрал сегмент /shop/ из структуры и выяснил, что
      часть описаний скрывал шаблон, а не сам импорт. Дальнейшая замена
      материалов бренда оставалась у клиента.
  - type: image
    title: Публичный вид сайта
    src: /media/projects/tea-shop/site.png
    alt: Публичная версия сайта проекта
    caption: Снимок на дату проверки. Он показывает публичную версию сайта, а не
      обязательно вид на момент сдачи.
