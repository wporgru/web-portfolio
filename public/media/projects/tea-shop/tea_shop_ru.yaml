title: Чайный магазин WooCommerce — перенос и объединение каталогов
tagline: Собрал на новом домене витрину WoodMart из двух ассортиментных
  источников — старого магазина и поставщика. Восстановил отображение описаний
  товаров и подготовил правила переадресации для будущего переключения.
role: Веб-разработка
year: "10.2025"
stack:
  - WordPress
  - WooCommerce
  - WoodMart
blocks:
  - type: text
    title: Как забрать каталог без обновления старого магазина
    body: Старый WooCommerce ограничивал выбор средств экспорта. Подобрал
      совместимые версии инструментов, выгрузил существующие товары и не стал
      обновлять рабочий исходник ради единственного переноса. Отдельно загрузил
      ассортимент поставщика. Так новый магазин получил оба источника, а старый
      не пришлось менять до согласования переключения.
  - type: text
    title: Почему импортированные описания казались пустыми
    body: В одноимённых категориях отличалось наполнение — в одной копии были
      товары, в другой описание. Разобрал это расхождение при объединении,
      часть ручной раскладки оставалась у клиента. Когда в новой витрине
      перестали отображаться товарные описания, сначала проверил данные и
      нашёл причину в макете. Отключил скрывавший их шаблон, и клиент
      подтвердил, что описания снова видны.
  - type: text
    title: Подготовил адреса и передал витрину клиенту
    body: Убрал лишний сегмент /shop/ из новых адресов. Для старого домена
      передал разные правила для карточек товаров и остальных страниц.
      Клиент принял этап; перенос страниц и статей, замена материалов бренда
      и решение об открытии индексации оставались у него. Применение правил
      на старом хостинге и сохранение позиций этим этапом не подтверждены.
  - type: image
    title: Публичный вид сайта
    src: /media/projects/tea-shop/site.png
    alt: Публичная витрина чайного магазина после переноса каталога
    caption: Снимок на дату проверки. Он показывает публичную версию сайта, а не
      обязательно вид на момент сдачи.
  - type: text
    title: Если нужно объединить два ассортимента
    body: Пришлите два примера товарных карточек и покажите, из какого источника
      брать цену, описание и фото при совпадении артикула. Для переноса домена
      добавьте список старых адресов, которые важно сохранить или перенаправить.
