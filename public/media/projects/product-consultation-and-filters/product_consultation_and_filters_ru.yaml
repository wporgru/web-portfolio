title: Форма консультации и фильтры магазина WooCommerce
tagline: Доработал карточку товара для консультаций и восстановил навигацию по
  ассортименту, не меняя тему магазина целиком.
year: "08.2024"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - WordPress
  - WP Rocket
  - Product UX
blocks:
  - type: text
    title: Задача и ограничения
    body: Доработал карточку товара для консультаций и восстановил навигацию по
      ассортименту, не меняя тему магазина целиком.
  - type: text
    title: Как устроено решение
    body: Когда форма не заработала в существующей теме, сравнил её поведение с
      другой темой и адаптировал реализацию. Отдельно восстановил исчезнувшие
      фильтры и исправил отображение категорий. После правок очистил кэш WP
      Rocket, чтобы заказчик проверял новый вид, а не сохранённую версию
      страницы.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил удобство обновлённой карточки и принял этап. Массовое
      изменение единиц измерения и новый импорт ассортимента не входили в сдачу.
