title: Выбор пункта СДЭК без расчёта тарифа
tagline: Настроил выбор пункта выдачи для магазина, где товарные габариты не
  были заполнены. Требовалось сохранить выбранный адрес в заказе, а не просто
  показать карту.
year: "08.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - CDEK
  - Pickup points
  - Order QA
blocks:
  - type: text
    title: Задача и ограничения
    body: Настроил выбор пункта выдачи для магазина, где товарные габариты не были
      заполнены. Требовалось сохранить выбранный адрес в заказе, а не просто
      показать карту.
  - type: text
    title: Как устроено решение
    body: Выбрал вариант интеграции, который не требует расчёта тарифа, и передал
      покупательский сценарий на тест. После заказа обнаружилась отдельная
      ошибка при открытии записи в админке, затем похожий сбой в списке товаров.
      Диагностировал проблему и обновил расширения, после чего клиент повторно
      проверил результат.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил контрольный заказ и принял исправление ошибок админки.
      Расчёт стоимости и реальная отправка не входили в задачу.
