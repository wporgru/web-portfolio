title: Сайт-визитка Troubleshooter на WordPress
tagline: Собрал небольшую визитку с простым первым экраном и тремя
  информационными разделами. Клиенту была нужна основа, которую можно наполнить
  своими материалами.
year: "04.2023"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Business website
  - Navigation
  - Content layout
blocks:
  - type: text
    title: Задача и ограничения
    body: Собрал небольшую визитку с простым первым экраном и тремя информационными
      разделами. Клиенту была нужна основа, которую можно наполнить своими
      материалами.
  - type: text
    title: Как устроено решение
    body: Установил и настроил WordPress с согласованным шаблоном. Подготовил первый
      экран со слоганом и меню из трёх пунктов, передал адрес на проверку. После
      уточнения показал, как открываются описания по кнопкам, и запросил
      материалы для страниц.
  - type: text
    title: Результат и проверка
    body: Клиент принял визитку. Каталог, портал, магазин и окончательный
      автоматический слайдер не входили в подтверждённый объём.
