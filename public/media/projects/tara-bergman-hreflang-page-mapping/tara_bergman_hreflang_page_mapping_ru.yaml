title: "Tara Bergman: исправление hreflang для внутренних страниц"
tagline: У внутренних страниц фотосайта x-default указывал на главную. Для
  галереи, студии и воркшопов нужно было указывать соответствующую английскую
  страницу, а не отправлять поисковику один общий URL для разных материалов.
year: "07.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Polylang
  - PHP
  - hreflang
  - Technical SEO
blocks:
  - type: text
    title: Задача и ограничения
    body: У внутренних страниц фотосайта x-default указывал на главную. Для галереи,
      студии и воркшопов нужно было указывать соответствующую английскую
      страницу, а не отправлять поисковику один общий URL для разных материалов.
  - type: text
    title: Как устроено решение
    body: Заменил общий URL в шаблоне шапки на расчёт по контексту страницы. Для
      главной сохранил английский корень; на отдельной странице запрашиваю её
      английскую пару через Polylang. Если пары нет, шаблон не выводит
      собственный x-default на нерелевантный адрес. Проверку выполнил после
      выкладки и очистки кэша.
  - type: text
    title: Результат и проверка
    body: "В отчёте проверены пять маршрутов: главная, галерея, городская страница,
      студия и воркшопы. Для каждого отмечен относящийся к нему x-default без
      дублей. При повторном открытии публичной галереи x-default совпал с её
      английским URL. Это проверка разметки, а не гарантия выбора страницы
      поисковиком."
  - type: text
    title: Другой этап этого проекта
    links:
