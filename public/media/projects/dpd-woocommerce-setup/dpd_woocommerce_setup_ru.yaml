title: Настройка модуля доставки DPD для WooCommerce
tagline: Действующему магазину требовалось подключить DPD. Задача была в
  настройке существующего модуля, а не в разработке собственного API
  перевозчика.
year: "02.2024"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - DPD
  - Shipping
blocks:
  - type: text
    title: Задача и ограничения
    body: Действующему магазину требовалось подключить DPD. Задача была в настройке
      существующего модуля, а не в разработке собственного API перевозчика.
  - type: text
    title: Как устроено решение
    body: Проверил данные подключения, выполнил настройку и показал промежуточный
      результат до оформления заказа. После согласования передал результат на
      проверку и сдачу.
  - type: text
    title: Результат и проверка
    body: Покупатель принял работу и отметил качество в отзыве. Фактическая
      отгрузка, печать накладной и проверка каждого тарифа не подтверждены этой
      сдачей.
