title: "r-ferra.ru: настройка доставки DPD в WooCommerce"
tagline: Подключил существующий модуль DPD к WooCommerce-магазину r-ferra.ru и
  проверил предоставленные данные подключения — без разработки собственного
  плагина перевозчика.
year: "02.2024"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - DPD
  - Shipping
blocks:
  - type: text
    title: Задача и ограничения
    body: Покупатель Kwork передал настройку доставки DPD для магазина своего
      клиента на r-ferra.ru. Нужно было подключить существующий модуль в
      WooCommerce; разработка интернет-магазина или собственного API DPD не
      входила в запрос.
  - type: text
    title: Как устроено решение
    body: Получил необходимые доступы и проверил данные подключения DPD. Настроил
      существующий модуль и показал промежуточный результат до оформления
      заказа; покупатель положительно отреагировал и согласовал оплату. В
      переписке не указаны версия плагина, включённые тарифы и точная
      конфигурация — поэтому не выдаю их за установленные детали.
  - type: text
    title: Результат и проверка
    body: "Покупатель принял заказ и оставил отзыв: «Спасибо, задача выполнена
      быстро и качественно, рекомендую». Это подтверждает приёмку настройки, но
      не реальное отправление. Печать накладной, все адреса доставки и полный
      контроль тарифов по архиву не подтверждены."
    links:
      - label: Открыть исходный заказ на Kwork
        url: https://kwork.ru/track?id=41429270
