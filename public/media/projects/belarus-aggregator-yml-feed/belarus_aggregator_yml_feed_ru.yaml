title: YML-фид для белорусских товарных агрегаторов
tagline: Настроил регулярную выгрузку WooCommerce для товарных агрегаторов,
  чтобы владельцу не приходилось формировать новый файл после каждой правки
  карточки.
year: "09.2022"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - YML
  - XML
  - Scheduled export
blocks:
  - type: text
    title: Задача и ограничения
    body: Настроил регулярную выгрузку WooCommerce для товарных агрегаторов, чтобы
      владельцу не приходилось формировать новый файл после каждой правки
      карточки.
  - type: text
    title: Как устроено решение
    body: "Подготовил YML-файл и передал адрес для проверки. Объяснил два режима
      обновления: по расписанию раз в сутки и при изменении товара. Клиент
      проверил, что формат подходит принимающей стороне."
  - type: text
    title: Результат и проверка
    body: Клиент принял заказ. Модерация всех карточек и актуальность каждой цены на
      площадках отдельно не подтверждены.
