title: "telek.by: YML-фид WooCommerce для Shop.by и Onliner.by"
tagline: "Подготовил каталог telek.by к передаче на Shop.by и Onliner.by: сформировал
  адрес YML/XML-выгрузки и объяснил, как она обновляется по расписанию и после
  изменений товаров."
year: "09.2022"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - YML
  - XML
  - Scheduled export
blocks:
  - type: text
    title: Задача и ограничения
    body: Нужно было передавать товарный каталог магазина telek.by белорусским
      агрегаторам Shop.by и Onliner.by. Вместо ручного пересоздания файла после
      каждой правки требовалась выгрузка, которую принимающая сторона могла
      проверить по адресу.
  - type: text
    title: Как устроено решение
    body: "Сформировал YML/XML-фид WooCommerce и передал адрес
      `/wp-content/uploads/feed-yml-0.xml` для проверки. Объяснил два способа
      обновления каталога: раз в сутки и при изменении карточки товара. Клиент
      проверил формат и подтвердил, что он подходит агрегаторам."
  - type: text
    title: Результат и проверка
    body: Клиент принял заказ и оставил положительный отзыв «Быстро и
      качественно». Это подтверждает приёмку задачи и оценку работы, но не
      публикацию каждой позиции на двух площадках. Число товаров, модерация
      карточек, актуальность всех цен и влияние фида на продажи отдельно не
      подтверждены.
    links:
      - label: Открыть исходный заказ на Kwork
