title: WooCommerce YML feed for Belarusian aggregators
tagline: Configured a recurring WooCommerce export for product aggregators so
  the owner would not need to regenerate a file after every product edit.
year: "09.2022"
role: Web development and automation
stack:
  - WooCommerce
  - YML
  - XML
  - Scheduled export
blocks:
  - type: text
    title: Brief and constraints
    body: Configured a recurring WooCommerce export for product aggregators so the
      owner would not need to regenerate a file after every product edit.
  - type: text
    title: How it works
    body: "Created the YML file and shared its URL for validation. Explained two
      refresh paths: a daily run and updates triggered by product changes. The
      client checked that the format suited the receiving system."
  - type: text
    title: Result and verification
    body: The client accepted the order. Approval of every listing and the freshness
      of each price on external platforms were not independently verified.
