title: Диагностика пропавшей доставки в WooCommerce
tagline: При упрощении формы заказа пропала доставка. Разобрал, какие поля можно
  скрыть для покупателя, а какие нужны магазину для расчёта и проверки заказа.
year: "03.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Checkout fields
  - Local shipping
  - Pickup
blocks:
  - type: text
    title: Задача и ограничения
    body: При упрощении формы заказа пропала доставка. Разобрал, какие поля можно
      скрыть для покупателя, а какие нужны магазину для расчёта и проверки
      заказа.
  - type: text
    title: Как устроено решение
    body: Обнаружил конфликт со скрываемыми полями, заменил расширение и заново
      настроил оформление с доставкой и самовывозом. Сделал телефон обязательным
      и при повторной проверке выявил отдельное требование к email. Это
      позволило разделить проблему расчёта и обязательность контактных данных.
  - type: text
    title: Результат и проверка
    body: Заказ закрыт по сроку проверки. Передачу телефона в письмо и финальный
      прогон всех вариантов доставки архив не подтверждает.
