title: Англоязычная партнёрская витрина на WoodMart
tagline: Подготовил англоязычную витрину с блогом и переходами на сайт партнёра.
  Сайт должен был помогать выбирать товары, а не принимать оплату у себя.
year: "05.2023"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WoodMart
  - Affiliate links
  - UTM
blocks:
  - type: text
    title: Задача и ограничения
    body: Подготовил англоязычную витрину с блогом и переходами на сайт партнёра.
      Сайт должен был помогать выбирать товары, а не принимать оплату у себя.
  - type: text
    title: Как устроено решение
    body: "Согласовал оформление на WoodMart, цветовую схему и использование UTM для
      внешних переходов. При переносе карточек учитывал исходные фотографии: их
      водяные знаки сохранялись. Изменения, которые партнёр запросил после
      оценки визуального сходства, выделили в отдельное задание."
  - type: text
    title: Результат и проверка
    body: Клиент принял витрину. Полноту перевода, число всех товаров и фактическое
      начисление комиссии отдельно не проверяли.
