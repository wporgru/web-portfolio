title: Ремонт темы и обучение владельца магазина
tagline: Владельцу нужно было восстановить действующую тему и получить понятный
  способ самостоятельно добавлять товары и редактировать магазин.
year: "02.2024"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - Child theme
  - Training
blocks:
  - type: text
    title: Задача и ограничения
    body: Владельцу нужно было восстановить действующую тему и получить понятный
      способ самостоятельно добавлять товары и редактировать магазин.
  - type: text
    title: Как устроено решение
    body: Отремонтировал родительскую тему и проверил установку дочерней. Объяснил,
      как подготовить и загрузить архив темы. На примере одной карточки матраса
      показал работу с товаром и передал материалы по редактированию, чтобы
      владелец мог повторить последовательность на своём ассортименте.
  - type: text
    title: Результат и проверка
    body: Клиент принял ремонт и консультацию. Пример показывает способ работы с
      карточкой, а не массовое наполнение. Оплата, доставка и ускорение магазина
      обсуждались, но не были частью выполненной поставки.
