title: Подключение ЮKassa и проверка перехода к оплате
tagline: Подключил модуль оплаты к существующему WooCommerce, когда владелец
  завершал согласование со стороны платёжного сервиса.
year: "06.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - YooKassa
  - Checkout
  - Payment QA
blocks:
  - type: text
    title: Задача и ограничения
    body: Подключил модуль оплаты к существующему WooCommerce, когда владелец
      завершал согласование со стороны платёжного сервиса.
  - type: text
    title: Как устроено решение
    body: Настроил модуль и показал переход из оформления WooCommerce к оплате.
      Вместе с заказчиком разобрал, какие данные покупателя нужны для заказа и
      какие настройки чеков предстоит согласовать отдельно. Не включал
      автоматическую отправку чеков без решения клиента.
  - type: text
    title: Результат и проверка
    body: Клиент принял заказ и подтвердил совместную проверку кассы в отзыве. Сумма
      контрольной операции, завершённый возврат и автоматическая фискализация
      отдельно не подтверждены.
