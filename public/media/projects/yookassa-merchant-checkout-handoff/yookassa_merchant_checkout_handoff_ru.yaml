title: "ЮKassa + WooCommerce: подключение кассы и тест checkout"
tagline: "Подключил платёжный модуль к neftegazshop.ru и вместе с заказчиком
  проверил переход из оформления магазина к кассе."
year: "06.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - YooKassa
  - Checkout
  - Payment QA
blocks:
  - type: text
    title: Подключить кассу к готовому магазину
    body: "В июне 2023 года владелец neftegazshop.ru завершал регистрацию и
      согласование со стороны ЮKassa и попросил подключить приём оплаты к уже
      работающему WooCommerce-магазину. Задача включала не только сам модуль, но
      и проверку пути покупателя: от страницы оформления до перехода к
      платёжному сервису. Дополнительно нужно было обсудить, какие данные
      покупателя передаются для заказа и как владелец будет настраивать чеки."
  - type: text
    title: Настройка модуля и совместная проверка
    body: "Настроил платёжное расширение в существующем магазине и показал
      переход с WooCommerce checkout на оплату через ЮKassa. Вместе с заказчиком
      прошёл контрольную проверку кассы; в отзыве владелец подтвердил, что
      «подключил кассу, протестили. Всё работает». Отдельно обсудили поля,
      необходимые для оформления заказа, email-уведомления и варианты работы с
      чеками. Автоматическую отправку фискальных чеков не включал без решения
      клиента — этот вопрос требовал отдельного согласования."
  - type: text
    title: Результат и подтверждение заказчика
    body: "Клиент принял заказ и публично рекомендовал исполнителя, подтвердив
      совместное тестирование: «Всё работает». Это подтверждает настройку
      подключения и проверенный переход к кассе в рамках заказа. Архив не
      сохраняет отдельный чек с суммой контрольной операции, завершённый возврат
      средств или независимую проверку автоматической фискализации. Поэтому кейс
      не заявляет автоматическую передачу чеков, юридическую проверку налоговых
      сценариев или создание интернет-магазина с нуля."
    links:
      - label: Исходный заказ и отзыв на Kwork
        url: https://kwork.ru/track?id=36772232
  - type: text
    title: Что важно проверить при подключении онлайн-оплаты
    body: "Подключение платёжного расширения — только часть сценария. До запуска
      важно пройти путь из checkout к кассе, согласовать набор данных покупателя
      и отдельно определить, как будут формироваться и отправляться чеки. Эти
      процессы связаны, но не тождественны: переход на страницу оплаты сам по
      себе не доказывает успешное списание, возврат или автоматическую
      фискализацию. В этом проекте именно совместная проверка кассы подтверждена
      отзывом клиента; остальные финансовые этапы не приписываются работе."
