title: Запуск основы магазина товаров для боулинга
tagline: Владельцу требовалась рабочая основа каталога на WordPress, которую он
  сможет наполнить своими товарами и брендами, не переделывая навигацию с нуля.
year: "04.2024"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - WoodMart
  - Localization
blocks:
  - type: text
    title: Задача и ограничения
    body: Владельцу требовалась рабочая основа каталога на WordPress, которую он
      сможет наполнить своими товарами и брендами, не переделывая навигацию с
      нуля.
  - type: text
    title: Как устроено решение
    body: "Установил WordPress и WoodMart, настроил и перевёл интерфейс. Показал,
      как распределять категории по меню после наполнения, заменять
      демонстрационный блог и бренды. Демо-товары и категории не переводил: их
      предполагалось удалить, а не оставлять на витрине."
  - type: text
    title: Результат и проверка
    body: Клиент принял стартовый этап. Это готовая основа для наполнения, не
      доказательство полного ассортимента, подключённого эквайринга или открытой
      индексации.
