title: Управление миниатюрами большого каталога WooCommerce
tagline: После импорта каталога хостинг стал заполняться дополнительными копиями
  товарных изображений. Доработку витрины нужно было продолжить, устранив
  причину дальнейшего роста числа файлов.
year: "02.2026"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - WordPress
  - Media
blocks:
  - type: text
    title: Задача и ограничения
    body: После импорта каталога хостинг стал заполняться дополнительными копиями
      товарных изображений. Доработку витрины нужно было продолжить, устранив
      причину дальнейшего роста числа файлов.
  - type: text
    title: Как устроено решение
    body: Диагностировал генерацию нескольких размеров миниатюр для каждого
      изображения и объяснил клиенту, почему закончился диск. Клиент увеличил
      доступное место; я отключил ненужные размеры и запустил регенерацию, после
      чего продолжил выполнение заказа.
  - type: text
    title: Результат и проверка
    body: Заказ сдан и принят автоматически. В результате изменились правила
      создания изображений, но независимого замера экономии места и
      поэлементного отчёта по дизайну не сохранилось.
