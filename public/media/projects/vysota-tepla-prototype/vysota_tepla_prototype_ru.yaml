title: Прототип сайта услуг «ВысотаТепла» с калькулятором стоимости
tagline: В локальном Antigravity workspace найден исходный код лендинга для
  услуг фасадных работ и промышленного альпинизма. Интерфейс показывает
  направления услуг, даёт предварительный ориентир по стоимости и ведёт
  посетителя к заявке; подтверждений публикации и приёмки нет.
year: "2026"
role: Веб-разработка и автоматизация
stack:
  - React
  - TypeScript
  - Vite
  - React Router
  - Tailwind CSS
blocks:
  - type: text
    title: Задача и ограничения
    body: В локальном Antigravity workspace найден исходный код лендинга для услуг
      фасадных работ и промышленного альпинизма. Интерфейс показывает
      направления услуг, даёт предварительный ориентир по стоимости и ведёт
      посетителя к заявке; подтверждений публикации и приёмки нет.
  - type: text
    title: Как устроено решение
    body: Собрал SPA на React и TypeScript с отдельными страницами услуг.
      Реализованы переключение между двумя регионами с сохранением выбора в
      localStorage и локальный калькулятор по типу работ, площади, материалу,
      способу доступа, численности команды, срочности и региональному
      коэффициенту. В кодовой базе также есть каталог услуг, галереи объектов,
      FAQ, отзывы, блок публикаций и форма заявки; отправка формы отдельно не
      проверялась.
  - type: text
    title: Результат и проверка
    body: "Локальная production-сборка Vite завершилась успешно; браузерная проверка
      главной дала ноль ошибок JavaScript. ESLint не запустился: в workspace нет
      конфигурации ESLint 9. Сборка предупреждает о JS-чанке 915 кБ до gzip.
      Реальные тарифы, рекламные цифры и отзывы в макете не подтверждены; также
      не проверены мобильная версия, клиентская приёмка, домен и публикация.
      Кейс поэтому описывает локальный прототип, а не запущенный сайт или
      подтверждённые показатели бизнеса."
