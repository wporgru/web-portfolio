title: Контактный виджет на действующем сайте Creatium
tagline: Посетителям нужен был заметный способ начать переписку, при этом заказ
  не требовал переноса сайта на другую CMS или переработки страниц.
year: "01.2026"
role: Веб-разработка и автоматизация
stack:
  - Creatium
  - Widgets
blocks:
  - type: text
    title: Задача и ограничения
    body: Посетителям нужен был заметный способ начать переписку, при этом заказ не
      требовал переноса сайта на другую CMS или переработки страниц.
  - type: text
    title: Как устроено решение
    body: Проверил возможность подключения на Creatium, установил виджет на
      существующем сайте и передал его на проверку. Попросил отдельно посмотреть
      внешний вид и сценарий отправки сообщений, чтобы не сводить приёмку только
      к появлению кнопки.
  - type: text
    title: Результат и проверка
    body: Клиент принял работу и оставил положительный отзыв. Новый сайт и полный
      тест каждого мессенджера или устройства не заявляются.
