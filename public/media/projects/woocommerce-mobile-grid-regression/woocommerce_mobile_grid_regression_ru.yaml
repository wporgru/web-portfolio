title: Ремонт мобильной сетки товаров и категорий
tagline: Вернул нормальную сетку товаров и категорий после предыдущих изменений.
  На мобильном отдельно проверил описание товара и элементы, которые могли
  выходить за пределы экрана.
year: "01.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Responsive design
  - WP Rocket
  - Browser QA
blocks:
  - type: text
    title: Задача и ограничения
    body: Вернул нормальную сетку товаров и категорий после предыдущих изменений. На
      мобильном отдельно проверил описание товара и элементы, которые могли
      выходить за пределы экрана.
  - type: text
    title: Как устроено решение
    body: Нашёл, что сетка нарушалась при активном дополнительном расширении темы, и
      отключил его. Для мобильного описания включил безопасный режим WP Rocket.
      Не смешивал эти исправления с отдельным ограничением ширины виджета VK на
      узком iPhone.
  - type: text
    title: Результат и проверка
    body: Заказчик подтвердил исправления и принял работу. Остаточное ограничение
      виджета и изменение глубины просмотров не выдаю за подтверждённый
      результат.
