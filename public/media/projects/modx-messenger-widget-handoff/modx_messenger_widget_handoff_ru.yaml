title: "Виджет мессенджеров для MODX: код и инструкция для команды клиента"
tagline: На существующем сайте на MODX Revolution клиент хотел добавить блок
  связи по визуальному примеру. Устанавливать его должен был штатный
  программист, поэтому нужно было передать готовый виджет и объяснить, что
  менять при подключении.
year: "03.2026"
role: Веб-разработка и автоматизация
stack:
  - MODX Revolution
  - Messenger widget
  - Implementation handoff
blocks:
  - type: text
    title: Задача и ограничения
    body: На существующем сайте на MODX Revolution клиент хотел добавить блок связи
      по визуальному примеру. Устанавливать его должен был штатный программист,
      поэтому нужно было передать готовый виджет и объяснить, что менять при
      подключении.
  - type: text
    title: Как устроено решение
    body: Подготовил и передал код для самостоятельного внедрения. Показал, где в
      начале кода подставить собственные ссылки, объяснил отличие оформления с
      подписями от варианта без них и предложил дополнительные варианты. Рабочий
      шаблон сайта сам не менял.
  - type: text
    title: Результат и проверка
    body: "Клиент принял комплект кода и инструкцию. Итоговый состав кнопок и
      установка на рабочем MODX-сайте отдельно не подтверждены: результат этапа
      — передача решения, а не запуск на сайте."
