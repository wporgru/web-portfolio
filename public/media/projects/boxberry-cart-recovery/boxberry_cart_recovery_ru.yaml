title: Подключение Boxberry и восстановление корзины
tagline: "Подключил новый способ доставки и разобрал блокирующую проблему:
  покупатель не мог добавить товар в корзину, то есть не доходил до выбора
  перевозчика."
year: "05.2024"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Boxberry
  - CDEK
  - Checkout
blocks:
  - type: text
    title: Задача и ограничения
    body: "Подключил новый способ доставки и разобрал блокирующую проблему:
      покупатель не мог добавить товар в корзину, то есть не доходил до выбора
      перевозчика."
  - type: text
    title: Как устроено решение
    body: "Передал настройку Boxberry на проверку и отключил конфликтующее
      расширение СДЭК, которое мешало добавлению товаров. Разделил
      восстановление корзины и дальнейшую настройку перевозчиков: отдельно
      объяснил, какие правила оплаты доставки не поддерживает выбранное
      расширение Boxberry и что требует отдельного решения."
  - type: text
    title: Результат и проверка
    body: Клиент принял этап. Повторное подключение СДЭК, реальная отправка и
      проверка всех направлений Boxberry не входили в подтверждённый результат.
