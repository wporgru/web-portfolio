title: Переимпорт каталога напольных покрытий по ID
tagline: Обновил каталог по идентификаторам, чтобы изменения применялись к
  существующим карточкам, а новые позиции добавлялись отдельно.
year: "03.2024"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Data import
  - Catalog maintenance
blocks:
  - type: text
    title: Задача и ограничения
    body: Обновил каталог по идентификаторам, чтобы изменения применялись к
      существующим карточкам, а новые позиции добавлялись отдельно.
  - type: text
    title: Как устроено решение
    body: "При перегрузке импорта согласовал временное повышение тарифа хостинга.
      Сопоставил строки с товарами по ID, загрузил изменения и новые позиции.
      Фотографий в исходнике не было: не подставлял чужие изображения и
      согласовал, что клиент добавит свои. Дополнительно установил переданный
      внешний код."
  - type: text
    title: Результат и проверка
    body: Клиент проверил результат и принял работу. Из-за ошибки в конце прогона
      удаление всех позиций, отсутствовавших в таблице, отдельно не
      подтверждено.
