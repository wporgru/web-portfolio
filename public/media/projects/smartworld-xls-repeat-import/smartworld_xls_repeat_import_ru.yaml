title: "Smartworld: повторный импорт товаров и цен из XLS"
tagline: Настроил импорт из XLS, исправил выбор розничной цены и разобрал дубли
  после самостоятельной загрузки клиента.
year: "11.2018"
role: Интеграция каталога
stack:
  - WooCommerce
  - XLS
  - Product import
blocks:
  - type: text
    title: Первый импорт и цены
    body: "Перед первой загрузкой сопоставил поля прайса. По итогам проверки
      исправил выбор колонки: магазину нужна была розничная цена, а не оптовая.
      Уточнил обработку товаров, отсутствующих в новом файле."
  - type: text
    title: Повторный запуск и дубли
    body: На следующем прайсе передал инструкцию. После самостоятельного прогона
      появились дубли и проблемы с фотографиями. Объяснил, почему для повторного
      импорта нужны стабильный уникальный идентификатор и то же сопоставление
      колонок, перезапустил загрузку и сообщил о загрузке изображений.
  - type: text
    title: Приёмка
    body: Клиент подтвердил работу и оставил отзыв. Тысяча товаров относится к
      первому прайсу, а не к общему итогу. Скидочная цена была отдельным этапом;
      безошибочность всех будущих запусков не подтверждена.
