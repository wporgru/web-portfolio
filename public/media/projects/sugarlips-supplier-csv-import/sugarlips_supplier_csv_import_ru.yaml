title: Импорт и обновление каталога Sugarlips
tagline: Подготовил CSV-импорт поставщика с согласованной наценкой и
  возможностью обновлять магазин по расписанию.
year: "12.2021"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - CSV
  - Scheduled imports
  - Pricing rules
blocks:
  - type: text
    title: Задача и ограничения
    body: Подготовил CSV-импорт поставщика с согласованной наценкой и возможностью
      обновлять магазин по расписанию.
  - type: text
    title: Как устроено решение
    body: Сопоставил поля, категории и метки. Настроил правило наценки и
      планировщик. Когда загрузку прервал лимит тарифа, отделил проблему сервера
      от сопоставления данных и предупредил, что автоматический запуск может
      упереться в то же ограничение. Клиент повысил тариф.
  - type: text
    title: Результат и проверка
    body: Заказ принят. В отчёте о сдаче указано 5 900 загруженных товаров;
      независимого пересчёта и подтверждения полного цикла по расписанию после
      повышения тарифа нет.
