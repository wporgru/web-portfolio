title: "Халис: выборочный YML-фид по цене и наличию"
tagline: Настроил правила выборочной выгрузки и передал постоянный адрес фида.
  На момент сдачи в файле не было товаров из-за отсутствующих цен.
year: "08.2022"
role: Товарные данные и интеграция фидов
stack:
  - YML
  - XML
  - Product feeds
blocks:
  - type: text
    title: Зачем ограничили состав
    body: Клиент хотел выгружать собственную продукцию отдельно от перепродаваемых
      стройматериалов с неактуальными ценами. Для отбора согласовали условия по
      цене и статусу наличия.
  - type: text
    title: Подготовил адрес и порядок обновления
    body: Передал постоянный адрес XML-файла и объяснил, как заполнить цены у нужных
      товаров, запустить обновление и дождаться формирования выгрузки.
  - type: text
    title: Что именно принял заказчик
    body: "Клиент принял механизм и порядок запуска. Заполнение цен планировалось
      после разделения сайтов. На момент сдачи файл был пуст: наполненный фид,
      размещение товаров и автоматическое обновление цен не подтверждены."
