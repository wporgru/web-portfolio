title: Выбор вариаций под ценой в WooCommerce
tagline: "Перестроил порядок элементов карточки: выбор исполнения должен был
  находиться сразу под ценой и применяться на уровне шаблона, а не правиться
  вручную в каждом товаре."
year: "04.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - PHP
  - Product templates
  - Child themes
blocks:
  - type: text
    title: Задача и ограничения
    body: "Перестроил порядок элементов карточки: выбор исполнения должен был
      находиться сразу под ценой и применяться на уровне шаблона, а не правиться
      вручную в каждом товаре."
  - type: text
    title: Как устроено решение
    body: "Переместил блок выбора и передал изменённый functions.php. Объяснил
      владельцу, как сохранить изменение при обновлении темы: использовать
      дочернюю тему или восстановить доработку после обновления, если она
      осталась в файле основной темы."
  - type: text
    title: Результат и проверка
    body: Клиент принял настройку. Установка дочерней темы, проверка каждого
      альтернативного шаблона и совместимость с будущими обновлениями отдельно
      не подтверждены.
