title: Поиск по артикулу и фильтры магазина швейной техники
tagline: После загрузки ассортимента покупателю нужно было находить нужную
  модель по артикулу, отбирать товары по наличию и акциям и применять промокод в
  корзине. В карточке требовалось показывать сведения о дилере по бренду товара.
year: "12.2025"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - SKU search
  - Catalog filters
  - Coupons
blocks:
  - type: text
    title: Задача и ограничения
    body: После загрузки ассортимента покупателю нужно было находить нужную модель
      по артикулу, отбирать товары по наличию и акциям и применять промокод в
      корзине. В карточке требовалось показывать сведения о дилере по бренду
      товара.
  - type: text
    title: Как устроено решение
    body: Настроил поиск по артикулу и правила назначения статусов при обновлении
      каталога, чтобы фильтр опирался на обновляемые данные. Добавил применение
      промокодов в корзине и показал, как создавать коды. Подставил название
      бренда из атрибута в дилерский блок и поправил вёрстку карточек без
      краткого описания. Отдельно согласовал исключения поставщика.
  - type: text
    title: Результат и проверка
    body: Клиент принял пакет доработок. Отдельно передал XLSX с данными ещё одного
      поставщика, но его загрузка не подтверждена. Ошибки КИТ и Яндекс Доставки
      через eShopLogistic остались на стороне дальнейшей диагностики; приёмка
      каталога не означает, что эти способы доставки заработали.
