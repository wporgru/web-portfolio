title: Шесть корпоративных HTML-подписей для Яндекс Почты
tagline: Команде нужны были персональные подписи в едином стиле. Первый вариант
  требовал уменьшения, а иконки и промежутки на разных устройствах выглядели
  неодинаково.
year: "03.2026"
role: Веб-разработка и автоматизация
stack:
  - HTML email
  - Table layout
  - Yandex Mail
blocks:
  - type: text
    title: Задача и ограничения
    body: Команде нужны были персональные подписи в едином стиле. Первый вариант
      требовал уменьшения, а иконки и промежутки на разных устройствах выглядели
      неодинаково.
  - type: text
    title: Как устроено решение
    body: Итеративно уменьшал блок и корректировал иконки и интервалы после
      пересылки образцов. Запросил данные сотрудников и обычные ссылки Telegram
      вместо QR-кодов. После согласования передал шесть HTML-файлов с табличной
      разметкой и изображениями по HTTPS.
  - type: text
    title: Результат и проверка
    body: Состав передачи подтверждён шестью восстановленными оригиналами.
      Персональные контакты не публикую; одинаковое отображение во всех почтовых
      клиентах не заявляется.
