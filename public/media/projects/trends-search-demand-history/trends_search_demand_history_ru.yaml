title: "Дашборд спроса: история выгрузок Google Trends"
tagline: Отчётливый рост запроса в одной выгрузке ещё не повод делать новую
  страницу. Требовалось хранить историю наблюдений, различать типы отчётов и
  сверять запросы с накопленными данными поиска.
year: "09.2026"
role: Веб-разработка и автоматизация
stack:
  - Python
  - SQLite
  - CSV
  - Google Trends
  - Search Console
  - Yandex Webmaster
blocks:
  - type: text
    title: Задача и ограничения
    body: Отчётливый рост запроса в одной выгрузке ещё не повод делать новую
      страницу. Требовалось хранить историю наблюдений, различать типы отчётов и
      сверять запросы с накопленными данными поиска.
  - type: text
    title: Как устроено решение
    body: "Сделал импорт Rising CSV в SQLite: проценты роста и Breakout принимаются,
      а обычная шкала Top не выдаётся за рост. Снимок хранится неизменяемым;
      повтор того же файла и фильтров добавляет наблюдение, но не дублирует
      данные. Страну, категорию и период фиксирую явно. Точные запросы сверяются
      с Вебмастером и агрегатом Search Console, а совпадения с названием
      карточки отмечаются как предварительные."
  - type: text
    title: Результат и проверка
    body: В тестах на отдельной базе проверил повторный импорт, отклонение неверного
      формата и сортировку по всему набору, а не только на открытой странице.
      Панель помогает выбрать темы для проверки; относительный рост Trends не
      выдаётся за абсолютную частотность, трафик или продажи.
