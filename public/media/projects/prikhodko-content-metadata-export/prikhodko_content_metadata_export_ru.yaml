title: Выгрузка текстов, Title и Description сайта Prikhodko
tagline: Собрал тексты и метаданные страниц Prikhodko в передаваемый файл.
  Клиент принял выгрузку как отдельную работу без импорта на новый сайт.
year: "02.2023"
role: Подготовка веб-данных
stack:
  - Title
  - Meta description
  - Выгрузка контента
blocks:
  - type: text
    title: Что было нужно
    body: "Заказчику требовались текст страниц и два отдельных поля для поиска:
      Title и Description. Источником служил сайт Prikhodko; его разработка не
      входила в заказ."
  - type: text
    title: Что передал
    body: Собрал запрошенные материалы и передал вложение для дальнейшей работы. Так
      тексты и поисковые метаданные можно было использовать отдельно от
      исходного сайта.
  - type: text
    title: Границы результата
    body: Клиент принял работу. Ссылка на вложение истекла, поэтому формат файла,
      число страниц и полноту метатегов не удалось подтвердить повторной
      проверкой. Копирайтинг, публикация и импорт не входят в результат.
