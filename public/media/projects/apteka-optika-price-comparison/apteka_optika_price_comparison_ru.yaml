title: "Аптека & Оптика: витрина сравнения цен на Node.js"
tagline: "Собрал отдельную публичную витрину для аптечного каталога.
  Пользователю нужен один экран со сравнимыми предложениями, а поиску —
  стабильные страницы категорий и товаров. Задача не сводилась к выводу фида:
  одну позицию нужно было связать с вариантами и предложениями разных продавцов,
  не показывая непроверенные записи."
year: "2026"
role: Веб-разработка и автоматизация
stack:
  - Node.js
  - Express
  - SQLite
  - Server-side rendering
  - Technical SEO
blocks:
  - type: text
    title: Задача и ограничения
    body: "Собрал отдельную публичную витрину для аптечного каталога. Пользователю
      нужен один экран со сравнимыми предложениями, а поиску — стабильные
      страницы категорий и товаров. Задача не сводилась к выводу фида: одну
      позицию нужно было связать с вариантами и предложениями разных продавцов,
      не показывая непроверенные записи."
  - type: text
    title: Как устроено решение
    body: Разделил обработку данных и публичный показ. Витрина на Express читает
      SQLite в режиме только для чтения и формирует HTML категорий, поиска и
      карточек на сервере. Для публикации учитываются статус проверки, наличие
      описания и исключения по рецептурным позициям. Карточка объединяет
      варианты и предложения, а переход к продавцу проходит через отдельный
      маршрут. Для прежних адресов предусмотрел 301-редиректы; новым шаблонам
      назначил канонические URL и карту сайта.
  - type: text
    title: Результат и проверка
    body: Проверил публичную главную в браузере и переход со старого адреса каталога
      на главную. Приложил полностраничный снимок действующей витрины. Кейс
      показывает устройство интерфейса и данных; не заявляет полноту цен,
      медицинскую точность карточек или рост поискового трафика.
  - type: image
    src: /media/projects/apteka-optika-price-comparison/homepage-full.webp
    alt: Полностраничный снимок витрины «Аптека & Оптика»
