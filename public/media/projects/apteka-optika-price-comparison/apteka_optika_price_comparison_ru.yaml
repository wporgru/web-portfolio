title: "Аптека & Оптика: витрина сравнения цен на Node.js"
tagline: "Собрал отдельную публичную витрину для аптечного каталога. Пользователю нужен
  один экран со сравнимыми предложениями, а поиску — стабильные страницы категорий и
  товаров. Задача не сводилась к выводу фида: одну позицию нужно было связать с вариантами
  и предложениями разных продавцов, не показывая непроверенные записи."
year: "2026"
role: Веб-разработка и автоматизация
stack:
  - Node.js
  - Express
  - SQLite
  - Server-side rendering
  - Technical SEO
blocks:
  - type: text
    title: "Задача: сравнение предложений вместо копии прайса"
    body: "Аптечные фиды описывают предложения разных продавцов, но покупателю нужен понятный
      товар с вариантами и ценами на одной странице. Для поискового трафика важны
      отдельные стабильные адреса категорий и товаров. При этом не каждая запись готова к
      публикации: непроверенные или неподходящие товары нельзя просто выводить из сырой
      выгрузки."
  - type: text
    title: Разделение данных и публичной витрины
    body: Собрал серверную витрину на Node.js и Express с SQLite, подключённой в режиме только
      для чтения. Главная, категории, поиск и карточки формируются на сервере. Такой
      контур отделяет публичный показ от подготовки данных и не требует от посетителя
      доступа к редакционной системе.
  - type: text
    title: Варианты, цены и правила показа
    body: На товарной странице данные о товаре связываются с вариантами и предложениями
      продавцов. В коде предусмотрены проверка статуса карточки, наличие описания и
      исключение отмеченных рецептурных позиций. Для вариантов отбираются записи с
      предложениями, а список предложений сортируется с учётом наличия и цены. Переход к
      продавцу обрабатывается отдельным маршрутом. Эти правила интерфейса не заменяют
      проверку медицинских данных и соответствия каждого предложения упаковке.
  - type: text
    title: SEO и совместимость адресов
    body: Для новых страниц предусмотрены canonical и карта сайта; старые адреса
      обрабатываются редиректами. В браузере проверил публичную главную и переход со
      старого адреса каталога на главную. Полностраничный снимок показывает внешний вид
      витрины, но не является проверкой всех редиректов и поисковых позиций.
  - type: image
    src: /media/projects/apteka-optika-price-comparison/homepage-full.webp
    alt: Полностраничный снимок витрины «Аптека & Оптика»
    caption: Полностраничный снимок действующей главной в браузере, ширина 1440 px, без
      обрезки. Это текущий вид, а не исторический снимок запуска.
  - type: text
    title: Действующий сайт
    links:
      - label: Открыть страницу проекта
        url: https://apteka-optika.ru/
  - type: text
    title: Что можно применить к вашему проекту
    body: Это пример серверной витрины и организации данных, а не доказательство полноты
      аптечных цен или роста трафика. Для похожего агрегатора пришлите обезличенные
      примеры источников, варианты одного товара и желаемый сценарий обновления. Начнём с
      правил сопоставления и проверки того, какие записи допустимо показывать.
