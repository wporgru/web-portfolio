    src: /media/projects/apteka-optika-price-comparison/homepage-full.webp
    alt: Full-page screenshot of the Apteka & Optika storefront
    caption: Uncropped browser capture of the current live homepage at 1440 px
      width. This is not an archival launch screenshot.
