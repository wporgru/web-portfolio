title: "Arenda-PM: technical SEO for the equipment catalog"
tagline: Fourteen equipment pages opened for visitors but were excluded from indexing. The
  sitemap still listed URLs that redirected. The task was to align the sitemap, crawl
  rules and templates without disrupting equipment enquiries.
year: "10.2026"
role: Web development and automation
stack:
  - Technical SEO
  - Yoast SEO
  - WordPress
  - Canonical
  - 301 redirects
blocks:
  - type: text
    title: The visitor saw a listing; search engines saw noindex
    body: Fourteen equipment pages were marked noindex in Yoast even though the catalog
      worked. The sitemap also included shop and author URLs redirecting to the homepage,
      while robots.txt contained conflicting crawler groups. I separated crawl, metadata
      and redirect issues so search fixes would not interrupt equipment enquiries.
  - type: text
    title: Cleaned up crawling and URLs
    body: I allowed indexing for all 14 equipment pages and included them in the sitemap,
      while removing redirecting archives. I resolved conflicting robots.txt groups,
      retained existing AI crawler permissions and pointed to the Yoast sitemap. I added a
      301 from the redundant first catalog page and a direct redirect for the old M20
      address, without renaming the separate F50P listing. Two empty categories were not
      forced into the sitemap.
  - type: text
    title: Put metadata back under the owner’s control
    body: Hard-coded child-theme overrides prevented the SEO plugin from controlling titles; a
      blog description even referenced an unrelated milking robot. I removed the overrides
      and restored Yoast control. I rewrote titles and descriptions for 77 pages, posts
      and product listings, and filled eight additional category records. The homepage
      received one H1, five H2s and two H3s through Elementor without changing its
      appearance.
  - type: text
    title: What was actually verified
    body: "After the changes I crawled all 83 unique sitemap URLs: each returned HTTP 200
      without redirects or noindex, and no empty or duplicate titles or descriptions were
      found. I checked direct 301s, mobile and desktop homepage views and opening the M20
      enquiry dialog while signed out, without submitting it. Database, files, robots.txt,
      .htaccess and settings were saved beforehand; a full staging restore was not
      performed in this stage."
  - type: image
    src: /media/projects/arenda-pm-catalog-indexability/seo-release-viewport.webp
    alt: Arenda-PM homepage after heading updates
    caption: Browser viewport captured after the heading edits. It shows the preserved design,
      not search visibility.
  - type: text
    title: Another stage of this project
    links:
      - label: "Related stage: JavaScript repair and form verification"
        url: /showcase/arenda-pm-legacy-js-cleanup/en/
  - type: text
    title: Outcome and next step
    body: The listings became technically eligible for crawling; that does not prove Google or
      Yandex indexed them or improved their rankings. For your site, send example excluded
      URLs, the sitemap and recent changes. I can compare the actual responses, index
      settings and search-console evidence before prioritizing fixes.
    links:
      - label: Why products and categories are missing from search
        url: /guides/woocommerce-products-not-indexed/en/
