title: "Аренда-ПМ: техническое SEO каталога техники"
tagline: Четырнадцать карточек техники открывались для посетителей, но были закрыты от
  индексации. В карте сайта при этом оставались адреса, которые вели через редирект. Нужно
  было согласовать карту, правила обхода и шаблоны, не мешая посетителям бронировать
  технику.
year: "10.2026"
role: Веб-разработка и автоматизация
stack:
  - Technical SEO
  - Yoast SEO
  - WordPress
  - Canonical
  - 301 redirects
blocks:
  - type: text
    title: "Проблема: посетитель видит карточку, поисковик — noindex"
    body: У 14 страниц техники был включён запрет индексации в Yoast, хотя каталог работал.
      Одновременно карта включала адреса магазина и авторов, которые перенаправляли на
      главную. Отдельные правила robots.txt для разных роботов конфликтовали. Сначала
      разделил проблемы обхода, метаданных и редиректов, чтобы исправление SEO не сломало
      путь к бронированию.
  - type: text
    title: Навёл порядок в обходе и адресах
    body: Разрешил индексацию 14 карточек и включил их в карту, убрал из неё перенаправляемые
      архивы. В robots.txt устранил конфликтующие группы, сохранил действующие разрешения
      AI-роботов и указал прямой адрес карты Yoast. Настроил 301 с лишней первой страницы
      каталога. Для M20 согласовал понятный адрес и прямой редирект со старого; отдельную
      модель F50P не переименовывал. Две пустые категории не добавлял в карту
      искусственно.
  - type: text
    title: Метаданные вернул владельцу сайта
    body: Жёсткие подмены дочерней темы мешали управлять заголовками через SEO-плагин; в блоге
      обнаружилось чужое описание доильного робота. Убрал подмены и передал управление
      обратно Yoast. Переписал title и description 77 страниц, статей и карточек, отдельно
      заполнил восемь рубрик и категорий. На главной настроил один H1, пять H2 и два H3
      средствами Elementor, сохранив внешний вид.
  - type: text
    title: Что и как проверено
    body: "После изменений обошёл 83 уникальных URL карты: все ответили HTTP 200 без
      редиректов и noindex; пустых или повторяющихся title и description не найдено.
      Проверил прямые 301, мобильную и широкую главную и открытие формы M20 без
      авторизации и отправки заявки. До правок сохранены база, файлы, robots.txt,
      .htaccess и настройки; полное восстановление копии на стенде в этом этапе не
      выполнялось."
  - type: image
    src: /media/projects/arenda-pm-catalog-indexability/seo-release-viewport.webp
    alt: Главная «Аренда-ПМ» после правки заголовков
    caption: Фрагмент браузерной проверки после правки заголовков. Показывает сохранённое
      оформление, а не состояние поисковой выдачи.
  - type: text
    title: Другой этап этого проекта
    links:
      - label: "Связанный этап: исправление JavaScript и проверка форм"
        url: /showcase/arenda-pm-legacy-js-cleanup/
  - type: text
    title: Граница результата и следующий шаг
    body: "Карточки стали технически доступны для обхода — это не доказательство, что Google
      или Яндекс их уже проиндексировали или улучшили позиции. Для своего сайта пришлите
      примеры исключённых URL, карту сайта и список недавних изменений: сначала сопоставлю
      фактическую выдачу, настройки индексации и данные кабинетов, а затем предложу
      приоритеты исправления."
    links:
      - label: Почему карточки и категории не попадают в поиск
        url: /guides/woocommerce-products-not-indexed/
