title: "Аренда-ПМ: техническое SEO каталога техники"
tagline: Четырнадцать карточек техники открывались для посетителей, но были
  закрыты от индексации. В карте сайта при этом оставались адреса, которые вели
  через редирект. Нужно было согласовать карту, правила обхода и шаблоны, не
  мешая посетителям бронировать технику.
year: "10.2026"
role: Веб-разработка и автоматизация
stack:
  - Technical SEO
  - Yoast SEO
  - WordPress
  - Canonical
  - 301 redirects
blocks:
  - type: text
    title: Задача и ограничения
    body: Четырнадцать карточек техники открывались для посетителей, но были закрыты
      от индексации. В карте сайта при этом оставались адреса, которые вели
      через редирект. Нужно было согласовать карту, правила обхода и шаблоны, не
      мешая посетителям бронировать технику.
  - type: text
    title: Как устроено решение
    body: Снял noindex с карточек в Yoast, убрал перенаправляемые страницы из карты
      и устранил конфликтующие группы правил robots.txt. Настроил прямые 301 со
      служебной первой страницы каталога и старого адреса M20; отдельную
      карточку F50P не переименовывал. Перенёс управление метаданными обратно в
      Yoast, убрал жёсткие подмены в теме и переписал тайтлы и описания 77
      страниц, статей и карточек. Для главной настроил заголовки в Elementor,
      сохранив оформление.
  - type: text
    title: Результат и проверка
    body: "На контрольном этапе повторно проверил 83 уникальных адреса из карты:
      HTTP 200, без редиректов, noindex, пустых или повторяющихся тайтлов и
      описаний. Все 14 карточек вошли в проверку. Открытие формы M20 проверил
      без отправки заявки. Это подтверждает техническую доступность, а не
      появление карточек в выдаче."
  - type: image
    src: /media/projects/arenda-pm-catalog-indexability/seo-release-viewport.webp
    alt: Главная «Аренда-ПМ» после правки заголовков
    caption: Фрагмент браузерной проверки после правки заголовков. Показывает
      сохранённое оформление, а не состояние поисковой выдачи.
