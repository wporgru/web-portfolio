title: Доставка СДЭК и упрощение оформления в Осмокот
tagline: В форме покупки требовалось убрать лишние поля и при этом сохранить
  данные, нужные для расчёта доставки и выбора пункта выдачи. Отдельной задачей
  была видимость формы обратной связи.
year: 03–04.2024
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - CDEK
  - Checkout
blocks:
  - type: text
    title: Задача и ограничения
    body: В форме покупки требовалось убрать лишние поля и при этом сохранить
      данные, нужные для расчёта доставки и выбора пункта выдачи. Отдельной
      задачей была видимость формы обратной связи.
  - type: text
    title: Как устроено решение
    body: Настроил доставку, сократил набор полей оформления, проверил поведение
      автозаполнения и добавлял подсказку по способам получения. Объяснил
      зависимость СДЭК от адресных данных и ограничения плагина по постаматам и
      наложенному платежу. После работы с кэшем передал контактный попап на
      повторную проверку.
  - type: text
    title: Результат и проверка
    body: Заказчик подтвердил форму и принял оба этапа. Перенос хостинга, реальные
      отгрузки и новая настройка платёжного шлюза не входили в эту сдачу.
