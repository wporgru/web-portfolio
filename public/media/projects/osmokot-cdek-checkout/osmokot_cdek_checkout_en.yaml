title: CDEK delivery and simpler checkout for Osmokot
tagline: Checkout needed fewer unnecessary fields without losing the data
  required for delivery quotes and pickup points. Making the contact form
  visible was a separate requirement.
year: 03–04.2024
role: Web development and automation
stack:
  - WooCommerce
  - CDEK
  - Checkout
blocks:
  - type: text
    title: Brief and constraints
    body: Checkout needed fewer unnecessary fields without losing the data required
      for delivery quotes and pickup points. Making the contact form visible was
      a separate requirement.
  - type: text
    title: How it works
    body: Configured delivery, reduced checkout fields, checked autofill behavior
      and added guidance on delivery options. Explained CDEK’s address
      requirements and plugin limits around parcel lockers and cash on delivery.
      After addressing cache behavior, handed the contact popup back for
      retesting.
  - type: text
    title: Result and verification
    body: The client confirmed the form and accepted both stages. Hosting migration,
      live shipments and a new payment integration were outside this delivery.
