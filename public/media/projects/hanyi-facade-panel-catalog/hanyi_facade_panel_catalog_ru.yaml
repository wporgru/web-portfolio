title: Наполнение раздела фасадных панелей Ханьи
tagline: Подготовил раздел фасадных панелей и комплектующих на действующем сайте
  поставщика по образцу уже оформленного раздела сухих смесей.
year: "11.2024"
role: Веб-разработка и автоматизация
stack:
  - Catalog content
  - XLSX
  - Product photography
blocks:
  - type: text
    title: Задача и ограничения
    body: Подготовил раздел фасадных панелей и комплектующих на действующем сайте
      поставщика по образцу уже оформленного раздела сухих смесей.
  - type: text
    title: Как устроено решение
    body: "Уточнил, откуда брать названия, цены и описания: прайс и текстовые
      материалы были разнесены по двум таблицам, изображения и баннер передал
      клиент. В согласованный объём вошли один баннер и 16 товарных позиций.
      После наполнения передал ссылку на раздел для проверки."
  - type: text
    title: Результат и проверка
    body: Клиент принял работу. Кейс показывает подготовку раздела из разрозненных
      материалов, а не автоматический обмен ценами или разработку сайта с нуля.
