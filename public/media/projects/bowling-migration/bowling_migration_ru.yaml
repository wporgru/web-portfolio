title: Переезд WooCommerce-магазина и восстановление карточек
tagline: Перенести магазин на Beget и разобраться с карточками, которые
  перестали открываться.
role: Веб-разработка
year: "12.2025"
stack:
  - WordPress
  - WooCommerce
  - Beget
blocks:
  - type: text
    title: Задача
    body: Перенести магазин на Beget и разобраться с карточками, которые перестали
      открываться.
  - type: text
    title: Что сделано
    body: Перенёс магазин на новый хостинг и исправил несколько проблемных карточек
      с одной вариацией. Для товаров с полноценным выбором размеров и весов
      сохранил вариативную структуру.
  - type: text
    title: Как решалась задача
    body: "До переноса проверял предзагрузку кэша и подозрительный трафик, но
      зависания возвращались: одной установленной причины не было. После
      переезда разобрал карточки с одной вариацией и восстановил открытие
      нескольких товаров. Где разные веса шаров и размеры обуви действительно
      нужны, сохранил варианты и отметки о наличии вместо массового упрощения
      каталога."
  - type: image
    title: Публичный вид сайта
    src: /media/projects/bowling-migration/site.png
    alt: Публичная версия сайта проекта
    caption: Снимок на дату проверки. Он показывает публичную версию сайта, а не
      обязательно вид на момент сдачи.
