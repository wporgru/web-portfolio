title: Аудит товарных фидов трёх партнёрских сетей
tagline: Нужно было выбрать источники для партнёрской витрины. Наличие оффера в
  API не гарантировало, что у него есть рабочий товарный фид, нужный регион и
  достаточно данных для карточек. Поэтому сравнивал не только списки программ,
  но и пригодность выгрузок для импорта.
year: "09.2026"
role: Веб-разработка и автоматизация
stack:
  - Python
  - REST API
  - XML
  - YML
  - Data validation
  - Affiliate catalogs
blocks:
  - type: text
    title: Задача и ограничения
    body: Нужно было выбрать источники для партнёрской витрины. Наличие оффера в API
      не гарантировало, что у него есть рабочий товарный фид, нужный регион и
      достаточно данных для карточек. Поэтому сравнивал не только списки
      программ, но и пригодность выгрузок для импорта.
  - type: text
    title: Как устроено решение
    body: Собрал выдачу Admitad, AdvCake и «Где Слон?», выделил релевантные
      программы и отдельно проверил доступные примеры фидов. Сверял регион,
      количество позиций, заполненность описаний, изображений и атрибутов.
      Отдельно отметил пустые XML-выгрузки, ошибки и программы без фида. Собрал
      результаты в таблицы CSV и XLSX, отделив найденные офферы от
      подтверждённых источников данных.
  - type: text
    title: Результат и проверка
    body: В выгрузке Admitad выделил 143 релевантные программы из 1 283 записей API.
      Один проверенный московский фид содержал 11 245 товаров и 11 243
      изображения; другой доступный фид оказался не московским. Результат —
      приоритеты для пилота. Это срез сентября, не подтверждение сегодняшней
      доступности фидов или комиссий.
