title: "Solomon: responsive layout and enquiry button audit"
tagline: Compared a service website’s requested changes with the public version.
  Pages could load while still showing a consultation button that did nothing or
  cutting text off at the screen edge.
year: "07.2026"
role: Web development and automation
stack:
  - WordPress
  - Elementor
  - Chromium
  - Responsive QA
  - UX audit
blocks:
  - type: text
    title: Brief and constraints
    body: Compared a service website’s requested changes with the public version.
      Pages could load while still showing a consultation button that did
      nothing or cutting text off at the screen edge.
  - type: text
    title: How it works
    body: Checked eight public pages in Chromium at 1440 and 390 px. Compared the
      hero, copy and forms with the brief, and tested navigation and
      consultation buttons separately. Measured document width and element
      boundaries in addition to the viewport to distinguish full-page overflow
      from intentional clipping within carousels. Prioritized buttons that
      opened nothing and clipped text before brief discrepancies and visual
      polish.
  - type: text
    title: Result and verification
    body: "On the desktop passport page, a heading widened the document to 1540 px
      in a 1440 px viewport. On the mobile consular review page, a 400 px
      heading and paragraph started 30 px from the left, leaving the right edge
      40 px outside the screen. Listed placeholder buttons separately from
      working Elementor dialogs: appearance alone did not show whether a button
      triggered an action. Delivered the eight-page matrix and a prioritized
      repair list. No site edits or form submissions were made."
  - type: image
    src: /media/projects/solomon-responsive-conversion-audit/audit-passport-desktop.png
    alt: Archived desktop capture of the passport service page
    caption: July 14, 2026, 1440 px viewport. An overflowing heading expanded the
      document to 1540 px. The capture includes the entire document and overflow
      area. This is the audited state, not a redesign result.
  - type: image
    src: /media/projects/solomon-responsive-conversion-audit/audit-consular-mobile.png
    alt: Archived mobile capture of the consular review page
    caption: July 14, 2026, 390 px viewport and a 430 px document. The full-page
      capture includes the 40 px overflow on the right. No enquiry was
      submitted.
