title: "«Соломон»: аудит мобильной вёрстки и кнопок заявок"
tagline: "Сопоставил замечания к сайту услуг с его публичной версией. Все
  страницы открывались, но этого было недостаточно: посетитель мог увидеть
  кнопку консультации, которая ничего не открывала, или потерять часть текста за
  краем экрана."
year: "07.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Elementor
  - Chromium
  - Responsive QA
  - UX audit
blocks:
  - type: text
    title: Задача и ограничения
    body: "Сопоставил замечания к сайту услуг с его публичной версией. Все страницы
      открывались, но этого было недостаточно: посетитель мог увидеть кнопку
      консультации, которая ничего не открывала, или потерять часть текста за
      краем экрана."
  - type: text
    title: Как устроено решение
    body: "Проверил восемь публичных страниц в Chromium при ширине 1440 и 390 px.
      Сопоставил первый экран, тексты и формы с заданием, отдельно проверил меню
      и кнопки консультации. Измерял не только ширину окна, но и ширину
      документа и границы элементов: это помогло отделить переполнение всей
      страницы от штатной обрезки карточек внутри карусели. В отчёте расставил
      приоритеты: сначала кнопки, которые ничего не открывали, и обрезанный
      текст, затем расхождения с заданием и оформление."
  - type: text
    title: Результат и проверка
    body: "На десктопной странице о паспорте заголовок «Жизнь на две страны»
      расширял документ до 1540 px при окне 1440 px. На мобильной странице
      консульской проверки заголовок и абзац шириной 400 px начинались с
      отступом 30 px: правый край выходил на 40 px за границу экрана. Отдельно
      составил список кнопок-заглушек и рабочих попапов Elementor: внешний вид
      кнопки не показывал, есть ли за ней действие. Передал матрицу из восьми
      страниц и порядок исправлений. Сайт не менял и формы не отправлял."
  - type: image
    src: /media/projects/solomon-responsive-conversion-audit/audit-passport-desktop.png
    alt: Архивный десктопный снимок страницы «Паспорт без проживания»
    caption: 14 июля 2026 года, окно 1440 px. Из-за выступающего заголовка ширина
      документа составила 1540 px. Сохранён весь документ, включая область
      переполнения. Это состояние на момент аудита, не результат редизайна.
  - type: image
    src: /media/projects/solomon-responsive-conversion-audit/audit-consular-mobile.png
    alt: Архивный мобильный снимок страницы «Консульская проверка»
    caption: 14 июля 2026 года, окно 390 px, документ шириной 430 px.
      Полностраничный снимок включает выступающие 40 px справа. Отправка заявки
      не выполнялась.
