title: "«Соломон»: аудит мобильной вёрстки и кнопок заявок"
tagline: "Сопоставил замечания к сайту услуг с его публичной версией. Все
  страницы открывались, но этого было недостаточно: посетитель мог увидеть
  кнопку консультации, которая ничего не открывала, или потерять часть текста за
  краем экрана."
year: "07.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Elementor
  - Chromium
  - Responsive QA
  - UX audit
blocks:
  - type: text
    title: Задача и ограничения
    body: "Сопоставил замечания к сайту услуг с его публичной версией. Все страницы
      открывались, но этого было недостаточно: посетитель мог увидеть кнопку
      консультации, которая ничего не открывала, или потерять часть текста за
      краем экрана."
  - type: text
    title: Как устроено решение
    body: "Проверил восемь URL в Chromium на 1440 и 390 px. Сопоставил фактические
      элементы с заданием, открыл меню и попапы, измерил ширину документа и
      нашёл конкретные блоки, создающие переполнение. Разделил настоящую
      горизонтальную прокрутку и штатную обрезку слайдера. Составил матрицу по
      страницам: блокирующие кнопки и обрезка текста, затем отсутствующие
      разделы и косметические изменения."
  - type: text
    title: Результат и проверка
    body: "В одном десктопном сценарии документ был примерно на 100 px шире окна; в
      мобильном — на 40 px. Отдельно перечислил кнопки-заглушки и рабочие
      попапы, чтобы править только проблемные места. Сайт не менял и формы не
      отправлял: результат работы — воспроизводимые замечания и порядок
      исправлений."
