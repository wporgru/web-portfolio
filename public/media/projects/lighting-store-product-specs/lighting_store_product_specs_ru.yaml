title: Характеристики и корзина магазина освещения
tagline: "Доработал карточку товара и корзину магазина освещения: покупателю
  должно быть проще читать характеристики и продолжать оформление заказа."
year: "05.2024"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Product attributes
  - Storefront UI
blocks:
  - type: text
    title: Задача и ограничения
    body: "Доработал карточку товара и корзину магазина освещения: покупателю должно
      быть проще читать характеристики и продолжать оформление заказа."
  - type: text
    title: Как устроено решение
    body: "Подобрал инструмент группировки характеристик и показал, как выглядит
      результат на реальном товаре. Восстановил работу корзины. Отдельно
      разобрал кнопку сравнения при наведении: её позиционирование зависело от
      разметки темы, поэтому правки карточки пришлось адаптировать, а не
      переносить вслепую."
  - type: text
    title: Результат и проверка
    body: Заказчик одобрил оформление характеристик и принял заказ. Интеграции
      оплаты, доставки и CRM в этот этап не входили.
