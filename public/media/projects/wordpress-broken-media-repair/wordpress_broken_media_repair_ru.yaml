title: Исправление битых изображений и редиректов блога
tagline: "После предыдущего этапа работ оставалась очередь проблемных адресов:
  недоступные изображения и лишние переадресации. Задача была в исправлении
  найденных ошибок, а не в очередной смене темы."
year: "04.2025"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - HTTP 404
  - Redirects
  - Technical SEO
blocks:
  - type: text
    title: Задача и ограничения
    body: "После предыдущего этапа работ оставалась очередь проблемных адресов:
      недоступные изображения и лишние переадресации. Задача была в исправлении
      найденных ошибок, а не в очередной смене темы."
  - type: text
    title: Как устроено решение
    body: Разбирал изображения партиями и сообщал о прогрессе, затем завершил
      обработку выявленных 404 и 301 по отчёту. Один редирект сохранил по
      соображениям безопасности; замену роликов отделили от этой работы.
  - type: text
    title: Результат и проверка
    body: Клиент принял работу. Промежуточные числа исправленных картинок не
      выдаются за итоговый пересчёт, а исправление URL — за подтверждённый рост
      поискового трафика.
