title: Покупка цифровых материалов Langformula
tagline: Настроил понятный переход в корзину для цифрового товара, который
  покупатель приобретает в одном экземпляре. Отдельное поле количества только
  усложняло этот сценарий.
year: "08.2022"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Astra
  - Elementor
  - PHP
  - CSS
blocks:
  - type: text
    title: Задача и ограничения
    body: Настроил понятный переход в корзину для цифрового товара, который
      покупатель приобретает в одном экземпляре. Отдельное поле количества
      только усложняло этот сценарий.
  - type: text
    title: Как устроено решение
    body: Помог исправить хлебные крошки и положение символа рубля. Логику кнопки
      вынесли в отдельный PHP-плагин; первый вариант временно нарушил доступ,
      клиент удалил файл, и настройку продолжили на исправленном варианте. После
      настройки продажи по одному экземпляру проверили переход в корзину, а поле
      количества скрыли через CSS.
  - type: text
    title: Результат и проверка
    body: После очистки кэша клиент подтвердил отображение и принял работу с
      бонусом. Платёж и выдачу файла этот этап не проверял.
