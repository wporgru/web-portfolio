title: "Wellland: глобальные атрибуты и фильтры каталога"
tagline: Локальные свойства отображались на карточках, но не участвовали в
  штатных фильтрах. При переносе нужно было сохранить исходные характеристики,
  категории и видимость, не объединяя разные единицы.
year: "10.2026"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - PHP
  - Data migration
blocks:
  - type: text
    title: Задача и ограничения
    body: Локальные свойства отображались на карточках, но не участвовали в штатных
      фильтрах. При переносе нужно было сохранить исходные характеристики,
      категории и видимость, не объединяя разные единицы.
  - type: text
    title: Как устроено решение
    body: Проверил 198 опубликованных товаров в 33 категориях, перевёл 192 товара на
      глобальные атрибуты и настроил 18 фильтров. Добавил слой совместимости для
      существующих шаблонов. Например, раздельно хранятся объём чистой и грязной
      воды и разные виды массы.
  - type: text
    title: Результат и проверка
    body: Независимо сверил 1 583 счётчика и проверил выбор, сброс и комбинации
      фильтров в браузере. Сопоставил данные с резервной копией и проверил
      мобильные ширины 320 и 390 px.
