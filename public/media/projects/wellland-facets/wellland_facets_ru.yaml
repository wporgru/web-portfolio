title: "Wellland: глобальные атрибуты и фильтры каталога"
tagline: Локальные свойства отображались на карточках, но не участвовали в штатных
  фильтрах. При переносе нужно было сохранить исходные характеристики, категории и
  видимость, не объединяя разные единицы.
year: "10.2026"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - PHP
  - Data migration
blocks:
  - type: text
    title: Почему характеристики не работали в фильтрах
    body: "На карточках отображались параметры техники, но многие хранились как локальный
      текст товара. Штатная фильтрация WooCommerce работает с общими атрибутами: красивой
      таблицы характеристик недостаточно, если у товара нет соответствующей связи с
      термином. В результате покупатель не мог надёжно отобрать машины по параметрам."
  - type: text
    title: Перенос без потери смысла и данных
    body: "Проверил 198 опубликованных простых товаров в 33 категориях: 192 требовали
      перевода, ещё шесть уже использовали глобальные атрибуты. Преобразовал 1 244
      присвоения характеристик в 1 343 значения, создал 29 общих атрибутов и повторно
      использовал три существующих. Разделил чистую и грязную воду, производительность
      уборки и расход воздуха, вес с батареями и без них. Длинную комплектацию оставил
      текстом, отсутствующие значения не превращал в фиктивные фильтры."
  - type: text
    title: Совместимость витрины и резервная копия
    body: "Перед изменениями сохранил исходные данные и файлы. Добавил совместимый читатель
      локальных и глобальных характеристик, чтобы существующие карточки, динамические
      элементы и шаблоны каталога продолжали выводить параметры после переноса. Сверил с
      копией названия, описания, адреса, цены, изображения, SEO-метаданные и исходные
      значения — расхождений в отчёте нет. Старый импорт XLSX не менял: при повторном
      запуске его карту атрибутов нужно согласовать отдельно."
  - type: image
    src: /media/projects/wellland-facets/category-verification.webp
    alt: Каталог Wellland с фильтрами по характеристикам
    title: Фильтры в каталоге
    caption: Полностраничный снимок браузерной проверки 28 октября 2026 года; видны фильтры и
      карточки категории. Заявка не отправлялась.
  - type: text
    title: Проверка не на одной карточке
    body: "Проверил 33 страницы категорий и независимо сверил 1 583 счётчика фильтров с
      видимыми товарами, учитывая исключение из каталога. Настроил 18 штатных виджетов. В
      браузере проверил выбор и сброс в девяти категориях и комбинацию бака 100 л с
      гелевой батареей: остался один товар. После фильтрации проверил, что форма заказа
      получает правильный ID; саму заявку не отправлял. На ширинах 320 и 390 px
      горизонтального переполнения не обнаружено."
  - type: text
    title: Как применить к вашему каталогу
    body: Если фильтр показывает пустую выдачу, хотя характеристики видны в карточках,
      пришлите ссылку на категорию, два артикула и значение фильтра. Определю, где
      хранится параметр, как он приходит из импорта и что нужно сохранить при переходе на
      общие атрибуты.
