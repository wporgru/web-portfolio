title: Парсинг каталога одежды и подготовка данных к импорту
tagline: Нужно было получить не копию всего каталога поставщика, а таблицу, с
  которой можно начать настройку импорта. В выборку требовалось включить
  позиции, обозначенные как доступные, и разложить характеристики по отдельным
  полям.
year: "02.2026"
role: Веб-разработка и автоматизация
stack:
  - Web scraping
  - XLSX
  - Data validation
blocks:
  - type: text
    title: Задача и ограничения
    body: Нужно было получить не копию всего каталога поставщика, а таблицу, с
      которой можно начать настройку импорта. В выборку требовалось включить
      позиции, обозначенные как доступные, и разложить характеристики по
      отдельным полям.
  - type: text
    title: Как устроено решение
    body: "Проверил доступность данных, настроил парсер и запустил длительный сбор.
      Передал полный XLSX и отдельную выборку для загрузки. В подготовленной
      таблице стало 22 столбца вместо девяти в исходной: атрибуты можно
      сопоставлять по полям, а не разбирать вручную из общего текста. При сверке
      оригиналов все адреса подготовленной выборки нашлись в полном файле."
  - type: text
    title: Результат и проверка
    body: "Клиент принял файлы. Полный сбор содержал 28 664 непустые строки,
      подготовленная выборка — 9 683 строки и 9 645 уникальных URL. Это объём
      данных, а не число опубликованных товаров: развёртывание магазина и
      загрузка были отдельными работами."
  - type: text
    title: Другой этап этого проекта
    links:
