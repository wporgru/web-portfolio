title: "Pariscoiff: внутренняя SEO-настройка и мобильные правки"
tagline: Настроил URL, шаблоны метаданных и sitemap WooCommerce, дополнил ALT и после проверки заказчиком поправил мобильный H1 и навигацию в Chrome.
year: "07.2022"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - Google Search Console
  - Technical SEO
blocks:
  - type: text
    title: Задача и ограничения
    body: Устранить пробелы во внутренней SEO-настройке магазина WooCommerce и привести мобильные заголовки и навигацию в порядок по результатам проверки.
  - type: text
    title: Как устроено решение
    body: Настроил адреса WooCommerce, шаблоны метаданных и исключение ненужных
      типов из существующей карты сайта. Передал карту в Search Console и
      добавил недостающие ALT. По обратной связи менял переносы, цвета и
      мобильный H1, вернул прежний размер фото и исправил ложное активное
      состояние якорного меню в Chrome.
  - type: text
    title: Результат и проверка
    body: Клиент проверил и принял правки. Отправка карты сайта и исправление
      интерфейса не доказывают рост видимости в поиске.
