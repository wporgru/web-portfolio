title: "Pariscoiff: внутренняя SEO-настройка и мобильные правки"
tagline: Доработал структуру страниц и поисковые настройки магазина и исправил
  отображение заголовков на телефонах.
year: "07.2022"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - Google Search Console
  - Technical SEO
blocks:
  - type: text
    title: Задача и ограничения
    body: Доработал структуру страниц и поисковые настройки магазина и исправил
      отображение заголовков на телефонах.
  - type: text
    title: Как устроено решение
    body: Настроил адреса WooCommerce, шаблоны метаданных и исключение ненужных
      типов из существующей карты сайта. Передал карту в Search Console и
      добавил недостающие ALT. По обратной связи менял переносы, цвета и
      мобильный H1, вернул прежний размер фото и исправил ложное активное
      состояние якорного меню в Chrome.
  - type: text
    title: Результат и проверка
    body: Клиент проверил и принял правки. Отправка карты сайта и исправление
      интерфейса не доказывают рост видимости в поиске.
