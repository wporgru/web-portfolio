title: Сетка и габариты каталога медоборудования
tagline: Переработал каталог медоборудования так, чтобы покупатель мог быстрее
  просматривать ассортимент, видеть размеры и искать нужный товар внутри
  каталога.
year: "09.2020"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Catalog UX
  - Product dimensions
  - Search
blocks:
  - type: text
    title: Задача и ограничения
    body: Переработал каталог медоборудования так, чтобы покупатель мог быстрее
      просматривать ассортимент, видеть размеры и искать нужный товар внутри
      каталога.
  - type: text
    title: Как устроено решение
    body: Убрал лишние визуальные эффекты, добавил поиск, перенёс счётчик
      результатов к сортировке и поправил отступы и контакты. Настроил вывод
      габаритов WooCommerce и проверял поисковый шаблон по фактическим
      результатам. Клиент подтвердил вид сетки из шести колонок на ноутбуке.
  - type: text
    title: Результат и проверка
    body: После закрытия заказа получен положительный отзыв. Остаточные проблемы
      поиска были выделены в отдельную диагностику, не выданы за устранённые.
