title: "MediMarket24: восстановление 120 изображений каталога"
tagline: В каталоге пропадали изображения, когда поставщик временно не отвечал.
  Сборка воспринимала сетевой сбой как повод убрать картинку, хотя у неё уже был
  пригодный локальный вариант. Нужно было сохранить проверенные изображения, не
  подставляя файлы от других товаров.
year: "10.2026"
role: Веб-разработка и автоматизация
stack:
  - Astro
  - Node.js
  - Sharp
  - Git
  - SHA-256
  - GitHub Actions
blocks:
  - type: text
    title: Задача и ограничения
    body: В каталоге пропадали изображения, когда поставщик временно не отвечал.
      Сборка воспринимала сетевой сбой как повод убрать картинку, хотя у неё уже
      был пригодный локальный вариант. Нужно было сохранить проверенные
      изображения, не подставляя файлы от других товаров.
  - type: text
    title: Как устроено решение
    body: Воспроизвёл потерю файла регрессионным тестом. Разделил временный сбой
      источника и случаи, когда изображение нельзя использовать. Вернул файлы из
      проверенного Git-кэша только при совпадении источника и контрольной суммы;
      отдельно проверил читаемость через Sharp. Сомнительные и недоступные
      источники не заменял похожими картинками.
  - type: text
    title: Результат и проверка
    body: После публикации все 120 восстановленных изображений ответили HTTP 200 и
      совпали с кэшем по SHA-256. На этапе приёмки сборка приняла 740 из 746
      товарных изображений. Это проверка файлов и их доступности; рост трафика и
      продаж не измерялся.
