title: "Tara Bergman: ускорение фотогалереи порциями"
tagline: На странице портфолио почти три сотни фотографий уже имели lazy
  loading, но при обычном открытии браузер всё равно запрашивал почти всю
  галерею. Нужно было облегчить старт, не исключая фотографии из коллекции и не
  ломая просмотр в полноэкранном режиме.
year: "07.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - PHP
  - JavaScript
  - Image loading
  - Playwright
blocks:
  - type: text
    title: Задача и ограничения
    body: На странице портфолио почти три сотни фотографий уже имели lazy loading,
      но при обычном открытии браузер всё равно запрашивал почти всю галерею.
      Нужно было облегчить старт, не исключая фотографии из коллекции и не ломая
      просмотр в полноэкранном режиме.
  - type: text
    title: Как устроено решение
    body: "Сверил разметку и сетевые ответы: в исходном аудите было 302 элемента
      img, 298 с lazy loading, но 301 ответ с изображением без прокрутки.
      Разделил вывод на серверную стартовую порцию и добавление следующих
      элементов по кнопке. Для добавленных фотографий сохранил миниатюры, alt,
      индексы просмотра и отложенную загрузку. Подпись кнопки локализовал для
      EN, RU и ES."
  - type: text
    title: Результат и проверка
    body: В актуальной браузерной проверке галерея начала с 30 фотографий в
      контейнере; после одного нажатия стало 60. Это подтверждает порционную
      загрузку элементов. Исторический объём сетевых ответов и текущий размер
      HTML не сравниваю как один и тот же показатель.
