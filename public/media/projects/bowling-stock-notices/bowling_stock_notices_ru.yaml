title: Уведомления о поступлении и WhatsApp в BowlingStore
tagline: Покупателю нужно было оставить заявку на отсутствующий товар или быстро
  связаться с магазином. Письмо подписки при этом должно было выглядеть как
  сообщение от магазина, а не как стандартный шаблон плагина.
year: "02.2025"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Joinchat
  - Localization
blocks:
  - type: text
    title: Задача и ограничения
    body: Покупателю нужно было оставить заявку на отсутствующий товар или быстро
      связаться с магазином. Письмо подписки при этом должно было выглядеть как
      сообщение от магазина, а не как стандартный шаблон плагина.
  - type: text
    title: Как устроено решение
    body: Перевёл интерфейс подписки, адаптировал цвета письма и добавил логотип.
      После замечания клиента перевёл оставшуюся строку. Установил Joinchat и
      проверил тестовые сообщения, чтобы заказчик мог увидеть путь обращения
      через WhatsApp.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил чат и принял заказ. Полная цепочка уведомлений о каждом
      товаре и удаление прежнего виджета не заявляются.
