title: "Keytering: смена домена и правка первого экрана"
tagline: Помог перевести действующий сайт на более короткий адрес после
  сложности с HTTPS на вложенном поддомене. Вместе с переездом поправил подачу
  текста на главной.
year: "05.2022"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Domain migration
  - TLS
  - Homepage layout
blocks:
  - type: text
    title: Задача и ограничения
    body: Помог перевести действующий сайт на более короткий адрес после сложности с
      HTTPS на вложенном поддомене. Вместе с переездом поправил подачу текста на
      главной.
  - type: text
    title: Как устроено решение
    body: Передал новый адрес для проверки. По обратной связи уменьшил заголовок
      первого экрана с 35 до 20, чтобы он занимал меньше места. Поздние
      пожелания по дальнейшему уменьшению и положению телефона не выдавал за
      проверенный итог.
  - type: text
    title: Результат и проверка
    body: Заказчик принял этап. Редиректы прежнего адреса, цепочка сертификатов и
      поисковые зеркала не проверены по сохранённым данным.
