title: Очистка WordPress и восстановление разделов сайта
tagline: После обнаружения вредоносных файлов требовалось не просто очистить
  сайт, а вернуть разделы, которыми пользовался заказчик.
year: "04.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - PHP
  - Incident recovery
blocks:
  - type: text
    title: Задача и ограничения
    body: После обнаружения вредоносных файлов требовалось не просто очистить сайт,
      а вернуть разделы, которыми пользовался заказчик.
  - type: text
    title: Как устроено решение
    body: В рабочем отчёте зафиксировал десять обнаруженных заражённых файлов,
      провёл очистку и повторную проверку. После замечаний о состоянии сайта
      последовательно восстановил блог и акции, чтобы заказчик мог проверить оба
      раздела отдельно.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил работу блога и акций. Это конкретный восстановительный
      этап, а не гарантия отсутствия будущих инцидентов или подтверждение работы
      старого редактора планов.
