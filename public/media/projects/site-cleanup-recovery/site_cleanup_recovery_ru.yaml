title: "RumbaStock: очистка WordPress и восстановление блога и акций"
tagline: "После лечения сайта восстановил два ключевых раздела, где вместо
  полноценного списка публикаций оставался только последний элемент."
year: "04.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - PHP
  - Incident recovery
blocks:
  - type: text
    title: После лечения сайта пропали привычные разделы
    body: "В апреле 2026 года на rumbastock.ru потребовалось разобраться с
      последствиями заражения WordPress и вернуть владельцу рабочие разделы.
      Исторический отчёт исполнителя фиксирует десять найденных заражённых
      файлов и выполненную очистку. После неё клиент отдельно сообщил о
      проблемах блога и страницы акций: вместо списка материалов с изображениями
      и текстом выводилась только последняя запись. Поэтому задача состояла не
      только в очистке, но и в восстановлении конкретных функций, нужных для
      ежедневной работы с контентом."
  - type: text
    title: Очистка и поэтапное восстановление
    body: "В отчёте зафиксировал десять обнаруженных заражённых файлов, очистку и
      повторную проверку. После замечаний клиента не стал считать первоначальную
      очистку финалом: последовательно восстановил страницу блога, затем список
      акций. Разделы проверялись отдельно, чтобы заказчик мог подтвердить каждый
      сценарий — чтение публикаций и просмотр действующих предложений — а не
      только главную сайта. Клиент также поднимал вопрос старого редактора
      планов; его окончательное исправление и отдельная приёмка в читаемой
      переписке не подтверждены, поэтому в результат кейса он не включён."
  - type: text
    title: Результат и подтверждение
    body: Клиент по отдельности подтвердил, что блог и страница акций снова
      работают. Это проверяемый результат именно по rumbastock.ru; отзыв клиента
      упоминает более широкое сотрудничество по нескольким сайтам, но другие
      домены не приписываются этому заказу. Число десять — из исторического
      отчёта исполнителя, а не из независимого нового сканирования. Не заявляю
      способ проникновения, полный перечень вредоносных изменений, гарантию от
      повторного заражения или подтверждённый ремонт редактора планов.
    links:
      - label: Исходный заказ и отзыв на Kwork
        url: https://kwork.ru/track?id=61061072
  - type: text
    title: Почему после очистки важно вернуть рабочий контент
    body: "Удаление вредоносных файлов само по себе не гарантирует, что редактор
      сможет работать с сайтом как раньше. После очистки нужно отдельно пройти
      пользовательские и редакционные сценарии: открывается ли блог, выводится
      ли архив материалов, работает ли список акций. В этом проекте восстановление
      двух разделов было отдельным этапом после антивирусной очистки, и клиент
      подтвердил результат по каждому из них."
