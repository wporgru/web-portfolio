title: Товары WooCommerce на страницах услуг
tagline: Доработал существующую страницу услуги, чтобы посетитель видел
  относящиеся к ней товары, а не общий список каталога.
year: "06.2024"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Elementor
  - Contextual merchandising
blocks:
  - type: text
    title: Задача и ограничения
    body: Доработал существующую страницу услуги, чтобы посетитель видел относящиеся
      к ней товары, а не общий список каталога.
  - type: text
    title: Как устроено решение
    body: Разобрал нестандартную разметку Elementor и изменил вывод товаров в уже
      существующем оформлении. Передал страницу заказчику, чтобы он проверил не
      только внешний вид, но и состав показанных позиций.
  - type: text
    title: Результат и проверка
    body: Заказчик подтвердил показ нужных товаров и принял работу. Это точечная
      настройка вывода, а не универсальная система рекомендаций.
