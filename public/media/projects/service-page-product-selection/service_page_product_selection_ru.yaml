title: Товары WooCommerce на страницах услуг
tagline: 'Связал содержание страницы услуги с подборкой товара: вместо случайной карусели кондиционеров посетитель должен был видеть категорию, которая относится к конкретной услуге.'
year: "06.2024"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Elementor
  - Контекстный вывод товаров
blocks:
  - type: text
    title: 'Проблема: карусель не соответствовала услуге'
    body: >-
      На странице вентиляционной услуги клиент обнаружил в товарной карусели
      несвязанные кондиционеры. Требовалось показывать релевантную категорию,
      например приточные клапаны, чтобы подборка поддерживала содержание страницы,
      а не уводила посетителя к другому типу оборудования.
  - type: text
    title: Разобрал существующую сборку Elementor
    body: >-
      Страница использовала нестандартную разметку Elementor. Я изучил текущую
      структуру и изменил вывод каталога внутри существующего оформления, не
      подменяя задачу полной переделкой сайта. В доступных материалах не раскрыты
      точный код и механизм связи услуги с товарной категорией, поэтому не
      приписываю проекту отдельный универсальный движок рекомендаций.
  - type: text
    title: Проверка по релевантности и работе блока
    body: >-
      Передал страницу клиенту для проверки двух вещей: карусель должна показывать
      товары нужного типа, а сама подборка — корректно работать в реальном шаблоне.
      Заказчик подтвердил появление нужных товаров и работоспособность решения,
      после чего принял заказ. Это приёмка конкретной страницы, а не независимый
      аудит каждой услуги на сайте.
  - type: text
    title: Практический эффект и границы
    body: >-
      Контекстная товарная подборка делает путь от описания услуги к подходящему
      оборудованию понятнее и избавляет посетителя от заведомо нерелевантных
      карточек в этом блоке. Рост конверсии или продаж не измерялся; решение не
      заявляется как автоматическое сопоставление всего каталога.
  - type: image
    title: Публичный вид сайта
    src: /media/projects/service-page-product-selection/later-homepage.webp
    alt: Публичная главная сайта «ДомКлимат»
    caption: Публичная версия от 24 октября 2026 года, без обрезки. Пустые участки сохранены; снимок не проверяет подбор товаров на страницах услуг.
