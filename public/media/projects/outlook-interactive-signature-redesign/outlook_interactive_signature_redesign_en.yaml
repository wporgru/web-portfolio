title: Interactive Outlook HTML signature replacing a static business card
tagline: Replaced a static business-card image with an editable Outlook HTML
  signature, corrected the file after an installation issue, then refined its
  proportions, fonts, colours and icons in a separate follow-up stage.
year: 08–09.2023
role: Web development and automation
stack:
  - HTML
  - Outlook
  - Email design
  - Brand assets
blocks:
  - type: text
    title: Brief and constraints
    body: The brief was to replace a static business-card image with an editable
      HTML signature for Outlook. It had to use the company's supplied assets
      and reference, with separate contact elements linking to its website,
      email, WhatsApp and social channels. The scope was the signature, not the
      company website or a new brand identity.
  - type: text
    title: "First stage: HTML layouts and installation"
    body: Prepared several versions using the company logo and a visual divider.
      After the client reported an installation issue, corrected the file and
      handed over an updated version. The client accepted this stage and
      described the result as almost perfect.
  - type: text
    title: "Second stage: proportions and brand details"
    body: Refined the same signature under a separate order. Agreed on a
      rectangular composition; adjusted proportions and the placement of the
      website, channel and dividers, and revised icons, colours and fonts. This
      was a continuation of the signature project, not a new website or brand
      identity engagement.
  - type: text
    title: Outcome and verification limits
    body: The client accepted both stages; a positive review is preserved for the
      first. The archive does not contain a confirmed final file for independent
      testing, so this case does not claim link testing, a team-wide rollout or
      compatibility with every Outlook version.
