title: Интерактивная HTML-подпись Outlook вместо статичной визитки
tagline: "Подготовил редактируемую HTML-подпись для Outlook вместо изображения-визитки,
  исправил файл после замечания к установке, а затем отдельным этапом переработал
  пропорции, шрифты, цвета и иконки."
year: 08–09.2023
role: Веб-разработка и автоматизация
stack:
  - HTML
  - Outlook
  - Email design
  - Brand assets
blocks:
  - type: text
    title: Задача и ограничения
    body: Требовалось заменить статичную картинку-визитку на редактируемую
      HTML-подпись для Outlook. В основу нужно было взять материалы компании и
      образец, а контакты — оформить отдельными элементами со ссылками на сайт,
      почту, WhatsApp и социальные площадки. Работа относилась к подписи, а не к
      разработке сайта или фирменного стиля.
  - type: text
    title: "Первый этап: HTML-варианты и установка"
    body: Подготовил несколько вариантов с логотипом компании и визуальным
      разделителем. После сообщения о проблеме с установкой поправил файл и
      повторно передал его клиенту. Заказчик принял этап и назвал результат
      практически идеальным.
  - type: text
    title: "Второй этап: пропорции и фирменные детали"
    body: По отдельному заказу доработал ту же подпись. Согласовали прямоугольную
      компоновку; уточнил пропорции и расположение сайта, канала и разделителей,
      обновил иконки, цвета и шрифты. Это продолжение одного проекта, а не новый
      сайт или отдельная разработка бренда.
  - type: text
    title: Результат и границы проверки
    body: Оба этапа приняты заказчиком; по первому сохранён положительный отзыв.
      В архиве не сохранился подтверждённый финальный файл для независимого
      тестирования. Поэтому кейс не заявляет проверку ссылок, развёртывание для
      всей команды или совместимость со всеми версиями Outlook.
