title: Интерактивная подпись Outlook вместо картинки
tagline: "Заменил картинку-визитку на редактируемую HTML-подпись: получатель мог
  открыть сайт, написать письмо или перейти в мессенджер прямо из подписи."
year: 08–09.2023
role: Веб-разработка и автоматизация
stack:
  - HTML
  - Outlook
  - Email design
  - Brand assets
blocks:
  - type: text
    title: Задача и ограничения
    body: "Заменил картинку-визитку на редактируемую HTML-подпись: получатель мог
      открыть сайт, написать письмо или перейти в мессенджер прямо из подписи."
  - type: text
    title: Как устроено решение
    body: Подготовил несколько вариантов на основе материалов компании, включая
      логотип и разделитель. После замечания об установке исправил файл.
      Следующим этапом согласовал прямоугольную компоновку, обновил пропорции и
      передал новый вариант.
  - type: text
    title: Результат и проверка
    body: Клиент принял оба этапа. Это оформление подписи, а не разработка
      фирменного стиля или проверка всех версий Outlook.
