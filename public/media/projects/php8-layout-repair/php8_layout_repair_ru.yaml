title: Переход на PHP 8 с ремонтом вёрстки сайта
tagline: Заказчику нужно было обновить серверную среду, не потеряв рабочий
  каталог. Перед обновлением требовалось отделить дефекты интерфейса от
  особенностей вручную заполненных страниц меток.
year: "06.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - PHP 8
  - Responsive layout
blocks:
  - type: text
    title: Задача и ограничения
    body: Заказчику нужно было обновить серверную среду, не потеряв рабочий каталог.
      Перед обновлением требовалось отделить дефекты интерфейса от особенностей
      вручную заполненных страниц меток.
  - type: text
    title: Как устроено решение
    body: Проверил каталог, уточнил, где работает настоящий фильтр, а где
      открывается вручную собранная страница. Согласовал существующий снимок
      хостинга как точку отката. После перехода на PHP 8 исправил ошибки вёрстки
      и по отчёту повторно проверил ключевые участки.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил работу сайта и принял заказ. Точная минорная версия PHP
      и проверка каждой страницы каталога в итоговом отчёте не зафиксированы.
