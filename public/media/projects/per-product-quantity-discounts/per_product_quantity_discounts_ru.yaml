title: Количественные скидки по каждому товару
tagline: Настроил скидки по количеству единиц конкретного товара, чтобы покупка
  разных наименований не давала скидку по общему числу позиций в корзине.
year: "03.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Quantity discounts
  - Cart rules
blocks:
  - type: text
    title: Задача и ограничения
    body: "Для WooCommerce-магазина ортопедических стелек требовались оптовые ступени скидки по числу пар каждого конкретного товара: 15 пар — 2,5%, 50 — 5%, 100 — 10%. Суммировать разные модели для достижения порога было нельзя; при смешанном заказе каждая товарная позиция должна получать собственную подходящую ступень."
  - type: text
    title: Как устроено решение
    body: "Первоначально выбранная логика CART COUNT считала общее количество товаров в корзине. Клиент указал, что при смешении разных моделей такое правило даст неверный результат. Уточнил бизнес-логику: порог считается по количеству одного товара, а скидки между ступенями не складываются — для позиции действует максимальный достигнутый уровень. Перенастроил правила именно под такой расчёт и отправил результат заказчику на проверку. Точное название расширения и полный протокол проверок в архиве не сохранились."
  - type: text
    title: Результат и проверка
    body: Клиент поблагодарил за исправление и принял настройку; заказ закрыт с положительным отзывом. В материалах подтверждено исправление исходной трактовки общей корзины на требуемую логику по товарным позициям. При этом полный набор граничных и смешанных корзин не сохранён, а актуальный сайт закрывает цены для анонимных посетителей, поэтому сегодняшняя повторная проверка исторических порогов не проводилась. Это настройка существующего магазина, не разработка собственного плагина.
