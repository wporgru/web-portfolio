title: Количественные скидки по каждому товару
tagline: Настроил скидки по количеству единиц конкретного товара, чтобы покупка
  разных наименований не давала скидку по общему числу позиций в корзине.
year: "03.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Quantity discounts
  - Cart rules
blocks:
  - type: text
    title: Задача и ограничения
    body: Настроил скидки по количеству единиц конкретного товара, чтобы покупка
      разных наименований не давала скидку по общему числу позиций в корзине.
  - type: text
    title: Как устроено решение
    body: "Первый вариант опирался на общий счётчик корзины и не подошёл для
      смешанных заказов. Уточнил правило: проценты не складываются, а скидка
      определяется отдельно для каждой позиции. Перенастроил условия и передал
      результат клиенту на проверку."
  - type: text
    title: Результат и проверка
    body: Клиент принял настройку. Полный набор тестовых корзин и параметры
      используемого расширения не сохранились.
