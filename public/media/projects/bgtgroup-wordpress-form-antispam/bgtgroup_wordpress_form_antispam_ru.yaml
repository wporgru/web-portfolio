title: "BGT Group: защита WordPress-форм от спама"
tagline: Через существующие формы обратной связи периодически приходил спам.
  Нужно было добавить защиту в действующий сценарий отправки, не превращая
  задачу в переделку сайта.
year: "03.2024"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Contact forms
  - CAPTCHA
  - Spam prevention
blocks:
  - type: text
    title: Задача и ограничения
    body: Через существующие формы обратной связи периодически приходил спам. Нужно
      было добавить защиту в действующий сценарий отправки, не превращая задачу
      в переделку сайта.
  - type: text
    title: Как устроено решение
    body: Установил капчу на согласованных формах и передал скриншоты на проверку.
      Изменения международного формата номера и чекбоксов согласия обсуждались
      отдельно; не смешиваю их с этапом защиты.
  - type: text
    title: Результат и проверка
    body: Клиент посмотрел результат и принял заказ. В архиве нет полного перечня
      проверенных форм, подтверждения поставщика капчи или статистики до и
      после. Кейс подтверждает установку защиты, а не исчезновение спама
      навсегда.
  - type: text
    title: Связанный проект
    links:
      - label: "Связанный этап: согласие и ссылки на политику в трёх языковых версиях"
