title: "FoodsFact: англоязычный каталог оборудования"
tagline: Собрал англоязычную витрину пищевого оборудования для клиентов, которым
  важны технические характеристики, условия поставки и возможность задать вопрос
  до заказа.
year: "09.2020"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - WP All Import
  - Product UX
blocks:
  - type: text
    title: Задача и ограничения
    body: Собрал англоязычную витрину пищевого оборудования для клиентов, которым
      важны технические характеристики, условия поставки и возможность задать
      вопрос до заказа.
  - type: text
    title: Как устроено решение
    body: "Передал таблицу для проверки английских названий и цен. Перестроил
      карточку: увеличил фото, выделил Equipment specs, согласовал кнопки, вывел
      контакты, чат и ссылку на условия доставки. Настроил раздел объявлений с
      отдельной формой подачи. Передал экспорт и инструкцию по обновлению через
      WP All Import."
  - type: text
    title: Результат и проверка
    body: Клиент счёл витрину достаточной для старта и оставил положительный отзыв.
      В отчёте указано 130 товаров без независимого пересчёта. Реальную оплату,
      модерацию объявлений и все условия доставки архив не подтверждает.
  - type: image
    src: /media/projects/foodsfact-equipment-catalog/historical-storefront.webp
    alt: Главная англоязычного каталога FoodsFact
    caption: "Исторический снимок из портфолио Kwork: категории оборудования,
      объявление раздела Bulletin board и контактные элементы. Дата съёмки не
      установлена."
