    src: /media/projects/foodsfact-equipment-catalog/historical-storefront.webp
    alt: Homepage of the English-language FoodsFact catalog
    caption: Historical Kwork portfolio image showing equipment categories, Bulletin
      board navigation and contact elements. Capture date unknown.
