title: Хлебные крошки WooCommerce в шаблонах сайта
tagline: Добавил навигационный путь на внутренние страницы сайта, сохранив
  основное меню и не выводя лишнюю навигацию на главной.
year: "03.2020"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - Yoast SEO
  - Templates
blocks:
  - type: text
    title: Задача и ограничения
    body: Добавил навигационный путь на внутренние страницы сайта, сохранив основное
      меню и не выводя лишнюю навигацию на главной.
  - type: text
    title: Как устроено решение
    body: Встроил вывод Yoast SEO в шаблоны, где крошки должны были появляться над
      H1. Отключил ставший ненужным Breadcrumb NavXT, чтобы не держать два
      решения для одной функции. После проверки с клиентом уточнил расположение
      и сократил лишний отступ на 30 px.
  - type: text
    title: Результат и проверка
    body: Клиент принял настройку. Текущий вид сайта не используется как
      подтверждение расположения крошек во всех исторических шаблонах.
