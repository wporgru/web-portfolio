title: "Мегаватт: перенос 136 коммерческих страниц WordPress"
tagline: Отделил услуги от статей и проектов, перевёл их на единый шаблон
  с редактируемыми полями и проверил каждую страницу на стенде. У 135 из
  136 страниц сохранились прежние адреса.
year: "10.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - GeneratePress
  - Secure Custom Fields
  - SEO migration
  - Playwright
blocks:
  - type: text
    title: Задача и ограничения
    body: На тестовой копии нужно было отделить коммерческие услуги от статей и
      проектов. Страницы услуг должны редактироваться через структурированные
      поля, но при переносе нельзя было затронуть смешанные рубрики или потерять
      содержание и поисковые метаданные.
  - type: text
    title: Перенос без массовой смены адресов
    body: Отобрал записи из однозначно коммерческих рубрик, не затрагивая
      статьи и проекты в смешанных разделах. Перед изменениями сохранил тему
      и базу. Перевёл 136 записей, в том числе 8 страниц технических документов,
      из записей WordPress в страницы, сохранив их содержимое и SEO-поля.
      Один адрес уже использовала другая страница. Вместо того чтобы перезаписать
      её или направить посетителей не туда, для услуги выделили новый slug.
  - type: text
    title: Что получил редактор сайта
    body: В едином шаблоне услуги изображения, секции и FAQ редактируются
      через поля Secure Custom Fields. Для 14 приоритетных услуг заменил
      одинаковые FAQ на отдельные наборы из десяти тематических вопросов
      и ответов. На телефоне прайс стал карточками с подписями к значениям;
      на компьютере сохранились таблица и сортировка.
  - type: text
    title: Результат и проверка
    body: "По сохранённому HTML-отчёту на стенде проверены 136 уникальных
      адресов. Все вернули HTTP 200 и содержали один непустой H1, разметку
      шаблона услуги, блок основного контента и десять элементов FAQ.
      В итоговой ведомости зафиксировано 135 сохранённых адресов и один новый.
      Это результаты проверки тестовой копии, а не подтверждение выпуска
      на боевой сайт или индексации."
    links:
      - label: Сводка проверки 136 страниц (JSON)
        url: /media/projects/megawatt-service-template-migration/service-migration-qa-summary.json
  - type: text
    title: Если предстоит такой перенос
    body: "Пришлите sitemap и несколько URL, которые должны остаться
      неизменными. По ним можно определить правила отбора страниц и составить
      проверку приёмки: какие адреса сохраняем, где нужен отдельный разбор
      и какие поля и блоки сравниваем после переноса."
    links:
      - label: Технический SEO-аудит перед переносом
        url: /services/technical-seo/
