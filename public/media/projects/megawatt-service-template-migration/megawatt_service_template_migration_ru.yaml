title: "«Мегаватт»: перенос 136 услуг на новый шаблон"
tagline: На тестовой копии нужно было отделить коммерческие услуги от статей и
  проектов. Страницы услуг должны редактироваться через структурированные поля,
  но при переносе нельзя было затронуть смешанные рубрики или потерять
  содержание и поисковые метаданные.
year: "10.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - GeneratePress
  - Secure Custom Fields
  - SEO migration
  - Playwright
blocks:
  - type: text
    title: Задача и ограничения
    body: На тестовой копии нужно было отделить коммерческие услуги от статей и
      проектов. Страницы услуг должны редактироваться через структурированные
      поля, но при переносе нельзя было затронуть смешанные рубрики или потерять
      содержание и поисковые метаданные.
  - type: text
    title: Как устроено решение
    body: Выделил записи из однозначно коммерческих рубрик, сохранил тему и базу
      перед изменениями и перевёл 136 записей в страницы. Подключил шаблон услуг
      с блоками SCF, тематическими изображениями и FAQ. На 14 основных страницах
      заменил общий блок десятью тематическими вопросами для каждой услуги.
      Мобильный прайс перевёл в карточки с видимыми подписями столбцов, сохранив
      настольную таблицу и сортировку.
  - type: text
    title: Результат и проверка
    body: "На стенде 136 из 136 URL вернули HTTP 200, один H1, шаблон услуги и
      видимое содержимое. У 135 страниц адрес сохранился; для одной согласовали
      новый slug, а старый оставили за другой действующей страницей. Боевой сайт
      в этом этапе не менялся: результаты относятся к стенду, не к индексации
      или выпуску."
