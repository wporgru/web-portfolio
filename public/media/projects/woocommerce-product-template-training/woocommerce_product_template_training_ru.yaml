title: Индивидуальные шаблоны товаров WooCommerce
tagline: Показал, как оформлять отдельные товарные страницы с собственными
  блоками, не меняя общий шаблон всего каталога.
year: "01.2024"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - Shortcodes
  - Product templates
blocks:
  - type: text
    title: Задача и ограничения
    body: Показал, как оформлять отдельные товарные страницы с собственными блоками,
      не меняя общий шаблон всего каталога.
  - type: text
    title: Как устроено решение
    body: На примере 1С:ERP показал визуальное редактирование, вставку блоков
      шорткодами и назначение шаблона отдельному товару. Когда непривычный
      редактор мешал работе, отключил его и объяснил, как включить снова.
      Разделил настройку механизма и будущую разработку отдельных лендингов.
  - type: text
    title: Результат и проверка
    body: Клиент принял консультацию. Серия готовых лендингов и внедрение CRM не
      входили в подтверждённый результат.
