title: "Шаблоны товарных страниц WooCommerce: настройка и обучение"
tagline: Показал владельцу, как оформлять выбранные товарные страницы отдельно от общей витрины, назначать шаблоны и добавлять блоки через визуальный редактор и шорткоды.
year: "01.2024"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - Shortcodes
  - Product templates
blocks:
  - type: text
    title: Задача и ограничения
    body: Владелец магазина хотел постепенно заказывать отдельные посадочные страницы для выбранных товаров, сохранив обычные карточки остальных позиций. Вопрос охватывал не массовую смену каталога, а понятный способ назначать индивидуальный шаблон и собирать контентные секции. Дополнительно обсуждались информационные плашки и будущий блок отзывов, но их готовая серия не была частью этой консультации.
  - type: text
    title: Как устроено решение
    body: "На товаре 1С:ERP провёл демонстрацию рабочего процесса: открыть продукт, добавить блоки через визуальный редактор или шорткоды и назначить шаблон только этой карточке. Так общий шаблон каталога оставался отдельным и не требовал переделки. Когда непривычный редактор начал мешать текущей работе, отключил его и объяснил владельцу, как включить обратно при необходимости. Разделил настройку/объяснение механизма и будущую разработку товарных лендингов по одному."
  - type: text
    title: Результат и проверка
    body: Клиент принял консультацию и оставил отзыв. Результат этой работы — показанный и переданный владельцу способ управлять отдельными шаблонами; готовая серия лендингов не подтверждена. Создание блока отзывов, настройка CRM, удаление реквизитов и восстановление полного оформления по веб-архиву не заявляются. Субъективное замечание о скорости не является замером, а текущий снимок сайта не подтверждает историческое состояние отдельных карточек.
