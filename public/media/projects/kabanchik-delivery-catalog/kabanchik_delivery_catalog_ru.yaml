title: "«Кабанчик»: каталог доставки и корзина блюд"
tagline: Заменил демонстрационный блок доставки на каталог, связанный с корзиной
  WooCommerce. Гость должен видеть порцию, цену и состав заказа, а ресторан —
  редактировать ассортимент в обычном интерфейсе магазина.
year: 06–07.2026
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - PHP
  - AJAX
  - Blocksy
  - Playwright
blocks:
  - type: text
    title: Задача и ограничения
    body: Заменил демонстрационный блок доставки на каталог, связанный с корзиной
      WooCommerce. Гость должен видеть порцию, цену и состав заказа, а ресторан
      — редактировать ассортимент в обычном интерфейсе магазина.
  - type: text
    title: Как устроено решение
    body: "В дочерней теме Blocksy сделал шорткод каталога: он получает
      опубликованные товары WooCommerce и строит разделы меню. Разделил текст
      порции на витрине и технический вес товара. Добавил управление количеством
      в карточках и обновление состава, счётчика и суммы через AJAX. На
      компьютере корзина остаётся рядом с меню, а на телефоне её открывают из
      нижней панели. Шапку, промоблоки и FAQ не пришлось переписывать ради
      нового каталога."
  - type: text
    title: Результат и проверка
    body: Сохранились полноразмерные браузерные снимки версии доставки и код с
      автоматической проверкой структуры каталога и корзины. Это подтверждает
      разработку интерфейса; оплату, проверку зоны доставки и обработку реальных
      заказов в этот результат не включаю.
  - type: image
    src: /media/projects/kabanchik-delivery-catalog/delivery-desktop.webp
    alt: Каталог доставки «Кабанчика» с блюдами и корзиной справа
    caption: Архивный полностраничный снимок доставки на десктопе, без обрезки.
      Снимок показывает интерфейс, но не подтверждает оплату или работу службы
      доставки.
