title: "Kabanchik: a food delivery catalog and cart"
tagline: Replaced the delivery mockup with a catalog connected to the
  WooCommerce cart. Guests needed to see portions, prices and order contents,
  while restaurant staff needed to manage the assortment through the standard
  store admin.
year: 06–07.2026
role: Web development and automation
stack:
  - WooCommerce
  - PHP
  - AJAX
  - Blocksy
