title: "Boom Shop: исправление расчёта СДЭК для покупателей"
tagline: "Восстановил гостевой сценарий WooCommerce, в котором покупатель
  застревал на расчёте доставки и не мог перейти к оформлению."
year: "12.2024"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - CDEK
  - Checkout debugging
  - Guest-flow testing
blocks:
  - type: text
    title: "Задача: доставка должна работать не только для администратора"
    body: "В декабре 2024 года для магазина косметики Boom Shop требовалось
      восстановить расчёт доставки СДЭК на boomshopcosmetics.com. Ошибка влияла
      на критичный этап покупки: посетитель должен был выбрать вариант доставки,
      увидеть расчёт и продолжить оформление заказа. Первоначальная проверка
      выглядела успешной, но клиент не увидел результата у себя — значит,
      ориентироваться только на административный просмотр было недостаточно."
  - type: text
    title: Диагностика гостевого сценария
    body: "После повторного сообщения клиента сопоставил его скриншоты с
      поведением оформления и выделил отдельное условие: покупатель без
      авторизации в административной панели. В этом сценарии расчёт всё ещё
      зависал. Продолжил исправление с фокусом на обычного посетителя, уточнил
      настройки способа и точки отправления и передал поток заказа на повторную
      проверку. Точная техническая причина и конкретный патч в сохранённом отчёте
      не зафиксированы; поэтому не приписываю проблему кэшу, JavaScript или
      определённому конфликту плагинов."
  - type: text
    title: Результат и отзыв клиента
    body: "После доработки клиент подтвердил: «теперь да, работает», и принял
      заказ. Это подтверждает восстановление расчёта и возможность перейти к
      оплате в проверенном клиентом сценарии. Оно не подтверждает завершённый
      платёж, созданную отправку, расчёт всех тарифов и направлений либо
      сегодняшнее состояние старого WooCommerce-магазина. На момент последующей
      проверки публичная главная уже показывала версию на Tilda, поэтому она не
      используется как доказательство исторической доставки."
    links:
      - label: Исходный заказ и отзыв на Kwork
        url: https://kwork.ru/track?id=48296130
  - type: text
    title: Как проверять расчёт доставки в checkout
    body: "Если доставка работает в административной сессии, но зависает у
      покупателя, проверять нужно именно публичный путь оформления: открыть
      корзину без авторизации, пройти расчёт адреса и способа доставки, убедиться
      в появлении предложения и проверить переход к оплате. В данном заказе
      повторное воспроизведение гостевого зависания помогло отделить успешную
      проверку администратора от реального клиентского сценария — и продолжить
      работу до подтверждения заказчиком."
