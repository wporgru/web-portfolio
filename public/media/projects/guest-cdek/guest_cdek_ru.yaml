title: Восстановление расчёта СДЭК для гостей магазина
tagline: Расчёт доставки оставался недоступным для обычного покупателя, хотя
  административная проверка не сразу выявляла проблему.
year: "12.2024"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - CDEK
blocks:
  - type: text
    title: Задача и ограничения
    body: Расчёт доставки оставался недоступным для обычного покупателя, хотя
      административная проверка не сразу выявляла проблему.
  - type: text
    title: Как устроено решение
    body: "После повторного замечания воспроизвёл проблему по скриншотам клиента и
      выделил анонимный сценарий как отдельный: без входа в админку покупатель
      получал зависание. Продолжил доработку и передал сценарий на повторную
      клиентскую проверку."
  - type: text
    title: Результат и проверка
    body: Заказчик подтвердил работу и принял заказ. Оплаченный платёж, реальная
      отгрузка и проверка всех направлений доставки не заявляются.
