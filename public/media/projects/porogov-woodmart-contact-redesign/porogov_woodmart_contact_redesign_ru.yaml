title: "Porogov.by: смена темы магазина и новая шапка"
tagline: Магазин кузовных деталей уже работал, но заказчик хотел сменить
  оформление и сделать телефон заметным в верхней части сайта. Задача касалась
  витрины действующего магазина, а не разработки нового каталога.
year: "12.2023"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - WoodMart
  - Storefront design
blocks:
  - type: text
    title: Задача и ограничения
    body: Магазин кузовных деталей уже работал, но заказчик хотел сменить оформление
      и сделать телефон заметным в верхней части сайта. Задача касалась витрины
      действующего магазина, а не разработки нового каталога.
  - type: text
    title: Как устроено решение
    body: "По согласованным примерам выбрал WoodMart, заменил тему и выполнил
      согласованные настройки, включая размещение телефонов в шапке. На архивном
      экране видны бренд, навигация по каталогу и карточки ремонтных арок: новый
      блок контактов встроен в витрину, а не вынесен на отдельную страницу."
  - type: text
    title: Результат и проверка
    body: Клиент принял работу. Архив подтверждает оформление верхней части магазина
      и заметные контакты. Проверка всех страниц, мобильных состояний и отправки
      формы не зафиксирована, поэтому не заявляю их как измеренный результат.
  - type: text
    title: Фрагмент витрины из архива проекта
    links:
      - label: Оригинал в портфолио Kwork
        url: https://kwork.ru/portfolio/11549314
  - type: image
    src: /media/projects/porogov-woodmart-contact-redesign/archive-storefront.webp
    alt: Шапка Porogov.by с телефонами и каталог кузовных запчастей
    caption: "Оригинальный архивный фрагмент 1400 × 515: шапка, навигация и карточки
      ремонтных арок. Это верхняя часть витрины, не полная страница."
