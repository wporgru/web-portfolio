title: "MediMarket24: аналитика партнёрских переходов"
tagline: На витрине один товар мог появляться на главной, в каталоге,
  рекомендациях или поиске. Требовалось видеть, откуда посетитель ушёл к
  партнёру, и не считать этот переход покупкой или подтверждённой комиссией.
year: "10.2026"
role: Веб-разработка и автоматизация
stack:
  - JavaScript
  - Astro
  - Yandex Metrica
  - GA4
  - Admitad
  - Event tracking
blocks:
  - type: text
    title: Задача и ограничения
    body: На витрине один товар мог появляться на главной, в каталоге, рекомендациях
      или поиске. Требовалось видеть, откуда посетитель ушёл к партнёру, и не
      считать этот переход покупкой или подтверждённой комиссией.
  - type: text
    title: Как устроено решение
    body: Добавил событие affiliate_click для Метрики и GA4 с товаром, продавцом,
      местом кнопки и адресом страницы. Сформировал subid по товару и
      размещению, сохранив маркировку и параметры партнёрской ссылки. Учёл
      динамические результаты поиска и переход средней кнопкой мыши. Сценарии
      сопоставления закрепил в тестах проекта.
  - type: text
    title: Результат и проверка
    body: "В мобильном прогоне на одной подборке проверил разметку 24 отслеживаемых
      ссылок. Реализация события не подтверждает его приём настроенной целью:
      при первом выпуске API Метрики не дал создать цель. Факт продажи и
      комиссия подтверждаются партнёрским отчётом, не кликом."
