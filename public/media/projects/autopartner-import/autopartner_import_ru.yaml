title: "Автопартнёр: пакет обновления каталога"
tagline: Подготовить клиенту новые карточки и изображения так, чтобы выгрузка и
  медиа могли быть переданы на импорт независимо от исходных файлов поставщика.
year: "10.2026"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - CSV
  - WebP
blocks:
  - type: text
    title: Задача и ограничения
    body: Подготовить клиенту новые карточки и изображения так, чтобы выгрузка и
      медиа могли быть переданы на импорт независимо от исходных файлов
      поставщика.
  - type: text
    title: Как устроено решение
    body: Собрал CSV на 32 товарные строки и 73 колонки, подготовил комплект из 220
      файлов WebP и описал ограничения на исходные данные и медиа.
  - type: text
    title: Результат и проверка
    body: Результат — комплект к импорту, а не утверждение о выкладке в действующий
      магазин.
