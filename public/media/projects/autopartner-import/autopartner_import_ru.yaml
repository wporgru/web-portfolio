title: "Автопартнёр: пакет обновления каталога"
tagline: "Подготовить пакет новых запчастей для WooCommerce: отделить товары,
  цены и фотографии от файлов поставщика и передать комплект, который можно
  проверить до загрузки в действующий магазин."
year: "10.2026"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - CSV
  - WebP
blocks:
  - type: text
    title: Задача и ограничения
    body: "Подготовить пакет новых запчастей для WooCommerce: отделить товары, цены
      и фотографии от файлов поставщика и передать комплект, который можно
      проверить до загрузки в действующий магазин."
  - type: text
    title: Как устроено решение
    body: "Сопоставил список клиента с 73 колонками шаблона WooCommerce. Артикул
      оставил ключом, а ID — пустым для создания новых карточек. Привязал
      изображения к товарам, подготовил WebP шириной 1280 px и записал
      соответствия в медиа-манифест. Повторно прочитал готовый CSV; проверил
      заголовки, пустые ID, уникальность артикулов, положительные цены и наличие
      ссылок на изображения. Один артикул уже встречался в прежнем пакете: его
      не скрыл и указал как отдельный риск перед импортом."
  - type: text
    title: Результат и проверка
    body: "Передал CSV на 32 товара, медиа-манифест с 220 изображениями и список
      предупреждений. Контрольная сумма сохранённого CSV совпадает с манифестом.
      Работа заканчивалась передачей комплекта: загрузка в рабочий магазин,
      сверка через API и проверка публичных карточек не входили в этот прогон."
