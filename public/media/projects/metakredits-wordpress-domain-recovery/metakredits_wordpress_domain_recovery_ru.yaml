title: "Metakredits: привязка домена и восстановление сайта"
tagline: "Восстановил существующий WordPress при подключении нового домена: сайт
  обращался не к той базе и перенаправлял посетителей на прежний адрес."
year: "12.2021"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Domain binding
  - MySQL
  - Redirect diagnostics
blocks:
  - type: text
    title: Задача и ограничения
    body: "Восстановил существующий WordPress при подключении нового домена: сайт
      обращался не к той базе и перенаправлял посетителей на прежний адрес."
  - type: text
    title: Как устроено решение
    body: После регистрации привязал домен к хостингу, проверил редирект и выяснил,
      с какой базой должен работать сайт. Нашёл прежнюю базу WordPress и
      восстановил открытие страниц. Отдельно обозначил оставшиеся ссылки на
      фотографии.
  - type: text
    title: Результат и проверка
    body: Клиент принял этап. Полная замена всех адресов изображений, публикация
      новых статей и индексация не подтверждены.
