title: "Metakredits: подключение домена и восстановление WordPress"
tagline: Подключил metakredits.lv к хостингу существующего сайта и устранил связку с неправильной базой, из-за которой открывался прежний адрес.
year: "12.2021"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Domain binding
  - MySQL
  - Redirect diagnostics
blocks:
  - type: text
    title: Задача и ограничения
    body: "Заказчик хотел открыть уже существующий WordPress на новом домене metakredits.lv. Это был этап подключения адреса к хостингу и восстановления сайта после переключения, а не создание сайта с нуля. После активации домена посетителей перенаправляло на finlat.lv, потому что сайт использовал не ту базу данных. План публикации блога и 30 будущих статей в этот заказ не входил."
  - type: text
    title: Как устроено решение
    body: "После регистрации и ожидания активации привязал metakredits.lv к хостингу. Проверил поведение адреса: вместо нового сайта происходил переход на finlat.lv. Сопоставил подключение с базой данных, нашёл прежнюю базу WordPress и восстановил открытие страниц на целевом адресе. После восстановления отдельно отметил оставшуюся незавершённую часть — ссылки на фотографии ещё требовали обновления."
  - type: text
    title: Результат и проверка
    body: Клиент принял этап подключения и восстановления существующего сайта. Подтверждённый итог — страницы WordPress снова открывались на новом адресе вместо ошибочного перехода на прежний домен. Исправление каждой ссылки на изображение отдельно не подтверждено; создание блога, публикация 30 статей и фактическая индексация также не входят в доказанный результат. В 2026 году домен не разрешался через DNS в проверявшей сети, поэтому текущий статус сайта неизвестен; историческую сдачу это не опровергает.
