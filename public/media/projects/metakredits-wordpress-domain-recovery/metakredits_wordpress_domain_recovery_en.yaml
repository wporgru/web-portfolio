title: Metakredits domain setup and WordPress recovery
tagline: "Recovered an existing WordPress site while connecting a new domain: it
  used the wrong database and redirected visitors to an older address."
year: "12.2021"
role: Web development and automation
stack:
  - WordPress
  - Domain binding
  - MySQL
