title: Marketlace theme migration from Astra to WoodMart
tagline: Moved an existing sewing supplies store to WoodMart without
  commissioning a bespoke redesign. The homepage and catalog needed separate
  layouts while retaining key storefront functionality.
year: "10.2022"
role: Web development and automation
stack:
  - WordPress
  - WooCommerce
  - Astra
  - WoodMart
blocks:
  - type: text
    title: Brief and constraints
    body: Moved an existing sewing supplies store to WoodMart without commissioning
      a bespoke redesign. The homepage and catalog needed separate layouts while
      retaining key storefront functionality.
  - type: text
    title: How it works
    body: Installed and configured WoodMart, separated the homepage from the shop
      page, and agreed on colors and PT Serif. Fixed mobile navigation and the
      wishlist by replacing a conflicting old shortcode and duplicate extension
      with the theme’s built-in feature.
  - type: text
    title: Result and verification
    body: The client checked the storefront and accepted the base migration.
      Comparative performance and the full set of future filters and sliders
      were not verified deliverables.
