title: "Marketlace: переход с Astra на WoodMart"
tagline: Перевёл действующий магазин швейной фурнитуры на WoodMart без создания
  отдельного индивидуального дизайна. Главную и каталог нужно было развести, не
  потеряв ключевые функции магазина.
year: "10.2022"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - Astra
  - WoodMart
blocks:
  - type: text
    title: Задача и ограничения
    body: Перевёл действующий магазин швейной фурнитуры на WoodMart без создания
      отдельного индивидуального дизайна. Главную и каталог нужно было развести,
      не потеряв ключевые функции магазина.
  - type: text
    title: Как устроено решение
    body: "Установил и настроил WoodMart, отделил главную от страницы магазина,
      согласовал цветовую схему и шрифт PT Serif. Исправил мобильное меню и
      список желаний: вместо дублирующего расширения и конфликтующего старого
      шорткода использовал встроенную функцию темы."
  - type: text
    title: Результат и проверка
    body: Клиент проверил витрину и принял базовый этап. Сравнимый замер скорости и
      полный набор будущих фильтров и слайдеров не входили в подтверждённый
      результат.
