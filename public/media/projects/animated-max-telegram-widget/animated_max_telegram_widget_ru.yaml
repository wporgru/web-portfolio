title: Анимированный контактный виджет MAX и Telegram
tagline: На сайте нужно было сделать два канала связи заметными на мобильном, не
  занимая место двумя постоянными плавающими кнопками.
year: "02.2026"
role: Веб-разработка и автоматизация
stack:
  - Web widgets
  - MAX
  - Telegram
  - Mobile QA
blocks:
  - type: text
    title: Задача и ограничения
    body: На сайте нужно было сделать два канала связи заметными на мобильном, не
      занимая место двумя постоянными плавающими кнопками.
  - type: text
    title: Как устроено решение
    body: "Установил готовый виджет и проверил мобильный вид. Когда клиент попросил
      показать оба значка, объяснил разницу между одновременным выводом и
      согласованным переключением. Настроил ритм смены: сначала две секунды
      вместо трёх, затем одну после обратной связи."
  - type: text
    title: Результат и проверка
    body: Клиент одобрил вариант и принял работу. Результат — настроенный виджет с
      чередованием значков, а не две одновременно мигающие кнопки.
