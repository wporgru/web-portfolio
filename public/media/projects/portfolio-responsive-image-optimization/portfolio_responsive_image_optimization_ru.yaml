title: Как я облегчил тяжёлые снимки в портфолио
tagline: "В собственном портфолио на Astro компактные версии уже были, но на
  экране с высокой плотностью браузер всё равно выбирал оригинальный PNG. Самый
  тяжёлый снимок в выбранной тройке занимал 14,08 МБ. Обрезать изображения
  нельзя: по ним читатель проверяет результат работ."
year: "11.2026"
role: Веб-разработка и автоматизация
stack:
  - Astro
  - Sharp
  - WebP
  - Responsive images
  - Playwright
blocks:
  - type: text
    title: Задача и ограничения
    body: "В собственном портфолио на Astro компактные версии уже были, но на экране
      с высокой плотностью браузер всё равно выбирал оригинальный PNG. Самый
      тяжёлый снимок в выбранной тройке занимал 14,08 МБ. Обрезать изображения
      нельзя: по ним читатель проверяет результат работ."
  - type: text
    title: Как устроено решение
    body: "Добавил в сборку Sharp полноразмерные WebP-копии: без обрезки и изменения
      размеров, только если файл не превышает 60% объёма оригинала. В адаптивном
      наборе заменил тяжёлый кандидат, оставив оригинал по клику и в карте
      изображений. Проверил формат и размеры копий и повторил браузерный прогон
      с новым контекстом для каждой страницы."
  - type: text
    title: Результат и проверка
    body: Сборка подготовила 17 полноразмерных копий. На Microsoft Edge при ширине
      1440 px и DPR 2 три снимка суммарно уменьшились с 23,46 до 3,78 МБ,
      примерно на 84%. Измерял объём ответов этих изображений, а не время
      загрузки всего сайта, Core Web Vitals или позиции.
    links:
      - label: Замеры до и после в байтах (JSON)
        url: /media/projects/portfolio-responsive-image-optimization/dense-display-network-measurements.json
  - type: text
    title: Что важно сохранить при оптимизации
    body: Облегчённая копия нужна для просмотра страницы, а исходный снимок — для
      изучения деталей по клику. Например, PNG в кейсе «Цветник» весил 14,08 МБ,
      а браузер стал запрашивать WebP на 2,21 МБ. Замеры относятся к портфолио,
      а не к скорости сайтов, изображённых на снимках.
    links:
      - label: Кейс «Цветник» с оптимизированным снимком
        url: /showcase/cvetnik-widget/
