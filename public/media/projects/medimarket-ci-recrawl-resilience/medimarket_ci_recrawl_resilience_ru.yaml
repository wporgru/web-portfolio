title: "MediMarket24: релизы без блокировки при сбое API"
tagline: Ежедневное обновление каталога на GitHub Actions показывало ошибку,
  хотя сайт был уже собран и опубликован. Причиной оказался сетевой сбой в
  дополнительном шаге отправки URL на переобход. Нужно было сохранить диагноз и
  не путать сбой внешней системы со сбоем самого релиза.
year: "10.2026"
role: Веб-разработка и автоматизация
stack:
  - GitHub Actions
  - Python
  - Astro
  - Yandex Webmaster
  - CI/CD
blocks:
  - type: text
    title: Задача и ограничения
    body: Ежедневное обновление каталога на GitHub Actions показывало ошибку, хотя
      сайт был уже собран и опубликован. Причиной оказался сетевой сбой в
      дополнительном шаге отправки URL на переобход. Нужно было сохранить
      диагноз и не путать сбой внешней системы со сбоем самого релиза.
  - type: text
    title: Как устроено решение
    body: По шагам разобрал упавший прогон и отделил обязательные проверки HTML и
      публикацию от сигнала внешнему сервису. В обработчике Python перехватил
      временные сетевые ошибки и записал отдельную причину в журнал. Для ручных
      запусков, где недоступность Яндекса должна считаться ошибкой, оставил
      строгий режим. Другие ошибки не стали автоматически успешными.
  - type: text
    title: Результат и проверка
    body: "Повторный Daily Feed Deploy завершился успешно: сборка, публикация и
      коммит обновлённых данных прошли. В журнале переобхода отдельно осталось
      ноль отправленных URL, потому что Яндекс всё ещё был недоступен. Успешный
      workflow не означает успешный переобход."
  - type: text
    title: Другой этап этого проекта
    links:
