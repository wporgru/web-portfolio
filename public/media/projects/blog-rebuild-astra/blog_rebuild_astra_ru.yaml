title: Переезд WordPress-блога на чистую установку Astra
tagline: Перенести старый блог вместе с изображениями, восстановить нормальное
  отображение материалов и подготовить новый сайт к запуску на прежнем домене.
year: "03.2025"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Astra
  - Technical SEO
blocks:
  - type: text
    title: Задача и ограничения
    body: Перенести старый блог вместе с изображениями, восстановить нормальное
      отображение материалов и подготовить новый сайт к запуску на прежнем
      домене.
  - type: text
    title: Как устроено решение
    body: Перенёс статьи на чистую установку WordPress и согласовал переход на
      Astra. Исправил пропорции вертикальных изображений, настроил хлебные
      крошки, похожие записи, подвал, Метрику и рекламные коды. Сопроводил смену
      NS и передал отдельный аудит с адресами с двойными слешами, недоступными
      картинками и проблемными встраиваниями YouTube.
  - type: text
    title: Результат и проверка
    body: В историческом отчёте указано 636 перенесённых статей с изображениями.
      Клиент подтвердил запуск и SSL. Массовый ремонт старых картинок и
      редиректов был отдельной работой; показатели рекламного дохода не
      измерялись.
