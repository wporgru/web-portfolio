title: Карточка, быстрый просмотр и корзина WooCommerce
tagline: "Доработал несколько шагов покупки: карточку и быстрый просмотр, список
  желаний и пересчёт суммы при изменении количества в корзине."
year: "04.2021"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Quick view
  - Wishlist
  - Cart UX
blocks:
  - type: text
    title: Задача и ограничения
    body: "Доработал несколько шагов покупки: карточку и быстрый просмотр, список
      желаний и пересчёт суммы при изменении количества в корзине."
  - type: text
    title: Как устроено решение
    body: Добавил редактируемую вкладку «Комплектация», поправил сравнение и
      оформление. По согласованию убрал неработающие элементы количества из
      быстрого просмотра и смещённые кнопки из списка желаний. В корзине
      восстановил изменение количества и автоматический пересчёт суммы, показав
      работу на видео.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил работу корзины, принял заказ и добавил бонус. Отдельную
      очистку сайта, полный редизайн и заполнение всех товарных комплектов не
      выполнял в этом этапе.
