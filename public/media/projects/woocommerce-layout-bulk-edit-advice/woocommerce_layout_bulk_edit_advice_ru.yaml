title: Консультация по шаблонам и каталогу WooCommerce
tagline: Помог владельцу магазина отделить настройки витрины от редактирования
  товаров и найти причину узкой главной страницы с лишним сайдбаром после
  изменений в Elementor.
year: "04.2024"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - Elementor
  - Consulting
blocks:
  - type: text
    title: Задача и ограничения
    body: Помог владельцу магазина отделить настройки витрины от редактирования
      товаров и найти причину узкой главной страницы с лишним сайдбаром после
      изменений в Elementor.
  - type: text
    title: Как устроено решение
    body: "Разобрал два сценария: число товаров в сетке на сайте и массовое
      редактирование в админке. Для второго предложил отдельный инструмент
      пакетного редактирования. Для лишней пагинации указал на соответствующий
      плагин, а для узкой главной направил клиента к выбору шаблона страницы в
      редакторе WordPress."
  - type: text
    title: Результат и проверка
    body: Клиент самостоятельно выбрал шаблон Page Builders вместо No Sidebar и
      оплатил консультацию. Установка плагина и редизайн не входили в
      подтверждённый объём.
