title: WooCommerce layout and catalog editing consultation
tagline: Helped a store owner distinguish storefront controls from product
  editing and investigate a homepage that had become narrow with an unwanted
  sidebar after Elementor edits.
year: "04.2024"
role: Web development and automation
stack:
  - WordPress
  - WooCommerce
  - Elementor
  - Consulting
blocks:
  - type: text
    title: Brief and constraints
    body: Helped a store owner distinguish storefront controls from product editing
      and investigate a homepage that had become narrow with an unwanted sidebar
      after Elementor edits.
  - type: text
    title: How it works
    body: Separated the storefront grid count from back-office bulk editing and
      recommended a dedicated tool for the latter. Identified the pagination
      plugin as a point to check and directed the client to the WordPress page
      template setting to address the narrow homepage.
  - type: text
    title: Result and verification
    body: The client selected the Page Builders template instead of No Sidebar and
      paid for the consultation. Plugin installation and a redesign were not
      part of the confirmed scope.
