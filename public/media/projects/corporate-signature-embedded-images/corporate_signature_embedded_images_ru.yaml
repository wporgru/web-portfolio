title: Корпоративная HTML-подпись без внешних картинок
tagline: Двум компаниям нужно было сохранить действующее оформление подписи и
  ссылки, но убрать зависимость логотипов и иконок от внешнего хостинга. Клиент
  также сообщал о недоставке отдельным получателям, но почтовых журналов для
  доказательства причины не было.
year: "02.2026"
role: Веб-разработка и автоматизация
stack:
  - HTML email
  - Corporate signatures
  - Data URI
  - Browser QA
blocks:
  - type: text
    title: Задача и ограничения
    body: Двум компаниям нужно было сохранить действующее оформление подписи и
      ссылки, но убрать зависимость логотипов и иконок от внешнего хостинга.
      Клиент также сообщал о недоставке отдельным получателям, но почтовых
      журналов для доказательства причины не было.
  - type: text
    title: Как устроено решение
    body: "Встроил изображения прямо в полученный HTML и сохранил оба корпоративных
      блока. Передал файл размером 122 360 байт. При проверке сохранённого
      оригинала проверил все 17 тегов изображений: каждый содержит встроенные
      данные, все декодируются, внешних URL картинок нет. Отдельно открыл
      исходный файл в браузере и сверил логотипы, иконки и структуру обоих
      блоков."
  - type: text
    title: Результат и проверка
    body: Клиент принял работу. HTML больше не запрашивает картинки с внешнего
      хостинга, но это не доказывает доставку писем проблемным получателям или
      отображение во всех почтовых клиентах. Результат офисного почтового теста
      не сохранился.
