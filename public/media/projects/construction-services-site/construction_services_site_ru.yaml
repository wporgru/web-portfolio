title: Перестройка раздела услуг строительной компании
tagline: Строительной компании требовалось убрать из витрины шаблонные проекты и
  помочь посетителям перейти от общего знакомства с компанией к нужной услуге и
  заявке.
year: "01.2018"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Service pages
  - Navigation
  - On-page SEO
blocks:
  - type: text
    title: Задача и ограничения
    body: Строительной компании требовалось убрать из витрины шаблонные проекты и
      помочь посетителям перейти от общего знакомства с компанией к нужной
      услуге и заявке.
  - type: text
    title: Как устроено решение
    body: На главной скрыл демонстрационные проекты и переименовал блок в
      «Популярные проекты». Доработал иконки направлений, подготовил клиентские
      сертификаты из PDF для просмотра на сайте. На основе старого сайта собрал
      страницы услуг и верхнее меню, заполнил SEO-поля и альтернативные подписи
      по отчёту. Добавил ссылку на политику в форме и кнопку возврата наверх.
  - type: text
    title: Результат и проверка
    body: Получилась структура, в которую клиент мог добавлять свои проекты вместо
      демонстрационных. Заказ закрылся автоматически; позже заказчик оставил
      положительный отзыв. Полная проверка форм, мобильных устройств и поисковой
      индексации не зафиксирована.
