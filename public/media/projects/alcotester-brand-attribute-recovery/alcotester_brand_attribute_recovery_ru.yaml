title: Массовое добавление марок в каталог WooCommerce
tagline: Магазину алкотестеров нужны были марки и технические характеристики в
  уже созданных карточках. Штатный для проекта сценарий остановился на ошибке
  XLS в WP All Import. Отдельное ограничение — не затрагивать расширения,
  которые передавали заказы в CRM.
year: "07.2018"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Product attributes
  - Catalog data
  - Product filters
blocks:
  - type: text
    title: Задача и ограничения
    body: Магазину алкотестеров нужны были марки и технические характеристики в уже
      созданных карточках. Штатный для проекта сценарий остановился на ошибке
      XLS в WP All Import. Отдельное ограничение — не затрагивать расширения,
      которые передавали заказы в CRM.
  - type: text
    title: Как устроено решение
    body: "Обошёл проблемный сценарий импорта и добавил атрибут «Марка» в
      существующие карточки. Остальные характеристики вынес в таблицу для
      совместного заполнения: там, где в исходных описаниях не было значений, их
      должен был уточнить владелец. Объяснил, почему товар без значения
      характеристики не появится при выборе соответствующего значения фильтра."
  - type: text
    title: Результат и проверка
    body: Клиент принял работу с положительным отзывом. Магазин получил заполненный
      атрибут «Марка» и таблицу для дальнейшего обогащения каталога. Полнота
      остальных характеристик и финальная настройка фильтров не подтверждены.
