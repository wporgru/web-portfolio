title: "YML: как обозначили ограничение доставки по городу"
tagline: Магазин доставлял только по Ростову-на-Дону, но получал заявки из
  неподдерживаемых регионов. Владелец попросил объяснить, как сделать территорию
  обслуживания заметной в товарной выгрузке и кабинете площадки.
year: "08.2022"
role: Веб-разработка и автоматизация
stack:
  - YML
  - Product feeds
  - Local delivery
  - Yandex Webmaster
blocks:
  - type: text
    title: Задача и ограничения
    body: Магазин доставлял только по Ростову-на-Дону, но получал заявки из
      неподдерживаемых регионов. Владелец попросил объяснить, как сделать
      территорию обслуживания заметной в товарной выгрузке и кабинете площадки.
  - type: text
    title: Как устроено решение
    body: "На примере установленного генератора показал, где задать общее текстовое
      ограничение и пересоздать YML. Отдельно объяснил аналогичное уведомление
      на стороне Вебмастера. Разграничил описание зоны доставки и технический
      запрет принять заказ: консультация закрывала первое, не второе."
  - type: text
    title: Результат и проверка
    body: Клиент оплатил и принял консультацию. Сохранилось содержание ответа;
      внедрение владельцем и сокращение числа неподходящих заказов не
      подтверждены. Это исторический кейс, а не инструкция по текущему
      интерфейсу Яндекса.
