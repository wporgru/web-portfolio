title: Технический SEO-аудит каталога учебных материалов
tagline: В Antigravity workspace сохранились отчёт аудита и исходная
  CSV-выгрузка Screaming Frog от 28 июня 2026 года. Задача работы — отделить
  ошибки, влияющие на обход и индексируемость большого каталога, от рекомендаций
  по шаблонам и метаданным. Домен и заказчик в портфолио обезличены.
year: "06.2026"
role: Технический SEO-аудит
stack:
  - Screaming Frog
  - CSV analysis
  - Technical SEO
  - Indexability
blocks:
  - type: text
    title: Задача и ограничения
    body: В Antigravity workspace сохранились отчёт аудита и исходная CSV-выгрузка
      Screaming Frog от 28 июня 2026 года. Задача работы — отделить ошибки,
      влияющие на обход и индексируемость большого каталога, от рекомендаций по
      шаблонам и метаданным. Домен и заказчик в портфолио обезличены.
  - type: text
    title: Как устроено решение
    body: "Сверил выводы отчёта с исходной таблицей, затем сгруппировал URL по
      HTTP-коду, индексируемости, наличию второго H1 и пустому Meta Description.
      Разложил рекомендации по порядку: устранить внутренние 404 и проверить
      целевые адреса, исправить шаблонную разметку заголовков, затем заполнять
      отсутствующие метаописания. Отдельно исключил из итоговых тезисов
      показатель дублей описаний: его число в тексте отчёта не совпало с
      пересчётом исходного CSV."
  - type: text
    title: Результат и проверка
    body: Пересчёт CSV подтвердил 3 508 URL. Краулер классифицировал 2 995 URL как
      индексируемые, а 513 — как неиндексируемые. Это не число страниц в индексе
      поисковых систем. В выгрузке найден 81 адрес с ответом 404, у 2 868
      индексируемых страниц заполнен второй H1 (95,8%), у 617 отсутствует Meta
      Description (20,6%). Это показатели снимка краулинга на дату аудита, а не
      текущего состояния сайта. В архиве нет доказательства внедрения
      рекомендаций, повторного обхода, роста трафика или позиций; это
      диагностический кейс, не отчёт о достигнутом SEO-эффекте.
