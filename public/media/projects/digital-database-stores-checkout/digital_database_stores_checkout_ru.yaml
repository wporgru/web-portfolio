title: Витрина цифровых баз и настройка оплаты
tagline: "Доработал существующий магазин цифровых материалов: восстановил
  переходы из меню и с главной, чтобы покупатель мог дойти до оформления, а
  менеджер — получить уведомление."
year: "09.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Digital products
  - YooKassa
  - Checkout
blocks:
  - type: text
    title: Задача и ограничения
    body: "Доработал существующий магазин цифровых материалов: восстановил переходы
      из меню и с главной, чтобы покупатель мог дойти до оформления, а менеджер
      — получить уведомление."
  - type: text
    title: Как устроено решение
    body: Исправил шапку, подвал и неработающие ссылки, настроил товары и заказы и
      показал пример товара с категорией. По согласованию направил кнопки
      главной к оформлению. На отдельном этапе настроил ЮKassa и показал
      сценарий повторной оплаты неоплаченного заказа.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил уведомление заказа и принял оба этапа. Боевой платёж,
      передача чека и защита скачиваний не подтверждены отдельным тестом.
