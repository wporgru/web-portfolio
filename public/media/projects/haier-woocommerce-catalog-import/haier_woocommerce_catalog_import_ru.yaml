title: "Каталог кондиционеров Haier: импорт в WooCommerce"
tagline: "Нужно было собрать позиции кондиционеров и загрузить их в WooCommerce.
  Импорт и оформление витрины разделили: наличие товаров в каталоге не означает,
  что весь внешний вид приведён к референсу."
year: "01.2024"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Product data
  - Catalog import
blocks:
  - type: text
    title: Задача и ограничения
    body: "Нужно было собрать позиции кондиционеров и загрузить их в WooCommerce.
      Импорт и оформление витрины разделили: наличие товаров в каталоге не
      означает, что весь внешний вид приведён к референсу."
  - type: text
    title: Как устроено решение
    body: Выполнил сбор и импорт товаров по заданию. В итоговом сообщении отдельно
      указал, что стили доработаны лишь частично. В архивном фрагменте витрины
      видны модели Haier, их названия, цены и кнопки корзины. Не выдаю видимую
      сетку за тест оформления заказа.
  - type: text
    title: Результат и проверка
    body: Клиент принял работу и подтвердил импорт по ТЗ. Итоговое число позиций и
      перечень всех загруженных полей не сохранились. Полный редизайн,
      актуальность цен и покупка через корзину в подтверждённый результат не
      входят.
  - type: text
    title: Фрагмент витрины из архива проекта
    links:
      - label: Оригинал в портфолио Kwork
        url: https://kwork.ru/portfolio/11899043
  - type: image
    src: /media/projects/haier-woocommerce-catalog-import/archive-storefront.webp
    alt: Сетка кондиционеров Haier с названиями моделей, ценами и кнопками корзины
    caption: Оригинальный фрагмент 1234 × 1199 из портфолио Kwork, опубликованного
      27 января 2024 года. Цены относятся к архивной витрине; снимок не
      показывает полный каталог и не подтверждает работу покупки.
