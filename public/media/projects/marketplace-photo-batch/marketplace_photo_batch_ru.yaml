title: Пакетная подготовка фото для Ozon и Wildberries
tagline: Подготовил две версии товарных фотографий, чтобы заказчик мог работать
  с вертикальными и квадратными материалами отдельно.
year: "11.2024"
role: Веб-разработка и автоматизация
stack:
  - Image processing
  - Marketplace assets
  - Batch production
blocks:
  - type: text
    title: Задача и ограничения
    body: Подготовил две версии товарных фотографий, чтобы заказчик мог работать с
      вертикальными и квадратными материалами отдельно.
  - type: text
    title: Как устроено решение
    body: "Согласовал вертикальный формат 900 × 1200. Для квадратного набора вместо
      исходно обсуждавшихся 1200 × 1200 выбрали 900 × 900: часть фотографий была
      слишком маленькой. Обработал изображения пакетно, передал наборы через
      облако и предупредил о нулевых файлах и нескольких недоступных
      исходниках."
  - type: text
    title: Результат и проверка
    body: Клиент принял работу. Публичная карточка Kwork показывает пример
      результата, но не подтверждает число всех файлов или прохождение модерации
      на площадках.
  - type: image
    src: /media/projects/marketplace-photo-batch/processed-sample.webp
    alt: Пример обработанных товарных фотографий
    caption: Выборка из публичной карточки Kwork, ноябрь 2024. Не весь архив и не
      сравнение до/после.
