title: Обновление цен и ассортимента по новому прайсу
tagline: "Прайс поставщика изменился: новые позиции нужно было добавить,
  существующие — переоценить, а исчезнувшие — убрать с витрины без физического
  удаления карточек."
year: "08.2026"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Supplier price list
  - Catalog visibility
blocks:
  - type: text
    title: Задача и ограничения
    body: "Прайс поставщика изменился: новые позиции нужно было добавить,
      существующие — переоценить, а исчезнувшие — убрать с витрины без
      физического удаления карточек."
  - type: text
    title: Как устроено решение
    body: "Подготовил прайс и разделил обработку на три сценария: создание новых
      карточек, обновление цен и перевод отсутствующих в черновики. Черновики
      оставили возможность вернуть позиции, если они снова появятся у
      поставщика."
  - type: text
    title: Результат и проверка
    body: В отчёте о сдаче — 1 013 опубликованных товаров и 144 черновика. Клиент
      принял этап; это исторический снимок результата, не текущее состояние
      каталога.
