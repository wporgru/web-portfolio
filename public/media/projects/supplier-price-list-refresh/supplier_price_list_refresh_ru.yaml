title: Обновление цен и ассортимента по новому прайсу
tagline: "Прайс поставщика изменился: новые позиции нужно было добавить,
  существующие — переоценить, а исчезнувшие — убрать с витрины без физического
  удаления карточек."
year: "08.2026"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Supplier price list
  - Catalog visibility
blocks:
  - type: text
    title: Задача и ограничения
    body: "Прайс поставщика изменился: новые позиции нужно было добавить,
      существующие — переоценить, а исчезнувшие — убрать с витрины без
      физического удаления карточек. Клиент попросил не менять категории и
      не включать в обновление сети и сетеполотна: их вели отдельно."
  - type: text
    title: Как устроено решение
    body: "Подготовил прайс и разделил обработку на три сценария: создание новых
      карточек, обновление цен и перевод отсутствующих в черновики. Черновики
      оставили возможность вернуть позиции, если они снова появятся у
      поставщика."
  - type: text
    title: Результат и проверка
    body: В отчёте о сдаче — 1 013 опубликованных товаров и 144 черновика. Клиент
      принял этап; это исторический снимок результата, не текущее состояние
      каталога.
  - type: image
    title: Публичный вид сайта
    src: /media/projects/supplier-price-list-refresh/later-homepage.webp
    alt: Публичный каталог рыболовного магазина Kaida
    caption: Публичный каталог на 4 ноября 2026 года, без обрезки. Снимок не
      подтверждает состояние цен и остатков на момент импорта; одна загрузка
      изображения оставалась незавершённой.
  - type: text
    title: Чем этот этап отличается от предыдущего
    body: В 2024 году исходная таблица не позволяла надёжно сопоставить товары
      и магазин загрузил подготовленный ассортимент заново. Здесь по выбранным
      диапазонам нового прайса обновлялись существующие товары, а исчезнувшие
      позиции переводились в черновики. Эти два заказа описывают разные способы
      обновления одной витрины.
    links:
      - label: Kaida в 2024 году — замена ассортимента и правка меню
        url: /showcase/kaida-catalog-replacement/
