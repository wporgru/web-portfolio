title: Refreshing prices and assortment from a new price list
tagline: "The supplier price list changed: new items needed adding, existing
  prices needed updating, and missing items had to leave the storefront without
  being permanently deleted."
year: "08.2026"
role: Web development and automation
stack:
  - WooCommerce
  - Supplier price list
  - Catalog visibility
blocks:
  - type: text
    title: Brief and constraints
    body: "The supplier price list changed: new items needed adding, existing prices
      needed updating, and missing items had to leave the storefront without
      being permanently deleted. The client requested that existing categories
      stay as they were and that separately managed fishing nets and netting
      remain outside the update."
  - type: text
    title: How it works
    body: "Prepared the price list and handled three outcomes separately: new
      listings, updated prices and drafts for missing items. Retaining drafts
      kept the records available if the supplier listed those products again."
  - type: text
    title: Result and verification
    body: The handoff recorded 1,013 published products and 144 drafts. The client
      accepted the stage; these figures describe the delivery, not current
      catalog totals.
  - type: image
    title: Public site view
    src: /media/projects/supplier-price-list-refresh/later-homepage.webp
    alt: Public catalog of the Kaida fishing store
    caption: Public catalog captured November 4, 2026, uncropped. It does not
      establish historical import prices or stock; one image load remained
      incomplete.
  - type: text
    title: How this differed from the earlier import
    body: In 2024, the spreadsheet could not be matched reliably and the prepared
      assortment was imported as a replacement. Here, selected ranges of the
      supplier price list updated existing products, while missing listings were
      moved to draft. These were different approaches for the same storefront.
    links:
      - label: Kaida in 2024 — assortment replacement and menu repair
        url: /showcase/kaida-catalog-replacement/en/
