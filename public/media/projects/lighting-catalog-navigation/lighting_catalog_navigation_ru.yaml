blocks:
  - type: text
    title: Задача и ограничения
    body: "Настроил навигацию для большого WooCommerce-каталога: категории в боковой
      колонке, фильтры в разделах и читаемые стили без копирования чужой витрины
      целиком."
  - type: text
    title: Как устроено решение
    body: Настроил вывод категорий и подкатегорий, оформил фильтры на CSS. После
      проверки с клиентом скрыл лишние разделы и атрибуты с витрины, не выдавая
      это за удаление данных. Объяснил, как менять порядок категорий в админке.
  - type: text
    title: Результат и проверка
    body: "Клиент принял оформление. Завершение параллельного импорта и ускорение
      фильтров отдельно не подтверждены: это этап навигации, а не замер
      производительности."
  - type: text
    title: Другой этап этого проекта
    links:
