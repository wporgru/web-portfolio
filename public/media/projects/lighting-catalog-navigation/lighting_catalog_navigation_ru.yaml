title: Навигация и фильтры большого каталога освещения
tagline: "Настроил навигацию для большого WooCommerce-каталога: категории в
  боковой колонке, фильтры в разделах и читаемые стили без копирования чужой
  витрины целиком."
year: "05.2024"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - CSS
