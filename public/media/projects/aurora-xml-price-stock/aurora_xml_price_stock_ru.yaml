title: Цены комплектов и остатки из XML-фида Aurora
tagline: Фид поставщика передавал несколько цен и собственные статусы наличия.
  Требовалось выбрать согласованную цену комплекта и обновлять остатки, не
  заменяя уже подготовленные описания и фотографии.
year: "09.2025"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - XML
  - PHP
  - Cron
blocks:
  - type: text
    title: Задача и ограничения
    body: Фид поставщика передавал несколько цен и собственные статусы наличия.
      Требовалось выбрать согласованную цену комплекта и обновлять остатки, не
      заменяя уже подготовленные описания и фотографии.
  - type: text
    title: Как устроено решение
    body: Добавил функцию выбора наибольшей цены из переданных значений, не меняя
      исходный XML. Сопоставил статусы «в наличии» и «в пути» с instock, а «под
      заказ» — с onbackorder. Согласовал ежечасный запуск с 09:00 до 21:00 и
      добавление новых товаров без перезаписи описаний и изображений
      существующих. При сдаче отдельно указал на проверку cron и уведомлений на
      хостинге.
  - type: text
    title: Результат и проверка
    body: Клиент принял исправление. Порядок расчёта цены и обновления остатков стал
      явным; непрерывная работа расписания и последующее оформление статуса на
      витрине не входят в доказанный итог этого этапа.
