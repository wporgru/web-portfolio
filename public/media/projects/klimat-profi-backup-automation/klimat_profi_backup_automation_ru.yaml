title: 'Климат Профи: автоматические копии сайта и базы'
tagline: 'Магазину нужны были резервные копии без ручного запуска и накопления тяжёлых архивов.
  Полную копию и отдельный дамп базы требовалось хранить по разным правилам: у файлов и данных
  разные объёмы и сценарии восстановления.'
year: '11.2026'
role: Веб-разработка и автоматизация
stack:
- Linux
- Bash
- MySQL
- cron
- Backup automation
blocks:
- type: text
  title: Задача и ограничения
  body: Магазину требовались регулярные резервные копии без ручного запуска и бесконтрольного
    накопления тяжёлых архивов. Полная копия файлов и базы и отдельные дампы БД имеют разные объёмы
    и сценарии восстановления, поэтому для них нужны разные правила хранения.
- type: text
  title: Скрипт, сжатие и расписание
  body: Подготовил Bash-скрипт и задания cron с отдельными режимами для базы и полной копии. В
    отчёте настройки за ноябрь 2026 года указаны ежедневный полный архив с хранением одной последней
    копии и дамп базы каждые три дня с хранением пяти копий. Для сжатия использовал pigz; приоритет
    CPU и диска для фоновой работы снизил.
- type: text
  title: Безопасная выдача и копия вне VPS
  body: Скрипт пишет во временный файл и проверяет результат до сохранения и ротации, чтобы не
    заменять последнюю копию незавершённым архивом. Отдельным PowerShell-сценарием организован
    перенос дампа базы на компьютер; в отчёте зафиксирована успешная синхронизация одного дампа.
- type: text
  title: Что проверено
  body: В отчёте указан полный архив около 20 ГБ. Сохранённый сжатый дамп дополнительно прочитан
    до конца и распаковался примерно в 364 МБ SQL. Это подтверждает читаемость проверенного файла,
    но не полноценное восстановление магазина и не бесперебойность каждого запуска cron; приведённые
    правила хранения относятся к зафиксированной конфигурации, не к независимой текущей проверке.
