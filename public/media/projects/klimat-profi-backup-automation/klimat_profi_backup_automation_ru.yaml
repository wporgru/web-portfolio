title: "Климат Профи: автоматические копии сайта и базы"
tagline: "Магазину нужны были резервные копии без ручного запуска и накопления
  тяжёлых архивов. Полную копию и отдельный дамп базы требовалось хранить по
  разным правилам: у файлов и данных разные объёмы и сценарии восстановления."
year: "11.2026"
role: Веб-разработка и автоматизация
stack:
  - Linux
  - Bash
  - MySQL
  - cron
  - Backup automation
blocks:
  - type: text
    title: Задача и ограничения
    body: "Магазину нужны были резервные копии без ручного запуска и накопления
      тяжёлых архивов. Полную копию и отдельный дамп базы требовалось хранить по
      разным правилам: у файлов и данных разные объёмы и сценарии
      восстановления."
  - type: text
    title: Как устроено решение
    body: "Подготовил Bash-скрипт и расписание cron: полная копия файлов и базы
      запускается ежедневно, отдельные дампы — по своему графику. Для сжатия
      использовал pigz, а для фоновых задач снизил приоритет CPU и диска. Скрипт
      пишет во временный файл и проверяет результат до сохранения и ротации.
      Наладил перенос дампа базы на отдельный компьютер, чтобы копия не
      оставалась только на VPS."
  - type: text
    title: Результат и проверка
    body: "Согласно отчёту, созданы полный архив около 20 ГБ и отдельный сжатый дамп
      базы. Для кейса отдельно проверил чтение сохранённого gzip до конца: он
      распаковывается в SQL объёмом около 364 МБ. Это проверка читаемости дампа,
      не пробное восстановление магазина и не доказательство бесперебойного
      выполнения всех заданий cron."
