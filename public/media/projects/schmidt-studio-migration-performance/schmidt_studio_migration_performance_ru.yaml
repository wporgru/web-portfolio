title: "Schmidt Studio: переезд и оптимизация WordPress"
tagline: Помог перенести WordPress на новый хостинг. Перед переключением домена
  обнаружил, что первая копия не содержала всех плагинов и фотографий и не
  годилась для оценки скорости рабочего сайта.
year: "11.2018"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Hosting migration
  - DNS
  - TLS
blocks:
  - type: text
    title: Задача и ограничения
    body: Помог перенести WordPress на новый хостинг. Перед переключением домена
      обнаружил, что первая копия не содержала всех плагинов и фотографий и не
      годилась для оценки скорости рабочего сайта.
  - type: text
    title: Как устроено решение
    body: Поднял тестовую копию, выявил недостающие материалы и запросил
      восстановление. Проверил варианты ускорения и не оставил настройки,
      которые нарушали работу страниц. После согласования перенёс сайт на новый
      хостинг, сменил NS основного домена и настроил SSL.
  - type: text
    title: Результат и проверка
    body: Клиент принял перенос и согласился с достигнутой скоростью. В итоговом
      сообщении указан прирост тестовой оценки на 10 пунктов; значение на
      неполной копии и прогноз не выдаю за результат рабочего сайта.
