title: Обновляемый YML-фид цветочного магазина
tagline: Настроил товарную выгрузку для действующего цветочного магазина, чтобы
  актуализировать данные без ручной пересборки файла при каждом изменении
  ассортимента.
year: "07.2023"
role: Веб-разработка и автоматизация
stack:
  - YML
  - XML
  - Product feeds
  - Scheduled updates
blocks:
  - type: text
    title: Задача и ограничения
    body: Настроил товарную выгрузку для действующего цветочного магазина, чтобы
      актуализировать данные без ручной пересборки файла при каждом изменении
      ассортимента.
  - type: text
    title: Как устроено решение
    body: Создал отдельный YML-файл и настроил обновление раз в сутки и при
      изменении товара. Передал адрес выгрузки и проверил с заказчиком, что в
      принимающей системе видны фотографии. Отдельно дал рекомендации по
      названиям и категориям, не смешивая их с настройкой выгрузки.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил работу и загрузку фотографий. Пересчёт составов букетов,
      Frontpad и отдельные выгрузки на другие площадки не были выполнены в этом
      этапе.
