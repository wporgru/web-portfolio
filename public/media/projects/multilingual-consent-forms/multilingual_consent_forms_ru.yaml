title: Согласие и ссылки на политику в многоязычных формах
tagline: Для трёх языковых версий требовалось встроить согласованные тексты и
  ссылки в формы так, чтобы посетитель видел их рядом с отправкой заявки.
year: "03.2024"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Localization
  - Forms
blocks:
  - type: text
    title: Задача и ограничения
    body: Для трёх языковых версий требовалось встроить согласованные тексты и
      ссылки в формы так, чтобы посетитель видел их рядом с отправкой заявки.
  - type: text
    title: Как устроено решение
    body: Согласовал предоставленные формулировки, ссылки и визуальное оформление.
      Проверил формы в административной панели, отдельно отметил формы, для
      которых не удалось установить публичную страницу, и передал результат на
      проверку заказчику.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил результат и принял заказ. Это реализация интерфейса по
      предоставленным текстам, не правовая экспертиза и не аудит хранения
      согласий.
