title: "Партнёрская витрина одежды: WordPress и товарные фиды"
tagline: Создать партнёрский каталог одежды на WordPress и WooCommerce,
  подготовить домен, оформление и интеграцию с партнёрской сетью.
role: Веб-разработка
year: "06.2018"
stack:
  - WordPress
  - WooCommerce
  - Affiliate feeds
  - YML
blocks:
  - type: text
    title: Задача
    body: Создать партнёрский каталог одежды на WordPress и WooCommerce, подготовить
      домен, оформление и интеграцию с партнёрской сетью.
  - type: text
    title: Что сделано
    body: Подготовил витрину, перенёс её на другой хостинг после ограничений
      импорта, доработал оформление и создал YML; заказчик принял этап.
  - type: text
    title: Как решалась задача
    body: Сначала подготовил каталог на временной площадке. После ограничений
      массового импорта перенёс его на другой хостинг; доработал логотип, меню и
      оформление, после регистрации заказчика сообщил о подключении домена.
      Подключал инструменты вебмастера и Jetpack с подтверждениями клиента,
      сообщил о бесконечной прокрутке и подготовил YML для Regmarkets. При
      предупреждениях о домене и безопасности обратился в поддержку Яндекса и
      предложил следующие шаги. На момент сдачи модерация Regmarkets ожидалась,
      а снятие ограничений не подтверждено. Покупки и партнёрский доход не
      заявляю.
