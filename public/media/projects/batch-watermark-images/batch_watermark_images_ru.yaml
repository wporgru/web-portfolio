title: Пакетная обработка 914 товарных фотографий
tagline: Нужно было нанести логотип на готовые фотографии автозапчастей,
  сохранив исходную композицию и фон. Один и тот же знак по-разному читался на
  контрастных и сиреневых участках.
year: "02.2026"
role: Веб-разработка и автоматизация
stack:
  - Image processing
  - JPEG
  - Product media
blocks:
  - type: text
    title: Задача и ограничения
    body: Нужно было нанести логотип на готовые фотографии автозапчастей, сохранив
      исходную композицию и фон. Один и тот же знак по-разному читался на
      контрастных и сиреневых участках.
  - type: text
    title: Как устроено решение
    body: Подготовил примеры с полупрозрачным логотипом по центру и показал
      заказчику участки со сниженным контрастом. После одобрения обработал
      партию и передал примеры в заказе, а полный комплект — облачной ссылкой.
  - type: text
    title: Результат и проверка
    body: "В отчёте — 914 файлов; клиент принял заказ. Позднее удалось восстановить
      и проверить 10 оригиналов примеров: каждый 810 × 1080. Это проверка
      выборки, а не повторный пересчёт полного архива."
