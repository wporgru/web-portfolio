title: Сбор справочника спортивных организаций
tagline: Собрал данные о спортивных организациях Москвы и доступных городов
  Московской области для дальнейшей работы заказчика со справочником.
year: "11.2018"
role: Веб-разработка и автоматизация
stack:
  - Web scraping
  - Data extraction
  - Regional directories
blocks:
  - type: text
    title: Задача и ограничения
    body: "Заказчику требовались сведения о спортивных организациях с сайта sportschools.ru для собственного справочника: отдельно по Москве и по запрошенным городам Московской области. История заказа показывает ограничение источника при частых запросах, а также неполный доступный перечень областных городов. Поэтому задачу пришлось вести с явным обозначением границ источника, а не выдавать частичную выборку за полный региональный реестр."
  - type: text
    title: Как устроено решение
    body: "Сначала собрал ссылки на доступные записи, настроил извлечение и передал заказчику пробный результат для проверки. После обратной связи сформировал московскую часть отдельно, чтобы её можно было получить независимо от областной выборки. Для Московской области использовал только города, присутствовавшие в источнике; недостающие позиции не дополнял данными из посторонних каталогов. Когда частые обращения к сайту стали ограничивать работу, сообщил об ограничении и продолжил в рамках доступного набора. Итог передал архивом «Новая папка.zip» размером около 3 МБ по сохранённой записи заказа."
  - type: text
    title: Результат и проверка
    body: "Заказчик скачал отдельную московскую выборку, положительно оценил её, а затем явно принял итоговый архив и оставил отзыв «Очень благодарен, спасибо!». При этом сам ZIP в архиве заказов не извлечён и не пересчитан: неизвестны точное число организаций, схема полей и полнота данных по каждому городу. Не заявляются покрытие всех 75 городов области, полная база России, разработка исходного сайта или портала клиента. Причина ограничения сайта также не диагностирована независимо."
