title: Сбор справочника спортивных организаций
tagline: Собрал данные о спортивных организациях Москвы и доступных городов
  Московской области для дальнейшей работы заказчика со справочником.
year: "11.2018"
role: Веб-разработка и автоматизация
stack:
  - Web scraping
  - Data extraction
  - Regional directories
blocks:
  - type: text
    title: Задача и ограничения
    body: Собрал данные о спортивных организациях Москвы и доступных городов
      Московской области для дальнейшей работы заказчика со справочником.
  - type: text
    title: Как устроено решение
    body: Собрал ссылки, настроил извлечение и передал образец на проверку.
      Московский набор отдал отдельно. Для области ограничил сбор доступным
      списком источника, не подменяя отсутствующие города данными из других
      мест. Затем передал итоговый архив.
  - type: text
    title: Результат и проверка
    body: Заказчик принял архив и оставил положительный отзыв. Полный охват всех
      запрошенных городов и точное число организаций не подтверждены.
