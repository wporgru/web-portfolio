title: "SALT SWITCH: English blog and article publishing"
tagline: "Prepared the live store's blog for English editorial content with an
  article template, publication listing and a menu entry to the new section."
year: "12.2021"
role: Web development and automation
stack:
  - WordPress
  - Editorial workflow
