title: "SALT SWITCH: блог и публикация англоязычных статей"
tagline: "Подготовил блог действующего магазина к публикации англоязычных
  материалов: настроил страницу статьи, список публикаций и вход в блог из меню."
year: "12.2021"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Editorial workflow
  - Navigation
  - Metadata
blocks:
  - type: text
    title: "Задача: встроить редакционный раздел в действующий магазин"
    body: "В декабре 2021 года для SALT SWITCH требовалось опубликовать
      англоязычные редакционные материалы на уже работающем сайте. Одной
      страницы с текстом недостаточно: читателю нужен отдельный адрес статьи,
      понятная страница со списком публикаций и заметный способ вернуться в блог
      из основной навигации. В задании фигурировали десять статей, фотографии,
      метаданные Title и Description и переданные заказчиком поисковые фразы."
  - type: text
    title: Страница статьи, архив и навигация
    body: "Настроил шаблон отдельной записи и страницу списка публикаций,
      подготовил раздел блога и добавил на него переход в меню. Это разделяет
      два разных сценария чтения: открыть материал по прямой ссылке или сначала
      просмотреть публикации и выбрать статью из общего списка. Для наполнения
      предусматривались предоставленные заказчиком английские тексты, фотографии,
      Title/Description и поисковые фразы. После выполнения передал клиенту URL
      страницы блога и статьи для проверки."
  - type: text
    title: Результат и подтверждение
    body: "Заказчик принял работу и оставил положительный отзыв: «Все отлично!».
      В архиве подтверждены блог, вид записи, меню и передача адресов на проверку.
      Десять статей — заявленный объём задания, но независимая сверка каждой
      публикации, фотографии и полного набора метаданных не сохранилась. Поэтому
      кейс описывает создание редакционного раздела и опубликованный объём
      задания, а не гарантирует отдельную проверку всех десяти URL или рост
      трафика и продаж. GTranslate, пятнадцать языков и разработка всего магазина
      SALT SWITCH с нуля в этот этап не входят."
    links:
      - label: Исходный заказ и отзыв на Kwork
        url: https://kwork.ru/track?id=25105921
