title: "SALT SWITCH: запуск блога и оформление статей"
tagline: "Доработал блог действующего сайта для публикации английских
  материалов: посетителю должны быть доступны и отдельная статья, и список
  публикаций."
year: "12.2021"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Editorial workflow
  - Navigation
  - Metadata
blocks:
  - type: text
    title: Задача и ограничения
    body: "Доработал блог действующего сайта для публикации английских материалов:
      посетителю должны быть доступны и отдельная статья, и список публикаций."
  - type: text
    title: Как устроено решение
    body: Настроил вид отдельной записи и списка, создал блог и добавил переход в
      меню. Для редакционного задания согласованы тексты, изображения и
      метаданные заказчика. Передал адреса статьи и страницы блога на проверку.
  - type: text
    title: Результат и проверка
    body: Клиент принял работу. Десять статей — объём задания, а не независимо
      сверенное число публикаций со всеми метаданными.
