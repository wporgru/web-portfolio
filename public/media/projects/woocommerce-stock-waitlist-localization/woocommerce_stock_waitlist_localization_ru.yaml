title: Лист ожидания и русификация писем WooCommerce
tagline: Настроил подписку на отсутствующий товар и доработал письма магазина,
  чтобы покупатель понимал, что произошло после подписки.
year: "02.2020"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Product variations
  - Waitlist
  - Localization
blocks:
  - type: text
    title: Задача и ограничения
    body: Настроил подписку на отсутствующий товар и доработал письма магазина,
      чтобы покупатель понимал, что произошло после подписки.
  - type: text
    title: Как устроено решение
    body: Проверил поведение на остатках 3, 2 и 0, показал выбор цвета и убрал
      принудительный переход в корзину. После обратной связи перевёл письмо
      подписки и ссылку подтверждения. Затем отключил дополнительный шаг
      подтверждения по согласованному сценарию и доработал письмо о поступлении
      и подвал уведомлений.
  - type: text
    title: Результат и проверка
    body: Клиент получил контрольное письмо, подтвердил исправления и принял работу.
      Массовая рассылка при реальном пополнении склада отдельно не проверялась.
