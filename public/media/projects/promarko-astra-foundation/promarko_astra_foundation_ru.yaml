title: Корпоративный сайт Promarko на базе Astra
tagline: Нужно было быстро получить основу корпоративного сайта и оставить
  заказчику возможность самостоятельно подготовить тексты и изображения. Для
  этого не требовалась индивидуальная тема с нуля.
year: "08.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Astra
  - Site setup
blocks:
  - type: text
    title: Задача и ограничения
    body: Нужно было быстро получить основу корпоративного сайта и оставить
      заказчику возможность самостоятельно подготовить тексты и изображения. Для
      этого не требовалась индивидуальная тема с нуля.
  - type: text
    title: Как устроено решение
    body: Уточнил назначение сайта, наличие материалов и границы наполнения.
      Подобрал варианты Astra без отметки Premium. После выбора шаблона
      agency-02 установил его на домене и заменил сиреневый акцент на зелёный.
      Не открывал индексацию, пока клиент не наполнит страницы, чтобы
      демонстрационный контент не стал публичной поисковой витриной.
  - type: text
    title: Результат и проверка
    body: Клиент проверил и принял основу. Он получил сайт, который можно было
      наполнять на своём домене; дальнейшие тексты, логотип и текущее
      продвижение не относятся к этой сдаче.
