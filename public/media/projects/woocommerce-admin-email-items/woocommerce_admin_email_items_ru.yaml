title: Состав заказа в письмах менеджеру WooCommerce
tagline: Восстановил подробности заказа в административном уведомлении, чтобы
  менеджер мог увидеть, что именно купил клиент.
year: "01.2024"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Transactional email
  - Order management
blocks:
  - type: text
    title: Задача и ограничения
    body: Восстановил подробности заказа в административном уведомлении, чтобы
      менеджер мог увидеть, что именно купил клиент.
  - type: text
    title: Как устроено решение
    body: Показал изменённое уведомление и попросил проверить административный ящик.
      После сообщения о другом письме без подробностей проверил новый заказ с
      отдельным тестовым получателем и показал полное письмо. Это позволило
      различить фактически проверенное уведомление и другие письма магазина.
  - type: text
    title: Результат и проверка
    body: Клиент принял работу. Настройка SMTP и проверка всех типов писем не
      входили в этот этап.
  - type: text
    title: Другой этап этого проекта
    links:
      - label: "Следующий этап: штатные статусы заказов"
        url: /showcase/woocommerce-native-order-statuses/
