title: Состав заказа в письмах менеджеру WooCommerce
tagline: Восстановил подробности заказа в административном уведомлении, чтобы менеджер мог увидеть,
  что именно купил клиент.
year: '01.2024'
role: Веб-разработка и автоматизация
stack:
- WooCommerce
- Transactional email
- Order management
blocks:
- type: text
  title: Задача магазина
  body: Административное уведомление о заказе не показывало менеджерам названия товаров, количества
    и цены. Без состава заказа сотрудникам приходилось отдельно уточнять, что именно купил клиент.
- type: text
  title: Изменение и проверка
  body: Восстановил подробности в уведомлении, показал результат и попросил проверить административную
    почту. Когда заказчик сообщил о другом письме без состава, провёл дополнительную проверку
    на новом заказе с отдельным тестовым получателем и показал полное письмо.
- type: text
  title: Результат и ограничения
  body: 'Клиент принял работу с положительным отзывом. Проверка относится к конкретному административному
    уведомлению и тестовому заказу: полная матрица всех писем, способов оплаты и статусов не
    подтверждена. Настройка SMTP и миграция магазина не входили в этот заказ.'
- type: text
  title: Когда полезна такая диагностика
  body: Если уведомления приходят без позиций или данные различаются в разных письмах, важно
    сначала определить тип письма, получателя и сценарий заказа, а затем повторить проверку
    на новом тестовом заказе, не подменяя проверку одной формы выводом обо всей системе.
