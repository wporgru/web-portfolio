title: "Wellland: blog, case studies and AI illustrations"
tagline: >-
  Built an editorial section for a cleaning-equipment supplier with structured case studies, industry filters and six launch publications. Created six AI-assisted covers, labeled as illustrations, and reduced their combined weight from 13.0 MB to 0.81 MB.
year: "10.2026"
role: WordPress content architecture and AI-assisted visual production
stack:
  - WordPress
  - Editorial workflows
  - AI-assisted image generation
  - WebP
  - Technical SEO
blocks:
  - type: text
    title: "Brief: prepare an editorial section for launch"
    body: >-
      A cleaning-equipment supplier needed to separate news, articles and customer case studies so the team could publish without rebuilding the same page structure each time. Case studies required dedicated challenge, solution and result fields; industry filters were needed to browse the stories. The new section also needed consistent covers, but synthetic images could not be presented as photographs of customer work or actual sites.
  - type: text
    title: Separated content types and editorial workflows
    body: >-
      Split the blog from a dedicated case-study content type with fields for the original challenge, delivered solution and outcome. Configured an industry taxonomy and three filters, prepared display templates and added the sections to the navigation. I also set up a generated HTML sitemap for published content. Editors received distinct publishing structures for news and customer stories instead of one generic template.
  - type: text
    title: Prepared the first editorial batch
    body: >-
      The release contained six publications: two news items, one article and three case studies. I rechecked source facts before publication and retained links to original references. The industry filters were checked against these materials; I also resolved a route conflict between filter URLs and attachment URLs so navigation and media would not claim the same path.
  - type: text
    title: Created and labeled six AI-assisted covers
    body: >-
      Generated six illustrations from cleaning-equipment references and prepared them as WebP files. Captions identify them as editorial illustrations, not photographs of customer work, equipment at a client site or real locations. This provides a consistent visual system across content types without implying documentary accuracy for synthetic images.
  - type: text
    title: Outcome, checks and SEO boundaries
    body: >-
      All six URLs loaded and appeared in the HTML sitemap; covers, disclosures and three industry filters were checked. The combined cover-file weight dropped from 13.0 MB to 0.81 MB, a 93.8% reduction. Existing noindex settings for posts and case studies were preserved: launching the editorial section and listing URLs in an HTML sitemap are not presented as proof of indexation or search-traffic growth.
