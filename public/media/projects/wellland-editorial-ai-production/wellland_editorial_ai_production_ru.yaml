title: "Wellland: блог, клиентские кейсы и ИИ-иллюстрации"
tagline: >-
  Для поставщика уборочной техники создал редакционный раздел с отдельной структурой кейсов, отраслевыми фильтрами и шестью стартовыми публикациями. Подготовил шесть ИИ-обложек, явно обозначенных как иллюстрации, и оптимизировал их общий вес с 13,0 до 0,81 МБ.
year: "10.2026"
role: Контентная архитектура WordPress и визуальный контент на базе ИИ
stack:
  - WordPress
  - Редакционные сценарии
  - Генерация изображений с ИИ
  - WebP
  - Техническое SEO
blocks:
  - type: text
    title: "Задача: подготовить редакционный раздел к публикации"
    body: >-
      Поставщику уборочной техники требовалось разделить новости, статьи и клиентские кейсы, чтобы команда могла публиковать материалы без ручной сборки одинаковых страниц. Для кейсов нужны были отдельные поля «задача», «решение» и «результат», а для поиска по материалам — фильтры по отраслям. К новому разделу также требовались согласованные обложки, но синтетические изображения нельзя было выдавать за реальные съёмки у клиентов или на объектах.
  - type: text
    title: Развёл типы контента и сценарии редактора
    body: >-
      Отделил блог от самостоятельного типа записей «Кейсы» с полями для исходной задачи, выполненного решения и результата. Настроил отраслевую таксономию и три фильтра, подготовил шаблоны вывода и добавил разделы в меню. Для навигации по опубликованному материалу настроил генерацию HTML-карты сайта. Это дало редакции разные формы публикации для новостей и историй клиентов вместо одного общего шаблона.
  - type: text
    title: Подготовил стартовую редакционную выборку
    body: >-
      В релиз вошло шесть публикаций: две новости, одна статья и три кейса. Перед размещением перепроверил исходные факты и сохранил ссылки на первоисточники. Отраслевые фильтры проверил на этих материалах; отдельно устранил конфликт адресов фильтра с URL вложений, чтобы навигация и медиа не перехватывали один и тот же маршрут.
  - type: text
    title: Создал и подписал шесть ИИ-обложек
    body: >-
      Сгенерировал шесть иллюстраций по референсам уборочной техники и подготовил файлы в WebP. В подписях обозначил их как редакционные иллюстрации, а не фотографии работ, оборудования у клиента или реальных объектов. Такой способ позволяет поддерживать единый визуальный ряд для разных типов публикаций, не приписывая синтетическим изображениям документальную достоверность.
  - type: text
    title: Результат, проверки и границы SEO
    body: >-
      Все шесть URL открывались и присутствовали в HTML-карте; проверены обложки, подписи и три отраслевых фильтра. Общий вес комплекта обложек сократился с 13,0 до 0,81 МБ — на 93,8%. Существующие настройки noindex для записей и кейсов сохранил: запуск редакционного раздела и наличие URL в HTML-карте не выдаю за индексацию или рост поискового трафика.
