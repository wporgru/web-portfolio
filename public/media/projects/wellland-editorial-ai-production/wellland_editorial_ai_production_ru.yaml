title: "Wellland: блог, клиентские кейсы и ИИ-иллюстрации"
tagline: "Запустил редакционный раздел для поставщика уборочной техники: новости
  и статьи должны были редактироваться штатно, а кейсы — иметь свою структуру и
  фильтры по отраслям. Для первого наполнения нужны были единообразные обложки
  без выдачи синтетических изображений за съёмку у клиентов."
year: "10.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Editorial workflows
  - AI-assisted image generation
  - WebP
  - Technical SEO
blocks:
  - type: text
    title: Задача и ограничения
    body: "Запустил редакционный раздел для поставщика уборочной техники: новости и
      статьи должны были редактироваться штатно, а кейсы — иметь свою структуру
      и фильтры по отраслям. Для первого наполнения нужны были единообразные
      обложки без выдачи синтетических изображений за съёмку у клиентов."
  - type: text
    title: Как устроено решение
    body: "Развёл блог и отдельный тип записей «Кейсы» с полями задачи, решения и
      результата. Настроил отрасли, шаблоны, ссылки в меню и автоматическую
      HTML-карту. Для стартового набора подготовил новости, статью и кейсы:
      перепроверил исходные факты и оставил ссылки на первоисточники.
      Сгенерировал шесть обложек по референсам техники, подписал их как
      иллюстрации и подготовил WebP. Исправил конфликт маршрутов отраслевых
      фильтров с адресами вложений."
  - type: text
    title: Результат и проверка
    body: "В релизе — шесть публикаций: две новости, одна статья и три кейса. Все
      шесть URL открывались и присутствовали в HTML-карте; проверены обложки,
      подписи и три отраслевых фильтра. Вес комплекта обложек снизился с 13,0 до
      0,81 МБ, на 93,8%. Существующий noindex для записей и кейсов не менял,
      поэтому не заявляю их индексацию."
  - type: image
    src: /media/projects/wellland-editorial-ai-production/editorial-illustration.webp
    alt: Редакционная ИИ-иллюстрация поломоечной машины для статьи Wellland
    caption: Одна из шести редакционных обложек. Сгенерирована по референсам
      техники; не фотография клиента или объекта.
