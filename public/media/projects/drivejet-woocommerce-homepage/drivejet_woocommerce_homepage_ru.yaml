title: "DriveJet: главная и ссылки действующего магазина"
tagline: Доработать существующий магазин дублирующих педалей и показать товар на
  главной странице.
role: Веб-разработка
year: "07.2018"
stack:
  - WordPress
  - WooCommerce
  - Product URLs
blocks:
  - type: text
    title: Задача
    body: Доработать существующий магазин дублирующих педалей и показать товар на
      главной странице.
  - type: text
    title: Что сделано
    body: Настроил товарный блок главной, структуру ссылок и оформление цены;
      объяснил, как будущие товары попадут в блок.
  - type: text
    title: Как решалась задача
    body: На момент работы WooCommerce уже был установлен и содержал один товар.
      Изменил структуру и транслитерацию товарных адресов, доработал отображение
      цены и вывел товары на главной. Объяснил заказчику сценарий появления
      новых позиций после самостоятельного добавления. После наполнения обсуждал
      дальнейшие настройки и предварительные замечания по контенту и метаданным;
      этап принят. Создание магазина с нуля, реальная оплата и устранение всех
      SEO-проблем в архиве не подтверждены.
