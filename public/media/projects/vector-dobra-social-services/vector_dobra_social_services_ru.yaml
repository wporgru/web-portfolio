title: "«Вектор Добра»: сайт социальных услуг"
tagline: "Подготовил сайт организации социального обслуживания: посетитель
  должен быстро понять, какие услуги доступны, и найти способ связаться с
  организацией."
year: "11.2021"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Elementor
  - Yoast SEO
  - Service pages
blocks:
  - type: text
    title: Задача и ограничения
    body: "Подготовил сайт организации социального обслуживания: посетитель должен
      быстро понять, какие услуги доступны, и найти способ связаться с
      организацией."
  - type: text
    title: Как устроено решение
    body: Собрал страницы услуг и подменю в Elementor. Доработал логотип, favicon,
      контактную шапку, подвал и кнопку обратного звонка. Сделал телефон и email
      кликабельными, настроил раскрытие поиска и перевёл адрес WordPress на
      HTTPS. Серверный редирект клиент настроил с поддержкой.
  - type: text
    title: Результат и проверка
    body: Клиент принял сайт. Исторический снимок показывает согласованные шапку и
      первый экран; доставку заявок и полное наполнение он не подтверждает.
  - type: image
    src: /media/projects/vector-dobra-social-services/historical-first-screen.webp
    alt: Шапка и первый экран сайта «Вектор Добра»
    caption: "Исторический фрагмент из портфолио Kwork: контактная шапка, навигация
      и блок услуг."
