title: "WP.ORG.RU: сайт веб-разработчика и витрина услуг"
tagline: Личный сайт веб-мастерской, где услуги, проекты, магазин и экспертные
  материалы собраны в единую систему — с прямым маршрутом к обсуждению задачи.
year: "2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - PHP
  - CSS
blocks:
  - type: text
    title: "Задача: превратить личный сайт в рабочую точку входа"
    body: Для частного разработчика сайт должен не только рассказывать о навыках,
      но и помогать разным заказчикам быстро найти подходящее направление,
      оценить примеры работ и связаться напрямую. Важно было показать широкий
      профиль — от WordPress и WooCommerce до аудита, SEO, ускорения и AI-контента
      — и не сводить его к десяткам одинаковых страниц с заменённым заголовком.
  - type: text
    title: Архитектура и путь посетителя
    body: "В публичной структуре разнесены основные сценарии: каталог услуг,
      портфолио, магазин цифровых продуктов, база знаний и контакты. На главной
      собраны направления работы, технологический профиль, блок об авторе,
      отзывы, ответы на частые вопросы и форма обращения. Посетитель может
      перейти от темы задачи к отдельной услуге, затем посмотреть связанные
      работы или сразу отправить запрос — без необходимости искать контакты в
      подвале."
  - type: text
    title: Не набор шаблонов, а отдельные страницы услуг
    body: На сайте представлены корпоративная разработка, WooCommerce-магазины,
      лендинги, техподдержка, SEO, аудит, редизайн, лечение сайтов, наполнение,
      ускорение, парсинг и генерация контента с AI. Для каждого направления
      посетитель получает отдельное описание и маршрут к обсуждению работ.
      Портфолио и база знаний дополняют страницы услуг примерами и объяснениями,
      а магазин выделен в самостоятельный раздел для готовых цифровых решений.
  - type: text
    title: Результат и границы описания
    body: "Текущая публичная версия позволяет изучить направления разработки,
      перейти к кейсам и материалам, увидеть отзывы и связаться с автором.
      Архитектура позиционирует специалиста как веб-разработчика широкого
      профиля, а не только исполнителя по WordPress: на сайте отдельно показаны
      интеграции, React, PHP, пользовательская логика и AI-направление. Это
      описание фактически опубликованных разделов, а не обещание конкретных
      продаж, поисковых позиций или конверсии. Внутренние планы, которые не
      представлены на сайте, не выдаются за внедрённый функционал."
    links:
      - label: Открыть WP.ORG.RU
        url: https://wp.org.ru/
