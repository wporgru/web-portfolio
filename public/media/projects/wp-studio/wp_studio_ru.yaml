title: "WP.ORG.RU: сайт веб-мастерской"
tagline: Сделать путь от описания услуги к кейсам и контакту короче, не
  превращая сайт в каталог одинаковых посадочных страниц.
year: "2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - PHP
  - CSS
blocks:
  - type: text
    title: Задача и ограничения
    body: Сделать путь от описания услуги к кейсам и контакту короче, не превращая
      сайт в каталог одинаковых посадочных страниц.
  - type: text
    title: Как устроено решение
    body: На публичном сайте выделены страницы услуг, портфолио, база знаний и
      контакты. В рабочих материалах Antigravity отдельно разобраны шаблоны
      услуг и портфолио, согласование первых экранов и навигация между
      разделами.
  - type: text
    title: Результат и проверка
    body: Публичная версия позволяет посмотреть предложения и написать исполнителю.
      Внутренние планы не выдаются за внедрённые изменения и не публикуются.
