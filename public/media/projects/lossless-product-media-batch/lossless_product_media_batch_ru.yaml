title: Пакетное сжатие каталожных изображений без потерь
tagline: Обработал крупный архив товарных изображений, сохранив исходные имена и
  форматы. Для клиента было важно вернуть файлы в существующую структуру без
  переназначения ссылок.
year: "11.2022"
role: Веб-разработка и автоматизация
stack:
  - JPEG
  - WebP
  - Lossless optimization
  - Catalog media
blocks:
  - type: text
    title: Задача и ограничения
    body: Обработал крупный архив товарных изображений, сохранив исходные имена и
      форматы. Для клиента было важно вернуть файлы в существующую структуру без
      переназначения ссылок.
  - type: text
    title: Как устроено решение
    body: "Разобрал входной архив: в нём были JPEG и WebP, а объём по переписке
      составлял около 3,57 ГБ. Выполнил пакетную обработку без изменения
      размеров и передал комплект в облаке. Объяснил, что уже сжатые изображения
      почти не дают выигрыша без изменения размеров или перекодирования с
      потерями."
  - type: text
    title: Результат и проверка
    body: Клиент получил ссылку и принял работу. Независимого счётчика файлов и
      точного процента экономии не сохранилось; существенное сокращение объёма
      не заявляю.
