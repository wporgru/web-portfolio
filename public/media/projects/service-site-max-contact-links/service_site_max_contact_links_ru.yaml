title: "Сайт услуг: замена WhatsApp на MAX в шапке, подвале и контактах"
tagline: "На действующем сайте услуг нужно было перевести обращения из WhatsApp
  в MAX. Одной новой кнопки было недостаточно: переходы были разбросаны по
  шапке, подвалу и странице контактов."
year: "04.2026"
role: Веб-разработка и автоматизация
stack:
  - Contact links
  - MAX
  - Header and footer
