blocks:
  - type: text
    title: Задача и ограничения
    body: "На действующем сайте услуг нужно было перевести обращения из WhatsApp в
      MAX. Одной новой кнопки было недостаточно: переходы были разбросаны по
      шапке, подвалу и странице контактов."
  - type: text
    title: Как устроено решение
    body: "Обновил контактные элементы и оформление кнопки по согласованному
      варианту: синий фон и белый круг вместо прежнего зелёного оформления. При
      приёмке клиент обнаружил, что ссылка в шапке осталась прежней. Я сохранил
      пропущенную правку, перепроверил остальные файлы и передал результат
      повторно."
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил повторную проверку и принял работу. Согласованные места
      размещения проверялись в рамках заказа; абсолютное число ссылок не
      зафиксировано. Это изменение контактного сценария, а не установка
      самостоятельного плагина или замер роста обращений.
