title: Восстановление кратких описаний при импорте
tagline: Исправил обновление карточек, где данные из таблицы не совпадали с
  результатом на витрине. Нужно было отделить ошибку сопоставления от настроек
  шаблона.
year: "02.2020"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Data import
  - Excerpt
  - Product attributes
blocks:
  - type: text
    title: Задача и ограничения
    body: Исправил обновление карточек, где данные из таблицы не совпадали с
      результатом на витрине. Нужно было отделить ошибку сопоставления от
      настроек шаблона.
  - type: text
    title: Как устроено решение
    body: После замечаний уточнил, какие названия и характеристики должен задавать
      файл клиента. Предложил загружать текст в краткое описание с
      HTML-заголовками и списками. Разобрал остановки импорта и в финале нашёл
      отключённый вывод краткого описания в теме. Сузил обновление до названий,
      атрибутов и кратких описаний.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил результат и принял заказ. Независимой построчной сверки
      не было; порядок фильтров и лист ожидания вынесли в следующие работы.
  - type: text
    title: Другой этап этого проекта
    links:
      - label: "Следующий этап: лист ожидания и письма магазина"
        url: /showcase/woocommerce-stock-waitlist-localization/
