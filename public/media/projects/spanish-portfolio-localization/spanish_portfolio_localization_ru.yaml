title: Испанская версия WordPress-сайта и портфолио
tagline: "Подключил второй язык и подготовил рабочий порядок для владельца
  сайта: как переводить страницы, записи, портфолио и виджеты, не меняя исходную
  версию."
year: "06.2024"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Localization
  - Responsive layout
blocks:
  - type: text
    title: Задача и ограничения
    body: "Подключил второй язык и подготовил рабочий порядок для владельца сайта:
      как переводить страницы, записи, портфолио и виджеты, не меняя исходную
      версию."
  - type: text
    title: Как устроено решение
    body: "Привёл в порядок переключатель языка: убрал дубль и лишний пункт,
      сохранил понятные подписи. Записал инструкции по копированию содержимого в
      новый перевод, работе с виджетами и отдельной настройке испанского меню.
      Исправил баннеры, которые в испанской версии складывались вертикально
      вместо горизонтальной прокрутки, и довёл мобильное отображение."
  - type: text
    title: Результат и проверка
    body: Владелица проверила исправления и приняла работу. Сплошной ручной перевод
      всех страниц не входил в этот этап.
