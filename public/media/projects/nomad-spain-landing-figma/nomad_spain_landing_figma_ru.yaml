title: "Digital Nomad: адаптивный лендинг по макетам Figma"
tagline: Перенёс длинную страницу программы по Испании из макетов Figma в шаблон
  WordPress. На десктопе важно было сохранить читаемую статью рядом с
  оглавлением, а на телефоне — оставить заявки, документы и вопросы доступными
  без горизонтальной прокрутки.
year: "10.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - PHP
  - Figma
  - CSS
  - Responsive design
  - Playwright
blocks:
  - type: text
    title: Задача и ограничения
    body: Перенёс длинную страницу программы по Испании из макетов Figma в шаблон
      WordPress. На десктопе важно было сохранить читаемую статью рядом с
      оглавлением, а на телефоне — оставить заявки, документы и вопросы
      доступными без горизонтальной прокрутки.
  - type: text
    title: Как устроено решение
    body: Разделил внешний контейнер и внутренние отступы карточек, чтобы вложенные
      блоки не сжимали текст дважды. На десктопе выровнял две части первого
      экрана, закрепил оглавление и согласовал ширину статьи. На мобильном
      перестроил первый экран и секцию документов в одну колонку, убрал
      декоративный элемент между панелями и сохранил переход из первого экрана к
      квизу.
  - type: text
    title: Результат и проверка
    body: На проверенной версии при ширине 1680 px контейнер занял 1320 px, при 375
      px — 327 px; горизонтального переполнения не было. Сверил размеры ключевых
      секций по DOM и визуально. Снимок фиксирует версию проверки, а не текущие
      условия программы или результат заявок.
  - type: image
    src: /media/projects/nomad-spain-landing-figma/archive-full.webp
    alt: "Полная страница программы Digital Nomad: Испания"
    caption: Архивный полностраничный снимок проверенной версии без обрезки, 1680 ×
      12327. Показаны интерфейс и вёрстка, а не актуальные условия программы.
