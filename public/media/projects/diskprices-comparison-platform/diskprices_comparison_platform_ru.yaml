title: "DiskPrices: сравнение цен и история стоимости"
tagline: Разработал витрину накопителей на Laravel. Вместо отдельных карточек из
  разных магазинов покупатель должен видеть сопоставимые предложения одной
  модели, а владелец проекта — понимать, какие фиды загрузились и по каким
  товарам были переходы.
year: "2026"
role: Веб-разработка и автоматизация
stack:
  - Laravel
  - PHP
  - SQLite
  - XML
  - YML
  - Affiliate tracking
blocks:
  - type: text
    title: Задача и ограничения
    body: Разработал витрину накопителей на Laravel. Вместо отдельных карточек из
      разных магазинов покупатель должен видеть сопоставимые предложения одной
      модели, а владелец проекта — понимать, какие фиды загрузились и по каким
      товарам были переходы.
  - type: text
    title: Как устроено решение
    body: "Разделил загрузку XML и YML, хранение исходных предложений и сборку
      публичного каталога. Для сопоставления важны не только название и бренд:
      ёмкость и тип накопителя извлекаются отдельно, а код модели не должен
      превращаться в объём. Настроил фильтры категории, страницы сравнения и
      историю цены. Добавил кабинет для управления импортами и переход на сайт
      продавца с записью события."
  - type: text
    title: Результат и проверка
    body: В проекте есть отдельные проверки для повторной загрузки, сопоставления
      предложений разных продавцов, дробной ёмкости и отсева посторонних
      товаров. Кейс описывает реализованную архитектуру и покрытые кодом
      сценарии, а не полноту рынка или рост партнёрской выручки.
