  - type: text
    title: Что можно взять для своего агрегатора
    body: "Архитектура и тестовые сценарии демонстрируют работу с каталогом, но не
      подтверждают полноту рынка, комиссионный доход или рост продаж. Для похожей задачи
      пришлите категорию и обезличенные образцы фидов: сначала согласуем ключи модели и
      варианта, исключения и правила повторного обновления, затем проверим их на небольшой
      выборке."
