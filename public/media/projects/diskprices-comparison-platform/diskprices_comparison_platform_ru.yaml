title: "DiskPrices: сравнение цен и история стоимости"
tagline: Разработал витрину накопителей на Laravel. Вместо отдельных карточек из разных
  магазинов покупатель должен видеть сопоставимые предложения одной модели, а владелец
  проекта — понимать, какие фиды загрузились и по каким товарам были переходы.
year: "2026"
role: Веб-разработка и автоматизация
stack:
  - Laravel
  - PHP
  - SQLite
  - XML
  - YML
  - Affiliate tracking
blocks:
  - type: text
    title: "Задача: сравнение предложений, а не просто список фидов"
    body: Для витрины накопителей нужно объединять предложения разных продавцов в полезное
      сравнение, не смешивая похожие, но разные модели и объёмы. Владелец должен видеть
      состояние загрузок и переходы, а покупатель — характеристики, цены и историю
      конкретной модели.
  - type: text
    title: От фида к карточке
    body: "Разделил загрузку XML/YML, сохранение исходных товарных записей и построение
      публичного каталога. В данных хранится происхождение предложения, а импорты доступны
      из кабинета. Для сопоставления извлекаются бренд, код модели, тип накопителя и
      ёмкость: код модели нельзя считать ёмкостью только потому, что в нём есть цифры."
  - type: text
    title: Группировка предложений и контроль вариантов
    body: "В проекте предусмотрены проверки случая с похожими предложениями одного продавца:
      они не должны автоматически сливаться в одну группу. Отдельно проверяется
      объединение совпадающих предложений разных продавцов. Также в тестах рассматриваются
      повторная загрузка, дробная ёмкость и отсеивание посторонних товаров. Это проверки
      заданных сценариев, а не доказательство отсутствия любой ошибки сопоставления."
  - type: text
    title: Путь покупателя и аналитика
    body: Публичная часть включает категорию с фильтрами и страницу сравнения с историей цены.
      При переходе к продавцу отдельный маршрут записывает событие; в тестовом сценарии
      проверяются перенаправление на партнёрскую ссылку, идентификатор предложения и
      источник перехода. В административной части предусмотрены разделы импортов и кликов.
  - type: image
    src: /media/projects/diskprices-comparison-platform/homepage-20261117.png
    title: Публичная главная DiskPrices
    alt: Полностраничная витрина DiskPrices с фильтрами и предложениями накопителей
    caption: Анонимный снимок 17 ноября 2026 года, 1440 px, без обрезки. Показывает публичную
      витрину; цены, наличие и переходы к продавцам отдельно не проверялись.
