        url: https://diskprices.ru/
  - type: text
    title: Another stage of this project
    links:
      - label: "Follow-up: adapting the catalog to memory products"
        url: /showcase/ramprices-memory-offer-normalization/en/
  - type: text
    title: Applying this to another aggregator
    body: The architecture and tests demonstrate catalog processing, not complete market
      coverage, affiliate commissions or sales growth. For a similar project, send a
      category and sanitized feed samples. We can agree on model and variant keys,
      exceptions and repeat-update rules before validating a small pilot.
