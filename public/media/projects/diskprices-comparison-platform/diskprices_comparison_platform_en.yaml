title: "DiskPrices: price comparison and price history"
tagline: Built a Laravel storefront for storage devices. Shoppers needed comparable offers
  for the same model rather than isolated merchant listings; the operator needed to see
  which feeds imported and which products generated outbound clicks.
year: "2026"
role: Web development and automation
stack:
  - Laravel
  - PHP
  - SQLite
  - XML
  - YML
  - Affiliate tracking
blocks:
  - type: text
    title: "The brief: compare offers, not just list feeds"
    body: A storage-device storefront needs to group offers from different merchants into
      useful comparisons without merging similar but distinct models and capacities. The
      owner needs import and click visibility; buyers need specifications, prices and the
      history of the relevant model.
  - type: text
    title: From feed to listing
    body: "I separated XML/YML ingestion, storage of raw product records and public catalog
      generation. The offer retains its source and imports are managed through an admin
      area. Matching extracts brand, model code, storage type and capacity separately:
      digits in a model code must not be mistaken for capacity."
  - type: text
    title: Grouping offers and checking variants
    body: The project includes a test where similar offers from the same merchant must not
      automatically merge into a single comparison group. Another test covers matching
      offers across different merchants. Tests also cover repeat imports, fractional
      capacities and excluding unrelated products. These verify specific scenarios, not
      the absence of every possible matching error.
  - type: text
    title: Buyer journey and analytics
    body: The public storefront includes a category with filters and a comparison page with
      price history. A dedicated outbound route records a click event before redirecting
      to the merchant. A test checks the affiliate destination, offer identifier and
      traffic source. Admin sections expose import and click information.
  - type: image
    src: /media/projects/diskprices-comparison-platform/homepage-20261117.png
    title: Public DiskPrices homepage
    alt: Full-page DiskPrices storefront with filters and storage offers
    caption: Anonymous full-page capture from November 17, 2026, at 1440 px. It shows the
      public storefront; prices, stock and merchant click-throughs were not independently
      checked.
  - type: text
    title: Visit the project
    links:
