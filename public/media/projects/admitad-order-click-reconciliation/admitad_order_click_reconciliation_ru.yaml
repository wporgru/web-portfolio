title: Сверка партнёрских заказов с исходным кликом
tagline: В партнёрском отчёте видна покупка, но не всегда понятно, с какой
  страницы и карточки начался переход. При этом посетитель может купить не тот
  товар, по которому кликнул. Нужно было восстановить маршрут без подмены
  состава заказа данными клика.
year: "09.2026"
role: Веб-разработка и автоматизация
stack:
  - Python
  - SQLite
  - Admitad
  - SSH
  - Attribution
  - Automated tests
blocks:
  - type: text
    title: Задача и ограничения
    body: В партнёрском отчёте видна покупка, но не всегда понятно, с какой страницы
      и карточки начался переход. При этом посетитель может купить не тот товар,
      по которому кликнул. Нужно было восстановить маршрут без подмены состава
      заказа данными клика.
  - type: text
    title: Как устроено решение
    body: Добавил отдельный импорт журнала в SQLite через проверенное
      SSH-подключение без записи на сайт. Сделал повторный импорт идемпотентным,
      а сопоставление ограничил идентификатором площадки и click ID из SubID. В
      отчёте раздельно показал исходный SKU, позиции покупки, сумму действия и
      комиссию. Не загруженный журнал не отображается как ноль кликов.
  - type: text
    title: Результат и проверка
    body: "Повторно прошли три профильных теста: повтор записи не создаёт дубль,
      чужая площадка не получает совпадение, незагруженный журнал не выдаётся за
      нулевой. Это проверка правил атрибуции, не оценка числа потерянных продаж
      или размера комиссии."
