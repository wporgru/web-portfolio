title: "ProLog: редактируемая подпись для Outlook"
tagline: Передал корпоративный HTML-шаблон с заменяемыми данными сотрудников,
  PNG-иконками и инструкциями по установке и редактированию.
year: "09.2023"
role: Вёрстка почтовых интерфейсов
stack:
  - HTML
  - CSS
  - Outlook
blocks:
  - type: text
    title: Один шаблон для сотрудников
    body: Заказчик предоставил фирменные материалы. Нужно было сохранить оформление,
      но позволить сотрудникам менять свои данные без пересборки подписи.
  - type: text
    title: Иконки, установка и редактирование
    body: Использовал PNG-иконки вместо шрифтовых. Передал HTML-файл и инструкции по
      размещению в Microsoft Signatures, выбору подписи в Outlook и
      редактированию через Notepad++.
  - type: text
    title: Что подтвердил клиент
    body: Клиент принял заказ и оставил положительный отзыв. Объяснение выбора
      нескольких подписей не означает передачу отдельных RU- и EN-файлов.
      Финальные цветовые поправки и совместимость со всеми версиями Outlook
      отдельно не подтверждены.
