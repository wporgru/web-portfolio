title: "«Кабанчик»: сайт ресторана с меню и банкетами"
tagline: "Подготовил первый этап сайта грузинского ресторана. Гостю нужна была
  понятная стартовая точка: узнать о ресторане, найти меню и банкетные залы,
  перейти к бронированию или узнать о доставке. На этом этапе владелец принимал
  сайт и оформление, а не интернет-магазин."
year: "06.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Blocksy
  - Responsive design
  - Restaurant website
blocks:
  - type: text
    title: Задача и ограничения
    body: "Подготовил первый этап сайта грузинского ресторана. Гостю нужна была
      понятная стартовая точка: узнать о ресторане, найти меню и банкетные залы,
      перейти к бронированию или узнать о доставке. На этом этапе владелец
      принимал сайт и оформление, а не интернет-магазин."
  - type: text
    title: Как устроено решение
    body: "Использовал фотографии клиента для оформления и материалы о шеф-поваре.
      Передал первый этап на проверку 15 июня и собрал замечания к показанной
      версии. Разложил обратную связь на дизайн-правки и новые функции:
      обновления первого этапа внёс отдельным проходом, а полноценную корзину,
      продажу и оплату блюд вынес за его границы. На странице доставки на тот
      момент оставил визуальную заготовку."
  - type: text
    title: Результат и проверка
    body: Клиент положительно оценил общий вид и передал отдельный список уточнений.
      16 июня отправил доработанную версию и отметил сделанное в файле правок.
      Нижний снимок показывает более позднее состояние сайта, а не историческую
      сдачу первого этапа.
  - type: image
    src: /media/projects/kabanchik-restaurant-website/homepage-20261102.webp
    alt: Полностраничный снимок сайта ресторана «Кабанчик»
    caption: Главная без обрезки, захват 2 ноября 2026 года. На снимке более поздняя
      версия, не сдача первого этапа в июне.
