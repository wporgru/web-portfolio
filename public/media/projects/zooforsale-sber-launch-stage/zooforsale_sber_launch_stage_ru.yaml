title: Zooforsale и тестовый эквайринг для Balance Group Life
tagline: "В одном заказе работал над двумя независимыми задачами: основой доски
  объявлений Zooforsale и тестовой оплатой для Balance Group Life."
year: "12.2022"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WCFM
  - Electro
  - Sber acquiring
blocks:
  - type: text
    title: Задача и ограничения
    body: "В одном заказе работал над двумя независимыми задачами: основой доски
      объявлений Zooforsale и тестовой оплатой для Balance Group Life."
  - type: text
    title: Как устроено решение
    body: На Zooforsale помог настроить основу Electro и WCFM, показал управление
      товарными блоками, категориями и секциями. На втором сайте проверил
      тестовую оплату, отображаемую в Сбере, уточнил параметры для передачи
      банку и создал недостающую страницу «Партнёрство». Отдельно объяснил
      порядок перехода к боевой среде.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил и принял этап. Тестовая транзакция не означает запуск
      боевых продаж, а доска объявлений не включала выплаты продавцам.
