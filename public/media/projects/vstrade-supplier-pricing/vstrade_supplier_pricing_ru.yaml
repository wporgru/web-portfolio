title: Импорт «ВсТрейд» и обновление цен и остатков
tagline: Требовалось загрузить ассортимент поставщика, превратить закупочные
  цены в розничные и при следующих обновлениях учитывать появление и
  исчезновение предложений.
year: "07.2025"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Supplier feed
  - Pricing rules
blocks:
  - type: text
    title: Задача и ограничения
    body: Требовалось загрузить ассортимент поставщика, превратить закупочные цены в
      розничные и при следующих обновлениях учитывать появление и исчезновение
      предложений.
  - type: text
    title: Как устроено решение
    body: Провёл первую загрузку и передал витрину на проверку. Стартовую наценку
      20% заменил правилами из согласованной таблицы, когда клиент уточнил
      назначение исходных цен. После повторной обработки настроил автоматическое
      обновление и выполнил контрольный проход.
  - type: text
    title: Результат и проверка
    body: В одном отчёте зафиксированы 20 новых товаров и перевод 21 позиции в
      статус «Нет в наличии». Это изменения конкретного прохода, а не общий
      размер магазина. Точные пороги наценки не раскрываются.
