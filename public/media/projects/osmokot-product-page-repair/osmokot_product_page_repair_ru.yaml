title: Ремонт карточки товара и шаблона магазина «Осмокот»
tagline: На карточке товара возникала ошибка, а в шаблоне отображался лишний
  блок меню. Задача заключалась в восстановлении товарной страницы без переделки
  всего магазина.
year: "02.2024"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - Yandex Metrica
blocks:
  - type: text
    title: Задача и ограничения
    body: На карточке товара возникала ошибка, а в шаблоне отображался лишний блок
      меню. Задача заключалась в восстановлении товарной страницы без переделки
      всего магазина.
  - type: text
    title: Как устроено решение
    body: Устранил ошибку и в рабочем отчёте связал её с плагином Метрики. Убрал
      лишнее меню из шаблона и отдельно проверил отправку отзыва на сайте.
      Предложил вариант подключения счётчика кодом как рекомендацию, а не как
      уже выполненную интеграцию.
  - type: text
    title: Результат и проверка
    body: Заказчик принял ремонт и оставил отзыв. Настройка Метрики, переход на WebP
      и ускорение обсуждались отдельно и не включены в результат.
