title: "iBike: сайт проката с заявкой на аренду"
tagline: Собрал сайт проката с тарифами, правилами, доставкой и формой заявки.
  Пользователь мог указать даты и аксессуары с телефона, не уточняя весь набор
  по переписке.
year: "01.2020"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Rental enquiry
  - Responsive forms
blocks:
  - type: text
    title: Задача и ограничения
    body: Собрал сайт проката с тарифами, правилами, доставкой и формой заявки.
      Пользователь мог указать даты и аксессуары с телефона, не уточняя весь
      набор по переписке.
  - type: text
    title: Как устроено решение
    body: Разложил материалы по разделам и добавил FAQ-аккордеон. Настроил кнопки
      связи для телефона, мессенджеров и почты. В форме разделил даты начала и
      окончания, вынес аксессуары в чекбоксы. Когда календари начали перекрывать
      друг друга, изменил ширину формы и передал клиенту на повторную проверку.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил мобильную правку и принял сайт с бонусом. Это форма
      заявки, а не автоматический учёт парка, бронирование или эквайринг.
  - type: image
    src: /media/projects/ibike-scooter-rental-website/historical-rental.webp
    alt: Исторический экран сайта проката iBike
    caption: Снимок из исторической карточки Kwork; не проверка отправки формы или
      доступности сайта сегодня.
