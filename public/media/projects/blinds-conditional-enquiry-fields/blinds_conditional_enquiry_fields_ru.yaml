title: Зависимые поля формы заявки для сайта жалюзи
tagline: Настроил форму, в которой доступные материалы зависят от выбранного
  типа жалюзи. Это позволяет не показывать клиенту заведомо несовместимые
  варианты.
year: "12.2022"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Elementor
  - Conditional forms
  - Lead capture
blocks:
  - type: text
    title: Задача и ограничения
    body: Настроил форму, в которой доступные материалы зависят от выбранного типа
      жалюзи. Это позволяет не показывать клиенту заведомо несовместимые
      варианты.
  - type: text
    title: Как устроено решение
    body: Сначала объяснил, как подключать существующие всплывающие формы к кнопкам
      и телефону и чем отличаются шаблоны страниц и шапок Elementor. Для
      платного этапа согласовал соответствия «тип → материалы» и наличие
      резервной копии, затем настроил зависимые поля и передал работу на
      проверку.
  - type: text
    title: Результат и проверка
    body: Клиент оплатил и принял настройку. Архив не раскрывает точный модуль и не
      подтверждает тест каждой комбинации и доставки заявок.
