title: "ARTRED: B2B-каталог техники и заявки с карточек"
tagline: Перестроил WooCommerce из витрины с корзиной в каталог для консультаций
  по технике. Покупатель видит цену и характеристики, а вместо покупки сразу
  переходит к обсуждению модели. Проверил 22 карточки и 6 страниц каталога на стенде.
year: "08.2026"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - GeneratePress
  - PHP
  - SVG
  - Contact Form 7
blocks:
  - type: text
    title: Задача и ограничения
    body: Переделал товарные страницы для сценария, в котором покупатель сначала
      обсуждает задачу и оборудование с менеджером, а не сразу покупает дорогую
      машину через корзину. При этом карточки должны были остаться пригодными
      для сравнения моделей по характеристикам.
  - type: text
    title: От сравнения техники к консультации
    body: В категории заменил декоративные точки характеристик на SVG-иконки и
      сохранил читаемые подписи. В карточке товара убрал стандартное действие
      покупки, оставив консультацию. Подключил существующий диалог Contact Form
      7 через Popup Maker и ограничил стили этим диалогом, не меняя сторонний
      виджет EnvyBox. Дополнительно сверил информационные страницы, ссылки и
      наличие формы ниже первого экрана.
  - type: text
    title: Проверил не только одну демонстрационную карточку
    body: На стенде все 22 проверенные карточки вернули HTTP 200, показывали
      цену и кнопку «Заказать консультацию» без видимой кнопки добавления в
      корзину. На каждой карточке было не менее трёх иконок характеристик.
      На шести страницах каталога проверил наличие товарных сеток и отсутствие
      ссылок со старыми префиксами товаров и категорий. В отдельных проверках
      диалог консультации открывался, а в одной категории было шесть карточек
      и 18 иконок характеристик. Проверял интерфейс, а не доставку писем или
      рост числа заявок.
    links:
      - label: Сводка проверок 22 карточек и 6 страниц каталога (JSON)
        url: /media/projects/artred-b2b-equipment-catalog/catalog-enquiry-qa-summary.json
  - type: image
    src: /media/projects/artred-b2b-equipment-catalog/archive-viewport.webp
    alt: Карточка техники ARTRED с характеристиками и кнопкой консультации
    caption: "Десктопный снимок проверки 28 августа 2026 года: область окна 1440 ×
      1100. Не подтверждает отправку формы или текущий вид сайта."
  - type: text
    title: Зачем магазину техники сценарий консультации
    body: Для профессионального оборудования стоимость ошибки при выборе высока — покупателю
      важно сравнить характеристики и обсудить условия до оформления. Поэтому вместо
      универсальной кнопки покупки на проверенной карточке оставлена консультация, а в
      каталоге характеристики сопровождаются иконками и текстом. Менеджер получает точку
      входа для диалога, а посетителю не приходится искать контакты отдельно от товара.
  - type: image
    src: /media/projects/artred-b2b-equipment-catalog/homepage-20261117.webp
    alt: Полностраничный снимок главной сайта техники ARTRED
    caption: Публичная главная сайта на 17 ноября 2026 года, ширина окна 1440 px, без
      обрезки. Снимок показывает текущую витрину, но не подтверждает работу форм или
      состояние отдельных карточек в момент выполнения проекта.
  - type: text
    title: Кому подойдёт подобная доработка
    body: Такая схема полезна B2B-каталогам, поставщикам техники и сложного оборудования,
      где перед заказом нужна консультация. Можно обсудить, какие характеристики вынести
      в список, какое действие оставить на карточке и как связать обращение с выбранной
      моделью, не переделывая весь магазин без необходимости.
