title: Ускорение мобильной главной Аренда-ПМ
tagline: Оптимизировал главную сайта аренды техники, сохранив десктопный
  слайдер, выбор категории и существующую аналитику. На мобильном замере
  PageSpeed вырос с 72 до 96 баллов.
year: "10.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - PageSpeed Insights
  - Critical CSS
  - Playwright
blocks:
  - type: text
    title: Задача и ограничения
    body: Оптимизировал главную сайта аренды техники, сохранив десктопный слайдер,
      выбор категории и существующую аналитику. На мобильном замере PageSpeed
      вырос с 72 до 96 баллов.
  - type: text
    title: Как устроено решение
    body: "Перестроил загрузку первого экрана: на телефонах карусель не создаётся и
      не загружает скрытые фото, а на широком экране продолжает работать.
      Критические стили встроил в HTML; полные стили вынес из начальной загрузки
      с запасным сценарием для ошибки изображения и отключённого JavaScript.
      Сохранил порядок собственных скриптов и не менял код Метрики, UIS и
      Calltouch. Исправил размеры поля категории и наложение фильтра на баннер."
  - type: text
    title: Результат и проверка
    body: В лабораторных замерах 30 октября LCP сократился с 6,8 до 2,7 с, FCP — с
      2,0 до 0,9 с; итоговый CLS — 0,001. Проверил 390, 767, 768 и 1440 px,
      меню, выбор категории и смену слайдов. Форма вернула ожидаемую ошибку
      обязательного поля; реальную заявку менеджеру не отправлял. Повторный
      обход 82 URL не выявил ошибок canonical, метаданных и внутренних ссылок.
      Лабораторный замер не равен данным реальных пользователей.
  - type: image
    src: /media/projects/arenda-pm-home-performance/mobile-viewport.png
    alt: Мобильный первый экран после оптимизации
    caption: Снимок браузерной проверки, ширина 390 px. Это не отчёт PageSpeed и не
      полностраничный снимок.
