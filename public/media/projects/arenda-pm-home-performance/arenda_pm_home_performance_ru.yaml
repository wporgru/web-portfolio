  - type: text
    title: Другой этап этого проекта
    links:
      - label: "Связанный этап: техническое SEO каталога"
        url: /showcase/arenda-pm-catalog-indexability/
  - type: text
    title: Как читать эти цифры
    body: PageSpeed — лабораторный результат конкретных запусков, а не обещание одинаковой
      скорости всем пользователям. Предыдущий полноценный замер после основных правок
      составил 89; отдельный прогон с таймаутом UIS не использовался как доказательство
      стабильного результата. Для вашего сайта полезно сначала зафиксировать URL,
      устройство и условия теста, затем проверить функции после оптимизации.
