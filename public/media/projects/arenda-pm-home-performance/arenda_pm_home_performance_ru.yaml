title: Ускорение мобильной главной Аренда-ПМ
tagline: Оптимизировал главную сайта аренды техники, сохранив десктопный слайдер, выбор
  категории и существующую аналитику. На мобильном замере PageSpeed вырос с 72 до 96
  баллов.
year: "10.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - PageSpeed Insights
  - Critical CSS
  - Playwright
blocks:
  - type: text
    title: "Задача: ускорить первый экран без потери функций"
    body: Главная сайта аренды техники должна быстро показывать подбор категории на телефоне,
      но сохранять рабочий слайдер на компьютере. При этом нельзя было просто отключить
      аналитику или убрать функциональные элементы ради красивого лабораторного балла.
  - type: text
    title: Перестроил загрузку для мобильного и десктопа
    body: На телефоне карусель больше не создаётся и не загружает скрытые фотографии; на
      широком экране прежний слайдер остаётся рабочим. Переключение между режимами
      предусмотрено без перезагрузки. Критические стили первого экрана встроил в HTML,
      остальные отложил до декодирования изображения и начальной отрисовки. Для ошибки
      изображения, взаимодействия и отключённого JavaScript предусмотрена запасная
      загрузка.
  - type: text
    title: Сохранил аналитику и исправил сдвиги
    body: Собственные скрипты главной перестроил без блокировки разбора HTML, сохранив порядок
      зависимостей. Код Метрики, UIS и Calltouch не менял. Уточнил первоначальный размер
      поля выбора категории и устранил наложение фильтра на мобильный баннер, чтобы
      полезные элементы не сдвигались после подгрузки стилей.
  - type: text
    title: Результат и проверка
    body: В мобильных лабораторных замерах 30 октября PageSpeed изменился с 72 до 96, LCP — с
      6,8 до 2,7 с, FCP — с 2,0 до 0,9 с; итоговый CLS составил 0,001. Проверил 390, 767,
      768 и 1440 px, мобильное меню, выбор категории и смену десктопных слайдов. Форма
      вернула ошибку обязательного поля; реальную заявку не отправлял. Повторно обошёл 82
      URL без найденных ошибок canonical, метаданных и внутренних ссылок.
    links:
      - label: Отчёт PageSpeed после оптимизации
        url: https://pagespeed.web.dev/analysis/https-arenda-pm-ru/l3ptntuhx8?form_factor=mobile
  - type: image
    src: /media/projects/arenda-pm-home-performance/homepage-20261117.webp
    title: Главная сайта целиком
    alt: Полностраничный снимок главной Аренда-ПМ
    caption: Публичная версия от 17 ноября 2026 года, 1440 px, без обрезки. Снимок показывает
      десктопный вид и не заменяет мобильный замер PageSpeed.
  - type: image
    src: /media/projects/arenda-pm-home-performance/mobile-viewport.png
