title: Ускорение мобильной главной Аренда-ПМ
tagline: Оптимизировал главную сайта аренды техники, сохранив десктопный слайдер, выбор
  категории и существующую аналитику. На мобильном замере PageSpeed вырос с 72 до 96
  баллов.
year: "10.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - PageSpeed Insights
  - Critical CSS
  - Playwright
blocks:
  - type: text
    title: "Задача: ускорить первый экран без потери функций"
    body: Главная сайта аренды техники должна быстро показывать подбор категории на телефоне,
      но сохранять рабочий слайдер на компьютере. При этом нельзя было просто отключить
      аналитику или убрать функциональные элементы ради красивого лабораторного балла.
  - type: text
    title: Перестроил загрузку для мобильного и десктопа
    body: На телефоне карусель больше не создаётся и не загружает скрытые фотографии; на
      широком экране прежний слайдер остаётся рабочим. Переключение между режимами
      предусмотрено без перезагрузки. Критические стили первого экрана встроил в HTML,
      остальные отложил до декодирования изображения и начальной отрисовки. Для ошибки
      изображения, взаимодействия и отключённого JavaScript предусмотрена запасная
      загрузка.
  - type: text
    title: Сохранил аналитику и исправил сдвиги
    body: Собственные скрипты главной перестроил без блокировки разбора HTML, сохранив порядок
      зависимостей. Код Метрики, UIS и Calltouch не менял. Уточнил первоначальный размер
      поля выбора категории и устранил наложение фильтра на мобильный баннер, чтобы
      полезные элементы не сдвигались после подгрузки стилей.
  - type: text
    title: Что изменилось в двух сопоставимых прогонах
    body: Сравнил первый заход на одну и ту же главную 30 октября 2026 года в 02:55 и 10:25
      МСК. В обоих прогонах — Lighthouse 13.6.0, эмуляция Moto G Power и медленной сети 4G.
      В архивных отчётах полевых данных не было.
    bullets:
      - PageSpeed вырос с 72 до 96, а основной контент появился на 4,1 с раньше
        (LCP с 6,8 до 2,7 с).
      - Первый видимый контент (FCP) появился через 0,9 с вместо 2,0 с.
      - Не все показатели улучшились. В этом сравнении TBT изменился с 20 до 30 мс,
        а CLS — с 0 до 0,001.
    links:
      - label: Сохранённая выписка из обоих замеров (JSON)
        url: /media/projects/arenda-pm-home-performance/mobile-lab-measurements.json
      - label: Оригинальный отчёт PageSpeed до дополнительного этапа
        url: https://pagespeed.web.dev/analysis/https-arenda-pm-ru/jrg48f7v4c?form_factor=mobile
      - label: Оригинальный отчёт PageSpeed после оптимизации
        url: https://pagespeed.web.dev/analysis/https-arenda-pm-ru/l3ptntuhx8?form_factor=mobile
  - type: text
    title: Как проверил, что ускорение не сломало главную
    body: На 390 и 767 px мобильный баннер отображался, а десктопной карусели не было даже в DOM.
      На 768 и 1440 px проверил обратное состояние. На этих ширинах не обнаружил горизонтального
      переполнения и битых видимых изображений. Отдельно проверил мобильное меню, подбор категории
      и смену десктопных слайдов. Форма ответила ошибкой обязательного поля; реальную заявку
      не отправлял. Повторный обход 82 URL не обнаружил ошибок canonical, метаданных и внутренних ссылок.
