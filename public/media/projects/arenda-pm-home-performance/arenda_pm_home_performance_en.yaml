  - type: text
    title: Another stage of this project
    links:
      - label: "Related stage: technical SEO for the catalog"
        url: /showcase/arenda-pm-catalog-indexability/en/
  - type: text
    title: How to read the measurements
    body: PageSpeed is a lab result from specific runs, not a promise of identical speed for
      every visitor. The previous complete run after the main changes scored 89; a
      separate run with a UIS timeout was not used as evidence of a consistently green
      score. For another site, first record the URL, device and test conditions, then
      verify functionality after optimization.
