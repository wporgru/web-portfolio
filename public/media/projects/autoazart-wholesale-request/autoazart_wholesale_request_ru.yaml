title: "Autoazart: вместо корзины — оптовая заявка и переход"
tagline: "На тестовой копии магазина заменить обычную покупку двумя понятными
  действиями: запросом оптовых условий и переходом на основной сайт."
role: Веб-разработка
year: "02.2018"
stack:
  - WooCommerce
  - B2B enquiries
  - Website UI
blocks:
  - type: text
    title: Задача
    body: "На тестовой копии магазина заменить обычную покупку двумя понятными
      действиями: запросом оптовых условий и переходом на основной сайт."
  - type: text
    title: Что сделано
    body: Настроил кнопки в каталоге и карточке, направил оптовый запрос в форму и
      скрыл корзину в шапке; заказчик принял этап.
  - type: text
    title: Как решалась задача
    body: "На временной копии настроил открытие сайта и заменил действие в списке на
      переход «Подробнее» к карточке. В карточке убрал корзинную покупку и
      добавил отдельные действия: оптовый запрос через форму и переход на
      основной адрес для покупки. После уточнения заказчика скрыл корзину шапки
      и скруглил кнопки. Клиент подтвердил результат и принял работу. Реальная
      доставка письма и все состояния кнопок отдельно не проверены; основной
      сайт был адресом перехода, а не подтверждённым объектом разработки этого
      этапа."
