title: "Inegol Home: магазин и импорт мебельного каталога"
tagline: Собрал мебельную витрину на WoodMart и перенёс ассортимент поставщика.
  Одной из главных задач было отделить реальные товары от повторов в разных
  разделах источника.
year: "07.2023"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - WoodMart
  - Catalog migration
blocks:
  - type: text
    title: Задача и ограничения
    body: Собрал мебельную витрину на WoodMart и перенёс ассортимент поставщика.
      Одной из главных задач было отделить реальные товары от повторов в разных
      разделах источника.
  - type: text
    title: Как устроено решение
    body: Собрал ссылки, названия, фотографии и разделы. Сверил повторяющиеся
      карточки, поскольку одна модель открывалась по нескольким адресам.
      Подготовил таблицу, импортировал товары и показал витрину. По замечаниям
      убрал ненужные подписи и платёжные значки и показал управление магазином
      через админку.
  - type: text
    title: Результат и проверка
    body: Клиент принял магазин. По отчёту первоначальные 2 003 ссылки дали 673
      товара после уточнения повторов. Это исторические числа из сдачи, не
      проверка сегодняшней базы. Русский перевод названий оставался за клиентом.
  - type: image
    src: /media/projects/inegolhome-furniture-store/historical-storefront.webp
    alt: Мебельные карточки и баннеры Inegol Home
    caption: Фрагмент исторической витрины из портфолио Kwork, сохранён без
      редактирования.
