title: Inegol Home furniture store and catalog import
tagline: Built a WoodMart furniture storefront and imported the supplier’s
  assortment. A key challenge was separating distinct products from repeated
  listings across source categories.
year: "07.2023"
role: Web development and automation
stack:
  - WordPress
