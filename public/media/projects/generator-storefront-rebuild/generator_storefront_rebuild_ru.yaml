title: Восстановление витрины генераторов и карточек товаров
tagline: Магазину требовалось вернуть страницу каталога и привести интерфейс в
  состояние, пригодное для выбора оборудования. Пустые категории и позиции без
  изображений мешали навигации по ассортименту.
year: "04.2026"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Catalog filters
  - Storefront design
blocks:
  - type: text
    title: Задача и ограничения
    body: Магазину требовалось вернуть страницу каталога и привести интерфейс в
      состояние, пригодное для выбора оборудования. Пустые категории и позиции
      без изображений мешали навигации по ассортименту.
  - type: text
    title: Как устроено решение
    body: Восстановил страницу магазина, убрал лишние пустые категории и скрыл
      запчасти без подготовленных изображений. Исправил вывод фотографий,
      добавил боковую колонку и фильтры, доработал шапку, меню и шрифт. Оформил
      шаблон карточки и палитру, настроил закреплённую кнопку покупки, чтобы она
      оставалась доступной при прокрутке.
  - type: text
    title: Результат и проверка
    body: Клиент принял работу. Расхождения модели и характеристик разобрали
      отдельно как ограничение исходных данных. Закрытие индексации на время
      работ не выдаётся за подтверждённый публичный запуск.
