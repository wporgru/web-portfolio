title: "Airmania: восстановление обновления товарного фида"
tagline: Ранее настроенная выгрузка перестала обновляться. Нужно было получить
  свежий файл и оставить владельцу магазина понятный способ повторить запуск, не
  пересоздавая каталог.
year: "02.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - YML
  - Feed regeneration
  - Scheduled exports
blocks:
  - type: text
    title: Задача и ограничения
    body: Ранее настроенная выгрузка перестала обновляться. Нужно было получить
      свежий файл и оставить владельцу магазина понятный способ повторить
      запуск, не пересоздавая каталог.
  - type: text
    title: Как устроено решение
    body: Вручную пересоздал фид и описал, как пересохранить почасовое расписание и
      проверить результат после генерации. Отметил 13 расширений, требовавших
      обновления, включая WooCommerce и генератор фида. Их состояние
      рассматривал как возможную причину, но обновление не приписываю этому
      этапу.
  - type: text
    title: Результат и проверка
    body: Клиент принял обновлённую выгрузку и инструкцию. Это подтверждает ручное
      восстановление, но не первопричину сбоя и не серию успешных автоматических
      запусков.
  - type: text
    title: Другой этап этого проекта
    links:
      - label: "Предыдущий этап: отбор товаров и передача модели в фиде"
        url: /showcase/airmania-selective-product-feed/
