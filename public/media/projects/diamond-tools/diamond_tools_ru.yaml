title: "Магазин алмазного инструмента: коммерческие доработки"
tagline: Внедрить доступные рекомендации аудита и понятнее представить
  покупателям производителя.
role: Веб-разработка
year: "07.2026"
stack:
  - WordPress
  - WooCommerce
  - SEO
blocks:
  - type: text
    title: Задача
    body: Внедрить доступные рекомендации аудита и понятнее представить покупателям
      производителя.
  - type: text
    title: Что сделано
    body: Уточнил сведения о производителе, переработал формулировку первого экрана
      и зафиксировал внедрённые и отложенные пункты аудита в отчёте.
  - type: text
    title: Как решалась задача
    body: В первую очередь требовалось объяснить, что продаёт компания и почему её
      стоит выбрать. Для правок нужны были реальные данные о производстве,
      контактах и продукции, поэтому сначала запросил материалы у клиента и
      согласовал формулировку первого экрана. В отчёте разделил реализованные
      рекомендации и пункты, на которые не хватало сведений. Рост трафика или
      конверсии по этой сдаче не измерялся.
  - type: image
    title: Публичный вид сайта
    src: /media/projects/diamond-tools/site.png
    alt: Публичная версия сайта проекта
    caption: Снимок на дату проверки. Он показывает публичную версию сайта, а не
      обязательно вид на момент сдачи.
