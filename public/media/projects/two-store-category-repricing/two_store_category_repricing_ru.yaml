title: Переоценка выбранных категорий двух магазинов
tagline: Клиенту требовалось изменить цены только у выбранных групп на двух
  действующих витринах. Нельзя было применять изменение ко всему ассортименту.
year: "02.2024"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Bulk pricing
  - Catalog operations
blocks:
  - type: text
    title: Задача и ограничения
    body: Клиенту требовалось изменить цены только у выбранных групп на двух
      действующих витринах. Нельзя было применять изменение ко всему
      ассортименту.
  - type: text
    title: Как устроено решение
    body: Уточнил направление изменения и границы выборки. Рекомендовал сделать
      копию, если у хостинга нет ежедневного бэкапа. Выполнил переоценку по
      каждому магазину отдельно и передал результаты на проверку двумя
      сообщениями.
  - type: text
    title: Результат и проверка
    body: Клиент принял работу. Количество карточек, округление и сводная ведомость
      до и после не зафиксированы; запуск самих магазинов не входил в задачу.
