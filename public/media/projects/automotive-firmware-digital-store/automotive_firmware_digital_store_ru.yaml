title: Магазин автомобильных прошивок с ЮKassa
tagline: "Собрал витрину цифровых прошивок: каталог, оплата и получение файла
  после покупки. Владелец должен был самостоятельно привязывать собственные
  файлы к остальным товарам."
year: "07.2022"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - YooKassa
  - Digital downloads
  - Catalog import
blocks:
  - type: text
    title: Задача и ограничения
    body: "Собрал витрину цифровых прошивок: каталог, оплата и получение файла после
      покупки. Владелец должен был самостоятельно привязывать собственные файлы
      к остальным товарам."
  - type: text
    title: Как устроено решение
    body: Импортировал ассортимент с основными категориями, сохранил цены по
      согласованию и оформил служебные страницы. Для примера прикрепил файл
      прошивки, показал письмо со скачиванием и записал инструкцию. После
      подключения ЮKassa описал контрольную оплату в отчёте и доработал
      изображения подкатегорий марок.
  - type: text
    title: Результат и проверка
    body: Клиент проверил и принял заказ. Подтверждён исторический платёжный тест и
      показ примера скачивания, но не наличие рабочих файлов у каждой карточки.
