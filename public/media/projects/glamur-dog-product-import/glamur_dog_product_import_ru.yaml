title: "Glamur Dog: массовая загрузка товаров с изображениями"
tagline: Загрузить товарный каталог WooCommerce, чтобы редакторы могли
  продолжить работу с карточками.
role: Веб-разработка
year: "07.2018"
stack:
  - WooCommerce
  - Product import
  - Images
blocks:
  - type: text
    title: Задача
    body: Загрузить товарный каталог WooCommerce, чтобы редакторы могли продолжить
      работу с карточками.
  - type: text
    title: Что сделано
    body: Выполнил и повторял загрузку товаров и изображений, устранял замечания по
      неполным данным; заказчик принял работу.
  - type: text
    title: Как решалась задача
    body: Большой объём изображений с переименованием замедлял обработку. В
      промежуточном журнале фигурировали 14 986 записей, но это не проверенное
      количество успешно загруженных товаров. Когда возникли ограничения
      ресурсов, заказчик увеличил лимиты и место на диске. После замечаний по
      фотографиям и артикулам продолжил обработку и предложил повторную
      проверку. Клиент принял этап и положительно оценил сроки и учёт пожеланий.
      Финального количественного отчёта нет, поэтому полноту фотографий и
      артикулов не заявляю.
