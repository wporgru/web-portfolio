title: Восстановление сохранения правок в редакторе WordPress
tagline: Нужно было вернуть возможность сохранять правки. Для клиента было важно
  отличить ошибку редактора от ситуации, когда изменения уже сохранены, но
  публичная страница показывает старую версию из кэша.
year: "04.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WP Rocket
  - Visual editor
blocks:
  - type: text
    title: Задача и ограничения
    body: Нужно было вернуть возможность сохранять правки. Для клиента было важно
      отличить ошибку редактора от ситуации, когда изменения уже сохранены, но
      публичная страница показывает старую версию из кэша.
  - type: text
    title: Как устроено решение
    body: "После восстановления рабочего доступа проверил сохранение в редакторе и
      предложил очистить кэш WP Rocket для проверки публичного результата.
      Передал два снимка: редактируемую карту со слоями и итоговый вид карты с
      дорогами и парковкой. Попросил клиента отдельно проверить блог и остальные
      разделы."
  - type: text
    title: Результат и проверка
    body: Клиент принял работу. Сохранение правок проверено по отчёту, а материалы
      показывают конкретный сценарий с картой. Полного аудита страниц и
      безопасности этот кейс не заявляет.
