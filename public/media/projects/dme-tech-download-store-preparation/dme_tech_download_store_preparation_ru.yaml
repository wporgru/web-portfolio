title: "DME Tech: подготовка магазина цифровых файлов"
tagline: Подготовить существующий магазин файлов к подключению онлайн-оплаты. На
  первом этапе нужно было привести страницы к HTTPS, улучшить навигацию и
  собрать оформляемый заказ. Онлайн-кассу и реальную выдачу файла отложили на
  следующий этап.
year: "08.2020"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - HTTPS
  - Checkout
  - Digital downloads
blocks:
  - type: text
    title: Задача и ограничения
    body: Подготовить существующий магазин файлов к подключению онлайн-оплаты. На
      первом этапе нужно было привести страницы к HTTPS, улучшить навигацию и
      собрать оформляемый заказ. Онлайн-кассу и реальную выдачу файла отложили
      на следующий этап.
  - type: text
    title: Как устроено решение
    body: Исправил смешанные HTTP-ресурсы после настройки SSL, отдельно проверил
      раздел оригинальных файлов и убрал лишний отступ на странице файлового
      сервиса. Доработал контакты, новости и поиск. Настроил корзину и форму
      оформления с прямым переводом; для первичной проверки добавил пустые
      тестовые файлы.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил правку страницы файлового сервиса и принял первый этап.
      Это готовность интерфейса к дальнейшей настройке, а не доказательство
      боевого платежа, успешной модерации или защищённой выдачи файлов.
