title: Шаблон импорта вариаций WooCommerce по SKU
tagline: В файле не хватало связей между родительскими товарами и вариациями.
  Повторные загрузки также осложнялись дублями и неоднородными значениями
  размеров.
year: "10.2025"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - WP All Import
  - SKU
blocks:
  - type: text
    title: Задача и ограничения
    body: В файле не хватало связей между родительскими товарами и вариациями.
      Повторные загрузки также осложнялись дублями и неоднородными значениями
      размеров.
  - type: text
    title: Как устроено решение
    body: Провёл пробную загрузку, разобрал отсутствующие артикулы вариаций и
      родительские SKU, передал пример структуры файла и сохранил шаблон WP All
      Import. Объяснил разницу между входным идентификатором, по которому
      обновляются цены и остатки, и внутренним ID WordPress. На одной карточке
      проверил влияние пересохранения на фильтр.
  - type: text
    title: Результат и проверка
    body: "Клиент получил повторяемый шаблон и инструкцию. Одна попытка остановилась
      на 99%, а вывод одного цвета оставался вопросом: кейс не обещает импорт
      всей базы или ремонт всех фильтров."
