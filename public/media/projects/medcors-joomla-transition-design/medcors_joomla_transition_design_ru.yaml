title: "Medcors: оформление WordPress-версии сайта"
tagline: Подготовил оформление установленного WordPress для проекта, который
  планировал перейти с Joomla. Новую версию собирали отдельно от основного
  сайта.
year: "12.2022"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Astra
  - Elementor
  - CMS migration preparation
blocks:
  - type: text
    title: Задача и ограничения
    body: Подготовил оформление установленного WordPress для проекта, который
      планировал перейти с Joomla. Новую версию собирали отдельно от основного
      сайта.
  - type: text
    title: Как устроено решение
    body: На Astra и Elementor оформил главную, шапку, подвал и структуру раздела.
      По обратной связи сохранил изображение скорой на главной, а для внутренних
      страниц согласовал другой фон. Доработал нижний блок и состояния наведения
      в шапке.
  - type: text
    title: Результат и проверка
    body: Клиент принял оформление. Полная миграция Joomla, SEO-семантика и
      публикация WordPress в корне домена не подтверждены.
