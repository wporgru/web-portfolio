title: "Medcors: оформление WordPress-версии сайта"
tagline: Подготовил оформление установленного WordPress для проекта, который
  планировал перейти с Joomla. Новую версию собирали отдельно от основного
  сайта.
year: "12.2022"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Astra
  - Elementor
  - CMS migration preparation
blocks:
  - type: text
    title: Задача и ограничения
    body: "Компания готовилась перейти с Joomla на WordPress, но на время работ основной сайт оставался отдельно. Заказчик попросил оформить уже установленную версию WordPress в каталоге medcors.ru/wp/: задать структуру раздела, обновить главную, шапку и подвал и согласовывать визуальные детали по обратной связи. Задача касалась подготовительной версии, а не полной миграции сайта."
  - type: text
    title: Как устроено решение
    body: "Оформил установленный WordPress на Astra и Elementor: структуру раздела, главную, шапку и подвал. По визуальному запросу клиента оставил изображение машины скорой помощи на главной, а для внутренних страниц использовал согласованный фон с голубыми облаками. Затем по комментариям уточнил нижний синий блок и цвет наведения в шапке — оранжевый акцент. perevozkibolnyh.ru был примером, который показал заказчик, а не сайтом, разработанным в этом проекте."
  - type: text
    title: Результат и проверка
    body: Клиент принял обновлённое оформление и оставил положительный отзыв о том, что дальнейший результат будет зависеть от чёткости пожеланий. Подтверждённая работа — дизайн и настройка WordPress-раздела /wp/ с несколькими итерациями по главной, внутреннему фону, нижнему блоку и состояниям шапки. Перенос всего содержимого с Joomla, разработка SEO-семантики и публикация WordPress в корень домена этим заказом не подтверждены.
