title: Medcors website design ahead of a CMS migration
tagline: Prepared the design for an existing WordPress installation ahead of a
  planned move from Joomla. The new version was built separately from the main
  site.
year: "12.2022"
role: Web development and automation
stack:
  - WordPress
  - Astra
  - Elementor
  - CMS migration preparation
blocks:
  - type: text
    title: Brief and constraints
    body: "The company was preparing to move from Joomla to WordPress, while the existing main site remained separate during the work. The client asked to design the already-installed WordPress version under medcors.ru/wp/: structure the section, refine the homepage, header and footer, and iterate on visual details. This was a preparation environment, not the complete site migration."
  - type: text
    title: How it works
    body: "Designed the WordPress section with Astra and Elementor: information structure, homepage, header and footer. Following the client’s visual direction, retained the ambulance image on the homepage and used the agreed blue-cloud background on internal pages. Then refined the lower blue block and the orange hover accent in the header based on feedback. perevozkibolnyh.ru was a client-supplied reference, not a site built as part of this project."
  - type: text
    title: Result and verification
    body: The client accepted the updated design and left a positive review noting that the final result depended on clearly specified preferences. The evidenced work is the WordPress /wp/ section design and setup, with iterations on the homepage, internal-page background, lower block and header states. A full content migration from Joomla, SEO keyword research and publication of WordPress at the domain root are not established by this order.
