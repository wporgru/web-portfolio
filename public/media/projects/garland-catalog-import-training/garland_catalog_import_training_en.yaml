blocks:
  - type: text
    title: Brief and constraints
    body: Fixed a garland spreadsheet import, prepared the assortment for upload and
      showed the owner how to update the catalog without rebuilding it manually.
  - type: text
    title: How it works
    body: Fixed encoding and spreadsheet structure, including UTF-8, column headers
      and category paths. Excluded fir and pine products from the expanded
      assortment by agreement. Configured the catalog and metadata, delivered
      the working sheet and instructions, and demonstrated color options on
      sample items.
  - type: text
    title: Result and verification
    body: The client accepted the work. The historical screenshot shows color
      selection but does not verify all variants or stock levels.
