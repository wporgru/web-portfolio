title: Импорт гирлянд и настройка выбора цвета
tagline: Восстановил импорт таблицы с гирляндами, подготовил ассортимент к
  загрузке и показал владельцу, как обновлять каталог без повторной ручной
  сборки.
year: "10.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - CSV
  - UTF-8
  - Product variations
blocks:
  - type: text
    title: Задача и ограничения
    body: Восстановил импорт таблицы с гирляндами, подготовил ассортимент к загрузке
      и показал владельцу, как обновлять каталог без повторной ручной сборки.
  - type: text
    title: Как устроено решение
    body: "Исправил кодировку и структуру таблицы: UTF-8, заголовки столбцов и
      иерархия категорий. При расширении ассортимента исключил ели и сосны по
      согласованию с клиентом. Настроил каталог и метаданные, передал рабочую
      таблицу и инструкцию. По замечаниям настроил варианты цвета и показал
      примеры товаров."
  - type: text
    title: Результат и проверка
    body: Клиент принял работу. Исторический снимок показывает выбор цвета, но не
      подтверждает тест всех вариантов и остатков.
  - type: image
    src: /media/projects/garland-catalog-import-training/historical-variants.webp
    alt: Выбор цвета в карточке гирлянды
    caption: "Исторический фрагмент из портфолио Kwork: виден выбор цвета. Это не
      тест корзины."
