title: Расчёт СДЭК и адресные подсказки в чекауте
tagline: Для расчёта доставки нужны параметры посылки, но вес и габариты были
  заполнены не у всех товаров. Также нужно было сохранить удобный ввод адреса.
year: "04.2026"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - CDEK
  - Address autocomplete
  - Shipping
blocks:
  - type: text
    title: Задача и ограничения
    body: Для расчёта доставки нужны параметры посылки, но вес и габариты были
      заполнены не у всех товаров. Также нужно было сохранить удобный ввод
      адреса.
  - type: text
    title: Как устроено решение
    body: Настроил использование данных товара при их наличии и согласованных
      временных параметров при пропусках. Отдельно проверил адресные подсказки
      после возврата прежней структуры полей. Разобрал подключение Яндекс
      Доставки с поддержкой, но для неподтверждённого автоматического расчёта
      согласовал временный вариант по тарифам.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил подстановку индекса, но отметил, что список подсказок
      быстро скрывался на мобильном. Автоматический расчёт Яндекс Доставки и
      заполнение реальных габаритов всех товаров этим этапом не подтверждены.
