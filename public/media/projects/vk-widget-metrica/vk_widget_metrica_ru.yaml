title: Подключение ВКонтакте и очистка дублей Метрики
tagline: Нужно было показать сообщество ВКонтакте на сайте и обновить ссылку в
  подвале. При проверке обнаружились несколько способов подключения Метрики,
  которые нужно было разделить и согласовать с заказчиком.
year: "09.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - VK
  - Yandex Metrica
blocks:
  - type: text
    title: Задача и ограничения
    body: Нужно было показать сообщество ВКонтакте на сайте и обновить ссылку в
      подвале. При проверке обнаружились несколько способов подключения Метрики,
      которые нужно было разделить и согласовать с заказчиком.
  - type: text
    title: Как устроено решение
    body: Разделил подключение виджета на код в шапке и блок вывода. Уточнил
      окончательный адрес сообщества и заменил ссылку. Нашёл подключения
      счётчика через плагины и код в шапке, согласовал правильный счётчик и
      убрал лишнее подключение.
  - type: text
    title: Результат и проверка
    body: Заказчик проверил результат и принял заказ. Верификация сообщества и
      полнота последующего сбора статистики не входят в подтверждённый
      результат.
