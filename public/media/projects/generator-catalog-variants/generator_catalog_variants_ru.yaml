title: Каталог генераторов из нескольких выгрузок поставщиков
tagline: У разных поставщиков похожие генераторы отличались наличием АВР и
  исполнением корпуса. Требовалось перенести ассортимент так, чтобы покупатель
  мог различить эти варианты, а не выбирать среди почти одинаковых карточек.
year: "03.2026"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Data import
  - Product variants
blocks:
  - type: text
    title: Задача и ограничения
    body: У разных поставщиков похожие генераторы отличались наличием АВР и
      исполнением корпуса. Требовалось перенести ассортимент так, чтобы
      покупатель мог различить эти варианты, а не выбирать среди почти
      одинаковых карточек.
  - type: text
    title: Как устроено решение
    body: Настроил последовательные импорты и согласовал с клиентом вариативные
      карточки. Развёл варианты по корпусу и автоматике, адаптировал оформление
      под палитру клиента и повторил ошибочный промежуточный импорт, прежде чем
      сдавать каталог.
  - type: text
    title: Результат и проверка
    body: В итоговом отчёте — 1 545 опубликованных товаров и 70 черновиков без
      исходных изображений. Клиент принял работу. Это результат импорта на
      момент сдачи, а не текущий пересчёт товаров и вариаций.
