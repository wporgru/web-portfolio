blocks:
  - type: text
    title: Brief
    body: Enable online payment for services without listing internal products in
      the public catalog.
  - type: text
    title: Work delivered
    body: Configured checkout and hidden service products, aligned pricing and
      removed a no-prepayment notice that conflicted with the new payment flow.
  - type: text
    title: Implementation and scope
    body: Service records were not meant to look like ordinary store products. I
      checked the relationship between each service page and its hidden product,
      aligned pricing in both places and explained future updates. The handoff
      reported a flow test. The site screenshot does not prove payment or the
      current gateway configuration.
