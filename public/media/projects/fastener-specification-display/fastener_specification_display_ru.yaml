title: Восстановление характеристик крепежа в WooCommerce
tagline: Характеристики уже были в административной части магазина, но
  покупатели не видели их в блоке зарубежных стандартов. Задача — восстановить
  вывод, не приписывая себе исходный импорт.
year: "06.2024"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - ACF
  - WP All Import
  - Product attributes
blocks:
  - type: text
    title: Задача и ограничения
    body: Характеристики уже были в административной части магазина, но покупатели
      не видели их в блоке зарубежных стандартов. Задача — восстановить вывод,
      не приписывая себе исходный импорт.
  - type: text
    title: Как устроено решение
    body: Разобрал разницу между стандартными атрибутами WooCommerce и
      демонстрационными полями ACF, которые читает шаблон. Вместо тестовой
      карточки сверил проблему на реальном примере болта. Определил, какое
      расширение импорта нужно для заполнения кастомных полей, и согласовал
      настройку с клиентом.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил нужный вид характеристик и заказал следующий этап —
      товарные фильтры. Полная схема переимпорта и независимый пересчёт карточек
      в архиве не сохранились.
  - type: text
    title: Другой этап этого проекта
    links:
      - label: "Следующий этап: фильтры каталога по характеристикам"
        url: /showcase/fastener-catalog-attribute-filters/
