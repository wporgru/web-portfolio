title: "Digital Nomad: локализация английского мегаменю"
tagline: "В английском меню вместо коротких названий стран появлялись длинные
  заголовки страниц. Запрет переноса строк усиливал проблему: пункты
  накладывались на соседние колонки, а часть навигации было трудно прочитать."
year: "10.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - PHP
  - CSS
  - Multilingual navigation
  - Playwright
blocks:
  - type: text
    title: Задача и ограничения
    body: "В английском меню вместо коротких названий стран появлялись длинные
      заголовки страниц. Запрет переноса строк усиливал проблему: пункты
      накладывались на соседние колонки, а часть навигации было трудно
      прочитать."
  - type: text
    title: Как устроено решение
    body: Разделил короткую метку навигации и полный заголовок страницы. Для стран
      использовал поле связанной страницы и перевод названия, для специальных
      программ задал отдельные подписи. Применил одну логику к десктопному
      мегаменю и мобильной панели. Разрешил перенос строк, ограничил меню
      шириной окна и выделил больше места колонке с длинными названиями
      программ.
  - type: text
    title: Результат и проверка
    body: На стенде проверил открытие русского и английского меню на ширинах 1280,
      1440, 1920 и 3392 px. Колонки не перекрывались, горизонтальной прокрутки
      не было. Это проверка меню, а не полный аудит переводов или доступности
      сайта.
  - type: image
    src: /media/projects/nomad-english-megamenu-localization/archive-menu.webp
    alt: Английское меню Digital Nomad с пятью колонками
    caption: Снимок раскрытого меню из отчёта проверки. Это фрагмент шапки, не
      снимок всей страницы.
