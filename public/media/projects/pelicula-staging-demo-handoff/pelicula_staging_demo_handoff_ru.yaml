title: Развёртывание Pelicula и передача архива сайта
tagline: Подготовил демонстрационную копию WordPress для передачи владельцу. На
  исходном хостинге импорт упирался в ограничения, поэтому работу продолжил на
  промежуточной площадке.
year: "12.2021"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Pelicula
  - Staging
  - Backup handoff
blocks:
  - type: text
    title: Задача и ограничения
    body: Подготовил демонстрационную копию WordPress для передачи владельцу. На
      исходном хостинге импорт упирался в ограничения, поэтому работу продолжил
      на промежуточной площадке.
  - type: text
    title: Как устроено решение
    body: Согласовал резервную копию, развернул Pelicula на промежуточной площадке и
      проверил, какие элементы появились после остановки импорта. Отдельно
      указал, что меню загрузилось, но часть главной осталась незаполненной.
      Передал архив развёрнутого сайта и дочернюю тему для дальнейшей работы.
  - type: text
    title: Результат и проверка
    body: Клиент принял комплект для самостоятельного переноса и очистки. Конечный
      запуск и полный импорт демо не подтверждены.
