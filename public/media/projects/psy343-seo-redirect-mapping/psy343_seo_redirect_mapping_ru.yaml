title: Карта редиректов для редизайна сайта психолога
tagline: При редизайне менялись устаревшие адреса с кириллицей, датами и
  префиксами. Требовалось сохранить переходы к полезным материалам, а
  демонстрационные URL удалить осознанно, а не перенаправлять весь накопившийся
  архив на главную.
year: "09.2026"
role: Веб-разработка и автоматизация
stack:
  - Python
  - WordPress
  - XML sitemaps
  - 301 redirects
  - Technical SEO
blocks:
  - type: text
    title: Задача и ограничения
    body: При редизайне менялись устаревшие адреса с кириллицей, датами и
      префиксами. Требовалось сохранить переходы к полезным материалам, а
      демонстрационные URL удалить осознанно, а не перенаправлять весь
      накопившийся архив на главную.
  - type: text
    title: Как устроено решение
    body: Собрал исходные пути из 12 карт сайта, сопоставил записи и новые slugs. В
      Python обработал обычные и URL-кодированные формы кириллицы и датированные
      адреса; правила для старых товаров и посадочных страниц сверил отдельно.
      Для перенесённых материалов подготовил прямые 301, а для удалённых
      демо-разделов выделил ответы 410. В проверке учитывал исходный статус и
      конечный адрес, а не только итоговый HTTP 200.
  - type: text
    title: Результат и проверка
    body: "Финальный отчёт стенда охватывает 126 исходных URL: в нём отмечено 78
      прямых перенаправлений и отдельно 12 ответов 410 для снятых демо-адресов.
      Битых контентных 404 отчёт не зафиксировал. Продакшен-перенос и изменение
      поисковых позиций не подтверждены."
  - type: text
    title: Другой этап этого проекта
    links:
      - label: "Связанный этап: редизайн на Gutenberg"
        url: /showcase/psy343-gutenberg-site-redesign/
