title: Сайт выкупа автомобилей с услугами и блогом
tagline: Собрал WordPress-сайт выкупа автомобилей с разделом услуг и блогом,
  который клиент мог редактировать самостоятельно.
year: "10.2023"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Service pages
  - Blogging
  - Documentation
blocks:
  - type: text
    title: Задача и ограничения
    body: Собрал WordPress-сайт выкупа автомобилей с разделом услуг и блогом,
      который клиент мог редактировать самостоятельно.
  - type: text
    title: Как устроено решение
    body: "Показал сайт на домене проекта, исправил некликабельные заголовки статей
      и привёл URL раздела услуг к согласованному виду. Передал две
      видеоинструкции: по редактированию шапки и подвала и по работе с
      содержимым."
  - type: text
    title: Результат и проверка
    body: Клиент принял сайт. Включение индексации и рабочие уведомления в
      мессенджерах оставались отдельными шагами запуска.
