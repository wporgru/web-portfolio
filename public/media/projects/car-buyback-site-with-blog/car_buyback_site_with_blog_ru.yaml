title: Сайт выкупа автомобилей с услугами и блогом
tagline: Собрал WordPress-сайт выкупа автомобилей с разделом услуг и блогом, который клиент
  мог редактировать самостоятельно.
year: '10.2023'
role: Веб-разработка и автоматизация
stack:
- WordPress
- Service pages
- Blogging
- Documentation
blocks:
- type: text
  title: Задача и ограничения
  body: Собрал WordPress-сайт выкупа автомобилей с разделом услуг и блогом, который клиент мог
    редактировать самостоятельно.
- type: text
  title: Как устроено решение
  body: 'Показал сайт на домене проекта, исправил некликабельные заголовки статей и привёл URL
    раздела услуг к согласованному виду. Передал две видеоинструкции: по редактированию шапки
    и подвала и по работе с содержимым.'
- type: text
  title: Результат и проверка
  body: Клиент принял сайт. Включение индексации и рабочие уведомления в мессенджерах оставались
    отдельными шагами запуска.
- type: text
  title: Контекст и структура сайта
  body: 'Задача состояла в создании сайта для выкупа автомобилей в одном городе: главная с формой
    оценки, раздел услуг, контакты и блог. По согласованию не требовались каталог продажи автомобилей,
    страхование и выбор города. Визуальным ориентиром служил сайт Keyauto без задачи точного
    копирования.'
- type: text
  title: Что увидит посетитель
  body: На сохранённом историческом снимке главной видны поля для сведений об автомобиле, блоки
    о процессе выкупа, карточки машин, статьи и переход в WhatsApp. Повторяющиеся карточки на
    снимке не подтверждают наличие реальной базы сделок или авторство публикаций.
- type: text
  title: Передача и дальнейший запуск
  body: Помимо исправления ссылок заголовков и структуры адреса услуг, передал две видеоинструкции,
    чтобы заказчик мог менять шапку, подвал и содержимое самостоятельно. Клиент принял работу.
    На момент передачи регистрация номера WhatsApp и настройка токена Telegram оставались за
    клиентом; доставку сообщений и последующую индексацию не подтверждаю.
- type: image
  src: /media/projects/car-buyback-site-with-blog/historical-homepage.webp
  title: Исторический вид главной
  alt: Исторический вид сайта выкупа автомобилей с формой оценки и блогом
  caption: Архивный снимок из портфолио Kwork за 2023 год, страница целиком. Панель WordPress
    видна сверху; снимок не подтверждает текущую доступность сайта и доставку заявок.
