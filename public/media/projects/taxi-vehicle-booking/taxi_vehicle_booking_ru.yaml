blocks:
  - type: text
    title: Задача и ограничения
    body: "Уточнил сценарий заявки на сайте трансфера: компания должна понимать,
      какой автомобиль выбрал посетитель. Параллельно исправил FAQ и добавил
      карту организации."
  - type: text
    title: Как устроено решение
    body: "Связал заявку с выбором автомобиля, чтобы менеджеру не приходилось
      уточнять его отдельно. Исправил конфликт двух блоков FAQ: действие в одном
      аккордеоне не должно раскрывать ответ в соседнем. Добавил Яндекс Карту с
      профилем организации, который указал заказчик."
  - type: text
    title: Результат и проверка
    body: Клиент принял этап. В архиве есть подтверждение по всем трём пунктам;
      отдельный тест доставки писем не сохранился. Карточки машин и мобильные
      отступы доводились следующим этапом.
  - type: text
    title: Другой этап этого проекта
    links:
      - label: "Следующий этап: карточки автомобилей и мобильная вёрстка"
        url: /showcase/taxi-mobile-car-cards/
