title: Форма выбора автомобиля для Silver Park Taxi
tagline: "Уточнил сценарий заявки на сайте трансфера: компания должна понимать,
  какой автомобиль выбрал посетитель. Параллельно исправил FAQ и добавил карту
  организации."
year: "02.2024"
role: Веб-разработка и автоматизация
stack:
  - WordPress
