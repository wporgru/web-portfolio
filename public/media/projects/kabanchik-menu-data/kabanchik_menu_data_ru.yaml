title: "«Кабанчик»: 212 позиций меню из DOCX и TXT"
tagline: Преобразовал разрозненные документы кухни и бара в одну ведомость,
  которую администратор ресторана может открыть в таблице, проверить и исправить
  без доступа к сайту.
year: "06.2026"
role: Веб-разработка и автоматизация
stack:
  - Python
  - DOCX
  - TXT
  - CSV
  - Data normalization
blocks:
  - type: text
    title: Задача и ограничения
    body: Преобразовал разрозненные документы кухни и бара в одну ведомость, которую
      администратор ресторана может открыть в таблице, проверить и исправить без
      доступа к сайту.
  - type: text
    title: Как устроено решение
    body: "Написал обработчик для DOCX и TXT. Разложил блюда и напитки по типу меню
      и разделам, вынес в отдельные поля названия, порции, цены и описания.
      Сохранил ссылку на исходный документ в каждой записи и отметил спорные
      места в комментариях. Для русскоязычного Excel использовал CSV с точкой с
      запятой и UTF-8 BOM. Не включал служебные поля WooCommerce: это ведомость
      для согласования, а не готовый пакет публикации."
  - type: text
    title: Результат и проверка
    body: "Проверка итогового CSV: 212 записей, из них 147 блюд и 65 позиций бара;
      22 раздела с учётом типа меню. Семь строк содержат комментарии. Эти числа
      относятся к ведомости, а не к товарам, опубликованным на сайте."
