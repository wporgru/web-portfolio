title: Оптимизация магазина купелей и гостевого чекаута
tagline: "После этапа мобильной вёрстки клиент вернулся с отдельной задачей:
  проверить скорость и убрать лишнюю регистрацию на пути к заказу, в том числе с
  телефона."
year: "11.2024"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - PageSpeed
  - Checkout
blocks:
  - type: text
    title: Задача и ограничения
    body: "После этапа мобильной вёрстки клиент вернулся с отдельной задачей:
      проверить скорость и убрать лишнюю регистрацию на пути к заказу, в том
      числе с телефона."
  - type: text
    title: Как устроено решение
    body: Передал результаты проверки PageSpeed и скриншоты. Когда клиент увидел
      регистрацию на телефоне, разделил авторизованный и гостевой сценарии и
      сообщил об отключении регистрации. Требования к отдельным подписям и
      ссылкам корзины были вынесены в документ, но он не заменяет проверку
      каждого пункта.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил улучшения и принял этап. Финальный балл PageSpeed и
      полная матрица гостевых сценариев не восстановлены; проценты ускорения не
      заявляются.
