title: Osama Market storefront launch and catalog import
tagline: Built a WordPress store and prepared the catalog for launch. The client
  changed the storefront design and supplied a product export during the
  project.
year: "08.2022"
role: Web development and automation
stack:
  - WordPress
  - WooCommerce
  - WoodMart
