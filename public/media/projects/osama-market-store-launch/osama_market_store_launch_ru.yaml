title: "Osama Market: запуск витрины и импорт каталога"
tagline: Собрал магазин на WordPress и подготовил каталог к запуску. В ходе
  работы клиент сменил оформление и предоставил собственную товарную выгрузку.
year: "08.2022"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - WoodMart
  - CSV
blocks:
  - type: text
    title: Задача и ограничения
    body: Собрал магазин на WordPress и подготовил каталог к запуску. В ходе работы
      клиент сменил оформление и предоставил собственную товарную выгрузку.
  - type: text
    title: Как устроено решение
    body: Перешёл на согласованное демо Electronics, отказался от пробного источника
      с ограниченным ассортиментом и загрузил клиентский CSV. Установил логотип,
      убрал лишнюю верхнюю панель и передал ссылку на магазин и управление им.
  - type: text
    title: Результат и проверка
    body: Клиент принял витрину. Пробная выборка не выдана за итоговое число
      товаров, а каждое поле каталога не пересчитывалось отдельно.
