title: Шаблонная витрина автозапчастей Volvoparts
tagline: Подготовил основу витрины запчастей на WoodMart Motorcycle.
  Демонстрационный каталог позволял согласовать структуру магазина до загрузки
  реального ассортимента.
year: "07.2022"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - WoodMart
  - Hosting
blocks:
  - type: text
    title: Задача и ограничения
    body: Подготовил основу витрины запчастей на WoodMart Motorcycle.
      Демонстрационный каталог позволял согласовать структуру магазина до
      загрузки реального ассортимента.
  - type: text
    title: Как устроено решение
    body: После перехода на HTTPS дождался исправления DNS поддержкой хостинга и
      убедился, что сайт снова открывается. Установил тему и демо с товарами,
      изображениями и блоками. При передаче пояснил отличие перевода настроек
      темы от перевода демонстрационных страниц.
  - type: text
    title: Результат и проверка
    body: Клиент принял стартовый этап. Демо-товары не были реальным ассортиментом,
      а установка темы не включала готовый магазин с оплатой и доставкой.
