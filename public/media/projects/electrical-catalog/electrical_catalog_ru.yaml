title: Парсинг электротехники и перестройка каталога
tagline: Перенести товары поставщика с неоднородными характеристиками и
  артикулами, а затем организовать их по коммерческим разделам магазина.
year: "02.2026"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Web scraping
  - Data import
blocks:
  - type: text
    title: Задача и ограничения
    body: Перенести товары поставщика с неоднородными характеристиками и артикулами,
      а затем организовать их по коммерческим разделам магазина.
  - type: text
    title: Как устроено решение
    body: Передал выгрузку, согласовал правила SKU и продолжил импорт после
      серверных ошибок. Распределил категории по 11 основным разделам, настроил
      подбор изображения категории и исправил замечание по мобильному поведению.
  - type: text
    title: Результат и проверка
    body: В отчёте указано 768 категорий, а клиент отдельно подтвердил мобильную
      правку. Технический статус наличия не выдавался за живые остатки 1С.
