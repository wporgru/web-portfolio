title: Парсинг электротехники и перестройка каталога
tagline: Перенести товары поставщика с неоднородными характеристиками и артикулами, а затем организовать
  их по коммерческим разделам магазина.
year: '02.2026'
role: Веб-разработка и автоматизация
stack:
- WooCommerce
- Web scraping
- Data import
blocks:
- type: text
  title: Поставщик, ассортимент и структура
  body: Нужно было продолжить парсинг и импорт электротехнического каталога с неоднородными характеристиками
    и артикулами поставщика, затем распределить категории по согласованной коммерческой структуре
    магазина. Будущую связь с 1С требовалось учитывать при работе с артикулами.
- type: text
  title: Данные и повторные запуски
  body: Передал результат парсинга и согласовал временную генерацию SKU на сайте с последующей
    ручной заменой артикулами клиента для связи с 1С. Из-за серверных ошибок импорт продолжался
    несколько дней; после сообщения о завершении товарной загрузки работа с атрибутами и категориями
    продолжилась.
- type: text
  title: Категории и витрина
  body: Распределил категории по 11 основным разделам, заданным клиентом; в историческом отчёте
    указано 768 категорий. Настроил выбор изображения первого товара для категории. По согласованию
    второстепенные категории временно перенёс в «Прочее оборудование», а после замечания исправил
    мобильное поведение, которое клиент отдельно подтвердил.
- type: text
  title: Что принято и что осталось отдельно
  body: Клиент принял заказ. Технический статус наличия был временным решением до фактической
    привязки к 1С и не подтверждает реальные складские остатки. Полная связка товаров с 1С, число
    опубликованных товаров и обработка всех изображений не доказаны этим этапом; 768 — показатель
    из отчёта, не новый пересчёт.
