title: "X-ONE: обновление каталога аксессуаров и вариаций"
tagline: "Обновил товарные данные магазина аксессуаров: новые позиции, существующие
  атрибуты и изображения нужно было обработать без потери уже заполненных фотографий."
year: "04.2020"
role: Веб-разработка и работа с товарными данными
stack:
  - WooCommerce
  - Product import
  - Product variations
  - Images
blocks:
  - type: text
    title: Задача магазина
    body: В действующем WooCommerce-каталоге требовалось добавить новые аксессуары, поправить
      существующие товары и атрибуты, а затем заменить часть изображений материалами
      заказчика. В исходном объёме обсуждались 49 новых позиций; дополнительные работы
      согласовали отдельно.
  - type: text
    title: Подготовка данных и импорт
    body: Передал экспорт для заполнения и объяснил, как обновлять существующие поля, не
      перезаписывая фотографии. После проверки пробной позиции продолжил импорт. В отчёте
      по этапу указаны изменения 114 существующих записей; эти цифры относятся к
      исторической переписке, а не к новому пересчёту базы.
  - type: text
    title: Модели и варианты
    body: Восстановил вариативную карточку DropGuard PRO для Huawei P30 Pro с двумя цветами и
      суффиксами. Исправлял принадлежность моделей iPhone, Samsung и Meizu, значения
      атрибутов и отмеченный дубль; убрал лишнюю привязку Huawei у Honor и заменил
      конфликтное обозначение «+» на Plus там, где это требовалось для данных.
  - type: text
    title: Фотографии и приёмка
    body: На следующем проходе заменял предоставленные клиентом дизайнерские изображения и
      регенерировал миниатюры. Разобрал расхождения в именах, регистре и суффиксе -t,
      повторно обработал изображения; клиент подтвердил результат и принял заказ.
  - type: text
    title: Границы проекта
    body: Работа касалась конкретного этапа обновления каталога, а не создания всего сайта.
      Персональные рекомендации, поисковые синонимы, исправление Турбо-страниц и ускорение
      магазина в подтверждённый результат не входят. Полнота всех изображений и глобальное
      отсутствие дублей отдельно не проверены.
