title: Перенос каталога оборудования видеонаблюдения
tagline: "Перенёс категории и характеристики оборудования в WooCommerce. Задача
  заключалась не только в загрузке карточек: свойства должны были попадать в
  понятную структуру, а изображения корректно отображаться в каталоге."
year: "11.2018"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Product taxonomy
  - Data import
  - Product media
blocks:
  - type: text
    title: Задача и ограничения
    body: "Перенёс категории и характеристики оборудования в WooCommerce. Задача
      заключалась не только в загрузке карточек: свойства должны были попадать в
      понятную структуру, а изображения корректно отображаться в каталоге."
  - type: text
    title: Как устроено решение
    body: После замечаний пересобрал импорт по категориям и вручную отсортировал
      свойства. Настроил 45 пар полей «название — значение» для характеристик.
      При повторном импорте исправлял чёрный фон миниатюр; в рабочей переписке
      проблема была связана с обработкой PNG.
  - type: text
    title: Результат и проверка
    body: Заказчик принял перенос и отметил экономию времени, хотя часть данных ещё
      требовала ручной доводки. Число товарных карточек независимо не
      пересчитано.
