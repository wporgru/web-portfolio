title: "Kaida: замена ассортимента WooCommerce и правка меню каталога"
tagline: "Рыболовному магазину нужно было заменить ассортимент по новому прайсу,
  оставив две категории: рыболовные сети и сетеполотна. В исходной таблице не
  хватало надёжных идентификаторов, фотографий и описаний для автоматического
  сопоставления."
year: "02.2024"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Product data
  - Catalog migration
blocks:
  - type: text
    title: Задача и ограничения
    body: "Рыболовному магазину нужно было заменить ассортимент по новому прайсу,
      оставив две категории: рыболовные сети и сетеполотна. В исходной таблице
      не хватало надёжных идентификаторов, фотографий и описаний для
      автоматического сопоставления."
  - type: text
    title: Как устроено решение
    body: Выгрузил товары из магазина, передал образец таблицы и записал видео о
      добавлении строк, категорий и фотографий. Клиент подготовил данные по
      этому образцу. Перед загрузкой проверил наличие ежедневного бэкапа на
      хостинге. Загрузил согласованный ассортимент, старые карточки оставил в
      корзине для возможного восстановления. После замечания клиента исправил
      пункт меню, который вёл в пустой раздел.
  - type: text
    title: Результат и проверка
    body: Клиент принял работу. На историческом снимке виден раздел «Катушки» с
      карточками, ценами и навигацией, в том числе обе согласованные категории в
      боковом меню. Полной сверки их карточек, итогового числа импортированных
      позиций, применения наценки и теста восстановления из бэкапа в материалах
      нет.
  - type: image
    src: /media/projects/kaida-catalog-replacement/historical-reels.webp
    alt: "Архивный раздел «Катушки» магазина Kaida: товары, цены и список категорий"
    caption: Фрагмент из карточки Kwork от февраля 2024 года. Показывает раздел
      «Катушки», но не подтверждает итоговое число загруженных товаров, формулу
      наценки или сохранность каждой карточки.
