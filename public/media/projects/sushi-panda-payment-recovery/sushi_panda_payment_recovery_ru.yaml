title: "Sushi Panda: восстановление сайта и онлайн-оплаты"
tagline: Вернул работу магазина доставки и восстановил путь от корзины до
  оплаты, чтобы клиент мог снова проверить покупку на сайте.
year: "05.2022"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - YooKassa
  - Incident recovery
blocks:
  - type: text
    title: Задача и ограничения
    body: Вернул работу магазина доставки и восстановил путь от корзины до оплаты,
      чтобы клиент мог снова проверить покупку на сайте.
  - type: text
    title: Как устроено решение
    body: При диагностике связал сбой открытия сайта с функцией покупки в один клик
      и обнаружил устаревший платёжный модуль. После согласования настроек
      восстановил сценарий оплаты и провёл контрольную покупку. Клиент увидел
      результат и проверил оплату со своей стороны.
  - type: text
    title: Результат и проверка
    body: Клиент принял работу. Это исторический тест оплаты, не проверка всех
      способов доставки или полного восстановления покупки в один клик.
