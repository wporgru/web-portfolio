title: Упрощение оформления заказа в Evrosumka
tagline: Сократил оформление до данных, нужных менеджеру, и доработал витрину и
  подвал существующего магазина.
year: "10.2022"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Checkout
  - Quick view
  - Flamp
blocks:
  - type: text
    title: Задача и ограничения
    body: Сократил оформление до данных, нужных менеджеру, и доработал витрину и
      подвал существующего магазина.
  - type: text
    title: Как устроено решение
    body: Когда плагин покупки в один клик оказался несовместим, оставил стандартное
      оформление WooCommerce и сократил форму до имени, телефона, email и
      комментария. Добавил быстрый просмотр при наведении, поправил текст и
      подвал. Для виджета Flamp запросил полный файл, поскольку код в сообщении
      был обрезан.
  - type: text
    title: Результат и проверка
    body: Сдача показывает упрощённую форму и настройку виджета, а не внедрение
      покупки в один клик или подтверждение роста конверсии.
