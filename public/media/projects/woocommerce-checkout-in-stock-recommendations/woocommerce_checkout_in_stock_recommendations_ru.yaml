title: Упрощение чекаута и подборок товаров в наличии
tagline: "Доработал магазин по двум связанным сценариям: как оформить заказ без
  расчёта по индексу и как предложить покупателю только доступные товары в блоке
  рекомендаций."
year: "05.2022"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Checkout
  - Stock visibility
  - Telegram
blocks:
  - type: text
    title: Задача и ограничения
    body: "Доработал магазин по двум связанным сценариям: как оформить заказ без
      расчёта по индексу и как предложить покупателю только доступные товары в
      блоке рекомендаций."
  - type: text
    title: Как устроено решение
    body: После согласования отключил расчёт по индексу и изменил поля оформления.
      Отправил контрольный заказ и попросил владельца проверить его получение.
      Ограничил блок «Смотрите также» товарами в наличии, добавил Telegram и
      скорректировал значок в подвале. Нерешённые правки нестандартного шаблона
      согласованно передали программисту.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил получение тестового заказа и принял согласованный объём.
      Проверка минимальной суммы, соцвход и восстановление обмена с МойСклад не
      входили в подтверждённый результат.
