title: "Titanfox: навигация каталога и смена хостинга"
tagline: Доработал витрину магазина ножей и помог перевести её на другой
  хостинг. Владелец хотел одновременно улучшить навигацию и разобраться с
  медленной загрузкой.
year: "03.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Hosting migration
  - Product filters
  - PHP
blocks:
  - type: text
    title: Задача и ограничения
    body: Доработал витрину магазина ножей и помог перевести её на другой хостинг.
      Владелец хотел одновременно улучшить навигацию и разобраться с медленной
      загрузкой.
  - type: text
    title: Как устроено решение
    body: "Обновил блоки главной и вывод новинок. Для ножей, кожи и эксклюзивов
      перестроил категории, боковое меню и фильтры: показал дочерние категории,
      не раскрывая всё дерево сразу. Объяснил владельцу, как поддерживать
      товары, и согласовал переезд на Hostiman после работы с PHP-окружением."
  - type: text
    title: Результат и проверка
    body: Клиент принял заказ и сообщил, что сайт стал загружаться заметно быстрее.
      Сопоставимого замера до и после нет; проверка всех комбинаций фильтров
      отдельно не сохранилась.
