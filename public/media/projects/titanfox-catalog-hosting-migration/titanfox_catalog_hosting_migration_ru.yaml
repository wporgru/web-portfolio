title: "Titanfox: навигация каталога и смена хостинга"
tagline: Доработал витрину магазина ножей и помог перевести её на другой
  хостинг. Владелец хотел одновременно улучшить навигацию и разобраться с
  медленной загрузкой.
year: "03.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Hosting migration
  - Product filters
  - PHP
blocks:
  - type: text
    title: Задача и ограничения
    body: На существующем магазине ножей нужно было привести в порядок главную и каталог, улучшить навигацию по разным группам товаров и разобраться с медленной загрузкой. Это была серия изменений действующего WooCommerce-сайта, а не разработка магазина с нуля. В качестве ориентира клиент упоминал другой магазин; он не входил в выполненные проекты.
  - type: text
    title: Как устроено решение
    body: "Дорабатывал главную: менял блоки, вывод новинок, контакты, цвета и отступы; клиент подтвердил обновлённый вариант. Для разделов ножей, кожаных изделий и эксклюзивных товаров перестроил категории, боковую навигацию и фильтры. Важный UX-компромисс — показывать релевантные дочерние разделы, не разворачивая всё дерево каталога одновременно. Параллельно проверил PHP-окружение и повысил версию PHP. После этого согласовали перенос на Hostiman; также объяснил владельцу базовое управление товарами."
  - type: text
    title: Результат и проверка
    body: Клиент принял заказ и сообщил, что после работ сайт стал загружаться заметно быстрее. В переписке есть обратная связь о результате, но нет сопоставимых измерений производительности до и после, поэтому числовой прирост не заявляется. В архиве также не сохранился полный регрессионный прогон каталога и всех комбинаций фильтров. Перенос описывается в рамках согласованной работы; исчерпывающая техническая ведомость миграции отсутствует.
