title: Titanfox catalog navigation and hosting migration
tagline: Refined a knife store and helped move it to another host. The owner
  wanted better catalog navigation as well as a solution to slow loading.
year: "03.2023"
role: Web development and automation
stack:
  - WooCommerce
  - Hosting migration
  - Product filters
  - PHP
blocks:
  - type: text
    title: Brief and constraints
    body: The existing knife store needed a clearer homepage and catalog, better navigation across product groups, and investigation of slow loading. This was a series of changes to a live WooCommerce store, not a ground-up build. A different store was mentioned by the client as a reference and is not presented as work delivered here.
  - type: text
    title: How it works
    body: Updated the homepage blocks and new-arrivals display, plus contact details, colors and spacing; the client confirmed the revised homepage. Reworked categories, sidebar navigation and filters for knives, leather goods and exclusive items. The key UX trade-off was to show relevant child categories without expanding the entire catalog tree at once. Reviewed the PHP environment and raised its version; the move to Hostiman was then agreed. Also explained basic product maintenance to the owner.
  - type: text
    title: Result and verification
    body: The client accepted the work and reported that the site loaded noticeably faster afterward. The archived feedback supports that qualitative outcome, but no comparable before-and-after performance measurements are available, so no numeric gain is claimed. The archive also contains no full regression run for every catalog and filter combination, nor a comprehensive technical migration checklist.
