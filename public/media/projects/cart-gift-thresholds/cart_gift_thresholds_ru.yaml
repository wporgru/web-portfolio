title: "WooCommerce: изменение порогов подарков в корзине доставки"
tagline: "Точечно обновил две суммы в существующей акции sushi-panda15.ru,
  сохранив прежнюю логику автоматического добавления подарка."
year: "01.2024"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Cart rules
  - Promotions
blocks:
  - type: text
    title: Новые условия для акции с подарочными роллами
    body: В январе 2024 года для sushi-panda15.ru потребовалось скорректировать
      условия действующей акции с подарком в корзине. Клиент попросил изменить
      суммы, связанные с порогом подарка и автоматическим добавлением
      определённого набора роллов. Важно было внести ограниченную правку в уже
      работающую WooCommerce-логику, а не переписывать оформление заказа,
      систему акций или правила скидок целиком.
  - type: text
    title: Две точечные правки вместо переделки корзины
    body: "В существующем коде нашёл два независимых условия акции. Обновил
      значение общего порога с 1799 до 1499 и изменил значение, используемое
      правилом автоматического добавления акционного набора Харумаки из восьми
      штук, с 1199 до 999 по запросу клиента о подарке от 1000 рублей. Изменения
      ограничил этими условиями: базовая механика автоматического добавления
      осталась прежней. В архиве нет исходного оператора сравнения, поэтому
      конкретное поведение ровно на граничных суммах не реконструирую и не
      обобщаю числовую замену до полного описания алгоритма акции."
  - type: text
    title: Результат и границы проверки
    body: Клиент подтвердил, что изменение работает. Подтверждены две правки
      существующих числовых условий, а не создание всей подарочной системы с
      нуля. Архив не фиксирует полный набор тестовых корзин, проверку каждой
      соседней суммы, повторное удаление и добавление подарка при изменении
      заказа или работу всех сочетаний акций. Поэтому не заявляю исчерпывающий
      регрессионный тест и не делаю выводов о влиянии акции на средний чек или
      продажи.
    links:
      - label: Исходный заказ на Kwork
        url: https://kwork.ru/track?id=40722476
  - type: text
    title: Почему важно проверять правила подарка отдельно
    body: В корзине могут одновременно работать общий порог промоакции и
      отдельное условие автодобавления конкретного товара. Если поменять только
      одну сумму, интерфейс может показывать подарок не в тот момент либо не
      добавить его автоматически. Перед точечной правкой полезно определить,
      какие условия независимы, изменить только согласованные значения и
      проверить обычный сценарий корзины; точные границы сравнения нужно
      подтверждать исходной логикой и тестами.
