title: Настройка порогов подарка в корзине доставки
tagline: "Обновил действующую акцию магазина доставки: подарок должен
  добавляться по новым условиям без переделки всей корзины."
year: "01.2024"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Cart rules
  - Promotions
blocks:
  - type: text
    title: Задача и ограничения
    body: "Обновил действующую акцию магазина доставки: подарок должен добавляться
      по новым условиям без переделки всей корзины."
  - type: text
    title: Как устроено решение
    body: Нашёл два отдельных условия в существующей логике. Изменил общий порог
      акции и правило автоматического добавления конкретного набора из восьми
      штук. Так сохранил уже работающий механизм и ограничил изменение только
      согласованными правилами.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил работу. В архиве не сохранилась проверка каждой
      пограничной суммы, поэтому не приписываю этапу полное тестирование
      подарочной системы.
