    body: The client needed a ready-to-use auto repair site package and instructions
      for setting it up on their own hosting without hiring the developer to
      install it.
  - type: text
    title: How it works
    body: "Delivered the website package through a download link along with
      installation instructions. Kept the handoff separate from deployment: the
      files and instructions were included, server access and publication by the
      developer were not."
