title: Передача сайта автосервиса для самостоятельного запуска
tagline: Клиенту был нужен готовый комплект сайта автосервиса и понятный способ
  разместить его на своём хостинге, без заказа установки у исполнителя.
year: "07.2026"
role: Веб-разработка и автоматизация
stack:
  - Web Deployment
  - Documentation
blocks:
  - type: text
    title: Задача и ограничения
    body: Клиенту был нужен готовый комплект сайта автосервиса и понятный способ
      разместить его на своём хостинге, без заказа установки у исполнителя.
  - type: text
    title: Как устроено решение
    body: "Передал комплект сайта по ссылке вместе с инструкцией по установке.
      Разделил передачу материалов и развёртывание: файлы и инструкция входят в
      работу, доступ к серверу и публикация сайта исполнителем — нет."
  - type: text
    title: Результат и проверка
    body: Клиент явно принял комплект. История подтверждает передачу материалов, но
      не состав архива и не запуск на конкретном домене.
