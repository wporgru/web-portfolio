title: Пакет сайта автосервиса и инструкция по установке
tagline: Передал готовый комплект и инструкцию для самостоятельного развёртывания; установка на сервер клиента в заказ не входила.
year: "07.2026"
role: Веб-разработка и автоматизация
stack:
  - Web Deployment
  - Documentation
blocks:
  - type: text
    title: Задача и ограничения
    body: Заказчик приобрёл готовое решение для автосервиса вместе с инструкцией, чтобы самостоятельно разместить сайт на своём хостинге. При оформлении он указал autopartner52.ru, но из этого не следует, что требовались или были выполнены разработка существующего сайта, его перенос либо публикация на этом домене.
  - type: text
    title: Как устроено решение
    body: "Передал ссылку на комплект через Яндекс Диск и приложил инструкцию по установке на хостинг. Формат поставки рассчитан на самостоятельный запуск: доступа к серверу клиента и действия по публикации сайта исполнитель не получал и не выполнял. Полученный архив и его внутренности не сохранились в локальных материалах, поэтому нельзя достоверно перечислить CMS, тему, плагины или заявлять проверку содержимого пакета."
  - type: text
    title: Результат и проверка
    body: Клиент явно принял поставку. Переписка подтверждает передачу ссылки и инструкции, но не установку покупателем, запуск сайта на autopartner52.ru или состав архива. Доступность названного домена проверялась отдельно и не подтверждена; нынешний снимок домена не используется как доказательство результата этого заказа или авторства сайта.
