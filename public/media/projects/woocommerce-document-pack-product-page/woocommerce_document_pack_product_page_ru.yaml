title: Карточка пакета документов для WooCommerce
tagline: "Доработал карточку цифрового пакета: длинное содержание было удобнее
  читать с одним шрифтом, согласованными отступами и без дублирующей подписи
  раздела."
year: "09.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Typography
  - Product UX
  - Editorial layout
blocks:
  - type: text
    title: Задача и ограничения
    body: "Доработал карточку цифрового пакета: длинное содержание было удобнее
      читать с одним шрифтом, согласованными отступами и без дублирующей подписи
      раздела."
  - type: text
    title: Как устроено решение
    body: "Настроил дополнительные текстовые области, привёл оформление к PT Sans и
      полуторному интервалу, убрал заголовок «Описание». Отдельно поправил вывод
      даты возле предложения: отображение обновлялось ежедневно, а не раз в
      месяц."
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил результат и принял работу. Изменение даты — правка
      интерфейса, а не доказательство реального ограничения акции или изменения
      цен.
