title: Сбор данных парфюмерного каталога Randewoo
tagline: Подготовил данные большого каталога для команды клиента. Парфюмерию
  требовалось выделить отдельным файлом, сохранив различия между объёмами и
  ценами вариантов.
year: "05.2021"
role: Веб-разработка и автоматизация
stack:
  - Web scraping
  - Product variants
  - Catalog data
blocks:
  - type: text
    title: Задача и ограничения
    body: Подготовил данные большого каталога для команды клиента. Парфюмерию
      требовалось выделить отдельным файлом, сохранив различия между объёмами и
      ценами вариантов.
  - type: text
    title: Как устроено решение
    body: "Настроил сбор и разобрал неоднородные поля: цены вариантов, отсутствие
      цен у недоступных товаров и лишние сегменты хлебных крошек. Передал общий
      ассортимент и парфюмерию двумя файлами. Последующую переработку Excel и
      импорт выделил из этапа сбора."
  - type: text
    title: Результат и проверка
    body: Клиент принял файлы. Размер очереди парсера не выдаю за итоговое число
      товаров или результат импорта.
