title: Из выгрузок Ozon в каталог товаров для животных
tagline: Несколько файлов Ozon нужно было превратить в единый импорт. В
  названиях различались длина, порядок бренда и модели, попадались повторные
  пробелы и лишние символы.
year: "11.2025"
role: Веб-разработка и автоматизация
stack:
  - Excel
  - Ozon
  - WooCommerce
  - Data normalization
blocks:
  - type: text
    title: Задача и ограничения
    body: Несколько файлов Ozon нужно было превратить в единый импорт. В названиях
      различались длина, порядок бренда и модели, попадались повторные пробелы и
      лишние символы.
  - type: text
    title: Как устроено решение
    body: Разобрал форматы наименований, согласовал единый бренд и объединил файлы в
      рабочую Excel-таблицу. Передал её на проверку до загрузки, учёл правки
      заказчика по названиям и ценам, затем выполнил импорт согласованной
      версии.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил появление товаров и принял этап. Обсуждение цветовых
      карточек не выдаю за готовую группировку; изображения и платёжная
      интеграция были отдельными задачами.
