blocks:
  - type: text
    title: Задача и ограничения
    body: "Восстановил элементы действующего сайта перевозок: видео, иконки на
      страницах услуг и автопарка, а также неработающие переходы."
  - type: text
    title: Как устроено решение
    body: Уточнил, где размещён сайт и доступны ли копии. Настроил размер видео и
      передал клиенту на проверку. Вернул значки без лишних подписей в разделах
      услуг и автопарка, поправил страницы автомобилей и исправил неработающую
      ссылку на главной и в услугах.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил улучшение и принял работу. Восстановление из резервной
      копии и полная проверка всех браузеров не подтверждены.
