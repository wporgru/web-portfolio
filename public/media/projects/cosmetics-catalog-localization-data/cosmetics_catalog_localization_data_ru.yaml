title: Таблица косметики для итальянской локализации
tagline: Подготовил таблицу для перевода каталога косметики. Заказчику нужен был
  редактируемый файл с исходными ссылками, названиями и описаниями, а не перевод
  внутри магазина.
year: "02.2020"
role: Веб-разработка и автоматизация
stack:
  - Excel
  - Web scraping
  - Localization
  - Product data
blocks:
  - type: text
    title: Задача и ограничения
    body: Подготовил таблицу для перевода каталога косметики. Заказчику нужен был
      редактируемый файл с исходными ссылками, названиями и описаниями, а не
      перевод внутри магазина.
  - type: text
    title: Как устроено решение
    body: "Собрал адреса товаров и изображений, заголовки и описания в Excel. Для
      категорий оставил отдельное поле: в источнике не было надёжных признаков
      принадлежности каждой позиции. Объяснил, как сохранять ссылки и сверять
      итальянские названия категорий с целевым каталогом."
  - type: text
    title: Результат и проверка
    body: Таблица передана и принята по сроку проверки. Ручной перевод, загрузка в
      WooCommerce и полная сверка всех фотографий не входили в подтверждённый
      результат.
