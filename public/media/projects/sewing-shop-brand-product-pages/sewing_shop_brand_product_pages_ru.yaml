title: "Магазин швейной техники: бренды, сравнение и избранное"
tagline: "В каталоге швейных машин нужно было упростить выбор модели: вывести
  страницы брендов, дать покупателю сравнение и избранное и не позволить
  ошибочным статусам из фида перезаписывать выбранные карточки."
year: "11.2025"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Yoast SEO
  - XML feeds
  - Catalog UX
blocks:
  - type: text
    title: Задача и ограничения
    body: "В каталоге швейных машин нужно было упростить выбор модели: вывести
      страницы брендов, дать покупателю сравнение и избранное и не позволить
      ошибочным статусам из фида перезаписывать выбранные карточки."
  - type: text
    title: Как устроено решение
    body: Подключил страницы брендов и настроил их представление в Yoast. Добавил
      сравнение и избранное, затем поправил иконки и английские подписи.
      Исключил Aurora 5000D и Aurora 600D из обновления через правила XPath.
      Перед следующим импортом сравнил названия в двух фидах и передал клиенту
      файлы для разбора пересечений.
  - type: text
    title: Результат и проверка
    body: "Клиент подтвердил страницы брендов и принял этап. В отчёте сравнения —
      170 совпадений по названию, при том что в каждом фиде было более 2 200
      позиций. Это список для проверки: одинаковое название не доказывает
      совпадение модели, а разные названия не исключают дубль. Измеренного
      ускорения и отдельного подтверждения формы на этом этапе нет."
  - type: text
    title: Другой этап этого проекта
    links:
