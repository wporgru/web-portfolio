title: "Sewing store: WooCommerce brands, comparison and wishlists"
tagline: The sewing-equipment store needed brand pages, product comparison and
  wishlists. Incorrect statuses from the supplier feed also needed to stop
  overwriting selected listings.
year: "11.2025"
role: Web development and automation
stack:
