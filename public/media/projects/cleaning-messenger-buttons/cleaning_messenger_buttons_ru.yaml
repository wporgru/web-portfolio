title: Кнопки WhatsApp и Telegram для клинингового сайта
tagline: На существующем сайте клининговой компании клиент хотел добавить прямой
  переход в мессенджеры для обращений по уборке, в том числе после мероприятий.
year: "06.2025"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WhatsApp
  - Telegram
blocks:
  - type: text
    title: Задача и ограничения
    body: На существующем сайте клининговой компании клиент хотел добавить прямой
      переход в мессенджеры для обращений по уборке, в том числе после
      мероприятий.
  - type: text
    title: Как устроено решение
    body: Установил кнопки WhatsApp и Telegram на существующий WordPress-сайт и
      передал результат клиенту. Каналы связи добавлялись в готовую витрину, без
      миграции платформы или перестройки её страниц.
  - type: text
    title: Результат и проверка
    body: Клиент принял работу и в отзыве подтвердил работоспособность. CRM,
      удаление других виджетов и рост обращений не заявляются.
