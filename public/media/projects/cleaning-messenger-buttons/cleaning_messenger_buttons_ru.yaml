title: Кнопки WhatsApp и Telegram для клинингового сайта
tagline: Добавил прямые каналы связи в страницу уборки мероприятий на действующем
  сайте компании, сохранив остальной сайт без изменений.
year: "06.2025"
role: Веб-разработка и интеграция коммуникаций
stack:
  - WordPress
  - WhatsApp
  - Telegram
blocks:
  - type: text
    title: Контактный маршрут для услуги уборки мероприятий
    body: >-
      Клиент попросил установить WhatsApp и Telegram на страницу услуги по уборке
      мероприятий сайта klining-profi.ru. Для посетителя это дополнительный прямой
      способ связаться с компанией именно в контексте нужной услуги, а не искать
      контакты отдельно от описания уборки.
  - type: text
    title: Добавил каналы в готовый сайт
    body: >-
      Установил кнопки WhatsApp и Telegram на существующую WordPress-площадку и
      передал результат заказчику. Задача была точечной: добавить быстрые каналы
      связи в готовый сайт без миграции платформы и полной перестройки страниц.
      Название плагина, способ реализации и точное положение элементов в доступной
      переписке не зафиксированы.
  - type: text
    title: Приёмка и отзыв заказчика
    body: >-
      Клиент принял заказ и оставил отзыв: «Спасибо за помощь! Заказ выполнен
      оперативно! Все работает!» Это подтверждает приёмку и оценку самого клиента.
      Удаление JivoSite, интеграция с CRM и рост числа обращений не подтверждены.
  - type: text
    title: Что можно проверить отдельно
    body: >-
      Текущий снимок сайта — более позднее состояние, а не историческое доказательство
      именно этой установки. При следующем этапе отдельно проверяются реальные
      WhatsApp- и Telegram-переходы на мобильном и десктопе; клики, обращения и
      конверсия в этом заказе не измерялись.
  - type: image
    title: Публичный вид сайта
    src: /media/projects/cleaning-messenger-buttons/later-homepage.webp
    alt: Публичная главная клининговой компании
    caption: Десктопный снимок 4 ноября 2026 года, без обрезки. Он не проверяет переходы в мессенджеры и мобильное положение кнопок.
