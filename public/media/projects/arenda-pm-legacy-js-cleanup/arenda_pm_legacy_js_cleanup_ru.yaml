title: "Аренда-ПМ: устранение ошибки JavaScript без потери аналитики"
tagline: В консоли возникала ошибка обращения к отсутствующему API старого
  конструктора. Нужно было убрать только сломанный фрагмент, не отключая
  аналитику, отслеживание звонков и действующие формы.
year: "10.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - JavaScript
  - Clearfy
  - Contact Form 7
  - Playwright
blocks:
  - type: text
    title: Контекст и задача
    body: "На страницах сайта после взаимодействия появлялась ошибка JavaScript:
      пользовательский фрагмент обращался к API прежнего конструктора, которого
      на текущей версии страниц уже не было. Ошибка засоряла консоль и могла
      мешать последующим скриптам, но исправлять её отключением всего
      пользовательского кода было нельзя. В нём находились и важные интеграции —
      аналитика, отслеживание звонков и формы обратной связи. Задача состояла в
      том, чтобы локализовать именно устаревший вызов и проверить, что исправление
      не затронуло соседние функции."
  - type: text
    title: Диагностика и точечное исправление
    body: "Проверил пользовательские настройки и нашёл источник в кодовом блоке
      Clearfy: там оставался вызов API старого конструктора. Перед изменением
      сохранил исходную настройку, чтобы её можно было восстановить, и сверил
      состав остальных полей. Удалил только неактуальный фрагмент, не отключая
      общий блок скриптов и не переписывая работающие интеграции. Такой подход
      уменьшает радиус изменений: исправляется конкретная причина, а не
      маскируется симптом удалением связанных функций."
  - type: text
    title: Проверки и границы результата
    body: "После правки проверил восемь адресов сайта в настольном и мобильном
      представлениях (1440 и 390 px), включая сценарии после прокрутки и
      интерактивных действий. В проверенных сессиях не появлялись runtime-ошибки
      и console.error. Отдельно сравнил три аналитических блока в сохранённом
      HTML по контрольным суммам: их содержимое не изменилось. Повторно прошёл
      пользовательские сценарии подбора категории, открытия мобильного меню и
      запуска бронирования с подстановкой модели M20. Это подтверждает отсутствие
      регрессии в проверенных интерфейсных сценариях; реальную отправку заявки и
      доставку событий во внешние системы аналитики не проверял, поэтому не
      приписываю кейсу такой результат."
  - type: text
    title: Почему важна точечная правка
    body: "Для сайта с несколькими скриптами и внешними интеграциями безопаснее
      найти конкретный устаревший вызов, сохранить возможность отката и проверить
      ключевые действия после изменения, чем отключать весь код ради чистой
      консоли. В этом случае вместе с устранением ошибки удалось сохранить
      аналитические фрагменты без изменений и подтвердить работу выбранных
      интерфейсных сценариев на мобильном и настольном экранах."
