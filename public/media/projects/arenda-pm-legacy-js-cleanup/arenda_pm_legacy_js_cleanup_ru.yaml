title: "Аренда-ПМ: устранение ошибки JavaScript без потери аналитики"
tagline: В консоли возникала ошибка обращения к отсутствующему API старого
  конструктора. Нужно было убрать только сломанный фрагмент, не отключая
  аналитику, отслеживание звонков и действующие формы.
year: "10.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - JavaScript
  - Clearfy
  - Contact Form 7
  - Playwright
blocks:
  - type: text
    title: Задача и ограничения
    body: В консоли возникала ошибка обращения к отсутствующему API старого
      конструктора. Нужно было убрать только сломанный фрагмент, не отключая
      аналитику, отслеживание звонков и действующие формы.
  - type: text
    title: Как устроено решение
    body: "Нашёл устаревший вызов в блоке пользовательского кода Clearfy. Удалил
      один фрагмент, сохранил исходную настройку для отката и сверил остальные
      поля до и после. Сравнил три аналитических блока в сохранённом HTML по
      контрольным суммам. После изменения повторил интерактивные проверки:
      подбор категории, мобильное меню и открытие бронирования с подстановкой
      модели M20."
  - type: text
    title: Результат и проверка
    body: На восьми адресах при ширине 1440 и 390 px проверка после прокрутки и
      действий не зафиксировала runtime-ошибок или console.error. Три
      аналитических блока остались неизменными. Отправка заявки и поступление
      данных во внешние отчёты не тестировались.
  - type: text
    title: Другой этап этого проекта
    links:
