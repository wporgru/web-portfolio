title: Исправление импорта объектов недвижимости и фото
tagline: Наладил сопоставление данных в WP All Import, чтобы импортированная
  запись выглядела как карточка недвижимости, а не как набор неполных полей без
  фотографий.
year: "11.2024"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WP All Import
  - Custom post types
  - Product data
blocks:
  - type: text
    title: Задача и ограничения
    body: Наладил сопоставление данных в WP All Import, чтобы импортированная запись
      выглядела как карточка недвижимости, а не как набор неполных полей без
      фотографий.
  - type: text
    title: Как устроено решение
    body: Проверил тип записи и образцы данных, согласовал удаление неудачно
      загруженных записей. Разделил проблемы исходного экспорта, подготовки
      файла и настроек импорта, затем передал исправленное сопоставление. Когда
      обработка на сервере продолжила прерываться, отдельно объяснил, как
      проверить лимиты хостинга и завершить публикацию оставшихся записей.
  - type: text
    title: Результат и проверка
    body: "Клиент подтвердил внешний вид карточки и загрузку фото, принял помощь и
      добавил бонус. Полный прогон всего массива не подтверждён: серверные
      остановки оставались отдельной задачей."
