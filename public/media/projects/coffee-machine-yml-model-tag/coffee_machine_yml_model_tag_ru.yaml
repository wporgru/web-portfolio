title: Отдельный тег модели в YML-фиде кофемашин
tagline: "Исправил структуру выгрузки кофемашин: получателю требовался отдельный
  элемент model, а не характеристика «Модель» внутри универсального param."
year: "06.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - YML
  - XML
  - Product feeds
blocks:
  - type: text
    title: Задача и ограничения
    body: "Исправил структуру выгрузки кофемашин: получателю требовался отдельный
      элемент model, а не характеристика «Модель» внутри универсального param."
  - type: text
    title: Как устроено решение
    body: Первый вариант менял название атрибута, но оставлял прежнюю XML-структуру.
      После проверки с заказчиком развёл внутренние атрибуты WooCommerce и
      формат фида. Передал обновлённую выгрузку, в которой model выводился
      отдельным элементом для каждой товарной записи.
  - type: text
    title: Результат и проверка
    body: Клиент проверил файл и принял заказ. В отчёте отмечены 60 товаров с тегом
      model; дальнейшее размещение и показатели площадки не проверялись.
