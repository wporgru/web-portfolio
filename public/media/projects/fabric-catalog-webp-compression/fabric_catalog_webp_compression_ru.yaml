title: Подготовка WebP для каталога тканей и кожи
tagline: Подготовил квадратные изображения коллекций для каталога. Заказчику
  нужны были компактные файлы, но фактуру материала нельзя было терять ради
  одинакового веса каждого изображения.
year: "01.2023"
role: Веб-разработка и автоматизация
stack:
  - WebP
  - MODX
  - Image optimization
  - Catalog media
blocks:
  - type: text
    title: Задача и ограничения
    body: Подготовил квадратные изображения коллекций для каталога. Заказчику нужны
      были компактные файлы, но фактуру материала нельзя было терять ради
      одинакового веса каждого изображения.
  - type: text
    title: Как устроено решение
    body: "Уточнил состав коллекций по таблице, предложил WebP и дождался проверки
      поддержки формата на MODX-сайте клиента. Подготовил материалы 500 × 500 и
      разложил файлы по двум источникам. На сложных фактурах сравнил результат
      сжатия: ниже примерно 39 КБ на части снимков были видны артефакты."
  - type: text
    title: Результат и проверка
    body: Клиент принял архивы и получил пояснения по просмотру WebP и распаковке.
      Цель 25 КБ достигалась не для всех файлов; точное количество изображений
      не сохранилось.
