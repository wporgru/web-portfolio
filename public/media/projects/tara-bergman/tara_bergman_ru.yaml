title: Перенос сайта фотографа на WordPress
tagline: Перенести сайт с Firebase и Webpack в CMS, когда полного архива
  исходников не оказалось.
role: Веб-разработка
year: "05.2026"
stack:
  - WordPress
  - Firebase
  - Webpack
blocks:
  - type: text
    title: Задача
    body: Перенести сайт с Firebase и Webpack в CMS, когда полного архива исходников
      не оказалось.
  - type: text
    title: Что сделано
    body: Восстановил страницы по опубликованной версии на отдельном стенде,
      согласовал размещение наград на разных экранах и подготовил отдельные
      адреса воркшопа для трёх языков.
  - type: text
    title: Как решалась задача
    body: Вместо попытки восстановить отсутствующий исходный проект Webpack собрал
      основу по доступным публичным страницам. Сначала показал главную на
      тестовом стенде, затем обсуждал, как встроить награды фотографа без
      перегрузки мобильной версии. Для воркшопа подготовил отдельные адреса EN,
      RU и ES; это не равнозначно переводу всего сайта.
