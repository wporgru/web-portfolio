title: Перенос сайта фотографа на WordPress
tagline: Перенести сайт с Firebase и Webpack в CMS, когда полного архива
  исходников не оказалось.
role: Веб-разработка
year: "05.2026"
stack:
  - WordPress
  - Firebase
  - Webpack
blocks:
  - type: text
    title: Задача
    body: Перенести сайт с Firebase и Webpack в CMS, когда полного архива исходников
      не оказалось.
  - type: text
    title: Что сделано
    body: Восстановил страницы по опубликованной версии на отдельном стенде,
      согласовал размещение наград на разных экранах и подготовил отдельные
      адреса воркшопа для трёх языков.
  - type: text
    title: Как решалась задача
    body: Вместо попытки восстановить отсутствующий исходный проект Webpack собрал
      основу по доступным публичным страницам. Сначала показал главную на
      тестовом стенде, затем обсуждал, как встроить награды фотографа без
      перегрузки мобильной версии. Для воркшопа подготовил отдельные адреса EN,
      RU и ES; это не равнозначно переводу всего сайта.
  - type: text
    title: После переноса
    body: Галереи и языковая разметка потребовали собственных проверок после
      переноса. Эти этапы разобраны отдельно.
    links:
      - label: Порционная загрузка галереи
        url: /showcase/tara-bergman-gallery-batches/
      - label: Исправление языковых ссылок
        url: /showcase/tara-bergman-hreflang-page-mapping/
  - type: text
    title: Главная из архива проекта
    links:
      - label: Оригинал в портфолио Kwork
        url: https://kwork.ru/portfolio/22781455
  - type: image
    src: /media/projects/tara-bergman/archive-homepage.webp
    alt: "Главная сайта фотографа Tara Bergman: галерея, тарифы и форма записи"
    caption: Главная целиком, 1400 × 5219. Снимок опубликован в портфолио после
      приёмки, 9 июня 2026 года. Фотографии предоставлены клиентом; снимок
      показывает вёрстку, а не работу формы.
  - type: text
    title: Как проверял скорость главной
    body: В сохранённом мобильном отчёте PageSpeed от 9 июня 2026 года главная
      получила 92 балла за производительность, LCP — 2,9 с. Это один
      лабораторный замер на эмуляции Moto G Power. Он не показывает прирост
      относительно старого сайта и не описывает скорость всех галерей.
    links:
      - label: Посмотреть архивный отчёт
        url: https://kwork.ru/portfolio/22781382
