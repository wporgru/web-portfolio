blocks:
  - type: text
    title: "Задача: восстановить сайт без полного исходного проекта"
    body: >-
      Нужно было перенести сайт фотографа с Firebase и Webpack на редактируемую CMS WordPress, сохранив визуальный стиль. Полного архива исходников до Webpack-сборки не оказалось, поэтому восстановление шло по опубликованным страницам. В исходном задании фигурировали версии EN и RU, шесть категорий галереи, 15 воркшопов, редактируемые тексты и SEO-переадресации. Перечень требований не означает, что каждый пункт подтверждён как реализованный.
  - type: text
    title: Пересобрал основу по доступной публичной версии
    body: >-
      Вместо попытки восстановить отсутствующий исходный проект собрал страницы по тому, что можно было увидеть на опубликованном сайте, и сначала показал главную на временном стенде. Такой подход позволил согласовать направление до дальнейшей работы, но не даёт оснований утверждать, что исходная архитектура Firebase/Webpack была полностью перенесена один к одному.
  - type: text
    title: Согласовал адаптивную подачу и языковые адреса
    body: >-
      Отдельно обсуждалось размещение наград фотографа на широком и мобильном экранах, чтобы сохранить характер проекта и не перегрузить телефонную версию. Для страниц воркшопа подготовил отдельные адреса EN, RU и ES. Это подтверждает языковые адреса для воркшопов, но не полный перевод всего сайта и не наличие трёх законченных языковых версий каждой страницы.
  - type: text
    title: Проверил один исторический мобильный замер
    body: >-
      В сохранённом отчёте PageSpeed от 9 июня 2026 года главная получила 92 балла за производительность: FCP — 2,6 с, LCP — 2,9 с, TBT — 0 мс, CLS — 0, Speed Index — 2,6 с. Это одиночный лабораторный запуск Lighthouse 13.3.0 с эмуляцией Moto G Power; полевых данных нет. Исходного сопоставимого замера до работы тоже нет, поэтому результат нельзя выдавать за прирост скорости или гарантию для всех страниц галереи.
    links:
      - label: Открыть карточку архивного отчёта
        url: https://kwork.ru/portfolio/22781382
  - type: text
    title: Приёмка и границы подтверждённого результата
    body: >-
      Заказчик принял этап 8 июня 2026 года; в отзыве отметил соответствие заданию, связь и скорость реакции. Перенос на WP Engine и работа с основным доменом обсуждались после подготовки стенда, однако завершённое переключение и SSL в сохранённой читаемой истории отдельно не подтверждены. Поэтому кейс описывает реконструкцию и согласования на стенде, а не гарантирует полный запуск, работу всех 15 воркшопов, форм, метаданных или редиректов.
  - type: text
    title: Связанные этапы по галереям и языковым ссылкам
    body: После этого этапа отдельно проверялись порционная загрузка галереи и соответствие языковых URL. Это самостоятельные последующие задачи, а не часть подтверждённого объёма первоначального переноса.
    links:
