title: "Реконструкция сайта фотографа: Firebase/Webpack → WordPress"
tagline: Восстановил страницы сайта на WordPress-стенде по опубликованной версии, когда полного архива исходников не нашлось; согласовал адаптивное размещение наград и подготовил отдельные адреса воркшопов на EN, RU и ES.
role: Реконструкция и миграция сайта на WordPress
year: "05.2026"
