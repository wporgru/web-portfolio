title: Photography website migration to WordPress
tagline: Move a Firebase/Webpack site to a CMS without a complete source archive.
role: Web development
year: "05.2026"
stack:
  - WordPress
  - Firebase
  - Webpack
blocks:
  - type: text
    title: Brief
    body: Move a Firebase/Webpack site to a CMS without a complete source archive.
  - type: text
    title: Work delivered
    body: Reconstructed pages from the published site on staging, reviewed desktop
      and mobile placement of awards, and prepared separate workshop URLs for
      three languages.
  - type: text
    title: Implementation and scope
    body: Rather than attempting to recover a missing Webpack project, I
      reconstructed the site from available public pages. I showed the homepage
      on staging first and then reviewed how to integrate the photographer's
      awards without crowding mobile layouts. I prepared separate EN, RU and ES
      workshop URLs; this does not mean the entire site was translated.
  - type: text
    title: After migration
    body: Galleries and language markup required their own checks after migration.
      Both follow-up projects are documented separately.
    links:
      - label: Batch loading for galleries
        url: /showcase/tara-bergman-gallery-batches/en/
      - label: Fixing hreflang
        url: /showcase/tara-bergman-hreflang-page-mapping/en/
  - type: text
    title: Archived project homepage
    links:
      - label: Original Kwork portfolio entry
        url: https://kwork.ru/portfolio/22781455
  - type: image
    src: /media/projects/tara-bergman/archive-homepage.webp
    alt: Tara Bergman photography homepage with galleries, pricing and a booking
      form
    caption: Full homepage, 1400 × 5219. Published in the portfolio after acceptance
      on June 9, 2026. The client supplied the photographs; the screenshot shows
      the layout, not form delivery.
  - type: text
    title: How I checked homepage performance
    body: In the archived mobile PageSpeed report dated June 9, 2026, the homepage
      scored 92 for performance, with a 2.9 s LCP. This was a single lab test
      emulating a Moto G Power. It does not measure gains over the original site
      or cover every gallery.
    links:
      - label: View the archived report
        url: https://kwork.ru/portfolio/22781382
