title: "Reconstructing a photographer's site: Firebase/Webpack → WordPress"
tagline: Rebuilt pages on a WordPress staging site from the published version when a complete source archive was unavailable; reviewed responsive award placement and prepared workshop URLs in English, Russian and Spanish.
role: Website reconstruction and WordPress migration
year: "05.2026"
