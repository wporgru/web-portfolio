blocks:
  - type: text
    title: "Brief: rebuild the site without a complete source project"
    body: >-
      The request was to move a photographer's Firebase/Webpack website to an editable WordPress CMS while preserving its visual style. A complete source archive from before the Webpack build was unavailable, so the reconstruction relied on published pages. The original brief mentioned English and Russian versions, six gallery categories, 15 workshops, editable copy and SEO redirects. These were requirements, not proof that every item was implemented.
  - type: text
    title: Rebuilt the foundation from the available public version
    body: >-
      Rather than attempting to recover a missing source project, I reconstructed pages from what could be inspected on the published website and presented the homepage on temporary staging first. This made it possible to review the direction before continuing, but it does not establish a one-to-one transfer of the original Firebase/Webpack architecture.
  - type: text
    title: Reviewed responsive presentation and language URLs
    body: >-
      We separately reviewed how the photographer's awards should appear on wide and mobile screens, keeping the site's character without overcrowding the phone layout. I prepared separate EN, RU and ES workshop URLs. This supports language-specific workshop routes, not a complete translation of the entire website or finished versions of every page in all three languages.
  - type: text
    title: Checked one historical mobile lab run
    body: >-
      A saved PageSpeed report dated June 9, 2026 scored the homepage 92 for performance: FCP 2.6 s, LCP 2.9 s, TBT 0 ms, CLS 0 and Speed Index 2.6 s. It was a single Lighthouse 13.3.0 lab run emulating a Moto G Power; there is no field data. No comparable pre-work baseline is available, so this cannot be presented as a speed improvement or a guarantee for every gallery page.
    links:
      - label: Open the archived report entry
        url: https://kwork.ru/portfolio/22781382
  - type: text
    title: Acceptance and the limits of the verified outcome
    body: >-
      The client accepted the stage on June 8, 2026; their review praised adherence to the brief, communication and response time. A move to WP Engine and work on the primary domain were discussed after staging, but the saved readable history does not independently confirm a completed switch or SSL setup. This case therefore documents the reconstruction and staging reviews, not a guaranteed full launch, all 15 workshops, working forms, complete metadata or redirects.
  - type: text
    title: Related gallery and language-routing work
    body: Gallery batch loading and language URL mapping were checked in separate follow-up tasks. These are later projects, not part of the verified scope of the original migration stage.
