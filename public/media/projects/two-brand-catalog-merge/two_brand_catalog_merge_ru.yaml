title: Объединение каталогов двух брендов для WooCommerce
tagline: Объединил товарные таблицы CWZ и Artred с разной структурой и настроил разовый
  импорт в WooCommerce для «Фаэтона». Клиент принял перенос.
year: "02.2026"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Spreadsheet mapping
  - Data import
blocks:
  - type: text
    title: Почему не загрузил таблицы по отдельности
    body: У CWZ и Artred были разные столбцы в Google Таблицах. Согласовал сначала подготовить
      общий набор данных, чтобы одинаковые поля товаров не обрабатывались по-разному в
      зависимости от бренда.
  - type: text
    title: Как разделил данные и контент
    body: Объединил товарные данные и настроил загрузку в действующий WooCommerce. Отдельно
      запросил прежнюю страницу на Creatium как источник блоков преимуществ, изображений и
      видео. Это источник материалов, а не сайт, созданный в рамках заказа.
  - type: text
    title: Что подтвердил клиент
    body: 25 февраля 2026 года заказчик принял работу и поблагодарил за перенос. Девять
      товаров из обсуждения одной таблицы не считаю общим итогом. Состав финального файла
      и внедрение каждого медиаэлемента отдельно не сверены; постоянная синхронизация не
      подтверждена.
  - type: image
    title: Публичный вид сайта
    src: /media/projects/elementor-editor-recovery/later-homepage.webp
    alt: Публичная главная «Фаэтон» с каталогом оборудования
    caption: Публичная главная от 23 октября 2026 года, без обрезки. Это более поздний вид, а
      не подтверждение состава загруженных таблиц.
