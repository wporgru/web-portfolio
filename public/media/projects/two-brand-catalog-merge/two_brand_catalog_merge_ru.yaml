title: Объединение каталогов двух брендов для WooCommerce
tagline: Два бренда передали данные в разных таблицах. Если загружать файлы
  независимо без согласования структуры, поля могут попасть в разные места и
  усложнить дальнейшую работу с каталогом.
year: "02.2026"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Spreadsheet mapping
  - Data import
blocks:
  - type: text
    title: Задача и ограничения
    body: Два бренда передали данные в разных таблицах. Если загружать файлы
      независимо без согласования структуры, поля могут попасть в разные места и
      усложнить дальнейшую работу с каталогом.
  - type: text
    title: Как устроено решение
    body: Согласовал предварительное объединение данных и запросил существующую
      страницу как источник содержимого. Подготовил общий набор для загрузки,
      настроил импорт в WooCommerce и передал результат клиенту.
  - type: text
    title: Результат и проверка
    body: Заказчик подтвердил перенос и принял работу. Число позиций по одной из
      таблиц не выдаётся за общий итог; постоянная синхронизация не входила в
      этап.
