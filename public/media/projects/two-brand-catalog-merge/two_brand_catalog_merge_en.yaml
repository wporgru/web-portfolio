title: Merging two brand catalogs for WooCommerce
tagline: Combined differently structured CWZ and Artred spreadsheets into one dataset and
  configured a one-time WooCommerce import for Faeton. The client accepted the transfer.
year: "02.2026"
role: Web development and automation
stack:
  - WooCommerce
  - Spreadsheet mapping
  - Data import
blocks:
  - type: text
    title: Why the spreadsheets were not imported separately
    body: CWZ and Artred used different columns in Google Sheets. I agreed to prepare a shared
      dataset first so the same product fields would not be handled differently by brand.
  - type: text
    title: Separated product data from page content
    body: I combined the product data and configured the import into the existing WooCommerce
      store. I separately requested the previous Creatium page as a reference for
      benefits, imagery and video. The source page was not built as part of this order.
  - type: text
    title: What the client confirmed
    body: On February 25, 2026, the client accepted the work and thanked me for the transfer.
      Nine products discussed for one sheet are not a combined total. The final file and
      every media placement were not verified separately, and ongoing synchronization was
      not established.
  - type: image
    title: Public site view
    src: /media/projects/elementor-editor-recovery/later-homepage.webp
    alt: Public Faeton homepage and equipment catalog
    caption: Public homepage captured October 23, 2026, uncropped. This later view does not
      verify the contents of the imported spreadsheets.
