title: "Circa Outlet: импорт 9 645 товаров и вывод размеров"
tagline: Магазину одежды нужен был рабочий каталог, в котором покупатель видит
  доступные размеры, а не только название и фотографию модели.
year: "02.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - Product import
blocks:
  - type: text
    title: Задача и ограничения
    body: Магазину одежды нужен был рабочий каталог, в котором покупатель видит
      доступные размеры, а не только название и фотографию модели.
  - type: text
    title: Подготовка каталога и загрузка
    body: "До импорта была подготовлена отдельная выборка из 9 645 уникальных
      товарных URL; полный исходный сбор содержал 28 664 непустые строки, а
      таблица для импорта — 22 столбца вместо девяти в исходном формате.
      Подготовил окружение и тему магазина и выполнил загрузку на circaoutlet.com.
      В отчёте о сдаче зафиксировал 9 645 товаров. Подготовка данных и импорт
      были отдельными этапами одного проекта."
  - type: text
    title: Размеры и приёмка
    body: После загрузки отдельно настроил вывод размеров в карточках, чтобы
      покупателю было проще понять, какие варианты доступны. Попросил клиента
      проверить именно этот элемент; он ответил «Размеры — отлично» и принял
      заказ 24 февраля 2026 года. Перестройка мужского и женского разделов,
      навигации и главной обсуждалась отдельно и не включена в этот этап.
  - type: text
    title: Что именно подтверждают данные
    body: Число 9 645 — совпадающий плановый объём уникальных URL и историческое
      число товаров в отчёте о сдаче, а не независимый пересчёт опубликованных
      карточек и вариаций. Итоговая выгрузка не сохранилась; источник и полнота
      всех полей также не установлены. Полностраничный снимок ниже сделан позже
      и показывает публичную главную, а не импортированный каталог.
    links:
      - label: Открыть исходный заказ на Kwork
        url: https://kwork.ru/track?id=59908880
  - type: text
    title: Другой этап этого проекта
    links:
      - label: "Предыдущий этап: сбор и проверка товарных данных"
        url: /showcase/fashion-data-preparation/
  - type: image
    title: Публичный вид сайта
    src: /media/projects/circa-outlet-catalog/later-homepage.webp
    alt: Публичная главная магазина Circa Outlet
    caption: Публичная версия от 24 октября 2026 года, без обрезки. Более позднее
      оформление не приписывается этапу импорта и не подтверждает количество
      товаров или настройку размеров.
