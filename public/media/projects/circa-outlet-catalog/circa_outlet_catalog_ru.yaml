title: "Circa Outlet: импорт 9 645 товаров и вывод размеров"
tagline: Магазину одежды нужен был рабочий каталог, в котором покупатель видит
  доступные размеры, а не только название и фотографию модели.
year: "02.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - Product import
blocks:
  - type: text
    title: Задача и ограничения
    body: Магазину одежды нужен был рабочий каталог, в котором покупатель видит
      доступные размеры, а не только название и фотографию модели.
  - type: text
    title: Как устроено решение
    body: Подготовил окружение и тему на домене магазина, запустил загрузку
      ассортимента и отдельно настроил вывод размеров. После завершения
      предложил проверить именно этот элемент карточек, чтобы приёмка не свелась
      к появлению новых товаров в админке.
  - type: text
    title: Результат и проверка
    body: В отчёте о сдаче — 9 645 загруженных товаров. Заказчик отдельно одобрил
      размеры и принял работу. Перестройка мужского и женского разделов,
      навигации и главной обсуждалась уже как следующий этап.
