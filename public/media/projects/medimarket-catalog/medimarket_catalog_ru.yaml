title: "MediMarket24: сборка каталога из партнёрских фидов"
tagline: Обновлять предложения и цены, не теряя редакционные данные, структуру
  категорий и ссылки на карточки при очередной сборке.
year: "2026"
role: Веб-разработка и автоматизация
stack:
  - Astro
  - Node.js
  - Python
  - GitHub Actions
blocks:
  - type: text
    title: Задача и ограничения
    body: Обновлять предложения и цены, не теряя редакционные данные, структуру
      категорий и ссылки на карточки при очередной сборке.
  - type: text
    title: Как устроено решение
    body: Разделил получение фидов, нормализацию, сопоставление категорий и
      объединение с редакционными данными. Добавил отдельные проверки покрытия
      контентом и подготовки изображений, сборку sitemap и автоматизированный
      деплой.
  - type: text
    title: Результат и проверка
    body: Доступность сервисов переобхода не приравнивается к успешной публикации
      или индексации. Статусы Яндекса, IndexNow и Google отслеживаются
      раздельно, чтобы ошибка одного сервиса не маскировала состояние сборки.
