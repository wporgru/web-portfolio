title: Продажа цифрового гайда без шага корзины
tagline: "Сократить путь от предложения до оплаты и выдачи гайда: покупатель
  должен сразу попадать на оформление и получить ссылку после покупки."
year: "02.2026"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Digital products
blocks:
  - type: text
    title: Задача и ограничения
    body: "Сократить путь от предложения до оплаты и выдачи гайда: покупатель должен
      сразу попадать на оформление и получить ссылку после покупки."
  - type: text
    title: Как устроено решение
    body: Связал цифровой товар, страницу оформления и письмо. После замечания
      клиента устранил увеличение количества товара при обновлении checkout.
      Настроил вывод ссылки и показал, где управлять ценой, письмом, лимитами
      скачивания и сроком доступа.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил исправление и принял заказ. Передал видеоинструкции. Сам
      файл и окончательный адрес гайда клиент добавлял самостоятельно;
      фискализация не входила в этап.
