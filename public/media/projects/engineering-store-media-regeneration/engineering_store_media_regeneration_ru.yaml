title: Оптимизация медиатеки магазина оборудования
tagline: "Подготовил изображения магазина к сжатию, не меняя все файлы подряд: в
  медиатеке часть изображений использовалась не в каталоге, а в оформлении
  сайта."
year: "11.2022"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Image optimization
  - Media library
  - Thumbnails
blocks:
  - type: text
    title: Задача и ограничения
    body: "Подготовил изображения магазина к сжатию, не меняя все файлы подряд: в
      медиатеке часть изображений использовалась не в каталоге, а в оформлении
      сайта."
  - type: text
    title: Как устроено решение
    body: Согласовал обработку исходников и перегенерацию миниатюр. Собрал списки
      нужных изображений по папкам года и месяца и объяснил, почему сплошная
      замена могла нарушить оформление. После обработки передал сайт на
      проверку.
  - type: text
    title: Результат и проверка
    body: Клиент проверил и принял работу. Полный список изменённых файлов и
      сопоставимые замеры веса или скорости не сохранились.
