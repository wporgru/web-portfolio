title: "Goodwin Shop: переход на PHP 8.3 после сбоя"
tagline: Предыдущая попытка сменить версию PHP привела к остановке магазина и
  откату. Требовалось обновить среду, не оставив клиента с недоступной витриной.
year: "10.2026"
role: Веб-разработка и автоматизация
stack:
  - PHP 8.3
  - WordPress
  - WooCommerce
blocks:
  - type: text
    title: Исходная ситуация
    body: По словам заказчика, магазин работал на PHP 7.4.33. Предыдущая попытка
      включить PHP 8.3 привела к отказу сайта и возврату старой версии. В такой
      ситуации важно не просто изменить переключатель, а отдельно согласовать
      проверку работоспособности после изменения.
  - type: text
    title: Согласование доступа и обновления
    body: Проверил предоставленные данные для входа, запросил исправленный доступ к
      панели хостинга и после получения рабочего доступа выполнил переход.
      Клиент затем сообщил, что видит PHP 8.3, и подтвердил работу сайта.
      Перенос на другой хостинг в этот этап не входил.
  - type: text
    title: Что подтверждено, а что требует отдельной проверки
    body: Заказчик принял работу и сообщил, что сайт работает. Конкретный патч
      совместимости в сохранённой переписке не описан; обновление всех плагинов,
      проверку резервной копии, оплату и корзину как выполненные действия не
      заявляю. PHP 8.5 обсуждалась как отдельная проверка, но её итоговое
      включение не подтверждено.
  - type: text
    title: Как подготовить обновление своего магазина
    body: Пришлите текущую версию PHP, версию WordPress, адрес магазина и описание
      ошибки после предыдущего переключения. Для первой оценки доступы не нужны.
      Отдельно согласуем резервную копию, проверку на тестовой версии, окно
      переключения и сценарии корзины, оплаты и уведомлений.
  - type: image
    src: /media/projects/goodwin-php/later-site.webp
    title: Сохранённый вид магазина
    alt: Полностраничный снимок магазина Goodwin Shop
    caption: Публичная главная 30 октября 2026 года, без обрезки. Снимок не
      подтверждает версию PHP и работу оплаты.
