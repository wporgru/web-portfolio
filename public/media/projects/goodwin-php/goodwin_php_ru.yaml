title: "Goodwin Shop: переход на PHP 8.3 после сбоя"
tagline: Предыдущая попытка сменить версию PHP привела к остановке магазина и
  откату. Требовалось обновить среду, не оставив клиента с недоступной витриной.
year: "10.2026"
role: Веб-разработка и автоматизация
stack:
  - PHP 8.3
  - WordPress
  - WooCommerce
blocks:
  - type: text
    title: Задача и ограничения
    body: Предыдущая попытка сменить версию PHP привела к остановке магазина и
      откату. Требовалось обновить среду, не оставив клиента с недоступной
      витриной.
  - type: text
    title: Как устроено решение
    body: Восстановил рабочий доступ к хостингу, выполнил переход на PHP 8.3 и
      передал сайт заказчику для проверки. Вместо обещания совместимости с любой
      версией отдельно обсудил, как клиент может проверить PHP 8.5.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил смену версии и работу сайта, затем принял заказ. Переезд
      хостинга, окончательный переход на 8.5 и тестирование всех сценариев
      покупки в результат не включены.
