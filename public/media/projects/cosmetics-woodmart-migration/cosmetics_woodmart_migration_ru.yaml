title: Переезд косметического магазина на WoodMart через стенд
tagline: Действующий магазин нельзя было менять до согласования новой версии.
  Нужно было перенести оформление на отдельную копию, сверить страницы и только
  потом заменить основную витрину.
year: "09.2025"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WoodMart
  - Elementor
  - Staging
blocks:
  - type: text
    title: Задача и ограничения
    body: Действующий магазин нельзя было менять до согласования новой версии. Нужно
      было перенести оформление на отдельную копию, сверить страницы и только
      потом заменить основную витрину.
  - type: text
    title: Как устроено решение
    body: "Разделил работу на подготовку и переключение: до согласования все правки
      оставались на тестовом адресе. Доработал главную на WoodMart, объяснил,
      где редактировать блоки Elementor, цвета и баннер для телефона. Выгрузил
      списки страниц старой и новой витрин в две таблицы Excel и показал
      заказчику расхождение: на новой версии не оказалось страницы распродажи.
      Пока заказчик готовил часть баннеров и контента, он мог сверять обе
      версии; замену начал после его подтверждения."
  - type: text
    title: Результат и проверка
    body: Заказчик принял перенос. Вместо замены вслепую он получил наглядную сверку
      страниц и согласовал новую витрину до переключения. Таблицы не заменяют
      полного аудита URL, метаданных и редиректов; позднее добавление страницы
      распродажи отдельно не подтверждено.
  - type: text
    title: Главная из архива проекта
    links:
      - label: Оригинал в портфолио Kwork
