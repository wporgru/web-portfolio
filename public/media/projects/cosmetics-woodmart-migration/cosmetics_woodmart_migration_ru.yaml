title: Переезд косметического магазина на WoodMart через стенд
tagline: Действующий магазин нельзя было менять до согласования новой версии.
  Нужно было перенести оформление на отдельную копию, сверить страницы и только
  потом заменить основную витрину.
year: "09.2025"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WoodMart
  - Elementor
  - Staging
blocks:
  - type: text
    title: Задача и ограничения
    body: Действующий магазин нельзя было менять до согласования новой версии. Нужно
      было перенести оформление на отдельную копию, сверить страницы и только
      потом заменить основную витрину.
  - type: text
    title: Как устроено решение
    body: Развернул копию, установил WoodMart и показал, где редактировать блоки,
      цвета и мобильный баннер. Сравнил обе версии в отдельных Excel-выгрузках и
      отметил отсутствующую страницу распродажи. Доработал главную и приступил к
      замене после разрешения клиента.
  - type: text
    title: Результат и проверка
    body: Клиент принял результат. Тестовый адрес — этап одного проекта. Полный
      аудит SEO-полей и добавление страницы распродажи не подтверждены.
