title: Migrating a cosmetics store to WoodMart using staging
tagline: The live store needed to stay intact until the replacement was
  approved. The brief was to build on a copy, compare pages and only then switch
  the live storefront.
year: "09.2025"
role: Web development and automation
stack:
  - WordPress
  - WoodMart
  - Elementor
  - Staging
blocks:
  - type: text
    title: Brief and constraints
    body: The live store needed to stay intact until the replacement was approved.
      The brief was to build on a copy, compare pages and only then switch the
      live storefront.
  - type: text
    title: How it works
    body: "Split the work into preparation and cutover: all revisions stayed on
      staging until approval. Refined the WoodMart homepage and showed the
      client where to edit Elementor blocks, colors and the mobile banner.
      Exported the old and new page lists into separate Excel files, flagging
      that the replacement was missing the sale page. The client could compare
      the two storefronts while preparing some of the banners and content. I
      began the cutover after approval."
  - type: text
    title: Result and verification
    body: The client accepted the migration. Rather than switching without a review,
      they had a side-by-side page comparison and approved the replacement
      before cutover. The spreadsheets were not a full audit of URLs, metadata
      or redirects; later restoration of the sale page is not separately
      confirmed.
  - type: text
    title: Archived project homepage
    links:
      - label: Original Kwork portfolio entry
        url: https://kwork.ru/portfolio/18848055
