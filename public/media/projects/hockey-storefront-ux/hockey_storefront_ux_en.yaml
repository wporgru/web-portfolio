title: Redesigning product cards and the mobile storefront
tagline: After the catalog migration, the store needed easier variation
  selection, less clutter and clearer availability. The work spanned catalog
  cards, product pages and mobile components.
year: "02.2024"
role: Web development and automation
stack:
  - WooCommerce
  - WoodMart
  - Mobile layout
