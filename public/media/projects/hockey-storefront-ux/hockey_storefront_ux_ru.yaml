title: Редизайн карточек и мобильной витрины магазина
tagline: После переноса каталога нужно было облегчить выбор вариации, разгрузить
  карточки и сделать доступность товара понятнее. Задача затрагивала каталог,
  страницу товара и мобильные блоки.
year: "02.2024"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - WoodMart
  - Mobile layout
  - Product variants
blocks:
  - type: text
    title: Задача и ограничения
    body: После переноса каталога нужно было облегчить выбор вариации, разгрузить
      карточки и сделать доступность товара понятнее. Задача затрагивала
      каталог, страницу товара и мобильные блоки.
  - type: text
    title: Как устроено решение
    body: Убрал кнопку покупки из плитки каталога, заменил выпадающий список
      вариаций кнопками и добавил карусель изображений отзывов. Настроил вывод
      отсутствующих позиций в конце списка. На телефоне убрал лишнюю нижнюю
      плашку, раскрыл описание товара и скорректировал размещение блока доставки
      и самовывоза.
  - type: text
    title: Результат и проверка
    body: Команда клиента проверила и приняла результат. Смена адреса администратора
      подтверждена; доставку уведомлений в Telegram не считаю завершённой.
  - type: text
    title: Другой этап этого проекта
    links:
      - label: "Предыдущий этап: перенос каталога из InSales"
        url: /showcase/hockey-insales-woodmart/
