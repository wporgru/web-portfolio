title: "Завод «ПОТОК»: каталог и подбор отопителей по параметрам"
tagline: Вместо обычной витрины с длинным прайсом — интерфейс, в котором инженер находит
  оборудование по артикулу, а покупатель без артикула подбирает модель по своей машине и
  задаче.
year: "11.2026"
role: Прототипирование и фронтенд-разработка
stack:
  - HTML
  - CSS
  - JavaScript
  - Product configurator
  - Browser testing
blocks:
  - type: text
    title: Два покупателя, два входа в каталог
    body: "Специалист по ремонту часто приходит с артикулом или кодом аналога. Владельцу
      машины, наоборот, нужно сначала понять, что ему подходит: предпусковой подогреватель
      для двигателя или воздушный отопитель кабины. Спроектировал для завода «ПОТОК» два
      маршрута: прямой поиск по каталогу и пошаговый подбор без знания артикула."
  - type: text
    title: Каталог, в котором можно искать по знакомому коду
    body: "Разделил 25 демонстрационных позиций на три группы: 13 жидкостных подогревателей, 5
      воздушных отопителей и 7 позиций управления и GSM. Добавил совместимые фильтры по
      типу оборудования, топливу и напряжению, поиск по названию, артикулу, кросс-коду и
      названию аналога. Если совпадений нет, интерфейс предлагает сбросить фильтры вместо
      пустой страницы."
  - type: text
    title: Подбор модели и передача контекста в заявку
    body: "Собрал конфигуратор из трёх вопросов: тип транспорта, задача обогрева и топливо.
      Например, для грузовика с обогревом кабины интерфейс предложил дизельный отопитель
      24 В с артикулом PV224VD. Кнопка подставляет название и артикул в форму запроса —
      покупателю не нужно переписывать их, а в рабочей версии менеджер сможет сразу
      увидеть, о каком оборудовании идёт речь."
  - type: text
    title: Инженерная схема вместо статичной картинки
    body: Подготовил схему подогревателя с пятью интерактивными узлами. Точки на чертеже и
      отдельные кнопки открывают одну и ту же карточку с пояснением и характеристиками.
      Так покупатель может изучить устройство без перехода в PDF или на другую страницу.
  - type: image
    title: Витрина «ПОТОК» — вся страница прототипа
    alt: "Полностраничный снимок прототипа ПОТОК: витрина отопителей, инженерная схема,
      каталог, подбор и форма"
    caption: Снимок локального прототипа при ширине 1440 px. Страница не обрезана; номер в
      макете скрыт. Это не снимок опубликованного сайта.
    src: /media/projects/potoc-heater-selection-prototype/prototype-full.webp
  - type: text
    title: Что проверено и что осталось до запуска
    body: "На локальном прототипе при 1440 и 390 px проверил каталог, переключение в группу из
      пяти моделей, поиск одного артикула, сброс пустой выдачи, переключение узла на схеме
      и передачу артикула в форму. Форма имитирует отправку: почта и CRM не подключены. На
      390 px у прототипа остаётся горизонтальный выход за край; на этапе запуска нужно его
      устранить, сверить данные и цены с рабочим источником и принять сквозной сценарий
      доставки заявки."
  - type: text
    title: Хотите сделать каталог, который помогает выбрать товар?
    body: Пришлите прайс, три-пять типичных товаров и пару вопросов, которые клиенты задают
      менеджерам перед покупкой. По ним определю, какие свойства вывести в фильтры, где
      нужен пошаговый подбор и что передавать вместе с заявкой.
    links:
      - label: Что входит в редизайн сайта
        url: /services/website-redesign/
