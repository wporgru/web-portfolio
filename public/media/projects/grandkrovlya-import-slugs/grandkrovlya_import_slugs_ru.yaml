title: 'Grandkrovlya: восстановление импорта и адресов'
tagline: Разобрал, почему при повторной загрузке товаров не срабатывала транслитерация адресов
  WooCommerce.
year: '08.2022'
role: Веб-разработка и автоматизация
stack:
- WordPress
- WooCommerce
- Import
- URL transliteration
blocks:
- type: text
  title: Задача и ограничения
  body: Разобрал, почему при повторной загрузке товаров не срабатывала транслитерация адресов
    WooCommerce.
- type: text
  title: Как устроено решение
  body: Проверил настройки транслитерации и совместимость импортёра после обновления WordPress
    и WooCommerce. Обновил импортёр, включил нужную настройку и повторил загрузку, чтобы проверить
    результат на реальных карточках.
- type: text
  title: Результат и проверка
  body: Клиент подтвердил исправление, принял заказ и добавил бонус. Изменение поискового трафика
    по этим работам не измерялось.
- type: text
  title: Проблема в рабочем каталоге
  body: После изменений в WordPress и WooCommerce новые товары появлялись в административной
    части, но возникали вопросы к их отображению в каталоге, а адреса формировались кириллицей.
    Для действующего магазина это затрудняло проверку повторной загрузки и предсказуемое формирование
    ссылок.
- type: text
  title: Диагностика и повторная загрузка
  body: Разобрал настройки транслитерации и совместимость WP All Import с обновлёнными компонентами.
    В рамках работы импортёр обновили, нужную настройку включили и повторили импорт. Клиент
    подтвердил решение, принял работу и оставил положительный отзыв с бонусом.
- type: text
  title: Границы результата
  body: Подтверждение клиента относится к исправлению этого этапа импорта. Изменение органического
    трафика, полная модерация товарных страниц и долгосрочная бесперебойность импорта отдельно
    не измерялись.
