title: "Grandkrovlya: восстановление импорта и адресов"
tagline: Разобрал, почему при повторной загрузке товаров не срабатывала
  транслитерация адресов WooCommerce.
year: "08.2022"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - Import
  - URL transliteration
blocks:
  - type: text
    title: Задача и ограничения
    body: Разобрал, почему при повторной загрузке товаров не срабатывала
      транслитерация адресов WooCommerce.
  - type: text
    title: Как устроено решение
    body: Проверил настройки транслитерации и совместимость импортёра после
      обновления WordPress и WooCommerce. Обновил импортёр, включил нужную
      настройку и повторил загрузку, чтобы проверить результат на реальных
      карточках.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил исправление, принял заказ и добавил бонус. Изменение
      поискового трафика по этим работам не измерялось.
