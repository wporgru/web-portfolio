title: "WiseSpace: импорт партнёрского каталога оптики"
tagline: Подобрать подходящий товарный источник и импортировать на WordPress
  каталог телескопов и биноклей.
role: Веб-разработка
year: "02.2018"
stack:
  - WordPress
  - YML
  - Affiliate catalog
blocks:
  - type: text
    title: Задача
    body: Подобрать подходящий товарный источник и импортировать на WordPress
      каталог телескопов и биноклей.
  - type: text
    title: Что сделано
    body: Согласовал клиентский YML и партнёрский код, запустил импорт и сообщил о 1
      634 товарах; заказчик принял этап.
  - type: text
    title: Как решалась задача
    body: "Изначальный файл примерно на 9 000 товаров не подошёл: в нём были
      посторонние группы, неподходящая валюта и недостаточно описаний. После
      проблем с доступом сообщил об обновлении PHP с 5.2 до 7.0 и подготовке
      импортных инструментов. Согласовали предоставленный клиентом YML 4glaza.ru
      и подтверждённый партнёрский код; после загрузки сообщил о 1 634 товарах.
      Это историческое число из отчёта, а не независимый пересчёт. Еженедельный
      cron и реальные последующие обновления только обсуждались; партнёрские
      комиссии и доход не подтверждены."
