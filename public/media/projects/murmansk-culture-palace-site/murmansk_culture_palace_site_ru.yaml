title: Сайт Мурманского областного дворца культуры
tagline: "Подготовил сайт учреждения культуры: афиши, коллективы и новости
  должны были быть доступны с главной, а отзывы публиковаться только после
  проверки."
year: "03.2020"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Event listings
  - Content moderation
  - Site handoff
blocks:
  - type: text
    title: Задача и ограничения
    body: "Подготовил сайт учреждения культуры: афиши, коллективы и новости должны
      были быть доступны с главной, а отзывы публиковаться только после
      проверки."
  - type: text
    title: Как устроено решение
    body: Развернул рабочую версию на временной площадке. Согласовал логотип, цвета
      и замену фотографии здания блоком афиш. Уточнил представление коллективов
      и оформление шапки. Вместе с заказчиком проверил, что пробный отзыв не
      появляется без модерации. Передал архив сайта с базой данных.
  - type: text
    title: Результат и проверка
    body: Клиент принял работу и оставил отзыв. Подтверждена передача архива, а не
      его установка на постоянном домене или работа билетной системы.
