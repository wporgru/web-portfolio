title: Статусы наличия и сроки поставки на витрине Aurora
tagline: После настройки фида покупателю нужно было показать, какие товары можно
  получить сразу, а какие придётся ждать. Повторяющиеся подписи в списке
  перегружали карточки.
year: "09.2025"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - W3 Total Cache
  - Product labels
blocks:
  - type: text
    title: Задача и ограничения
    body: После настройки фида покупателю нужно было показать, какие товары можно
      получить сразу, а какие придётся ждать. Повторяющиеся подписи в списке
      перегружали карточки.
  - type: text
    title: Как устроено решение
    body: "Подготовил вывод согласованных сроков, показал клиенту и убрал
      дублирующую надпись под кнопкой в каталоге, оставив стикер. Отдельно
      разобрал расхождение цен: после очистки кэша оно исчезало, а в сценарии
      участвовал W3 Total Cache."
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил оформление и оплатил этот этап отдельно от импорта фида.
      Исторические сроки не являются актуальными условиями поставки; полный
      аудит кэша в этап не входил.
