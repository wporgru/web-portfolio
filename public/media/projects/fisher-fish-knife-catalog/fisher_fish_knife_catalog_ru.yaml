title: "Fisher Fish: импорт ножевого каталога и исправление цен"
tagline: Импортировать ножевой каталог с категориями, характеристиками,
  изображениями и корректными ценами.
role: Веб-разработка
year: "04.2018"
stack:
  - WooCommerce
  - Product import
  - Images
blocks:
  - type: text
    title: Задача
    body: Импортировать ножевой каталог с категориями, характеристиками,
      изображениями и корректными ценами.
  - type: text
    title: Что сделано
    body: Доработал характеристики и изображения, проверил цены и обработал
      проблемные позиции; заказчик принял этап.
  - type: text
    title: Как решалась задача
    body: После загрузки исправлял пропуски атрибутов и остатков, запускал
      регенерацию и добавлял изображения категорий; часть исходных фотографий
      подготовил клиент. В исходной выгрузке обнаружились оптовые цены, поэтому
      дополнительно собирал и корректировал цены. Сначала перевёл 227 товаров
      без фото или цены в черновики, но клиент попросил продолжить исправление.
      В финальном отчёте сообщил о ручной обработке 47 товаров без фото и 180
      оставшихся черновиках с нулевой ценой. Это исторический отчёт, не
      независимая сверка всего каталога; полнота категорий и отсутствие дублей
      не подтверждены.
