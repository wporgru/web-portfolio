    title: Публичный вид сайта
    src: /media/projects/elementor-editor-recovery/later-homepage.webp
    alt: Публичная главная «Фаэтон»
    caption: Публичная версия от 23 октября 2026 года, без обрезки. Снимок не является
      проверкой полноты статей из исходной таблицы.
