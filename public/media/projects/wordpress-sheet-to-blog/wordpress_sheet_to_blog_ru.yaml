title: Перенос материалов из Google Таблиц в блог WordPress
tagline: Статьи были подготовлены в таблице, а нужны были как записи на
  действующем сайте. Заказчику требовалось получить готовый раздел блога, не
  заводя материалы заново вручную.
year: "03.2026"
role: Веб-разработка и автоматизация
stack:
  - Google Sheets
  - WordPress
  - Content migration
blocks:
  - type: text
    title: Задача и ограничения
    body: Статьи были подготовлены в таблице, а нужны были как записи на действующем
      сайте. Заказчику требовалось получить готовый раздел блога, не заводя
      материалы заново вручную.
  - type: text
    title: Как устроено решение
    body: "Использовал предоставленную таблицу как источник, перенёс содержимое в
      раздел записей и передал страницу блога для проверки. В описании отделяю
      перенос от подготовки исходных текстов и изображений: задача была именно в
      публикации уже предоставленных материалов."
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил перенос и принял работу. В переписке нет итогового
      пересчёта статей, поэтому объём не подменяется предположением.
