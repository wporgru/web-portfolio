title: "DOLLOR: импорт оборудования и обновление цен"
tagline: Названия в магазине и выгрузке не совпадали, а артикулы были заполнены не везде.
  Сопоставление по одному названию рисковало обновить цену не той модели.
year: "06.2026"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Supplier feed
  - SKU mapping
blocks:
  - type: text
    title: Когда импорт нельзя начинать с названий
    body: Заказчик уже завёл часть оборудования вручную, но названия в магазине и XML/YML
      поставщика различались. Если сопоставить похожие записи только по названию, цена может
      попасть к другой модели. После заполнения артикулов заказчиком настроил привязку по
      коду поставщика и разделил обновление существующих товаров и создание новых.
  - type: text
    title: Что происходило с проблемными артикулами
    body: "В выгрузке обнаружились две модели с одинаковым vendorCode и одна позиция без него.
      Зафиксировал ограничения и согласовал временное поведение: при конфликте второй товар
      перезаписывает первый, а позиция без кода не импортируется. Это не идеальная схема и
      не гарантия отсутствия потерь; исправление исходного кода поставщиком осталось
      отдельной задачей."
  - type: text
    title: Цены и доступность — разные данные
    body: "В отчёте этапа указаны 32 созданных товара и обновление цен у 63 позиций. При
      отсутствии новых карточек процесс был настроен на обновление цен. Поскольку фид не
      содержал подтверждённых складских остатков, согласовали условную доступность по
      присутствию в выгрузке: товар в файле считался доступным, исчезнувший — недоступным.
      Это не проверка фактического остатка поставщика."
  - type: text
    title: Запуск и приёмка
    body: Сообщил о расписании запуска в 01:00; часовой пояс сервера и серия последующих ночных
      выполнений в сохранившихся материалах не подтверждены. Заказчик принял этап 15 июня
      2026 года. Полные названия новых карточек и исправление конфликтующего кода требовали
      дальнейшей работы.
  - type: text
    title: Хотите автоматизировать обновление каталога?
    body: Пришлите обезличенный образец выгрузки, несколько артикулов в магазине и правила,
      какие поля можно обновлять. До массового запуска проверю совпадение кодов, дубли,
      отсутствующие позиции и поведение повторного импорта на небольшой выборке.
    links:
      - label: Настройка импорта и обновления товаров
