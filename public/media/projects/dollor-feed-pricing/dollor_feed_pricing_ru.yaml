title: "DOLLOR: импорт оборудования и обновление цен"
tagline: Названия в магазине и выгрузке не совпадали, а артикулы были заполнены
  не везде. Сопоставление по одному названию рисковало обновить цену не той
  модели.
year: "06.2026"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Supplier feed
  - SKU mapping
blocks:
  - type: text
    title: Задача и ограничения
    body: Названия в магазине и выгрузке не совпадали, а артикулы были заполнены не
      везде. Сопоставление по одному названию рисковало обновить цену не той
      модели.
  - type: text
    title: Как устроено решение
    body: После заполнения артикулов заказчиком настроил сопоставление по коду
      поставщика. Выявил один повторяющийся код у разных моделей и запись без
      кода; согласовал временное поведение для обоих исключений. Настроил
      заявленный ежедневный запуск в 01:00 и отделил доступность по присутствию
      в фиде от реальных складских остатков.
  - type: text
    title: Результат и проверка
    body: В отчёте — 32 новых товара и обновление цен у 63 товаров; клиент принял
      этап. Исправление повторяющегося кода поставщиком и подтверждение серии
      ночных запусков оставались отдельными вопросами.
