title: "Nazim 1001: каталог на трёх языках"
tagline: Собрал основу каталога с азербайджанской, английской и русской
  версиями. Для оформления заявки выбрали согласование оплаты без
  онлайн-списания.
year: "12.2021"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - WPBakery
  - Localization
blocks:
  - type: text
    title: Задача и ограничения
    body: Собрал основу каталога с азербайджанской, английской и русской версиями.
      Для оформления заявки выбрали согласование оплаты без онлайн-списания.
  - type: text
    title: Как устроено решение
    body: Настроил товары, корзину и оформление заказа, опубликовал необходимые
      страницы и показал экран подтверждения. Восстановил баннеры, изменил
      порядок блоков и оформил отзывы слайдером. Подготовил три языковых
      направления, доработал переключатель и объяснил владельцу редактирование
      текста и стилей в WPBakery.
  - type: text
    title: Результат и проверка
    body: Клиент проверил сценарий и принял работу. Переводы и наполнение оставались
      за владельцем; перенос на конечный домен не подтверждён.
