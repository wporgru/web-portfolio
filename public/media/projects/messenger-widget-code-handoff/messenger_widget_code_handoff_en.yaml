title: Delivering an HTML CSS and JavaScript messenger widget
tagline: The client needed a ready-made contact widget with WeChat and other channels. The
  engagement covered code and instructions, not installation on an unidentified website.
year: "07.2026"
role: Web development and automation
stack:
  - HTML
  - CSS
  - JavaScript
  - Messaging
blocks:
  - type: text
    title: Brief and constraints
    body: The client needed a ready-made contact widget with WeChat and other channels. The
      engagement covered code and instructions, not installation on an unidentified
      website.
  - type: text
    title: How it works
    body: Delivered six code variants, pointed to the WeChat option and explained where to
      replace contact links in the configuration block. Provided placement instructions
      for the end of the body. The recovered selected variant includes Telegram, MAX,
      WeChat, phone, email and SMS.
  - type: text
    title: Checked rendering at two viewport sizes
    body: The chosen HTML/CSS/JS snippet embeds styles and icons without external scripts. In
      an isolated browser the menu opened from its button and closed with Escape. At
      1200×900 and 390×844 all six links fit on screen. Messaging apps, calls and message
      delivery were not tested.
  - type: text
    title: Result and verification
    body: The client received the variants and a specific option to install. Code delivery is
      documented; deployment on the client’s website was not verified.
  - type: image
    src: /media/projects/messenger-widget-code-handoff/widget-desktop-render.png
    title: Desktop rendering · 1200×900
    alt: Open widget menu with six contact options at 1200×900
    caption: The delivered HTML rendered on October 30, 2026, uncropped. The widget was tested
      on a blank page, not the client site. Contact links were not activated.
  - type: image
    src: /media/projects/messenger-widget-code-handoff/widget-mobile-render.png
    title: Mobile rendering · 390×844
    alt: Open widget menu with six contact options at 390×844
    caption: The delivered HTML rendered on October 30, 2026, uncropped. The widget was tested
      on a blank page, not the client site. Contact links were not activated.
