title: Готовый виджет мессенджеров на HTML CSS и JS
tagline: Заказчику нужен был готовый контактный блок с WeChat и другими способами связи.
  Работа заключалась в передаче кода и инструкции, а не во внедрении на неизвестный сайт.
year: "07.2026"
role: Веб-разработка и автоматизация
stack:
  - HTML
  - CSS
  - JavaScript
  - Messaging
blocks:
  - type: text
    title: Задача и ограничения
    body: Заказчику нужен был готовый контактный блок с WeChat и другими способами связи.
      Работа заключалась в передаче кода и инструкции, а не во внедрении на неизвестный
      сайт.
  - type: text
    title: Как устроено решение
    body: Передал шесть вариантов кода, указал нужную комбинацию с WeChat и показал, где в
      начале файла заменить собственные ссылки. Объяснил размещение перед закрывающим
      тегом body. В восстановленном оригинале выбранного варианта доступны Telegram, MAX,
      WeChat, телефон, email и SMS.
  - type: text
    title: Проверил отрисовку на двух экранах
    body: В выбранном HTML/CSS/JS-фрагменте стили и иконки встроены, внешние скрипты не
      подключаются. В изолированном браузере меню открылось кнопкой и закрылось по Escape.
      При 1200×900 и 390×844 все шесть ссылок помещались на экране. Приложения, звонки и
      отправку сообщений не запускал.
  - type: text
    title: Результат и проверка
    body: Клиент получил комплект и конкретный вариант для самостоятельной установки.
      Подтверждена передача кода; публикация на сайте клиента не проверялась.
