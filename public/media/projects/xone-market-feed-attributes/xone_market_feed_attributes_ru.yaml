title: "X-ONE: товарные характеристики и YML для Маркета"
tagline: Подготовил отдельные характеристики аксессуаров для Яндекс Маркета, сохранив
  фильтры магазина. Настроил состав YML и доработал данные после замечаний модерации.
year: "03.2020"
role: Товарные данные и интеграция фидов
stack:
  - WooCommerce
  - YML
  - Yandex Market
  - Product attributes
blocks:
  - type: text
    title: Разделил задачи магазина и площадки
    body: Для плёнок, стёкол, чехлов и аксессуаров для часов требовались характеристики для
      Яндекс Маркета без потери существующих фильтров магазина. Подготовил таблицу для
      заполнения и объяснил, как задавать множественные значения и признаки.
  - type: text
    title: Уточнил модели и свойства
    body: Разделил Huawei и Honor, добавил атрибуты моделей, материала и совместимости. После
      замечаний уточнял покрытия, матовость и глянцевость. Настроил состав характеристик в
      YML-плагине.
  - type: text
    title: Доработал после модерации
    body: Первую сдачу вернули с ошибками. Исправлял передачу характеристик и разделение
      iPhone X и XS; последнее подтвердил клиент. Для терявшегося знака плюс в моделях
      Samsung согласовали Plus и запустили обновление.
  - type: text
    title: Что подтверждено
    body: Клиент принял работу. Появление предложений на площадке зафиксировано в отчёте
      исполнителя; полного независимого аудита всех карточек и фильтров нет. Корзина,
      эквайринг и расчёт доставки не заявлены результатом этого этапа.
  - type: image
    title: Публичный сайт, поздний снимок
    src: /media/projects/xone-accessories-catalog-update/homepage-20261104.webp
    alt: Полностраничный снимок магазина аксессуаров X-ONE
    caption: Публичная главная от 4 ноября 2026 года, без обрезки. Поздний снимок не
      подтверждает состав исторического фида или статус предложений на площадке.
