title: Перенос мебельного каталога в WooCommerce
tagline: Разобрал перенос товаров мебельного поставщика в существующий
  WooCommerce-каталог, где требовалось сохранить связь между карточками,
  фотографиями, категориями и атрибутами.
year: "01.2019"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - CSV
  - XML
  - Catalog Migration
blocks:
  - type: text
    title: Задача и ограничения
    body: Разобрал перенос товаров мебельного поставщика в существующий
      WooCommerce-каталог, где требовалось сохранить связь между карточками,
      фотографиями, категориями и атрибутами.
  - type: text
    title: Как устроено решение
    body: Когда первый подход через XML не дал ожидаемого результата по фото и
      атрибутам, перешёл к извлечению данных из каталога и CSV-импорту. Повторно
      показал загруженные карточки. По замечанию клиента сообщил об откате
      изменения базы адресов категорий — для действующего магазина это отдельная
      зона проверки, а не часть переноса товаров.
  - type: text
    title: Результат и проверка
    body: Импорт принял заказчик, но отметил пустые атрибуты и недостающие
      посадочные группы. Кейс показывает смену подхода к переносу, а не полное
      закрытие всех требований или подтверждённое сохранение поисковых позиций.
