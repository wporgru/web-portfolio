title: Перенос 205 товаров из двух источников
tagline: Клиенту требовалось пополнить уже работающий магазин ассортиментом с двух сайтов без
  ручного создания каждой карточки.
year: '02.2026'
role: Веб-разработка и автоматизация
stack:
- WooCommerce
- Data import
blocks:
- type: text
  title: Задача и ограничения
  body: Клиенту требовалось пополнить уже работающий магазин ассортиментом с двух сайтов без
    ручного создания каждой карточки.
- type: text
  title: Как устроено решение
  body: Перенёс товары в WooCommerce и передал прямую ссылку на витрину, чтобы клиент мог проверить
    результат в каталоге. В отчёте о сдаче указано 205 позиций, а не оценка исходного объёма.
- type: text
  title: Результат и проверка
  body: Заказчик принял перенос и отметил качество и скорость. Это разовая загрузка ассортимента;
    постоянная синхронизация, касса и доставка не входили в результат.
- type: image
  title: Публичный вид сайта
  src: /media/projects/elementor-editor-recovery/later-homepage.webp
  alt: Публичная главная «Фаэтон»
  caption: Публичная версия от 23 октября 2026 года, без обрезки. Более поздний вид не подтверждает
    состав 205 импортированных товаров.
- type: text
  title: Перенос в действующий магазин
  body: 'Задача касалась уже существующего магазина: ассортимент нужно было собрать с двух источников
    и разместить в WooCommerce, а не создавать новый интернет-магазин с нуля. В отчёте о сдаче
    указано 205 перенесённых товаров; эту цифру сохраняю как итог исторического отчёта, а не
    как сегодняшний пересчёт базы.'
- type: text
  title: Приёмка и границы
  body: Для проверки передал заказчику ссылку на раздел магазина. Заказчик принял работу и отметил
    скорость и качество. Домены источников и полный состав перенесённых полей по доступным материалам
    достоверно не установлены; полнота фотографий, описаний и атрибутов требует отдельной сверки.
- type: text
  title: Для похожих задач
  body: Разовый перенос каталога помогает наполнить магазин без ручного создания каждой карточки.
    Если требуется регулярное обновление цен и остатков, сопоставление дублей или настройка
    доставки и оплаты, это следует согласовать и проверить отдельно.
