title: Перенос 205 товаров из двух источников
tagline: Клиенту требовалось пополнить уже работающий магазин ассортиментом с
  двух сайтов без ручного создания каждой карточки.
year: "02.2026"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Data import
blocks:
  - type: text
    title: Задача и ограничения
    body: Клиенту требовалось пополнить уже работающий магазин ассортиментом с двух
      сайтов без ручного создания каждой карточки.
  - type: text
    title: Как устроено решение
    body: Перенёс товары в WooCommerce и передал прямую ссылку на витрину, чтобы
      клиент мог проверить результат в каталоге. В отчёте о сдаче указано 205
      позиций, а не оценка исходного объёма.
  - type: text
    title: Результат и проверка
    body: Заказчик принял перенос и отметил качество и скорость. Это разовая
      загрузка ассортимента; постоянная синхронизация, касса и доставка не
      входили в результат.
