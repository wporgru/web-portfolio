title: SEO-подготовка WordPress перед открытием сайта
tagline: Подготовил внутреннюю структуру WordPress к запуску, пока сайт ещё не
  открывали для поисковых систем. Задача включала заголовки, изображения и
  устранение лишних компонентов.
year: "04.2024"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Clearfy
  - On-page SEO
  - Accessibility
blocks:
  - type: text
    title: Задача и ограничения
    body: Подготовил внутреннюю структуру WordPress к запуску, пока сайт ещё не
      открывали для поисковых систем. Задача включала заголовки, изображения и
      устранение лишних компонентов.
  - type: text
    title: Как устроено решение
    body: Исправил последовательность заголовков главной, добавил ALT к изображениям
      вручную и средствами плагина, перевёл настройки темы и отключил ненужные
      элементы портфолио. Сократил дублирование расширений редактора, виджетов и
      транслитерации. По обратной связи уточнил контакты и ссылки мессенджеров.
  - type: text
    title: Результат и проверка
    body: Клиент принял подготовку. Индексацию оставили закрытой до отдельного
      решения; обновление компонентов и рост поискового трафика в этап не
      входили.
