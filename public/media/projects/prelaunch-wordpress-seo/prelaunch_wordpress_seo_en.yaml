title: WordPress SEO preparation before launch
tagline: Prepared the internal structure of a WordPress site before it was
  opened to search engines, covering headings, images and redundant components.
year: "04.2024"
role: Web development and automation
stack:
  - WordPress
  - Clearfy
  - On-page SEO
  - Accessibility
blocks:
  - type: text
    title: Brief and constraints
    body: Prepared the internal structure of a WordPress site before it was opened
      to search engines, covering headings, images and redundant components.
  - type: text
    title: How it works
    body: Corrected homepage heading order, added image alt text manually and with a
      plugin, translated theme settings and disabled unused portfolio elements.
      Consolidated overlapping editor, widget and transliteration plugins.
      Updated contact and messenger links after feedback.
  - type: text
    title: Result and verification
    body: The client accepted the preparation. Indexing remained disabled pending a
      separate decision; component upgrades and traffic growth were outside this
      stage.
