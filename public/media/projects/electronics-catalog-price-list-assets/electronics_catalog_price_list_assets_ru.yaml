title: Наполнение каталога электроники по прайсу
tagline: Подготовил карточки электроники по прайсу. Покупатель должен был видеть
  конкретную комплектацию, а внутренние пометки поставщика не должны были
  попадать в названия.
year: "09.2020"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Product data
  - SKU
  - Image matching
blocks:
  - type: text
    title: Задача и ограничения
    body: Подготовил карточки электроники по прайсу. Покупатель должен был видеть
      конкретную комплектацию, а внутренние пометки поставщика не должны были
      попадать в названия.
  - type: text
    title: Как устроено решение
    body: Согласовал формат названия с моделью, памятью, цветом и SKU.
      Автоматизировал подбор фотографий из согласованных источников и показал
      пример готового товара. Отдельно предупредил, где изображения
      отсутствовали или могли не совпадать по цвету. Существующую конвертацию
      валют оставил за кодом клиента.
  - type: text
    title: Результат и проверка
    body: Заказ закрыт по истечении срока проверки; позднее клиент добавил бонус.
      Точный итоговый объём и доля совпадений фотографий независимо не
      измерялись.
