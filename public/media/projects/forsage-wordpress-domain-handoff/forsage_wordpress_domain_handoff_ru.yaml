title: "«Форсаж»: запуск готового WordPress-сайта на домене клиента"
tagline: "Автосервису требовался готовый сайт, который можно забрать на свой
  хостинг и редактировать самостоятельно. После переноса мешал прежний адрес в
  базе: клиенту нужно было получить доступ к установленной копии, а не делать
  новый дизайн."
year: "08.2023"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Elementor
  - Hosting handoff
  - Site URLs
blocks:
  - type: text
    title: Задача и ограничения
    body: "Автосервису требовался готовый сайт, который можно забрать на свой
      хостинг и редактировать самостоятельно. После переноса мешал прежний адрес
      в базе: клиенту нужно было получить доступ к установленной копии, а не
      делать новый дизайн."
  - type: text
    title: Как устроено решение
    body: Передал архив, базу и инструкцию. Перенос файлов выполнял хостинг; после
      него помог исправить адрес WordPress в базе и восстановить вход. Показал,
      где редактировать страницы в Elementor, подвал через виджеты и шапку через
      настройки темы.
  - type: text
    title: Результат и проверка
    body: Клиент принял комплект и помощь с запуском. Результат — передача рабочего
      решения и помощь после миграции, а не индивидуальный дизайн или проверка
      доставки заявок с нового домена.
