title: "SALT SWITCH: восстановление заказов и писем"
tagline: "Разобрал два разных сбоя магазина: отсутствие уведомлений и
  незавершённые заказы. Дополнительно подключил канал связи с менеджером."
year: "11.2021"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Checkout
  - Transactional email
  - WhatsApp
blocks:
  - type: text
    title: Задача и ограничения
    body: "Разобрал два разных сбоя магазина: отсутствие уведомлений и незавершённые
      заказы. Дополнительно подключил канал связи с менеджером."
  - type: text
    title: Как устроено решение
    body: Исправил домен отправителя и проверил письмо через временный сценарий
      оплаты при доставке. Отделил истечение неоплаченных заказов от почтового
      сбоя. После получения отдельного идентификатора провайдера внёс его для
      нужного домена и подключил виджет WhatsApp.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил появление новых заказов и работу виджета, затем принял
      заказ. Банковское подтверждение списания не сохранилось.
  - type: text
    title: Другой этап этого проекта
    links:
      - label: "Связанный этап: международная доставка и счета"
        url: /showcase/salt-switch-cross-border-checkout/
