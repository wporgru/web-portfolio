title: "SALT SWITCH: восстановление заказов и писем"
tagline: Разделил проблему почтовых уведомлений и незавершённых заказов,
  проверил временный тестовый сценарий и подключил прямой канал связи с менеджером.
year: "11.2021"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Checkout
  - Transactional email
  - WhatsApp
blocks:
  - type: text
    title: Два симптома — две отдельные проверки
    body: >-
      В магазине SALT SWITCH одновременно наблюдались отсутствие уведомлений и
      незавершённые заказы. Я не стал считать их одной и той же ошибкой: отдельно
      проверил отправку письма, а затем разобрал, что происходит с заказом при
      неоплаченной покупке. Это помогло не смешивать почтовый сбой с обычным
      истечением неоплаченного заказа.
  - type: text
    title: Проверил цепочку уведомлений
    body: >-
      Исправил домен отправителя и временно включил сценарий оплаты при доставке,
      чтобы проверить уведомление без успешного списания с банковской карты. Тестовое
      письмо пришло. Проверка подтвердила отправку в этом сценарии, но не является
      подтверждением реального платежа или успешной карточной транзакции.
  - type: text
    title: Привязал данные провайдера к нужному домену
    body: >-
      Отдельно исследовал незавершённые оформления. Тест с ненастоящими карточными
      данными не прошёл, поэтому я не записывал его как проверенную оплату. После
      того как клиент передал отдельный идентификатор провайдера, внёс его для
      домена salt-switch.com. Позднее клиент сообщил, что новые заказы снова начали
      поступать. Банковского подтверждения списания в материалах заказа нет.
  - type: text
    title: Добавил быстрый контакт с менеджером
    body: >-
      Подключил WhatsApp-виджет, чтобы посетитель мог напрямую связаться с менеджером.
      Клиент подтвердил работу виджета и появление новых заказов, затем принял этап.
      Это подтверждение заказчика, а не независимое измерение конверсии или проверка
      всех платёжных сценариев.
  - type: text
    title: Результат и границы
    body: >-
      В рамках одного этапа проверены отдельно тестовое письмо, сценарий заказа и
      канал связи. Магазин не создавался с нуля; реальное списание по карте отдельно
      не подтверждено. Обсуждавшаяся загрузка 30 товаров с французскими названиями
      также не доказана как выполненная в этом заказе. Связанный этап международной
      доставки и счетов описан отдельно.
  - type: text
    title: Другой этап этого проекта
    links:
