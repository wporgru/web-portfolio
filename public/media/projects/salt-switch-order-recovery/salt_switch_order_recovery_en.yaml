title: SALT SWITCH order and email recovery
tagline: Separated missing email notifications from incomplete orders, tested a
  temporary checkout scenario and added a direct contact channel for the manager.
year: "11.2021"
role: Web development and automation
stack:
  - WooCommerce
  - Checkout
  - Transactional email
  - WhatsApp
blocks:
  - type: text
    title: Two symptoms, two separate checks
    body: >-
      SALT SWITCH was experiencing missing notifications and incomplete orders at
      the same time. I did not assume they shared one cause: I checked email delivery
      separately, then examined what happened to an order when a purchase remained
      unpaid. This kept a mail issue distinct from the normal expiration of an
      unpaid order.
  - type: text
    title: Tested the notification path
    body: >-
      I corrected the sender domain and temporarily enabled a cash-on-delivery flow
      to test notifications without relying on a successful bank-card charge. A test
      email arrived. This verified delivery in that scenario only; it does not prove
      a real payment or a successful card transaction.
  - type: text
    title: Applied provider details to the correct domain
    body: >-
      I investigated incomplete checkouts separately. A test with non-real card
      details did not succeed, so I did not report it as a verified payment. After
      the client supplied a separate provider identifier, I applied it to
      salt-switch.com. The client later reported that new orders were coming in
      again. No bank record confirming a charge is present in the order materials.
  - type: text
    title: Added a direct contact route to the manager
    body: >-
      I installed a WhatsApp widget so visitors could contact the manager directly.
      The client confirmed that the widget worked and new orders were appearing, then
      accepted the stage. This is client confirmation, not an independent conversion
      measurement or a test of every payment scenario.
  - type: text
    title: Outcome and boundaries
    body: >-
      This stage covered separate checks for a test email, the order flow and a
      contact channel. The store was not built from scratch, and a real card charge
      was not independently confirmed. The discussed upload of 30 products with
      French names is also not established as completed in this order. The related
      international shipping and invoice work is described separately.
  - type: text
    title: Another stage of this project
    links:
      - label: "Related stage: international shipping and invoices"
        url: /showcase/salt-switch-cross-border-checkout/en/
