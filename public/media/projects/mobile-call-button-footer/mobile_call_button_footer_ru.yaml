title: Мобильная кнопка звонка и ремонт подвала сайта услуг
tagline: Клиенту нужен был удобный звонок с телефона и исправленный подвал. На
  части страниц при этом оставались старые кнопки, которые могли конкурировать с
  новым виджетом.
year: "04.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Mobile layout
  - Click to call
blocks:
  - type: text
    title: Задача и ограничения
    body: Клиенту нужен был удобный звонок с телефона и исправленный подвал. На
      части страниц при этом оставались старые кнопки, которые могли
      конкурировать с новым виджетом.
  - type: text
    title: Как устроено решение
    body: Восстановил подвал и установил мобильный телефонный виджет. После проверки
      заказчиком разобрал оставшиеся кнопки на страницах услуг и компании,
      удалил найденные элементы и отдельно вернулся к странице установки
      смесителя, где замечание повторилось.
  - type: text
    title: Результат и проверка
    body: Клиент принял работу и отдельно подтвердил подвал и виджет в отзыве.
      Проверка охватила замечания по конкретным страницам; полного обхода всех
      шаблонов и планшетов не было.
