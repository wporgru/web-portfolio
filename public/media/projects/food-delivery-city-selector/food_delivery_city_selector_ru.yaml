title: Выбор города на сайте доставки еды
tagline: Настроил выбор города для сети доставки, чтобы посетитель мог
  переключиться на нужный регион и не повторять выбор при каждом визите.
year: "11.2024"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Regional subdomains
  - Cookies
  - ACF
blocks:
  - type: text
    title: Задача и ограничения
    body: Настроил выбор города для сети доставки, чтобы посетитель мог
      переключиться на нужный регион и не повторять выбор при каждом визите.
  - type: text
    title: Как устроено решение
    body: Подготовил таблицу для заполнения региональных данных и добавил ссылку на
      окно выбора в привычном для пользователей месте. Объяснил, как выбор
      сохраняется в cookie и как проверять разные города в режиме инкогнито.
      После замечания о вёрстке на iPhone перенёс название города на отдельную
      строку и проверил отображение Курска и Волгограда.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил мобильную правку и принял заказ. Переход на цифровые
      коды поддоменов отменили; точность автоопределения для всех городов не
      измерялась.
