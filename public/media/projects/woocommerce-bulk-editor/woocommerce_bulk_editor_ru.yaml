title: Выгрузка каталога и массовое редактирование товаров
tagline: Владельцу требовался полный экспорт каталога и более удобный способ
  вносить повторяющиеся правки, не открывая каждую карточку отдельно.
year: "04.2026"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Data export
  - Bulk editing
blocks:
  - type: text
    title: Задача и ограничения
    body: Владельцу требовался полный экспорт каталога и более удобный способ
      вносить повторяющиеся правки, не открывая каждую карточку отдельно.
  - type: text
    title: Как устроено решение
    body: Сформировал выгрузку всех записей и передал ссылку на файл. Для выборки
      предложил отделять позиции с нулевым остатком и скрытые товары в самой
      таблице. По дополнительному запросу настроил табличный редактор и сообщил
      о записи видео по двум инструментам.
  - type: text
    title: Результат и проверка
    body: Клиент принял заказ и подтвердил получение выгрузки. Готовый фид только по
      наличию и регулярная синхронизация не входили в подтверждённый результат.
