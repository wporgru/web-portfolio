title: "«Дворецкий»: перенос строительного сайта из резервной копии"
tagline: "Для строительного сайта нужно было развернуть резервную копию и
  настроить WooCommerce. Это отдельный этап после разработки: важен рабочий
  адрес на новом хостинге, а не очередной макет сайта."
year: "01.2018"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - Database restore
  - Hosting migration
blocks:
  - type: text
    title: Задача и ограничения
    body: "Для строительного сайта нужно было развернуть резервную копию и настроить
      WooCommerce. Это отдельный этап после разработки: важен рабочий адрес на
      новом хостинге, а не очередной макет сайта."
  - type: text
    title: Как устроено решение
    body: Восстановил файлы из копии, загрузил дамп в подготовленную базу назначения
      и подключил к ней WordPress. В переписке зафиксировал этап настройки
      WooCommerce и передал клиенту конечный адрес для проверки.
  - type: text
    title: Результат и проверка
    body: Клиент принял работу после передачи адреса. Источник подтверждает перенос
      и приёмку, но не полный тест каталога, форм и оплаты. В отчёте об этапе не
      приписываю себе нынешний дизайн и калькулятор сайта.
  - type: text
    title: Связанный проект
    links:
      - label: "Связанный заказ: разработка строительного сайта «Дворецкий»"
        url: /showcase/dvoretskiy-construction-wordpress/
