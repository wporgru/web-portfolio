title: Шаблоны фильтров для категорий климатической техники
tagline: Настроил отдельный фильтр для категории бризеров, чтобы витрина
  использовала характеристики именно этого раздела, а не случайный набор
  фильтров от другого оборудования.
year: "04.2024"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Elementor
  - Theme Builder
  - Product filters
blocks:
  - type: text
    title: Задача и ограничения
    body: Настроил отдельный фильтр для категории бризеров, чтобы витрина
      использовала характеристики именно этого раздела, а не случайный набор
      фильтров от другого оборудования.
  - type: text
    title: Как устроено решение
    body: "В Elementor Theme Builder сделал копию шаблона приточно-вытяжных
      установок. Настроил вариант для бризеров Ballu и Tion: выбрал нужный
      атрибут и ограничил показ шаблона соответствующей категорией. Показал
      владельцу, как повторить настройку и почему карточки без заполненного
      производителя не попадают в фильтр."
  - type: text
    title: Результат и проверка
    body: Клиент принял работу и отметил понятное объяснение. Массовое заполнение
      атрибутов и разработка отдельного движка фильтрации не выполнялись.
