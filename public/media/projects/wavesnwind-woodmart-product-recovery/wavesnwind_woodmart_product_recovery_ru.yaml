title: "Waves & Wind: восстановление карточек товаров WoodMart"
tagline: Категория фонарей открывалась, но при переходе в отдельные карточки
  загрузка зависала. Покупатель мог увидеть ассортимент, но не всегда мог
  открыть характеристики выбранной модели. Нужно было вернуть переходы, а не
  пересобирать магазин.
year: "02.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - WoodMart
  - Product templates
blocks:
  - type: text
    title: Задача и ограничения
    body: Категория фонарей открывалась, но при переходе в отдельные карточки
      загрузка зависала. Покупатель мог увидеть ассортимент, но не всегда мог
      открыть характеристики выбранной модели. Нужно было вернуть переходы, а не
      пересобирать магазин.
  - type: text
    title: Как устроено решение
    body: Проверил состояние обновлений и сообщил об исправлении. Для приёмки клиент
      повторил переходы на карточки и подтвердил, что они открываются. Точный
      патч в архиве не сохранился, поэтому не приписываю работе замену темы,
      очистку базы или отключение конкретного плагина.
  - type: text
    title: Результат и проверка
    body: Клиент принял работу и отметил, что страницы открываются быстрее;
      сопоставимых замеров нет. При отдельной проверке 22 ноября 2026 года
      категория и три карточки из неё вернули HTTP 200, без редиректов, с
      заголовком и собственным canonical. Это проверка текущей выборки, не тех
      же артикулов на дату заказа и не проверка корзины или оплаты.
  - type: image
    src: /media/projects/wavesnwind-woodmart-product-recovery/product-viewport-20261122.png
    alt: Карточка фонаря Annsna AS-101 на сайте Waves & Wind
    caption: Браузерный снимок 22 ноября 2026 года, окно 1280 × 900. Это контрольная
      карточка текущей версии, не исторический снимок и не проверка покупки.
