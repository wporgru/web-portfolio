title: Мобильные карточки автомобилей Silver Park Taxi
tagline: "Доработал карточки машин и контактный блок сайта трансфера:
  характеристики и отступы должны были читаться одинаково от карточки к
  карточке, особенно на телефоне."
year: "02.2024"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Elementor
  - CSS
  - Yandex Maps
blocks:
  - type: text
    title: Задача и ограничения
    body: "Доработал карточки машин и контактный блок сайта трансфера:
      характеристики и отступы должны были читаться одинаково от карточки к
      карточке, особенно на телефоне."
  - type: text
    title: Как устроено решение
    body: "Исправил кнопки карты и разобрал ограничение внешнего iframe: страница
      может менять размер контейнера, но не управляет внутренней разметкой
      карты. Для телефона предложил отдельную высоту блока. Выровнял мобильные
      контейнеры, сверил карточки между собой и отдельно поправил отступ
      заголовка второй карточки."
  - type: text
    title: Результат и проверка
    body: Отправил видео проверки, после которого клиент принял заказ. Работа
      относилась к вёрстке карточек и карты; форма заявки была задачей
      предыдущего этапа.
  - type: text
    title: Другой этап этого проекта
    links:
      - label: "Предыдущий этап: форма выбора автомобиля и FAQ"
        url: /showcase/taxi-vehicle-booking/
