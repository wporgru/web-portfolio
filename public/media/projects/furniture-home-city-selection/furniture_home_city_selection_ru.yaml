title: Главная мебельного магазина и выбор города
tagline: Доработал главную мебельного магазина и добавил выбор города. Владелец
  мог наполнить подготовленные разделы позже, не меняя навигацию.
year: "05.2021"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - GeoTargeting
  - Storefront UX
blocks:
  - type: text
    title: Задача и ограничения
    body: Доработал главную мебельного магазина и добавил выбор города. Владелец мог
      наполнить подготовленные разделы позже, не меняя навигацию.
  - type: text
    title: Как устроено решение
    body: Собрал меню и страницы-заготовки, настроил заголовки, отступы и новостную
      полосу, где показывались записи с изображением. По замечаниям поправил
      шапку, цвета и смещение слайдера. Для выбора города установил WT
      GeoTargeting, отдельно проверял совместимость с темой и ограничил список
      городов по запросу клиента.
  - type: text
    title: Результат и проверка
    body: Клиент принял этап. Выбор города не означает проверенную геолокацию,
      региональное ценообразование или работу сети дилеров.
