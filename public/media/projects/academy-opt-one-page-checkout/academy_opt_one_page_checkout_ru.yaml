title: Одностраничная покупка курса с оплатой Тинькофф
tagline: Восстановил переход от оформления курса к оплате и убрал отдельный шаг
  корзины, чтобы покупатель мог проверить товар, применить купон и заполнить
  контакты на одной странице.
year: "09.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Tinkoff
  - Checkout
  - Mobile layout
blocks:
  - type: text
    title: Задача и ограничения
    body: Восстановил переход от оформления курса к оплате и убрал отдельный шаг
      корзины, чтобы покупатель мог проверить товар, применить купон и заполнить
      контакты на одной странице.
  - type: text
    title: Как устроено решение
    body: Разобрал настройки терминала и проверил переход к тестовой оплате. Собрал
      товар, промокод, контактные поля и выбор оплаты в одном сценарии.
      Скорректировал фон и поля, убрал необязательное предложение создать
      аккаунт. После замечаний клиента адаптировал верхнюю часть формы и блок
      оплаты для телефона.
  - type: text
    title: Результат и проверка
    body: Клиент принял работу. Проверены переход к тестовой оплате и историческое
      мобильное оформление; боевое списание и доставка фискального чека не
      подтверждены.
