title: Настройка витрины WoodMart Mega Electronics
tagline: Клиенту нужна была настраиваемая основа магазина электроники с готовой
  навигацией. Демо требовалось адаптировать, чтобы в карточках не осталось
  лишних эффектов и элементов.
year: "02.2024"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - WoodMart
  - Elementor
  - Storefront
blocks:
  - type: text
    title: Задача и ограничения
    body: Клиенту нужна была настраиваемая основа магазина электроники с готовой
      навигацией. Демо требовалось адаптировать, чтобы в карточках не осталось
      лишних эффектов и элементов.
  - type: text
    title: Как устроено решение
    body: Установил выбранное демо и показал, где менять меню, категории, подвал и
      шапку. Согласовал требования к логотипу, отключил эффект наведения на
      карточке и убрал элементы, отмеченные клиентом на скриншотах.
  - type: text
    title: Результат и проверка
    body: Клиент принял базовую витрину и получил возможность дальше менять блоки
      самостоятельно. Наполнение каталога, эквайринг и службы доставки не
      входили в подтверждённый этап.
