title: "Astola: исправление вёрстки для посетителей"
tagline: "Исправил дефект оформления, который проявлялся у обычных посетителей.
  Проверки внутри админки было недостаточно: залогиненный пользователь мог
  получать другую версию страницы."
year: "07.2022"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WP Rocket
  - Guest QA
  - Technical SEO
blocks:
  - type: text
    title: Задача и ограничения
    body: "Исправил дефект оформления, который проявлялся у обычных посетителей.
      Проверки внутри админки было недостаточно: залогиненный пользователь мог
      получать другую версию страницы."
  - type: text
    title: Как устроено решение
    body: Связал проявление дефекта с настройками WP Rocket, перевёл расширение в
      безопасный режим и проверил страницу в другом браузере без авторизации.
      Дополнительно разобрал базовые поисковые настройки и отделил исправление
      вёрстки от дальнейшей подготовки текстов и метаданных.
  - type: text
    title: Результат и проверка
    body: Клиент принял этап. Разбор дублирующего H1 и ручная редактура всех Title и
      Description не считаются завершёнными задачами этого заказа.
