title: Импорт 2 744 товаров Breez по API в WooCommerce
tagline: Магазину требовалось перенести ассортимент Breez и оставить владельцу
  понятный способ обновлять его после первой загрузки. При этом повторное
  обновление товаров не должно было заново запускать импорт структуры каталога.
year: "09.2025"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - REST API
  - Cron
  - CyrLitera
blocks:
  - type: text
    title: Задача и ограничения
    body: Магазину требовалось перенести ассортимент Breez и оставить владельцу
      понятный способ обновлять его после первой загрузки. При этом повторное
      обновление товаров не должно было заново запускать импорт структуры
      каталога.
  - type: text
    title: Как устроено решение
    body: Настроил импорт по API и вынес загрузку категорий в отдельный одноразовый
      процесс. Заменил Rustolat на CyrLitera, поскольку прежний инструмент не
      транслитерировал URL при импорте, и выровнял товарные миниатюры. Показал
      порядок ручного обновления, объяснил, почему нельзя закрывать страницу до
      завершения, и подготовил две команды cron с инструкцией.
  - type: text
    title: Результат и проверка
    body: В отчёте о сдаче — 2 744 загруженных товара. Клиент получил рабочий
      сценарий ручного обновления и команды для автоматизации. Установка
      расписания и его успешные запуски на сервере отдельно не подтверждены.
