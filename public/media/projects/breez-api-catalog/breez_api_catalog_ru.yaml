title: Импорт 2 744 товаров Breez по API в WooCommerce
tagline: Магазину требовалось перенести ассортимент Breez и оставить владельцу понятный способ
  обновлять его после первой загрузки. При этом повторное обновление товаров не должно было заново
  запускать импорт структуры каталога.
year: '09.2025'
role: Веб-разработка и автоматизация
stack:
- WooCommerce
- REST API
- Cron
- CyrLitera
blocks:
- type: text
  title: Задача и источник данных
  body: Для действующего магазина климатической техники нужно было загрузить ассортимент Breez
    по официальному API и оставить владельцу понятный порядок дальнейшего обновления. После уточнения
    выбрали весь доступный ассортимент поставщика, а не только бризеры и бытовые кондиционеры;
    предложенный вариант парсинга маркетплейса не использовали.
- type: text
  title: Импорт товаров и структура каталога
  body: Настроил импорт товаров с изображениями, а загрузку категорий отделил как самостоятельный
    одноразовый процесс. Это позволяло не запускать обновление структуры при каждом очередном
    обновлении товаров. Дополнительно выровнял миниатюры и передал шорткод для вывода брендов.
- type: text
  title: Адреса и передача управления
  body: При импорте прежний инструмент транслитерации оставлял адреса товаров кириллическими,
    поэтому заменил Rustolat на CyrLitera. Показал ручной запуск обновления и объяснил, что страницу
    нужно держать открытой до его завершения. Для возможной автоматизации подготовил две команды
    cron и инструкцию без публикации ключей доступа.
- type: text
  title: Результат и границы проверки
  body: В отчёте о сдаче указано 2 744 импортированных товара; клиент принял заказ и сообщил,
    что товарный раздел открывается, а товары видны в sitemap. Это исторические данные, а не независимый
    текущий пересчёт или доказательство индексации. Установку расписания и успешные серверные
    запуски cron отдельно не подтвердили; импорт следующего поставщика оставался другим этапом.
