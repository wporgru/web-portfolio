title: "Farkop Service: каталог и фильтр по марке авто"
tagline: "Доработал витрину фаркопов: сделал подкатегории компактнее, поправил
  карточки и ограничил фильтрацию одной маркой автомобиля за раз."
year: "02.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - CSS
  - Catalog filters
  - WPBakery
blocks:
  - type: text
    title: Задача и ограничения
    body: "Доработал витрину фаркопов: сделал подкатегории компактнее, поправил
      карточки и ограничил фильтрацию одной маркой автомобиля за раз."
  - type: text
    title: Как устроено решение
    body: Уменьшил изображения подкатегорий, переставил цену и кнопки, сократил
      отступы. Убрал из фильтра служебные категории. Когда обновление WPBakery
      не восстановило редактор шапки, скрыл лишний телефон через CSS и попросил
      клиента проверить, что ссылка больше не видна.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил фильтрацию и принял результат. Дополнительную
      двухколоночную вёрстку отложили. Сопутствующий перенос другого сайта не
      включён в этот кейс.
