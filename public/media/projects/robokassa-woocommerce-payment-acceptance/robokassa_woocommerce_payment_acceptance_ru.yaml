title: "Робокасса в WooCommerce: контрольная оплата и заявка на возврат"
tagline: Магазину требовалось принимать оплату через Робокассу и подтверждать
  заказ покупателю. Нужно было проверить не только открытие платёжной страницы,
  но и сам платёж, письма и возможность запросить возврат.
year: "12.2025"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Robokassa
  - Checkout
  - Payment QA
blocks:
  - type: text
    title: Задача и ограничения
    body: Магазину требовалось принимать оплату через Робокассу и подтверждать заказ
      покупателю. Нужно было проверить не только открытие платёжной страницы, но
      и сам платёж, письма и возможность запросить возврат.
  - type: text
    title: Как устроено решение
    body: Сохранил настройки подключения, выполнил контрольный платёж, показал
      письма покупателю и оформил заявку на возврат. По просьбе клиента убрал
      оплату при получении. Одна попытка с просроченной картой не прошла; клиент
      подтвердил успешную оплату другой картой.
  - type: text
    title: Результат и проверка
    body: Клиент проверил оплату и принял этап. Создание заявки на возврат было
      проверено отдельно, но зачисление денег на карту не подтверждено. Кейс не
      включает проверку всех платёжных методов, кассовых данных или сайта
      сегодня.
