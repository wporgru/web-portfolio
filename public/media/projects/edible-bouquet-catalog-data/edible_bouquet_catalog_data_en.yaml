title: Preparing edible bouquet products for WooCommerce
tagline: Collected edible bouquet listings and images so the client could
  complete the data and approve its structure before loading the store.
year: "01.2024"
role: Web development and automation
stack:
  - Web scraping
  - Spreadsheets
  - WooCommerce
  - Product data
blocks:
  - type: text
    title: Brief and constraints
    body: Collected edible bouquet listings and images so the client could complete
      the data and approve its structure before loading the store.
  - type: text
    title: How it works
    body: Delivered the spreadsheet and images separately. Explained how to separate
      products, categories and tags and fill in SKUs, specifications, metadata,
      headings and category parent relationships. Recommended consistent WebP
      images and preserved filenames for matching during a later import.
  - type: text
    title: Result and verification
    body: The client completed the spreadsheets and accepted the stage. Production
      migration, catalog upload and payment setup were outside this delivery.
