title: Подготовка каталога съедобных букетов к импорту
tagline: Собрал карточки съедобных букетов и фотографии, чтобы клиент мог
  дополнить данные и согласовать структуру до загрузки магазина.
year: "01.2024"
role: Веб-разработка и автоматизация
stack:
  - Web scraping
  - Spreadsheets
  - WooCommerce
  - Product data
blocks:
  - type: text
    title: Задача и ограничения
    body: Собрал карточки съедобных букетов и фотографии, чтобы клиент мог дополнить
      данные и согласовать структуру до загрузки магазина.
  - type: text
    title: Как устроено решение
    body: Передал таблицу и изображения отдельно. Показал, как разнести товары,
      категории и метки, заполнить артикулы, характеристики, Title, Description,
      H1 и связи родительских разделов. Для будущей обработки фото предложил
      единый размер и WebP с сохранением имён для сопоставления.
  - type: text
    title: Результат и проверка
    body: Клиент заполнил таблицы и принял этап. Перенос на рабочий домен, загрузка
      каталога и подключение оплаты не входили в эту сдачу.
