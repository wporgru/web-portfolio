title: Мобильная вёрстка магазина купелей и правки корзины
tagline: Магазину нужно было привести в порядок мобильные страницы и
  согласованный набор правок корзины. Отдельно после сдачи проявилось смещение
  строки на информационных страницах и в статьях.
year: "11.2024"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - Mobile layout
blocks:
  - type: text
    title: Задача и ограничения
    body: Магазину нужно было привести в порядок мобильные страницы и согласованный
      набор правок корзины. Отдельно после сдачи проявилось смещение строки на
      информационных страницах и в статьях.
  - type: text
    title: Как устроено решение
    body: Использовал готовый баннер клиента и передал отчёт по согласованному
      этапу. После повторной проверки разобрал смещение, связанное с
      закреплённой шапкой, сообщил об исправлении и обновил адресный текст по
      отдельной просьбе.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил результат и принял заказ. Авторство баннера не
      приписываю себе, а дополнительные правки checkout и ускорение были
      выделены в отдельный заказ.
