title: "Промэксперт: импорт 2 217 товаров в WooCommerce"
tagline: "Добавить ассортимент Промэксперта в действующий магазин швейной
  техники. Часть моделей уже приходила из Трансметалла: требовалось выбрать
  приоритет источника и не смешивать код для обновления с кодом, который видит
  покупатель."
year: "11.2025"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Supplier feeds
  - SKU mapping
blocks:
  - type: text
    title: Задача и ограничения
    body: "Добавить ассортимент Промэксперта в действующий магазин швейной техники.
      Часть моделей уже приходила из Трансметалла: требовалось выбрать приоритет
      источника и не смешивать код для обновления с кодом, который видит
      покупатель."
  - type: text
    title: Как устроено решение
    body: Для пересечений применил согласованный приоритет Промэксперта. До импорта
      исключил из обновления и убрал пять согласованных моделей Aurora. После
      загрузки удалил ссылки из значений атрибутов по замечанию клиента.
      Согласовали сохранение исходного SKU для сопоставления, отдельные префиксы
      поставщиков и утренний запуск обновления.
  - type: text
    title: Результат и проверка
    body: Заказчик принял этап. В отчёте о сдаче указано 2 217 новых товаров. Это
      результат исторического импорта, не текущий пересчёт каталога. Коды
      поставщика и расписание согласовали, но полную разметку всех карточек,
      отсутствие неявных дублей и серию последующих обновлений архив не
      подтверждает.
