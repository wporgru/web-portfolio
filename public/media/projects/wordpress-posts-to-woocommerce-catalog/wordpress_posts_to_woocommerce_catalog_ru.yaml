title: Перенос каталога из записей WordPress в WooCommerce
tagline: Перенёс каталог с обычных записей WordPress на товарную структуру
  WooCommerce на рабочей копии. Доработал витрину, чтобы новый каталог был
  удобен и покупателю, и владельцу.
year: "03.2020"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - Catalog migration
  - Notifications
blocks:
  - type: text
    title: Задача и ограничения
    body: Перенёс каталог с обычных записей WordPress на товарную структуру
      WooCommerce на рабочей копии. Доработал витрину, чтобы новый каталог был
      удобен и покупателю, и владельцу.
  - type: text
    title: Как устроено решение
    body: Установил WooCommerce, перенёс записи и проверил уведомления с клиентом.
      Убрал принудительный переход в корзину, настроил ручную подборку лидеров
      продаж и автоматический вывод новинок. После замечаний разобрал записи с
      объединёнными категориями и поправил отдельные случаи, оформление и
      хлебные крошки.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил получение заявки и принял перенос. Выкладка рабочей
      копии на основной домен, обмен с МойСклад и точный итоговый объём не
      подтверждены.
