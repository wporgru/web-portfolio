title: "Crypt Media: импорт страниц с SEO и виджетами"
tagline: Загрузить страницы криптовалют из таблицы с согласованными заголовками,
  адресами, описаниями и кодами виджетов.
role: Веб-разработка
year: "02.2018"
stack:
  - WordPress
  - CSV
  - SEO metadata
  - Widget integration
blocks:
  - type: text
    title: Задача
    body: Загрузить страницы криптовалют из таблицы с согласованными заголовками,
      адресами, описаниями и кодами виджетов.
  - type: text
    title: Что сделано
    body: Проверил тестовую партию из 100 страниц, согласовал её с клиентом и
      выполнил полный импорт подготовленного CSV.
  - type: text
    title: Как решалась задача
    body: "На тестовой загрузке обнаружились пропавшие виджеты: значения
      data-currency не всегда совпадали с тикерами. Другой участник со стороны
      клиента подготовил корректные коды, после чего клиент передал таблицу.
      Загрузил 100 страниц и проверил первые примеры; после согласования
      выполнил полный импорт ready.csv и передал подтверждение Import Complete.
      Клиент принял работу. Реплика о 750 записях на половине процесса не
      заменяет итоговый пересчёт: точное количество завершённых страниц и работа
      каждого виджета независимо не подтверждены. Сбор исходных кодов, точность
      курсов и рост поискового трафика в результат не включаю."
