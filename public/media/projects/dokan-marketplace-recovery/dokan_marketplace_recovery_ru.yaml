title: Восстановление публикации товаров в маркетплейсе Dokan
tagline: Продавцы не могли добавлять товары, а на части сценариев сайт показывал
  белый экран. Параллельно требовалось разобраться с регистрацией нового
  пользователя.
year: "01.2026"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Dokan
  - PHP
blocks:
  - type: text
    title: Задача и ограничения
    body: Продавцы не могли добавлять товары, а на части сценариев сайт показывал
      белый экран. Параллельно требовалось разобраться с регистрацией нового
      пользователя.
  - type: text
    title: Как устроено решение
    body: Диагностика выявила обращение к отсутствующей таблице модуля возвратов
      Dokan Pro. Проблемный компонент временно отключили. Отдельно проверил
      регистрацию с двух email и изменил настройку AJAX-формы темы для этого
      сайта. После работ выключил вывод диагностических ошибок.
  - type: text
    title: Результат и проверка
    body: "По отчёту публикация товаров и регистрация восстановлены. Возвраты Dokan
      Pro не выдавались за исправленные: для их включения требовалась отдельная
      проверка обновлённого компонента."
