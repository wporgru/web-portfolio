title: Редизайн сайта психолога на Gutenberg
tagline: Пересобрал тестовую версию сайта частной практики. Посетителю нужно
  было быстро понять форматы консультаций и порядок записи, а владельцу — менять
  цены, тексты и блоки услуг без ручной правки шаблонов.
year: "09.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - GeneratePress
  - Gutenberg
  - CSS
  - SVG
  - Contact Form 7
blocks:
  - type: text
    title: Задача и ограничения
    body: Пересобрал тестовую версию сайта частной практики. Посетителю нужно было
      быстро понять форматы консультаций и порядок записи, а владельцу — менять
      цены, тексты и блоки услуг без ручной правки шаблонов.
  - type: text
    title: Как устроено решение
    body: Создал дочернюю тему GeneratePress и библиотеку повторяемых
      Gutenberg-блоков. Через общие CSS-переменные выровнял ширину, типографику
      и интервалы; пиктограммы вывел в SVG. Собрал главную, страницы услуг и
      контактов, обновил шаблоны блога. Развёл очный и онлайн-форматы, а кнопки
      записи подключил к одному диалогу Contact Form 7. Для мобильного меню и
      FAQ настроил отдельные состояния раскрытия.
  - type: text
    title: Результат и проверка
    body: В отчёте Antigravity зафиксированы проверки адаптивности, меню и открытия
      диалога. В лабораторном запуске Chromium на стенде мобильный FCP был около
      1,4 с, CLS — 0,000. Это единичный замер тестовой копии, не полевые Core
      Web Vitals и не отчёт о публикации на боевом домене.
  - type: text
    title: Другой этап этого проекта
    links:
