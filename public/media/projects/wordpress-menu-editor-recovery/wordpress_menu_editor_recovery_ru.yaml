title: Восстановление редактора меню WordPress
tagline: Исправил зависание при редактировании главного меню через «Настроить».
  Пока этот экран не отвечал, владельцу требовался рабочий способ менять
  навигацию без ожидания ремонта.
year: "05.2022"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Navigation
  - Admin troubleshooting
blocks:
  - type: text
    title: Задача и ограничения
    body: Исправил зависание при редактировании главного меню через «Настроить».
      Пока этот экран не отвечал, владельцу требовался рабочий способ менять
      навигацию без ожидания ремонта.
  - type: text
    title: Как устроено решение
    body: Сначала показал альтернативный вход через административную панель, чтобы
      разблокировать текущие задачи. Затем отдельно восстановил редактирование
      через «Настроить» и попросил клиента проверить именно тот маршрут, на
      котором браузер раньше зависал.
  - type: text
    title: Результат и проверка
    body: Клиент повторил проверку и подтвердил работу редактора. Причина сбоя и
      конкретный патч в истории не сохранились.
