title: "LLP Pigment: две службы доставки в WooCommerce"
tagline: Магазину косметики нужно было добавить новые варианты доставки в
  существующее оформление. В одном списке должны были помещаться названия служб,
  способы получения и тарифы, не сливаясь в сплошной текст.
year: "10.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Boxberry
  - Russian Post
  - CSS
  - Checkout
blocks:
  - type: text
    title: Задача и ограничения
    body: Магазину косметики нужно было добавить новые варианты доставки в
      существующее оформление. В одном списке должны были помещаться названия
      служб, способы получения и тарифы, не сливаясь в сплошной текст.
  - type: text
    title: Как устроено решение
    body: "Настроил Boxberry и Почту России, показал заказчику варианты в оформлении
      заказа и предложил сценарии контрольного заказа. По обратной связи добавил
      отступы между строками доставки, чтобы проще было сравнивать варианты.
      Яндекс.Доставку вынес за пределы приёмки: работа с её расширением и
      условия подключения требовали отдельного продолжения."
  - type: text
    title: Результат и проверка
    body: Клиент принял настройку двух служб и обновлённый интерфейс. На архивном
      экране видны оба способа Boxberry и Почта России. Клиент решил провести
      контрольный заказ сам; боевое списание, отправление и завершение
      Яндекс.Доставки в этот кейс не входят.
  - type: text
    title: Фрагмент витрины из архива проекта
    links:
      - label: Оригинал в портфолио Kwork
        url: https://kwork.ru/portfolio/10894541
  - type: image
    src: /media/projects/llp-pigment-woocommerce-shipping/archive-storefront.webp
    alt: Экран оформления заказа LLP Pigment с Boxberry и Почтой России
    caption: Архивный экран 1400 × 661. Видны варианты доставки и пустые поля
      оформления. Суммы и сроки исторические; снимок не подтверждает оплату,
      отправление или настройку других показанных служб.
