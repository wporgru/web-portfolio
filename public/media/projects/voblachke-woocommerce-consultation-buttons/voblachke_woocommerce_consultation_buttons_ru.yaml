title: "«В облачке»: консультация и информация о доставке в карточке"
tagline: В магазине хотели сократить путь от карточки товара до консультации или
  заказа. Нужно было разместить информацию о доставке так, чтобы покупателю не
  приходилось искать её отдельно, и разобраться с повторяющимися телефонными
  обращениями.
year: "12.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Product pages
  - One-click checkout
  - Consultation forms
blocks:
  - type: text
    title: Задача и ограничения
    body: В магазине хотели сократить путь от карточки товара до консультации или
      заказа. Нужно было разместить информацию о доставке так, чтобы покупателю
      не приходилось искать её отдельно, и разобраться с повторяющимися
      телефонными обращениями.
  - type: text
    title: Как устроено решение
    body: Показал клиенту доработанные элементы консультации и доставки, добавил
      согласованный значок у логотипа и объяснил дублирование телефонных заявок.
      Передал инструкцию по удалению изображений и предложил оставить в
      оформлении только необходимые контактные поля. Точный итоговый состав этих
      полей в истории не перечислен.
  - type: text
    title: Результат и проверка
    body: Клиент принял доработки витрины. Подключение ЮKassa отложили до готовности
      других разделов. Реальные списания, работа всех форм и отдельный
      географический модуль не входят в подтверждённый результат.
