title: Выгрузка каталога WooCommerce для Taplink
tagline: "Подготовил переносимый табличный комплект товаров: владельцу нужен был
  исходный каталог с ценами в евро, а не ручное копирование карточек по одной."
year: "08.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Excel
  - Catalog export
  - Taplink
blocks:
  - type: text
    title: Задача и ограничения
    body: "Подготовил переносимый табличный комплект товаров: владельцу нужен был
      исходный каталог с ценами в евро, а не ручное копирование карточек по
      одной."
  - type: text
    title: Как устроено решение
    body: "Выгрузил существующие товары в Excel по согласованной задаче и передал
      файл владельцу для дальнейшей подготовки импорта. Разделил два этапа:
      получение исходных данных из WooCommerce и их загрузку на новую
      платформу."
  - type: text
    title: Результат и проверка
    body: Клиент принял таблицу. Около 1 100 позиций — его оценка исходного объёма;
      работу нового магазина в Taplink в этом заказе не проверяли.
