title: Перезапуск WordPress-магазина после неудачного редактирования
tagline: Проверил восстановление через хостинг, выяснил, что резервной копии нет, и согласовал с владельцем безопасный для пустого магазина повторный старт темы.
year: "02.2024"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - WPBakery
  - Recovery
blocks:
  - type: text
    title: Задача и ограничения
    body: На существующем WooCommerce-магазине после неудачного редактирования пропала главная страница. Заказчику требовалось вернуть рабочую основу, но до очистки нужно было понять, доступно ли восстановление из резервной копии и что произойдёт с уже внесёнными данными. На сайте ещё не было существенного наполнения, поэтому можно было рассмотреть чистую переустановку, но только после согласования последствий.
  - type: text
    title: Как устроено решение
    body: Сначала проверил штатный путь отката через хостинг, а не начал удалять файлы или тему вслепую. Резервной копии, пригодной для восстановления, не нашлось. Затем объяснил владельцу, что текущая тема построена на WPBakery и не рассчитана на параллельное редактирование тех же страниц через Elementor. Поскольку ценного наполнения ещё не было, предложил очистить установку и заново поставить тему, отдельно проговорив риск потери текущего содержимого. Клиент согласовал этот сценарий; задача стала контролируемым перезапуском основы, а не обещанием вернуть данные из несуществующего бэкапа.
  - type: text
    title: Результат и проверка
    body: Клиент явно принял выполненный этап. Подтверждён результат в виде согласованной переустановки темы и возврата к чистой основе магазина; подробной ведомости всех удалённых и повторно установленных компонентов в архиве нет. Не заявляются восстановление прежней главной из бэкапа, сохранение всего контента, полный запуск магазина или доказанная первопричина исчезновения страницы. Такой подход особенно полезен, когда сначала требуется честно оценить доступность отката и согласовать допустимую потерю данных, а уже затем выбирать способ восстановления.
