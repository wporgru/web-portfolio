title: Восстановление магазина после конфликта редакторов
tagline: После неудачного редактирования понадобилось вернуть рабочую основу
  магазина. Тема была рассчитана на WPBakery, но страницы пытались менять через
  Elementor.
year: "02.2024"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - WPBakery
  - Recovery
blocks:
  - type: text
    title: Задача и ограничения
    body: После неудачного редактирования понадобилось вернуть рабочую основу
      магазина. Тема была рассчитана на WPBakery, но страницы пытались менять
      через Elementor.
  - type: text
    title: Как устроено решение
    body: Объяснил несовместимость подходов и сначала проверил возможность
      восстановления через хостинг. При отсутствии доступной копии согласовал с
      владельцем очистку и повторную установку темы. Клиент разрешил этот путь,
      поскольку существенного наполнения ещё не было.
  - type: text
    title: Результат и проверка
    body: Клиент принял этап. Это согласованный перезапуск основы магазина, а не
      восстановление утраченного контента из резервной копии.
