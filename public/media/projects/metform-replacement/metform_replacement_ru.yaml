title: Замена MetForm и проверка доставки заявок
tagline: >-
  Заменил неотправлявшую заявки форму ARTRED на Contact Form 7. Заказчик подтвердил получение тестового письма и принял обновлённое оформление.
year: "05.2025"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Contact Form 7
  - CSS
blocks:
  - type: text
    title: Привёл форму к рабочей отправке
    body: >-
      На сайте ARTRED всплывающий MetForm выдавал ошибку при отправке. Согласовал замену на Contact Form 7 и использовал одну настроенную форму там, где требования совпадали.
  - type: text
    title: Учёл текст и оформление
    body: >-
      Добавил текст согласия и ссылку на страницу политики конфиденциальности. После первой сдачи сменил цвет кнопки с зелёного на красный, выровнял кнопку и подпись по центру и доработал скругления.
  - type: text
    title: Проверил доставку, а не только кнопку
    body: >-
      Отправил тестовую заявку и получил подтверждение от заказчика, что письмо пришло. Клиент также согласовал оформление и принял работу.
  - type: text
    title: Граница проверки
    body: >-
      Результат подтверждает доставку одного тестового письма, а не всех будущих заявок. Отдельный SMTP-аудит и юридическая экспертиза текста в этот этап не входили.
  - type: image
    title: Публичный вид сайта
    src: /media/projects/metform-replacement/later-homepage.webp
    alt: Публичная главная ARTRED с формой
    caption: Публичная версия от 25 октября 2026 года, без обрезки. Снимок не
      подтверждает отправку формы и доставку письма.
