title: Замена MetForm и проверка доставки заявок
tagline: "Форма заявки не выполняла основную задачу: клиенту требовался рабочий
  канал, а не только обновлённое оформление кнопки."
year: "05.2025"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Contact Form 7
  - CSS
blocks:
  - type: text
    title: Задача и ограничения
    body: "Форма заявки не выполняла основную задачу: клиенту требовался рабочий
      канал, а не только обновлённое оформление кнопки."
  - type: text
    title: Как устроено решение
    body: "Настроил Contact Form 7 вместо неработавшего MetForm и переиспользовал
      общую форму там, где требования совпадали. Отправил тестовую заявку. После
      первой проверки отдельно доработал интерфейс: цвет кнопки, выравнивание
      элементов и скругления."
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил получение тестового письма и согласовал внешний вид.
      Проверка относилась к заявке и оформлению; юридическая экспертиза не
      входила в этап.
