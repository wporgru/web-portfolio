title: Replacing MetForm and verifying inquiry delivery
tagline: >-
  Replaced a broken ARTRED enquiry form with Contact Form 7. The client confirmed receipt of a test email and approved the updated layout.
year: "05.2025"
role: Web development and automation
stack:
  - WordPress
  - Contact Form 7
  - CSS
blocks:
  - type: text
    title: Restored the enquiry flow
    body: >-
      The ARTRED MetForm popup returned an error on submission. I agreed the switch to Contact Form 7 and reused the configured form wherever the requirements matched.
  - type: text
    title: Updated copy and presentation
    body: >-
      I added consent text and a link to the privacy page. After the first handover, I changed the button from green to red, centered it and its supporting text, and adjusted the rounded corners.
  - type: text
    title: Verified delivery, not just the button
    body: >-
      I sent a test enquiry and the client confirmed that the email arrived. The client also approved the layout and accepted the work.
  - type: text
    title: Scope of verification
    body: >-
      The result establishes receipt of one test email, not delivery of all future enquiries. A separate SMTP audit and legal review were outside the scope.
  - type: image
    title: Public site view
    src: /media/projects/metform-replacement/later-homepage.webp
    alt: Public ARTRED homepage with enquiry form
    caption: Public version from October 25, 2026, uncropped. The screenshot does
      not verify form submission or email delivery.
