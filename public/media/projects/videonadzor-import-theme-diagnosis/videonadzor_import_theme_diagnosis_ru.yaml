title: Импорт товаров и диагностика темы WooCommerce
tagline: Загрузил каталог на существующий сайт видеонаблюдения и проверил,
  почему после импорта в исходной теме не отображались цены и корзина.
year: "11.2018"
role: Интеграция каталога
stack:
  - WooCommerce
  - WordPress
  - Theme diagnostics
blocks:
  - type: text
    title: Подготовка каталога
    body: Собрал товарный файл и передал его на проверку. Затем запустил длительный
      импорт в существующий WooCommerce-магазин и сообщил о завершении загрузки.
  - type: text
    title: Отделил импорт от отображения
    body: При проверке в исходной теме не отображались цены и корзина. На другой
      теме они появлялись. Сравнение показало, что одной загрузкой данных
      проблему витрины не решить; предложил замену или значительную доработку
      исходной темы.
  - type: text
    title: Что принял клиент
    body: Клиент принял импорт. Новый дизайн, исправление темы на основном сайте и
      готовность полного цикла продаж этим заказом не подтверждены. Количество
      товаров в сохранившихся материалах не установлено.
