    src: /media/projects/78-dosok/before-redesign.webp
    anchor: before-redesign
    title: Прежняя главная
    alt: Старая главная магазина 78 Досок со слайдером и списком категорий
    caption: Исторический снимок до смены темы. Оригинал из портфолио Kwork без обрезки.
  - type: image
    src: /media/projects/78-dosok/after-redesign.webp
    anchor: after-redesign
    title: Главная после смены темы
    alt: "Новая главная 78 Досок: крупный первый экран, каталог, отзывы и FAQ"
    caption: Исторический снимок после редизайна. Верхняя панель WordPress сохранена
      как на оригинале.
  - type: text
    title: Что получил магазин
    bullets:
      - Новая тема и обновлённая витрина вместо точечных правок старого шаблона.
      - Меньше дублирующих расширений, которые приходится поддерживать и
        проверять после обновлений.
      - Более заметный каталог на главной и быстрый доступ к корзине на
        мобильном.
  - type: text
    title: Как заказчик оценил работу
    body: "Заказчик согласовал направление по первому варианту главной, принял
      выполненный этап и отдельно отметил в отзыве на Kwork: «Полный редизайн»."
    links:
      - label: Публичный профиль и отзывы на Kwork
        url: https://kwork.ru/user/wporgru
  - type: text
    title: Как оценить редизайн своего магазина
    body: Если каждое обновление задевает шапку, меню или корзину, начните с разбора
      шаблонов и расширений, которые ими управляют. Для оценки пришлите адрес
      магазина, две-три проблемные страницы и список функций, которые нужно
      сохранить. По этим данным можно определить, какие части витрины обновлять,
      что проверить на мобильном и какие замеры скорости снять до и после.
    links:
      - label: Что входит в редизайн интернет-магазина
        url: /services/website-redesign/
