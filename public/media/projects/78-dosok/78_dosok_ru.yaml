title: "«78 Досок»: новая тема, редизайн и ускорение магазина"
tagline: "Обновить действующий магазин пиломатериалов целиком: заменить тему,
  переработать оформление и устранить технический балласт, накопившийся после
  обновлений."
role: Веб-разработка
year: "08.2026"
stack:
  - WordPress
  - WooCommerce
  - Astra
  - Elementor
blocks:
  - type: text
    title: Задача
    body: "Обновить действующий магазин пиломатериалов целиком: заменить тему,
      переработать оформление и устранить технический балласт, накопившийся
      после обновлений."
  - type: text
    title: Что сделано
    body: Сменил тему, полностью переработал оформление и обновил сайт. Очистил
      набор расширений от устаревших и дублирующих плагинов, выполнил работы по
      ускорению и улучшил мобильную навигацию и доступ к корзине.
  - type: text
    title: Как решалась задача
    body: "Старый магазин использовал несколько слоёв оформления: шапка Elementor
      перекрывала шапку темы, а часть мобильных функций была привязана к
      дочерней теме. Начал с разбора этих зависимостей, чтобы не переносить
      конфликтующие элементы в новый дизайн. Сохранил зелёную цветовую основу,
      перестроил первый экран и подачу каталога, переделал меню и добавил
      плавающую корзину. Технический этап включал полное обновление сайта,
      удаление устаревших и дублирующих плагинов и работы по ускорению. Заказчик
      принял работу и отдельно отметил полный редизайн. Исторические снимки до и
      после показывают изменение структуры главной; опубликованный ниже
      полностраничный снимок сделан позднее. Баллы PageSpeed, рост продаж и
      перестройку фильтров не включаю в результаты: таких подтверждений по этому
      этапу нет."
  - type: text
    title: Что вошло в комплексное обновление
    bullets:
      - "Смена темы и полный редизайн: сохранил узнаваемый зелёный цвет, но
        изменил первый экран, структуру каталога и навигацию."
      - "Обновление и очистка: убрал устаревшие и дублирующие расширения вместо
        того, чтобы переносить весь старый набор плагинов в новую витрину."
      - "Мобильный сценарий покупки: переработал меню и добавил плавающую
        корзину, чтобы к заказу можно было вернуться при прокрутке."
      - Работы по ускорению вошли в технический этап. Сопоставимых замеров до и
        после нет, поэтому точный прирост не указываю.
  - type: text
    title: Главная до и после
    body: В старой версии акцент был на слайдере и плотном списке категорий; после
      редизайна — на крупном первом экране, укрупнённых разделах каталога и
      блоках доверия, включая отзывы и FAQ.
    links:
      - label: До редизайна
        url: https://kwork.ru/portfolio/23517585
      - label: После редизайна
        url: https://kwork.ru/portfolio/23517588
  - type: text
    title: Что получил магазин
    bullets:
      - Новая тема и обновлённая витрина вместо точечных правок старого шаблона.
      - Меньше дублирующих расширений, которые приходится поддерживать и
        проверять после обновлений.
      - Более заметный каталог на главной и быстрый доступ к корзине на
        мобильном.
  - type: text
    title: Как оценить редизайн своего магазина
    body: Если каждое обновление задевает шапку, меню или корзину, начните с разбора
      шаблонов и расширений, которые ими управляют. Для оценки пришлите адрес
      магазина, две-три проблемные страницы и список функций, которые нужно
      сохранить. По этим данным можно определить, какие части витрины обновлять,
      что проверить на мобильном и какие замеры скорости снять до и после.
    links:
      - label: Обсудить редизайн магазина
        url: https://wp.org.ru/contacts/
  - type: image
    title: Публичный вид сайта
    src: /media/projects/78-dosok/site.png
    alt: Публичная версия сайта проекта
    caption: Снимок на дату проверки. Он показывает публичную версию сайта, а не
      обязательно вид на момент сдачи.
