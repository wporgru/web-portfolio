title: Редизайн магазина «78 Досок»
tagline: Обновить оформление действующего магазина пиломатериалов, не
  пересобирая каталог с нуля.
role: Веб-разработка
year: "08.2026"
stack:
  - WordPress
  - WooCommerce
  - Elementor
blocks:
  - type: text
    title: Задача
    body: Обновить оформление действующего магазина пиломатериалов, не пересобирая
      каталог с нуля.
  - type: text
    title: Что сделано
    body: Разобрал конфликт шапки Elementor с шапкой темы, предложил новый вариант
      главной, доработал меню и добавил плавающую корзину.
  - type: text
    title: Как решалась задача
    body: "Проблема была не только в дизайне: шапка Elementor перекрывала шапку
      темы, а часть мобильного интерфейса жила в старой дочерней теме. Поэтому
      сначала определил, какой шаблон отвечает за каждый элемент, а потом
      предложил новый вариант главной. Направление согласовали до дальнейших
      правок. Снимок показывает более позднее состояние магазина, а не
      утверждённый макет на дату сдачи."
  - type: image
    title: Публичный вид сайта
    src: /media/projects/78-dosok/site.png
    alt: Публичная версия сайта проекта
    caption: Снимок на дату проверки. Он показывает публичную версию сайта, а не
      обязательно вид на момент сдачи.
