title: "«78 Досок»: смена темы, редизайн и обновление магазина"
tagline: "Полностью обновил магазин пиломатериалов: сменил тему и дизайн, очистил набор
  плагинов и проработал производительность и мобильную навигацию."
role: Веб-разработка
year: "08.2026"
stack:
  - WordPress
  - WooCommerce
  - Astra
  - Elementor
blocks:
  - type: text
    title: Задача
    body: "Комплексно обновить работающий магазин пиломатериалов: заменить тему и дизайн,
      разобрать накопившиеся технические зависимости, обновить сайт и сохранить привычную для
      покупателей визуальную основу."
  - type: text
    title: Что сделано
    body: Полностью сменил тему и редизайнил витрину WooCommerce — от первого экрана до структуры
      каталога и меню. Обновил сайт, удалил устаревшие и дублирующие плагины, выполнил
      технические работы по ускорению, улучшил мобильную навигацию и добавил плавающий доступ
      к корзине.
  - type: text
    title: Сначала выяснил, что управляет витриной
    body: "Шапка Elementor перекрывала шапку темы, а мобильная версия и часть поведения зависели
      от старой дочерней темы. Поэтому начал с разбора этих связей: иначе новая шапка могла бы
      снова конфликтовать со старыми настройками. WoodMart обсуждался как вариант, но не выдаю
      его за установленную тему."
  - type: text
    title: Затем согласовал новый вид и заменил тему
    body: "Показал первый вариант главной, получил согласование направления и продолжил редизайн.
      Сохранил узнаваемый зелёный цвет, но перестроил первый экран и подачу каталога: крупнее
      выделил группы товаров, разместил отзывы и FAQ. Это видно на паре исторических снимков
      ниже. Обновление не сводилось к исправлению старой шапки."
  - type: text
    title: Обновил сайт, очистил плагины и доработал мобильную покупку
    body: "В рамках технического этапа обновил сайт, удалил устаревшие и дублирующие плагины и
      выполнил работы по ускорению. Переделал меню и добавил плавающий доступ к корзине: после
      прокрутки каталога к ней можно вернуться без перехода наверх. По этому заказу нет
      сопоставимых замеров скорости до и после; фильтры ожидали отдельного ТЗ."
  - type: text
    title: Редизайн затронул каталог, прайс и региональные страницы
    body: "Помимо главной, доработал представление разделов доски и бруса,
      доставку, контакты, услуги, сертификаты и общий прайс. Сохранил
      товарные сетки в каталоге, а на региональных страницах восстановил
      содержательные блоки без лишней боковой колонки. После смены темы
      покупателю по-прежнему были доступны данные для выбора и заказа:
      в проверенном прайсе отображались 83 строки таблицы, а в четырёх
      проверенных разделах каталога — товары."
  - type: text
    title: Что проверил после смены темы
    body: "Сохранил структурную проверку 76 публичных страниц. Все вернули
      HTTP 200 и имели один H1; наличие боковой колонки везде соответствовало
      правилам шаблона. Отдельно проверил 44 региональные страницы из этих
      же 76: на всех сохранился блок с подробностями. В двух мобильных
      проверках на ширине 390 px — региональной страницы и категории —
      не было горизонтального переполнения, а плавающая корзина отображалась.
      Это архивные проверки интерфейса, не замеры скорости или конверсии."
    links:
      - label: Сводка проверок после редизайна (JSON)
        url: /media/projects/78-dosok/redesign-qa-summary.json
  - type: text
    title: Главная до и после
    body: В старой версии акцент был на слайдере и плотном списке категорий; после редизайна — на
      крупном первом экране, укрупнённых разделах каталога и блоках доверия, включая отзывы и
      FAQ.
    links:
      - label: Снимок до редизайна
        url: "#before-redesign"
      - label: Снимок после редизайна
        url: "#after-redesign"
      - label: "Оригиналы на Kwork: до"
        url: https://kwork.ru/portfolio/23517585
      - label: "Оригиналы на Kwork: после"
        url: https://kwork.ru/portfolio/23517588
