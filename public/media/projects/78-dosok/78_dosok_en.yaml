title: "78 Dosok: new theme, redesign and faster storefront"
tagline: "Overhaul an existing timber store: replace the theme, redesign the
  storefront and remove technical debt accumulated through previous updates."
role: Web development
year: "08.2026"
stack:
  - WordPress
  - WooCommerce
  - Astra
  - Elementor
blocks:
  - type: text
    title: Brief
    body: "Overhaul an existing timber store: replace the theme, redesign the
      storefront and remove technical debt accumulated through previous
      updates."
  - type: text
    title: Work delivered
    body: Replaced the theme, redesigned and updated the site. Removed outdated and
      redundant plugins, worked on performance, and improved mobile navigation
      and access to the cart.
  - type: text
    title: Implementation and scope
    body: "The old storefront had overlapping presentation layers: Elementor
      overrode the theme header, while mobile features depended on a child
      theme. I mapped those dependencies before moving to a new design so the
      old conflicts would not carry over. I kept the green visual identity,
      reworked the hero and catalog presentation, rebuilt navigation, and added
      a floating cart. The technical overhaul included a full site update,
      removal of obsolete and redundant plugins, and performance work. The
      client accepted the order and highlighted the complete redesign.
      Historical before-and-after images show the homepage change; the full-page
      image below was captured later. The scope does not include measured
      PageSpeed gains, sales growth or a rebuild of product filters."
  - type: text
    title: What the overhaul covered
    bullets:
      - "Theme replacement and a full redesign: kept the recognizable green
        palette while changing the hero, catalog structure and navigation."
      - "Updates and cleanup: removed obsolete and redundant extensions rather
        than carrying the entire legacy plugin stack into the new storefront."
      - "Mobile shopping: revised navigation and added a floating cart so
        shoppers could return to their order while scrolling."
      - Performance work was part of the technical overhaul. Comparable
        before-and-after measurements are not available.
  - type: text
    title: Homepage before and after
    body: The original homepage emphasized a slider and a dense category list. The
      redesign uses a larger opening section, clearer catalog groupings and
      trust-building sections such as reviews and FAQs.
    links:
      - label: Before redesign
        url: https://kwork.ru/portfolio/23517585
      - label: After redesign
        url: https://kwork.ru/portfolio/23517588
  - type: image
    src: /media/projects/78-dosok/before-redesign.webp
    title: Original homepage
    alt: Original 78 Dosok homepage with slider and category list
    caption: Historical capture before the theme replacement. Uncropped original
      from Kwork.
  - type: image
    src: /media/projects/78-dosok/after-redesign.webp
    title: Homepage after the theme replacement
    alt: Redesigned 78 Dosok homepage with a larger hero, catalog, reviews and FAQ
    caption: Historical capture after the redesign. The WordPress toolbar is
      retained as in the original.
  - type: text
    title: What the store gained
    bullets:
      - A new theme and a redesigned storefront instead of isolated patches to
        the old template.
      - Fewer overlapping extensions to maintain and check after updates.
      - A more prominent homepage catalog and easier access to the cart on
        mobile.
  - type: text
    title: How to scope your own store redesign
    body: If updates keep breaking the header, menu or cart, start by mapping the
      templates and extensions behind them. For an estimate, send the store URL,
      two or three problem pages and a list of features that must be retained.
      This helps define what to redesign, what to test on mobile and what
      performance measurements to capture before and after.
    links:
      - label: Discuss a store redesign
        url: https://wp.org.ru/contacts/
  - type: image
    title: Public website snapshot
    src: /media/projects/78-dosok/site.png
    alt: Public website snapshot
    caption: Captured during a later availability check; it may differ from the site
      at handoff.
