title: "78 Dosok: theme replacement, redesign and store update"
tagline: "Completely updated a timber store: replaced its theme and design, cleaned up
  plugins, and worked on performance and mobile navigation."
role: Web development
year: "08.2026"
stack:
  - WordPress
  - WooCommerce
  - Astra
  - Elementor
blocks:
  - type: text
    title: Brief
    body: "Comprehensively update a live timber storefront: replace the theme and design, review
      accumulated technical dependencies, update the site, and preserve a familiar visual
      foundation for shoppers."
  - type: text
    title: Work delivered
    body: Replaced the theme and redesigned the WooCommerce storefront—from the opening section to
      catalog structure and navigation. Updated the site, removed outdated and duplicate
      plugins, carried out performance work, improved mobile navigation, and added a floating
      route back to the cart.
  - type: text
    title: First, traced what controlled the storefront
    body: Elementor overrode the theme header, while the mobile header and some behavior depended
      on the old child theme. I started by tracing those dependencies so the new header would
      not inherit the same conflicts. WoodMart was discussed as an option, not documented as
      the installed replacement.
  - type: text
    title: Then agreed on a new design and replaced the theme
    body: I showed an initial homepage, agreed on the direction and continued the redesign. I kept
      the recognizable green palette but rebuilt the opening section and catalog presentation,
      giving product groups more space and adding room for reviews and FAQs. The archival
      comparison below shows the difference. This was more than a header patch.
  - type: text
    title: Updated the site, cleaned up plugins and improved mobile shopping
    body: The technical phase included site updates, removal of outdated and duplicate plugins,
      and performance work. I revised the menu and added a floating shortcut to the cart so
      shoppers could return to it after scrolling. There are no comparable before-and-after
      speed measurements for this order, and the filters were left for a separate brief.
  - type: text
    title: Homepage before and after
    body: The original homepage emphasized a slider and a dense category list. The redesign uses a
      larger opening section, clearer catalog groupings and trust-building sections such as
      reviews and FAQs.
