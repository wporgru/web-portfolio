      original.
  - type: text
    title: What the store gained
    bullets:
      - A new theme and a redesigned storefront instead of isolated patches to the old
        template.
      - Fewer overlapping extensions to maintain and check after updates.
      - A more prominent homepage catalog and easier access to the cart on mobile.
  - type: text
    title: How the client rated the work
    body: The client approved the direction after seeing the initial homepage, accepted the
      completed stage and highlighted the “full redesign” in a Kwork review (translated).
    links:
      - label: Public Kwork profile and reviews
        url: https://kwork.ru/user/wporgru
  - type: text
    title: How to scope your own store redesign
    body: If updates keep breaking the header, menu or cart, start by mapping the templates and
      extensions behind them. For an estimate, send the store URL, two or three problem pages
      and a list of features that must be retained. This helps define what to redesign, what
      to test on mobile and what performance measurements to capture before and after.
    links:
      - label: What a store redesign covers
        url: /services/website-redesign/en/
  - type: text
    title: A separate project with measured performance gains
    body: Arenda-PM includes before-and-after measurements of its mobile homepage. Those figures
      belong to a separate project and do not describe 78 Dosok.
    links:
      - label: "Arenda-PM: PageSpeed and LCP measurements"
        url: /showcase/arenda-pm-home-performance/en/
