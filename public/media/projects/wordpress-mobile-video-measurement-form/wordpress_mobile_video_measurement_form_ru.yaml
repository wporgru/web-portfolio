title: "WordPress: мобильное видео и форма заявки на замер"
tagline: На телефоне видео было смещено, ссылка не открывала форму замера, а
  всплывающее окно запускалось без запроса посетителя. Нужно было вернуть
  понятный путь к заявке без смены оформления всего сайта.
year: "07.2024"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Mobile layout
  - On-demand forms
  - UX repair
blocks:
  - type: text
    title: Задача и ограничения
    body: На телефоне видео было смещено, ссылка не открывала форму замера, а
      всплывающее окно запускалось без запроса посетителя. Нужно было вернуть
      понятный путь к заявке без смены оформления всего сайта.
  - type: text
    title: Как устроено решение
    body: Исправил мобильный вывод видео на ширину блока, привязал форму замера к
      нужной ссылке и отключил автоматическое открытие окна по просьбе клиента.
      Для отдельно замеченного отображения каталога предложил обновить страницу;
      клиент увидел правильный вид, отдельной правки кода каталога не
      потребовалось по сохранившейся переписке.
  - type: text
    title: Результат и проверка
    body: Клиент принял правки интерфейса. Форма стала доступна по действию
      посетителя; попадание заявки в письмо или CRM, воспроизведение видео на
      всех устройствах и изменение поисковых позиций не проверялись.
