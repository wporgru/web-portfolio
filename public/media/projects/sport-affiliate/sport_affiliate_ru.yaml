title: "Sport-man: управление неактуальными предложениями"
tagline: У 1 892 позиций спортивного каталога были ссылки на партнёрскую кампанию Mad Wave
  без подтверждённой замены. Покупателя нельзя было отправлять на похожую модель другого
  размера или комплектации. При этом нужно было сохранить страницы, цены и исходные ссылки
  для возобновления работы.
year: "10.2026"
role: Веб-разработка и автоматизация
stack:
  - PHP
  - WooCommerce
  - Admitad
blocks:
  - type: text
    title: "Задача: не отправлять покупателя по неработающему предложению"
    body: В спортивной партнёрской витрине 1 892 карточки ссылались на кампанию Madwavenew,
      для которой не было подтверждённой замены. Удаление товаров или массовая подмена
      ссылок лишили бы владельца исходных данных, а покупателя могли привести к другой
      модели или размеру. Нужно было временно остановить переходы и сохранить возможность
      возврата.
  - type: text
    title: Сначала — проверка точного совпадения
    body: Сравнивал доступные товарные фиды по штрихкоду или полному коду производителя, затем
      учитывал вариант, размер, цвет и наличие. Похожее название или принадлежность к
      одному бренду не считал достаточным совпадением. По проверенным источникам
      подтверждённой замены не получил; это не означает, что её нет у всех возможных
      продавцов. Импорт и ссылки товаров не перенастраивал.
  - type: text
    title: Обратимая пауза вместо удаления карточек
    body: "Сделал отдельный MU-плагин: он распознаёт нужную кампанию по сохранённому адресу и
      вместо исходящего действия показывает «Временно нет в наличии». Правило скрывает
      ссылку и кнопку в каталоге, блокирует покупку и серверное добавление в корзину.
      Страницы, цены, остатки и исходные партнёрские адреса при этом остаются в базе без
      перезаписи; товары других продавцов продолжают работать."
  - type: text
    title: Как проверил результат
    body: "Сверил 1 892 затронутые записи до и после: изменения товарных данных не обнаружены.
      В браузере проверил карточку и категорию с приостановленным предложением, а также
      контрольный товар другого продавца — у него сохранилась кнопка перехода в магазин.
      Для отмены предусмотрено удаление только отдельного файла правила с последующей
      очисткой кэша при необходимости."
  - type: image
    src: /media/projects/sport-affiliate/homepage-20261117.webp
    title: Публичная витрина Sport-man
    alt: Полностраничный снимок каталога Sport-man
    caption: Анонимный снимок 17 ноября 2026 года, ширина 1440 px, без обрезки. Главная не
      проверяет состояние приостановленных товаров и партнёрских переходов.
  - type: text
    title: "Другой сценарий: в отчёте есть ссылка, но на сайте она не найдена"
    links:
      - label: "Sport-man: расследование битых партнёрских ссылок"
        url: /showcase/sport-affiliate-broken-link-audit/
  - type: text
    title: Когда нужна такая работа
    body: Если поставщик перестал принимать заказы или кампания отключена, пришлите пример
      товара, причину остановки и желаемое поведение карточки. Сначала отделю затронутые
      предложения от остальных и проверю, можно ли безопасно сохранить страницы и исходные
      данные без подмены неподтверждёнными аналогами.
