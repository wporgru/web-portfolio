title: "Sport-man: управление неактуальными предложениями"
tagline: Партнёрская кампания перестала давать подходящую замену. Нужно было
  убрать недействующие переходы, не подставляя покупателю похожий товар другой
  модели.
year: "10.2026"
role: Веб-разработка и автоматизация
stack:
  - PHP
  - WooCommerce
  - Admitad
blocks:
  - type: text
    title: Задача и ограничения
    body: Партнёрская кампания перестала давать подходящую замену. Нужно было убрать
      недействующие переходы, не подставляя покупателю похожий товар другой
      модели.
  - type: text
    title: Как устроено решение
    body: "Проверил соответствия по вариантам, модели и идентификаторам и не нашёл
      подтверждённой замены. Добавил обратимое правило в MU-плагин: оно
      отключает партнёрский переход и покупку только у затронутой группы, не
      перезаписывая карточки."
  - type: text
    title: Результат и проверка
    body: Проверка показала 1 892 затронутые позиции и сохранение действия у
      контрольного товара. Отдельные подозрительные переходы исследованы
      отдельно, без присвоения им неподтверждённого источника.
