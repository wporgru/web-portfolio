title: "Sport-man: управление неактуальными предложениями"
tagline: У 1 892 позиций спортивного каталога были ссылки на партнёрскую
  кампанию Mad Wave без подтверждённой замены. Покупателя нельзя было отправлять
  на похожую модель другого размера или комплектации. При этом нужно было
  сохранить страницы, цены и исходные ссылки для возобновления работы.
year: "10.2026"
role: Веб-разработка и автоматизация
stack:
  - PHP
  - WooCommerce
  - Admitad
blocks:
  - type: text
    title: Задача и ограничения
    body: У 1 892 позиций спортивного каталога были ссылки на партнёрскую кампанию
      Mad Wave без подтверждённой замены. Покупателя нельзя было отправлять на
      похожую модель другого размера или комплектации. При этом нужно было
      сохранить страницы, цены и исходные ссылки для возобновления работы.
  - type: text
    title: Как устроено решение
    body: "Перед заменой сравнил штрихкоды и полные коды производителя, затем
      учитывал вариант, размер и цвет. Сходство названий не считал совпадением.
      Вместо массовой перезаписи сделал обратимый MU-плагин: он распознавал
      кампанию по сохранённой ссылке, заменял кнопку текстом «Временно нет в
      наличии», убирал исходящий переход и блокировал добавление в корзину на
      сервере. Обычные товары шли по прежнему сценарию, данные карточек не
      менялись."
  - type: text
    title: Результат и проверка
    body: "Проверка подтвердила 1 892 позиции под новым правилом и ноль изменений
      данных товаров. Контрольный товар сохранил кнопку «Смотреть в магазине».
      Чтобы вернуть исходное поведение, достаточно убрать отдельный файл правила
      и при необходимости очистить кэш. Аудит не доказывал, что подходящей
      замены не существует у любого продавца: изменили только то, что
      подтвердили проверкой."
