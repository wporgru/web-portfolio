title: "Sport-man: handling expired affiliate offers"
tagline: A sports catalog had 1,892 listings tied to a Mad Wave affiliate campaign with no
  verified replacement. Shoppers should not be redirected to similar products in a
  different size or configuration. Pages, prices and source links needed to remain intact
  for later reactivation.
year: "10.2026"
role: Web development and automation
stack:
  - PHP
  - WooCommerce
  - Admitad
blocks:
  - type: text
    title: "The brief: stop sending buyers to an unavailable offer"
    body: In a sports affiliate storefront, 1,892 listings pointed to the Madwavenew campaign
      without a verified replacement. Deleting products or bulk-replacing links would
      discard the original data and could send buyers to a different model or size. The
      task was to pause outgoing actions while retaining a clear rollback path.
  - type: text
    title: Verify exact matches first
    body: I compared available product feeds by barcode or full manufacturer code, then
      considered variant, size, color and availability. A similar name or shared brand was
      not sufficient evidence. No replacement was confirmed in the sources checked; that
      does not establish that none exists with any merchant. Imports and saved product
      links were not reconfigured.
  - type: text
    title: A reversible pause instead of deleting listings
    body: I built a separate MU plugin that recognizes the target campaign from the saved URL
      and displays a “Temporarily unavailable” message instead of the outbound action. The
      rule suppresses catalog links and buttons, blocks purchase and validates add-to-cart
      server-side. Product pages, prices, stock data and original affiliate URLs remain in
      the database unchanged; other merchants’ products keep their normal behavior.
  - type: text
    title: How the result was checked
    body: I compared 1,892 affected records before and after and found no product-data
      changes. Browser checks covered an affected product page and category, plus a
      control product from another merchant that retained its store button. Rollback
      consists of removing the separate rule file and clearing cache if needed.
  - type: text
    title: "A different scenario: a reported link could not be found on the site"
    links:
      - label: "Sport-man: broken affiliate link investigation"
        url: /showcase/sport-affiliate-broken-link-audit/en/
  - type: text
    title: When this approach is useful
    body: If a supplier stops taking orders or an affiliate campaign is disabled, send a
      sample listing, the reason for the pause and the desired product-page behavior. I
      can first isolate affected offers and assess how to retain pages and source data
      without substituting unverified alternatives.
