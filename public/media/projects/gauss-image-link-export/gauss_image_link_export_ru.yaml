title: Выгрузка артикулов и фотографий Gauss в Excel
tagline: Подготовил таблицу ассортимента Gauss для дальнейшей работы с товарными
  фотографиями. В одной строке нужны были артикул, название и отдельные ссылки
  на все изображения карточки.
year: "06.2023"
role: Веб-разработка и автоматизация
stack:
  - Excel
  - Web scraping
  - Product images
  - Sitemap
blocks:
  - type: text
    title: Задача и ограничения
    body: Подготовил таблицу ассортимента Gauss для дальнейшей работы с товарными
      фотографиями. В одной строке нужны были артикул, название и отдельные
      ссылки на все изображения карточки.
  - type: text
    title: Как устроено решение
    body: "Взял адреса из карты сайта и проверил ответы: часть URL в ней возвращала
      404. Для доступных карточек собрал ссылки на изображения и разнёс их по
      столбцам, до 20 на товар. Не стал подменять отсутствующие у поставщика
      изображения сторонними фотографиями."
  - type: text
    title: Результат и проверка
    body: Клиент принял таблицу. В переписке указаны 1 285 исходных ссылок и
      результат для 1 246 товаров; это цифры сдачи, не повторный пересчёт файла.
