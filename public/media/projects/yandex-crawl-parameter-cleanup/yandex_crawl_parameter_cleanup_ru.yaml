title: Устранение лишних URL в Яндекс Вебмастере
tagline: Доработал поисковые настройки магазина, чтобы параметрические адреса и
  лишняя карта сайта не мешали обходу, а категории и товары получали осмысленные
  описания.
year: "04.2024"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Yandex Webmaster
  - Clean-param
  - Metadata
blocks:
  - type: text
    title: Задача и ограничения
    body: Доработал поисковые настройки магазина, чтобы параметрические адреса и
      лишняя карта сайта не мешали обходу, а категории и товары получали
      осмысленные описания.
  - type: text
    title: Как устроено решение
    body: Добавил правило Clean-Param для etext, отключил лишнюю sitemap, исправил
      шаблон описания категорий и предусмотрел запасной шаблон для товаров.
      Параллельно поправил viewport и настройки темы. По отчёту отправил 180
      страниц на переобход через Яндекс Вебмастер.
  - type: text
    title: Результат и проверка
    body: "Клиент принял этап. Отправку на переобход фиксирую отдельно: она не
      показывает, сколько страниц вошло в индекс и как изменились позиции."
