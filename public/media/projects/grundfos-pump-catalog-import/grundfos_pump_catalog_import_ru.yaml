title: Настройка импорта каталога насосов WooCommerce
tagline: Подготовил правила обмена между сторонним сборщиком данных и
  WooCommerce, затем настроил загрузку насосов на тестовой площадке.
year: "03.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - WP All Import
  - CSV
  - Product taxonomy
blocks:
  - type: text
    title: Задача и ограничения
    body: Подготовил правила обмена между сторонним сборщиком данных и WooCommerce,
      затем настроил загрузку насосов на тестовой площадке.
  - type: text
    title: Как устроено решение
    body: Описал поля для SKU, названий, категорий, цен, остатков, описаний,
      изображений и отдельных характеристик. Настроил WP All Import так, чтобы
      вместе с товарами создавались категории, и добавил изображения разделов
      вручную. Сбор с сайта поставщика выполнял другой специалист.
  - type: text
    title: Результат и проверка
    body: Заказчик принял работу и добавил бонус. Число товаров, все дополнительные
      правки оформления и запуск на конечном домене не подтверждены.
