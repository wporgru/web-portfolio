title: Шаблон повторного импорта вариаций обуви
tagline: Заказчик хотел повторно загружать CSV с вариантами обуви, не собирая
  сопоставление полей при каждом запуске. Отдельно требовалось разобраться,
  почему одинаковые миниатюры выглядят неодинаково.
year: "11.2024"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - WP All Import
  - CSV
blocks:
  - type: text
    title: Задача и ограничения
    body: Заказчик хотел повторно загружать CSV с вариантами обуви, не собирая
      сопоставление полей при каждом запуске. Отдельно требовалось разобраться,
      почему одинаковые миниатюры выглядят неодинаково.
  - type: text
    title: Как устроено решение
    body: "Разобрал недоступные поля WooCommerce, настроил импорт по согласованной
      структуре и сохранил шаблон. Передал порядок ручного запуска: создать
      импорт, загрузить CSV, выбрать товары, загрузить шаблон, проверить
      подстановку и дождаться завершения. Сравнил размеры миниатюр и показал,
      что различие масштаба связано с кадрированием исходников."
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил получение инструкции и принял заказ. Автоматический
      cron, массовая обработка фото и окончательная логика складского атрибута
      не заявляются.
