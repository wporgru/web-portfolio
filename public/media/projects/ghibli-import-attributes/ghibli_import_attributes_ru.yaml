title: Импорт Ghibli & Wirbel и восстановление характеристик
tagline: Из CSV требовалось перенести каталог уборочной техники. После первой
  загрузки товары появились, но клиент заметил неполные характеристики — для
  технического ассортимента это мешает сравнивать модели.
year: "05.2025"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - CSV
  - Product attributes
blocks:
  - type: text
    title: Задача и ограничения
    body: Из CSV требовалось перенести каталог уборочной техники. После первой
      загрузки товары появились, но клиент заметил неполные характеристики — для
      технического ассортимента это мешает сравнивать модели.
  - type: text
    title: Как устроено решение
    body: "Проверил исходный CSV и загрузил карточки, затем вернулся к настройкам
      шаблона по замечанию клиента. В связанном заказе нашёл ошибку номера поля:
      импортёр брал только первый атрибут. Исправил сопоставление и передал
      результат на повторную проверку."
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил корректный перенос характеристик после исправления.
      Вывод цены по запросу и независимый пересчёт всех изображений не входили в
      проверенный результат.
