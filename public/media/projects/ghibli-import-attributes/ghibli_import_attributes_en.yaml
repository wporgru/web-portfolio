title: Importing Ghibli & Wirbel and fixing missing specifications
tagline: A CSV needed to become a cleaning equipment catalog. Products appeared
  after the first import, but the client found incomplete specifications, making
  technical models harder to compare.
year: "05.2025"
role: Web development and automation
stack:
  - WooCommerce
  - CSV
  - Product attributes
blocks:
  - type: text
    title: Brief and constraints
    body: A CSV needed to become a cleaning equipment catalog. Products appeared
      after the first import, but the client found incomplete specifications,
      making technical models harder to compare.
  - type: text
    title: How it works
    body: "Reviewed the source CSV and imported the listings, then reopened the
      template after client feedback. In a follow-up job I found the field-index
      error: only the first attribute was being imported. I corrected the
      mapping and handed the result back for review."
  - type: text
    title: Result and verification
    body: The client confirmed specifications were transferred correctly after the
      fix. Price-on-request display and a separate audit of every image were
      outside the verified result.
