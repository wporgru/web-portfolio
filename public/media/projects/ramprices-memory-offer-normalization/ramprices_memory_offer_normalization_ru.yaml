title: "RamPrices: каталог и сопоставление модулей памяти"
tagline: Адаптировал ядро проекта сравнения цен под оперативную память. Здесь
  совпадение марки и объёма ещё не означает, что товары взаимозаменяемы. Ошибка
  в разборе фида может отправить предложение в другую категорию или объединить
  несопоставимые позиции.
year: "2026"
role: Веб-разработка и автоматизация
stack:
  - Laravel
  - PHP
  - YML
  - Data normalization
  - Product feeds
blocks:
  - type: text
    title: Задача и ограничения
    body: Адаптировал ядро проекта сравнения цен под оперативную память. Здесь
      совпадение марки и объёма ещё не означает, что товары взаимозаменяемы.
      Ошибка в разборе фида может отправить предложение в другую категорию или
      объединить несопоставимые позиции.
  - type: text
    title: Как устроено решение
    body: Сохранил раздельные уровни исходного фида и публичных вариантов. Добавил
      сценарии классификации DDR5, правила маршрутизации управляемых фидов и
      повторной синхронизации. Если обновлённая запись перестаёт соответствовать
      критериям каталога, ранее опубликованный вариант убирается. Отдельно
      проверяется группировка сопоставимых предложений разных продавцов и защита
      от объединения двух записей одного магазина.
  - type: text
    title: Результат и проверка
    body: Сценарии закреплены в тестах синхронизации и сопоставления. В отличие от
      DiskPrices, этот кейс показывает перенос ядра на другой тип товаров и
      правила качества данных, а не разработку всей платформы с нуля. Полнота
      ассортимента на дату публикации не заявляется.
  - type: text
    title: Другой этап этого проекта
    links:
      - label: "Основа проекта: платформа сравнения цен DiskPrices"
        url: /showcase/diskprices-comparison-platform/
