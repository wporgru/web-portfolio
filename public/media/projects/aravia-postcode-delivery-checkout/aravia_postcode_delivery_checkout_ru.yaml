title: Доставка по индексам и самовывоз для Aravia
tagline: Перенастроил оформление заказа для локальной доставки в Перми. Нужно
  было учитывать район и сумму заказа и при этом оставить понятный выбор
  самовывоза.
year: "04.2021"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Postal codes
  - Local delivery
  - Checkout
blocks:
  - type: text
    title: Задача и ограничения
    body: Перенастроил оформление заказа для локальной доставки в Перми. Нужно было
      учитывать район и сумму заказа и при этом оставить понятный выбор
      самовывоза.
  - type: text
    title: Как устроено решение
    body: Собрал таблицу районов и настроил тарифы по индексу и сумме. По замечаниям
      вернул поле индекса, добавил ссылку на стоимость доставки и восстановил
      поле промокода. Для самовывоза сменил плагин. Доработал подписи, отступы,
      поля и пояснения на странице заказа, затем попросил клиента проверить
      уведомления.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил самовывоз и получение двух писем, затем принял заказ.
      Онлайн-эквайринг и складской учёт по точкам не входили в задачу; все
      границы тарифов не пересчитывались независимо.
