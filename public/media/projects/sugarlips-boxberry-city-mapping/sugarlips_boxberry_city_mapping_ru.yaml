title: "Sugarlips: восстановление доставки Boxberry"
tagline: Восстановил доставку в магазине, где варианты не появлялись после ввода
  адреса. Разобрал, почему наличие города в форме ещё не означает, что его
  получает модуль доставки.
year: "11.2021"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Boxberry
  - Checkout
  - Elementor
blocks:
  - type: text
    title: Задача и ограничения
    body: Восстановил доставку в магазине, где варианты не появлялись после ввода
      адреса. Разобрал, почему наличие города в форме ещё не означает, что его
      получает модуль доставки.
  - type: text
    title: Как устроено решение
    body: Сверил настройки с поддержкой перевозчика. Выяснил, что нужное поле города
      отличается от billing_city, а обязательное значение не передавалось. С
      разрешения клиента отключил лишние компоненты, настроил доставку и
      подготовил проверку нового заказа и письма. Отдельно указал, какие
      компоненты остаются устаревшими.
  - type: text
    title: Результат и проверка
    body: Клиент принял настройку. Отправление, карта ПВЗ и подключение Почты России
      архивом не подтверждены.
