title: Подготовка каталога сантехники к импорту
tagline: Собрал данные поставщика в редактируемую таблицу, чтобы магазин мог
  отобрать нужные позиции, задать цены и согласовать фотографии до загрузки на
  сайт.
year: "04.2024"
role: Веб-разработка и автоматизация
stack:
  - Excel
  - Web scraping
  - Product data
  - Taxonomy
blocks:
  - type: text
    title: Задача и ограничения
    body: Собрал данные поставщика в редактируемую таблицу, чтобы магазин мог
      отобрать нужные позиции, задать цены и согласовать фотографии до загрузки
      на сайт.
  - type: text
    title: Как устроено решение
    body: Использовал карту сайта для поиска карточек. Поскольку в источнике не было
      цен, добавил отдельную колонку для заполнения. Отсортировал позиции по
      категориям, привёл родительские и дочерние разделы к единому формату и
      объяснил, как передавать в поле images ссылки или подготовленные имена
      собственных фотографий.
  - type: text
    title: Результат и проверка
    body: Клиент принял таблицу с бонусом. Итоговый отбор и импорт были отдельными
      задачами, а число URL в карте донора не равно подтверждённому числу
      загруженных товаров.
