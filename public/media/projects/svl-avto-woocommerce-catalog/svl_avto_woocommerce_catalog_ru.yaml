title: "SVL-AVTO: перенос магазина с Joomla на WooCommerce"
tagline: Магазину оборудования для автосервисов нужна была новая витрина с
  поиском по артикулу и фильтрацией. Требовалось перенести товары из Joomla,
  подготовить обновление из таблиц и не менять действующий магазин до приёмки
  новой версии.
year: 07–08.2025
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Joomla
  - WoodMart
  - CSV
  - Staging
blocks:
  - type: text
    title: Задача и ограничения
    body: Магазину оборудования для автосервисов нужна была новая витрина с поиском
      по артикулу и фильтрацией. Требовалось перенести товары из Joomla,
      подготовить обновление из таблиц и не менять действующий магазин до
      приёмки новой версии.
  - type: text
    title: Как устроено решение
    body: "Развернул WordPress и WoodMart на временном адресе. Запросил выгрузку с
      артикулами, ценами, остатками, описаниями, фото, категориями и
      характеристиками. При проверке CSV объёмом около 55 МБ обнаружил
      перепутанные столбцы, поэтому сначала подготовил данные, а уже потом
      перешёл к импорту. Работу разделил на проверяемые этапы: витрина, импорт и
      шаблоны обновления, фильтры, оплата и доставка, затем перенос."
  - type: text
    title: Результат и проверка
    body: Клиент принял финальный этап 20 августа 2025 года. На архивной главной
      видны категории техники, карточки подъёмников и домкратов и каталог
      брендов. Число импортированных товаров и работу конкретных платёжных и
      транспортных модулей отдельно не подтверждаю. Нынешний сайт на прежнем
      адресе не относится к этой работе.
  - type: text
    title: Проект в портфолио Kwork
