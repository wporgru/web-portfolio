title: "SVL-AVTO: moving an equipment store from Joomla to WooCommerce"
tagline: An auto workshop equipment store needed a new storefront with SKU
  search and filters. The brief called for moving products from Joomla,
  preparing spreadsheet updates and keeping the existing store unchanged until
  its replacement was approved.
year: 07–08.2025
role: Web development and automation
stack:
  - WooCommerce
  - Joomla
  - WoodMart
