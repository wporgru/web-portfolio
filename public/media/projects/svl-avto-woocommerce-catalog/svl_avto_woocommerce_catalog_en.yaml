blocks:
  - type: text
    title: Brief and constraints
    body: An auto workshop equipment store needed a new storefront with SKU search
      and filters. The brief called for moving products from Joomla, preparing
      spreadsheet updates and keeping the existing store unchanged until its
      replacement was approved.
  - type: text
    title: How it works
    body: "Set up WordPress and WoodMart on staging. Requested SKUs, prices, stock,
      descriptions, images, categories and attributes. An approximately 55 MB
      CSV had mismatched columns, so I reviewed the data before importing it.
      Delivery was split into stages: storefront, import and update templates,
      filters, payment and shipping setup, then cutover."
  - type: text
    title: Result and verification
    body: The client accepted the final stage on August 20, 2025. The archived
      homepage shows equipment categories, lifts and jacks, and a brand
      directory. The final imported product count and behavior of individual
      payment and shipping modules are not independently verified. The current
      content at the former address is unrelated to this work.
