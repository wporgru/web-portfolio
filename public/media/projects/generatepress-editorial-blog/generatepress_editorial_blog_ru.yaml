title: Блог на GeneratePress с оглавлением статей
tagline: Настроил основу блога на GeneratePress, чтобы редактор мог публиковать
  структурированные статьи и получать оглавление из заголовков.
year: "01.2023"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - GeneratePress
  - LuckyWP
  - Editorial workflow
blocks:
  - type: text
    title: Задача и ограничения
    body: Настроил основу блога на GeneratePress, чтобы редактор мог публиковать
      структурированные статьи и получать оглавление из заголовков.
  - type: text
    title: Как устроено решение
    body: Настроил тему и подготовил демонстрационную запись с изображением и
      несколькими заголовками. В согласованный состав включил LuckyWP Table of
      Contents и показал работу оглавления на примере статьи.
  - type: text
    title: Результат и проверка
    body: Клиент принял основу блога. Демонстрационная статья не означает полное
      наполнение, а скорость темы не оценивалась сравнительным замером.
