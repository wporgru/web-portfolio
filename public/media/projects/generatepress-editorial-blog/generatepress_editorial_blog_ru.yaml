title: "Блог на GeneratePress: структура статей и автоматическое оглавление"
tagline: "Подготовил редакционную основу на бесплатной теме GeneratePress:
  образец статьи показывает структуру и навигацию по заголовкам через LuckyWP."
year: "01.2023"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - GeneratePress
  - LuckyWP
  - Editorial workflow
blocks:
  - type: text
    title: Блог, который удобно читать и пополнять
    body: "В январе 2023 года клиенту понадобилась основа для лёгкого блога
      WordPress на бесплатной версии GeneratePress. В качестве визуального
      ориентира он предложил codingcampus.net, но готовое решение должно было
      использовать возможности бесплатной темы, без функций платного тарифа.
      Для статей требовалась понятная структура: иллюстрация, смысловые разделы
      и оглавление, помогающее читателю быстро перейти к нужному фрагменту."
  - type: text
    title: Настройка темы и демонстрация редакционного шаблона
    body: "Настроил GeneratePress как базу блога и подготовил пример публикации с
      изображением и несколькими заголовками. Подключил LuckyWP Table of Contents
      в согласованном объёме и проверил на демонстрационной статье, что оглавление
      формируется на основе структуры заголовков. Такой пример показывает
      редактору, как размечать материал, и посетителю — как ориентироваться в
      длинном тексте. Важное ограничение задания — бесплатная версия темы:
      решение не опирается на функции GeneratePress Premium, которые не входили
      в согласованный набор."
  - type: text
    title: Результат и границы проекта
    body: "Клиент принял настройку и оставил отзыв: «быстро и четко, рекомендую».
      Передана основа блога и показательный шаблон записи, но не библиотека
      полностью опубликованных материалов: создание всего контента не
      подтверждено. Домен проекта не установлен, поэтому референс codingcampus.net
      не выдаётся за сайт клиента. Числовые замеры скорости до и после не
      проводились — «лёгкий блог» описывает исходное пожелание, а не измеренный
      результат."
    links:
      - label: Исходный заказ и отзыв на Kwork
        url: https://kwork.ru/track?id=33142763
  - type: text
    title: Как работает оглавление из заголовков
    body: "Для длинной статьи оглавление превращает последовательность разделов в
      быстрые переходы внутри публикации. Редактору достаточно поддерживать
      иерархию заголовков, а посетитель может заранее увидеть структуру и
      перейти к нужной теме. В этом проекте взаимодействие было показано на
      демонстрационной записи; полноценная контентная библиотека и её наполнение
      в объём кейса не включаются."
