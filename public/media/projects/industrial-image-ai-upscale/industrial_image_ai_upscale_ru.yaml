title: Увеличение фотографий мостовых ограждений с ИИ
tagline: Подготовил увеличенные фотографии ограждений для сайта завода. Заказчику нужно было различать
  детали конструкций, а не просто получить файлы с большим разрешением.
year: '07.2023'
role: Веб-разработка и автоматизация
stack:
- AI-assisted image processing
- Upscaling
- Asset delivery
blocks:
- type: text
  title: Задача для промышленного каталога
  body: Заводу потребовались увеличенные изображения пешеходных мостовых ограждений из раздела
    его сайта. Важно было показать конструкцию на странице достаточно крупно, чтобы посетитель
    мог рассмотреть элементы.
- type: text
  title: Два варианта для оценки
  body: Сначала подготовил и передал ZIP с увеличенными изображениями; заказчик оценил отображение
    на сайте как приемлемое. После дополнительного вопроса о чёткости деталей подготовил второй
    архив с четырёхкратным увеличением при помощи нейросети и предложил сравнить результат с первым
    вариантом.
- type: text
  title: Результат и ограничения
  body: Заказчик принял работу после передачи второго комплекта. По сохранившимся материалам подтверждаются
    факт передачи архивов и заявленный способ увеличения; независимого пофайлового подсчёта и
    объективного сравнения качества нет. ИИ-увеличение служит подготовке изображений для витрины
    и не заменяет точные чертежи или измерения конструкции.
- type: text
  title: Где может пригодиться
  body: 'Подобный рабочий процесс подходит для подготовки небольших исходных изображений к использованию
    в каталоге: сначала согласовать размер и назначение, затем отдельно оценить чёткость, артефакты
    и соответствие исходному изделию. Этот заказ касался изображений, а не разработки всего сайта
    завода.'
