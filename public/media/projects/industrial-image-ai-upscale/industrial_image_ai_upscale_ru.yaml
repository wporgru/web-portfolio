title: Увеличение фотографий мостовых ограждений с ИИ
tagline: Подготовил увеличенные фотографии ограждений для сайта завода.
  Заказчику нужно было различать детали конструкций, а не просто получить файлы
  с большим разрешением.
year: "07.2023"
role: Веб-разработка и автоматизация
stack:
  - AI-assisted image processing
  - Upscaling
  - Asset delivery
blocks:
  - type: text
    title: Задача и ограничения
    body: Подготовил увеличенные фотографии ограждений для сайта завода. Заказчику
      нужно было различать детали конструкций, а не просто получить файлы с
      большим разрешением.
  - type: text
    title: Как устроено решение
    body: Сначала передал ZIP с увеличенными изображениями, чтобы клиент оценил их
      на сайте. После вопроса о чёткости подготовил второй комплект с
      четырёхкратным увеличением через нейросеть. Отдельная выдача позволяла
      сравнить варианты, не подменяя первый набор.
  - type: text
    title: Результат и проверка
    body: Клиент принял работу после передачи второго комплекта. Увеличенные
      изображения предназначались для витрины, а не для восстановления точных
      размеров или чертежей.
