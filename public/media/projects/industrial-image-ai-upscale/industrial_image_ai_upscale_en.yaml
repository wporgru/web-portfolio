title: AI-assisted upscaling for bridge railing images
tagline: Prepared larger bridge railing images for a manufacturer’s website. The
  client wanted clearer construction details, not just files with more pixels.
year: "07.2023"
role: Web development and automation
stack:
  - AI-assisted image processing
  - Upscaling
  - Asset delivery
blocks:
  - type: text
    title: Brief and constraints
    body: Prepared larger bridge railing images for a manufacturer’s website. The
      client wanted clearer construction details, not just files with more
      pixels.
  - type: text
    title: How it works
    body: Delivered a ZIP of enlarged images for review on the website. After the
      client asked about definition, prepared a separate set using fourfold AI
      upscaling so the two outputs could be compared without replacing the first
      batch.
  - type: text
    title: Result and verification
    body: The client accepted the work after the second batch was delivered. The
      upscaled images were intended for display, not for recovering exact
      dimensions or engineering drawings.
