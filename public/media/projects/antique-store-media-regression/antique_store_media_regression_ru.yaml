title: Оптимизация изображений антикварного магазина
tagline: Доработал тяжёлые изображения и проблемные элементы витрины. Важно было
  не выиграть баллы ценой неработающих форм или подвала.
year: "07.2020"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WebP
  - Autoptimize
  - Yandex Metrica
  - SiteAnalyzer
blocks:
  - type: text
    title: Задача и ограничения
    body: Доработал тяжёлые изображения и проблемные элементы витрины. Важно было не
      выиграть баллы ценой неработающих форм или подвала.
  - type: text
    title: Как устроено решение
    body: Уменьшил фотографии, восстановил баннеры и исправлял битые изображения
      категорий по SiteAnalyzer. Откатил настройки, которые ломали формы и
      социальные виджеты. Устранил конфликт Clearfy с подвалом, перенёс Метрику
      и убрал дублирующий счётчик. Отдельно заменил мобильный логотип.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил мобильную правку и принял работу. В отчёте упомянут
      настольный PageSpeed 77; сопоставимая серия замеров и мобильный результат
      не сохранились.
