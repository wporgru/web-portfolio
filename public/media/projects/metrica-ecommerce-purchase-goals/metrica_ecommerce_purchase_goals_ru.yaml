title: Электронная торговля и цели Яндекс Метрики
tagline: Настроил аналитику действующего магазина, чтобы отличать интерес к
  корзине от завершения покупки и видеть суммы заказов в отчётах.
year: "09.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Yandex Metrica
  - E-commerce analytics
blocks:
  - type: text
    title: Задача и ограничения
    body: Настроил аналитику действующего магазина, чтобы отличать интерес к корзине
      от завершения покупки и видеть суммы заказов в отчётах.
  - type: text
    title: Как устроено решение
    body: Разобрал сценарий от перехода к корзине до возврата после оплаты.
      Подключил электронную торговлю и объяснил владельцу разницу между
      автоматическими целями и добавленными целями оформления. При сдаче
      отдельно попросил сверить покупку и сумму, а не только наличие события.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил цели покупки и суммы в отзыве. Повторная отправка
      событий, точность выручки за период и дальнейшее ведение рекламы не
      проверялись.
