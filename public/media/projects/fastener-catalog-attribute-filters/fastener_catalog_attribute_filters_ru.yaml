title: Фильтры каталога крепежа по характеристикам
tagline: После восстановления вывода характеристик настроил фильтры, которые
  помогают сужать ассортимент и не перегружают страницы нерелевантными
  параметрами.
year: "06.2024"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Product attributes
  - Catalog filters
blocks:
  - type: text
    title: Задача и ограничения
    body: После восстановления вывода характеристик настроил фильтры, которые
      помогают сужать ассортимент и не перегружают страницы нерелевантными
      параметрами.
  - type: text
    title: Как устроено решение
    body: Создал фильтры по содержательным атрибутам, исключив пустые и служебные
      значения. Объяснил разницу между каталогом, где доступен общий набор, и
      категорией, где показываются параметры её товаров. Отдельно предложил
      развести реальную иерархию категорий и боковое меню.
  - type: text
    title: Результат и проверка
    body: Клиент принял настройку. Полная перестройка дерева категорий оставалась
      рекомендацией; скорость и все комбинации выбора не измерялись.
  - type: text
    title: Другой этап этого проекта
