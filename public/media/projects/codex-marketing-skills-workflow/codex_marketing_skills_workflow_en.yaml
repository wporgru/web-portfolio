title: Local Codex skills for marketing workflows
tagline: "Prepared three repeatable editorial workflows: develop positioning and
  sales arguments, run a brainstorm, and plan a Telegram channel. The task was
  more than installing prompts: it required understanding the embedded rules and
  deciding what outputs the agent should treat as acceptable."
