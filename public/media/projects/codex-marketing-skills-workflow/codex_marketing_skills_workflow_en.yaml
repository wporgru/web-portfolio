blocks:
  - type: text
    title: Brief and constraints
    body: "Prepared three repeatable editorial workflows: develop positioning and
      sales arguments, run a brainstorm, and plan a Telegram channel. The task
      was more than installing prompts: it required understanding the embedded
      rules and deciding what outputs the agent should treat as acceptable."
  - type: text
    title: How it works
    body: "Inspected the three packages: skill instructions, manifests, interface
      metadata and images. Removed advertising and hidden promotional
      instructions. Added rules against invented achievements, guarantees and
      quotes, and made the public-figure brainstorm explicitly hypothetical.
      Assembled a local catalog, installed the edited versions and validated all
      three skill structures. On Windows, fixed Cyrillic decoding by running the
      validator in UTF-8 mode."
  - type: text
    title: Result and verification
    body: Three skills are available in the local workspace, and all passed a repeat
      structure validation. They are instruction-based workflows with no MCP
      servers, external APIs or automated publishing. Structural validation does
      not replace editorial review or demonstrate sales growth.
