title: Local Codex skills for marketing workflows
tagline: "Prepared three repeatable editorial workflows: develop positioning and sales
  arguments, run a brainstorm, and plan a Telegram channel. The task was more than
  installing prompts: it required understanding the embedded rules and deciding what
  outputs the agent should treat as acceptable."
year: "10.2026"
role: Web development and automation
stack:
  - Codex
  - Agent workflows
  - Prompt engineering
  - JSON
  - YAML
blocks:
  - type: text
    title: Why repeatable AI workflows matter
    body: "One-off AI prompts can produce inconsistent output and lose important operating
      constraints. The editorial task called for three repeatable workflows: positioning,
      brainstorming and Telegram channel planning. The goal was structured preparation for
      human review, not automatic publishing."
  - type: text
    title: Inspecting packages before installation
    body: "I inspected three archives: SKILL.md instructions, manifests, YAML interface
      metadata and images. These were instruction-only packages, with no bundled scripts,
      MCP servers or external APIs. I checked both the package format and the actions or
      claims the instructions attempted to impose on the agent."
  - type: text
    title: Removing hidden promotions and invented evidence
    body: I removed promotional and hidden commercial instructions. I added requirements not
      to invent achievements, guarantees or quotations, to label perspectives of
      well-known people as thought experiments, and not to spawn separate agents without
      permission. The specific positioning, brainstorming and channel-planning workflows
      remained intact rather than being reduced to generic prompts.
  - type: text
    title: Local installation and validation
    body: I assembled a local plugin catalog with separate sources, installed and enabled the
      three edited packages, and checked their manifests, paths, state and skill
      structure. On Windows the validator initially failed to read Russian text under the
      system encoding; I reran it with PYTHONUTF8=1. All three structural validations
      passed.
  - type: text
    title: Boundaries and next step
    body: "These are local instruction-based workflows, not an autonomous CRM, ad-account
      integration or publishing system. Passing structural validation does not guarantee
      factual accuracy of generated content or sales growth: a person still needs to
      review the output. For a similar task, send a representative brief, the desired
      output format and examples of actions the agent must not take."
    links:
