title: Маркетинговые ИИ-навыки в локальном Codex
tagline: "Подготовил для редакционной работы три повторяемых сценария: собрать
  позиционирование и аргументы для продажи, провести брейншторм и спланировать
  Telegram-канал. Требовалось не просто установить готовые промпты, а понять,
  какие правила они навязывают и что агент будет считать допустимым
  результатом."
year: "10.2026"
role: Веб-разработка и автоматизация
stack:
  - Codex
  - Agent workflows
  - Prompt engineering
  - JSON
  - YAML
blocks:
  - type: text
    title: Задача и ограничения
    body: "Подготовил для редакционной работы три повторяемых сценария: собрать
      позиционирование и аргументы для продажи, провести брейншторм и
      спланировать Telegram-канал. Требовалось не просто установить готовые
      промпты, а понять, какие правила они навязывают и что агент будет считать
      допустимым результатом."
  - type: text
    title: Как устроено решение
    body: "Разобрал содержимое трёх пакетов: инструкции навыков, манифесты,
      метаданные интерфейса и изображения. Убрал рекламу и скрытые коммерческие
      инструкции. Добавил запрет выдумывать достижения, гарантии и цитаты;
      сценарий с известными людьми явно обозначил как мысленный эксперимент.
      Собрал локальный каталог, установил отредактированные версии и проверил
      структуру всех трёх навыков. Для Windows отдельно устранил сбой чтения
      кириллицы, включив UTF-8 при запуске валидатора."
  - type: text
    title: Результат и проверка
    body: Три навыка доступны в локальной рабочей среде, их структура повторно
      прошла валидацию. Это сценарии на основе инструкций, без MCP-серверов,
      внешних API и автоматической публикации. Проверка формата не заменяет
      вычитку сгенерированного текста и не подтверждает рост продаж.
