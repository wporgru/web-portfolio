title: Маркетинговые ИИ-навыки в локальном Codex
tagline: "Подготовил для редакционной работы три повторяемых сценария: собрать
  позиционирование и аргументы для продажи, провести брейншторм и спланировать
  Telegram-канал. Требовалось не просто установить готовые промпты, а понять, какие
  правила они навязывают и что агент будет считать допустимым результатом."
year: "10.2026"
role: Веб-разработка и автоматизация
stack:
  - Codex
  - Agent workflows
  - Prompt engineering
  - JSON
  - YAML
blocks:
  - type: text
    title: Зачем бизнесу повторяемые ИИ-сценарии
    body: "Разовые запросы к ИИ часто дают разный формат ответа и не сохраняют условия работы.
      Для редакционных задач потребовались три сценария: сформулировать позиционирование,
      провести брейншторм и подготовить концепцию Telegram-канала. Целью была не
      автоматическая публикация, а управляемая подготовка идей и материалов для
      последующей проверки человеком."
  - type: text
    title: Проверка пакетов перед установкой
    body: "Разобрал содержимое трёх архивов: инструкции SKILL.md, манифесты, YAML-метаданные
      интерфейса и изображения. Пакеты оказались инструкционными: собственных скриптов,
      MCP-серверов и внешних API в них не было. Проверял не только формат, но и то, какие
      действия и формулировки текст пытается навязать агенту."
  - type: text
    title: Убрал скрытую рекламу и вымышленные доказательства
    body: "Удалил рекламные и скрытые коммерческие указания. Добавил требования не выдумывать
      достижения, гарантии и цитаты, обозначать перспективы известных людей как мысленный
      эксперимент и не создавать отдельных агентов без разрешения. Сохранил предметные
      сценарии: позиционирование, брейншторм и планирование канала, а не превратил их в
      общие шаблоны ответов."
  - type: text
    title: Локальная установка и проверка
    body: Собрал локальный каталог плагинов с отдельными источниками, установил и включил три
      отредактированных пакета. Проверил манифесты, пути, состояние и структуру навыков.
      На Windows валидатор первоначально не смог прочитать русские инструкции из-за
      системной кодировки; повторил проверку с PYTHONUTF8=1. Валидация прошла для всех
      трёх.
  - type: text
    title: Границы результата и следующий шаг
    body: "Это локальные сценарии на инструкциях, а не автономная CRM, не подключение
      рекламных кабинетов и не автоматическая публикация. Успешная проверка структуры не
      гарантирует качества каждого текста или роста продаж: факты и итоговые материалы
      нужно проверять. Для похожей задачи пришлите типовой бриф, желаемый формат и примеры
      того, что агенту запрещено делать."
    links:
