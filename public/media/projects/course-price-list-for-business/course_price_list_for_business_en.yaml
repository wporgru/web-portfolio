blocks:
  - type: text
    title: Brief and constraints
    body: Updated course prices and prepared a separate price list for business
      customers instead of mixing corporate terms into the main page.
  - type: text
    title: How it works
    body: Checked course names and durations against the source and marked reviewed
      rows separately from courses that could not be found. When edits did not
      persist in the original tab, created a separate price list page and added
      it to the submenu.
  - type: text
    title: Result and verification
    body: The client approved the page and accepted the work. Creating missing
      courses and revising regional links were outside this stage.
