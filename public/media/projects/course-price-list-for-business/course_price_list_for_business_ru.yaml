title: Обновление цен курсов и прайс для организаций
tagline: Обновил стоимость курсов и подготовил отдельный прайс для организаций,
  чтобы корпоративные условия не смешивались с основной страницей.
year: "02.2020"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Content operations
  - Price list
  - B2B
blocks:
  - type: text
    title: Задача и ограничения
    body: Обновил стоимость курсов и подготовил отдельный прайс для организаций,
      чтобы корпоративные условия не смешивались с основной страницей.
  - type: text
    title: Как устроено решение
    body: Сверял названия и длительность курсов с источником. В отчёте отдельно
      отметил проверенные строки и курсы, которых не нашёл. Когда изменения
      исходной вкладки не сохранялись, предложил отдельную страницу прайса и
      добавил её в подменю.
  - type: text
    title: Результат и проверка
    body: Клиент одобрил страницу и принял работу. Создание отсутствующих курсов и
      переработку региональных ссылок в этот этап не включал.
