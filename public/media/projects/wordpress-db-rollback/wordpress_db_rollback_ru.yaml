title: Восстановление страниц WordPress из резервной копии
tagline: После изменений на сайте и попытки отката страницы продолжали
  отображаться некорректно. Нужно было отделить проблему данных от
  закэшированного состояния.
year: "01.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Database recovery
  - RabbitLoader
blocks:
  - type: text
    title: Задача и ограничения
    body: После изменений на сайте и попытки отката страницы продолжали отображаться
      некорректно. Нужно было отделить проблему данных от закэшированного
      состояния.
  - type: text
    title: Как устроено решение
    body: Уточнил, как выполнялся предыдущий откат, и предложил восстановить более
      раннюю копию базы. После восстановления сбросил кэш RabbitLoader в
      админке, чтобы проверка не показывала устаревшее состояние.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил исправление отображения и принял заказ. Восстановление
      всех файлов и окончательная диагностика первоначальной причины не
      заявляются.
