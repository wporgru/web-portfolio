title: "WordPress: восстановление страниц из резервной копии и очистка кеша"
tagline: "Вернул корректное отображение ключевых разделов после неудачного
  самостоятельного отката: восстановил раннюю базу и сбросил кеш RabbitLoader."
year: "01.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Database recovery
  - RabbitLoader
blocks:
  - type: text
    title: Сайт откатили, но страницы всё ещё отображались неправильно
    body: В январе 2026 года владелица магазина бассейн-химия.рф обратилась после
      проблем с отображением главной, каталога, контактов и доставки. Перед этим
      клиентка самостоятельно удалила около 8000 спам-записей и пыталась откатить
      сайт средствами хостинга, но состояние ключевых страниц оставалось
      некорректным. Число удалённых записей относится к действиям клиента, а не к
      объёму работы по этому заказу. Задача — восстановить отображение страниц и
      не перепутать данные базы с уже сохранённым кешированным HTML.
  - type: text
    title: Последовательность восстановления
    body: "Сначала уточнил, как именно выполнялся предыдущий откат, чтобы не
      повторять тот же неполный сценарий. Предложил восстановить базу данных из
      более ранней копии, соответствующей состоянию до некорректных изменений.
      После восстановления отдельно очистил кеш RabbitLoader в административной
      панели. Это важно для проверки: иначе сайт может продолжать отдавать старую
      сохранённую разметку, даже когда данные уже восстановлены. Работы были
      направлены на восстановление отображения страниц, а не на полный возврат
      файлов сайта или расследование причины удаления записей."
  - type: text
    title: Результат и подтверждение
    body: "После восстановления базы и очистки кеша клиент подтвердил, что
      отображение страниц исправлено, поблагодарил и явно принял заказ. В отзыве
      отметил, что проблема была быстро устранена. Подтверждён именно этот
      восстановительный этап: не заявляю восстановление всех файлов, полное
      выяснение первопричины, защиту от повторного инцидента или самостоятельную
      очистку около 8000 записей."
    links:
      - label: Исходный заказ и отзыв на Kwork
        url: https://kwork.ru/track?id=58572476
  - type: text
    title: Почему после отката важно очистить кеш
    body: "Восстановление резервной копии и проверка публичной страницы — не одно
      и то же. Если внешний кеш хранит предыдущую версию, сайт может показывать
      старую страницу уже после изменения базы. Поэтому восстановительный процесс
      должен учитывать оба слоя: сначала привести данные к нужному состоянию,
      затем очистить кеш и только после этого повторно проверить проблемные
      страницы. В этом заказе очистка RabbitLoader входила в подтверждённую
      последовательность работ."
