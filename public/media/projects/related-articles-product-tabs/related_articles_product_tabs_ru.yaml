  - type: text
    title: Как устроено решение
    body: Подготовил вывод через шорткод во вкладке карточки. Передал иллюстрации и
      видео с порядком настройки, отдельно объяснил, как оформить отступ перед
      вставкой, чтобы блок не сливался с текстом.
  - type: text
    title: Результат и проверка
    body: Клиент принял результат. Массовое автоматическое назначение статей всему
      каталогу не входило в этот этап.
