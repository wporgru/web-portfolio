title: Связанные статьи во вкладках товаров WooCommerce
tagline: Добавил способ показывать полезные статьи прямо в карточках товаров, сохранив индивидуальный
  выбор материалов для каждой позиции.
year: '12.2023'
role: Веб-разработка и автоматизация
stack:
- WooCommerce
- Shortcodes
- Editorial workflow
blocks:
- type: text
  title: Задача для товарных карточек
  body: Заказчик проекта «Воблачке» хотел показывать рядом с продуктами полезные статьи по примеру
    другого сайта. Обсуждался отбор по меткам или категориям, но было важно сохранить возможность
    индивидуального подбора материалов для конкретного товара.
- type: text
  title: Решение во вкладке товара
  body: Подготовил способ размещать связанные статьи через шорткод во вкладке карточки WooCommerce.
    Для каждого товара материалы можно было выбирать отдельно, не заменяя редакционный выбор
    автоматическим назначением всему каталогу.
- type: text
  title: Передача владельцу
  body: Передал иллюстрации и видео с порядком настройки, а также объяснил, как сделать отступ
    перед вставкой, чтобы блок не сливался с соседним текстом. Клиент принял работу и отметил
    оперативность.
- type: text
  title: Что входило в результат
  body: Подтверждён индивидуальный способ вывода и инструкция по использованию. Массовое автоматическое
    назначение статей, отдельный личный кабинет и другие обсуждавшиеся задачи в результат этого
    этапа не включены.
