title: XML import of variable products with markup rules
tagline: A variable-product assortment needed importing, with repeat pricing
  updates and fewer unnecessary copies of product images.
year: "12.2023"
role: Web development and automation
stack:
  - WooCommerce
  - XML
  - Pricing
