title: XML-импорт вариативных товаров с наценкой
tagline: Загрузил вариативный ассортимент поставщика из XML в WooCommerce,
  отдельно перенастроил наценку на 25% и подготовил повторение раз в десять дней.
year: "12.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - XML
  - Pricing
  - Product variants
blocks:
  - type: text
    title: Не перепутать карточки и вариации
    body: "Поставщик передавал вариативный ассортимент в XML. Оценка примерно
      в 15 тысяч относилась к вариантам, а не к числу родительских товаров:
      подтверждённого итога по карточкам нет. Настроил загрузку и сопровождал
      длительный прогон, отдельно разбирая замечания к пустым названиям и
      повторяющимся артикулам."
  - type: text
    title: Диск, цены и расписание проверял отдельно
    body: Во время импорта вырос расход места на хостинге. Отключил создание
      лишних размеров миниатюр; это не равнозначно сжатию уже загруженной
      медиатеки. Для следующего обновления изменил согласованную наценку на
      25%, проверил запуск и настроил повторение раз в десять дней.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил завершение конкретного прогона и принял работу. Успешный
      автоматический повтор через десять дней и сжатие всей медиатеки не
      подтверждены.
  - type: text
    title: Что нужно для оценки похожего импорта
    body: Пришлите обезличенный фрагмент XML с родительским товаром и двумя
      вариантами. Укажите, что можно обновлять при повторном запуске — цену,
      остатки, фото — и какие поля менеджеры редактируют вручную. Для большого
      каталога сначала согласуем контрольную выборку, правила наценки и проверку
      диска, затем решим вопрос с расписанием.
