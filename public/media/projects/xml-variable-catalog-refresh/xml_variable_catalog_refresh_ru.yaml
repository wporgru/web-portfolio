title: XML-импорт вариативных товаров с наценкой
tagline: Требовалось загрузить вариативный ассортимент, предусмотреть повторное
  обновление цен и не расходовать место на лишние копии товарных изображений.
year: "12.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - XML
  - Pricing
  - Product variants
blocks:
  - type: text
    title: Задача и ограничения
    body: Требовалось загрузить вариативный ассортимент, предусмотреть повторное
      обновление цен и не расходовать место на лишние копии товарных
      изображений.
  - type: text
    title: Как устроено решение
    body: Настроил XML-импорт и сопровождал длительную загрузку. По отчёту отключил
      лишние размеры миниатюр. Для следующего прогона изменил наценку на
      согласованные 25%, разобрал замечания о названиях и повторяющихся
      артикулах и проверил запуск перед настройкой повторения раз в десять дней.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил завершение конкретного прогона и принял работу. Успешный
      автоматический повтор через десять дней и сжатие всей медиатеки не
      подтверждены.
