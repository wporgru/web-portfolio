title: "«Фаэтон»: восстановление блога и архивов тегов"
tagline: "Читатель попадал на главную вместо публикаций по тегу, а один старый
  адрес рубрики возвращал 404. После снятия перенаправления обнаружилась ещё
  одна проблема: одинаковые даты импортированных записей приводили к дублям и
  пропускам при переходе между страницами архива."
year: "10.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Clearfy
  - Technical SEO
  - 301 redirects
  - Pagination
blocks:
  - type: text
    title: Задача и ограничения
    body: "Читатель попадал на главную вместо публикаций по тегу, а один старый
      адрес рубрики возвращал 404. После снятия перенаправления обнаружилась ещё
      одна проблема: одинаковые даты импортированных записей приводили к дублям
      и пропускам при переходе между страницами архива."
  - type: text
    title: Как устроено решение
    body: Отключил только настройку Clearfy, которая перенаправляла архивы тегов.
      Для главного запроса добавил сортировку по дате и ID, чтобы при одинаковой
      дате порядок оставался стабильным. Убрал устаревшие статические вкладки,
      сохранил H1 и оставил динамический список рубрик. Для старого адреса
      добавил узкий 301 на блог только при ответе 404 и сохранил параметры URL.
  - type: text
    title: Результат и проверка
    body: В отчёте 81 непустой архив вернул HTTP 200 без перенаправления. На восьми
      страницах тега Wellland стало 91 из 91 уникальных записей вместо 88
      уникальных в прежней выборке. Это проверка доступности и пагинации, а не
      доказательство индексации или роста трафика.
  - type: image
    src: /media/projects/faeton-blog-tag-archive-recovery/public-full.webp
    alt: Блог «Фаэтон» со списком статей, рубриками и пагинацией
