title: Парсинг и импорт каталога офисной техники
tagline: Нужно было собрать ассортимент поставщика и подготовить первую загрузку
  в WooCommerce с учётом исключений и карточек с изображениями-заглушками.
year: 04–05.2026
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Data import
  - Web scraping
blocks:
  - type: text
    title: Задача и ограничения
    body: Нужно было собрать ассортимент поставщика и подготовить первую загрузку в
      WooCommerce с учётом исключений и карточек с изображениями-заглушками.
  - type: text
    title: Как устроено решение
    body: Настроил сбор и согласовал обработку выгрузки с заказчиком до запуска.
      Показал первые карточки на витрине, отметил прогресс промежуточной
      загрузки, а после завершения отдельно сообщил о готовности. Это позволило
      не выдавать промежуточную сдачу за завершённый импорт.
  - type: text
    title: Результат и проверка
    body: Первый этап принят. Число 43 316 относится к позициям источника; итоговое
      количество импортированных записей отдельно не пересчитывалось.
