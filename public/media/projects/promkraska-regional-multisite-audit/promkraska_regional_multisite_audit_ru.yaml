title: "«Промкраска»: SEO-аудит четырёх городских поддоменов"
tagline: Проверил, что мешает региональному каталогу показывать правильные
  данные по городу. Массовый обход прерывался ошибками сервера, поэтому нужно
  было отделить подтверждённые проблемы шаблонов от участков, которые проверить
  полностью не получилось.
year: "08.2026"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - WordPress Multisite
  - Screaming Frog
  - Search Console
  - Technical SEO
blocks:
  - type: text
    title: Задача и ограничения
    body: Проверил, что мешает региональному каталогу показывать правильные данные
      по городу. Массовый обход прерывался ошибками сервера, поэтому нужно было
      отделить подтверждённые проблемы шаблонов от участков, которые проверить
      полностью не получилось.
  - type: text
    title: Как устроено решение
    body: "Сверил основной домен и четыре поддомена: доступность и HTTPS, карты
      сайта, canonical, заголовки, описания и разметку товара. После сбоев
      краулеров проверил репрезентативную выборку напрямую. Сопоставил похожесть
      городских главных и признаки копирования шаблона карточки; отдельно изучил
      выгрузки поисковой аналитики, чтобы разделить проблемы обхода и уже
      существующей видимости."
  - type: text
    title: Результат и проверка
    body: "В 21 из 24 проверенных региональных карточек описание повторяло чужой
      город, бренд и телефон. Карта сайта содержала 2 807 адресов — это размер
      карты, а не число проверенных страниц. Передал приоритеты: сначала
      доступность и сертификаты, затем исправление шаблонов карточек и локальные
      данные. Внедрение и рост трафика не приписываю аудиту."
