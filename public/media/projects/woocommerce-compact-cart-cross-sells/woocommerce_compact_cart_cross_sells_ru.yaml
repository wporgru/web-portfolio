title: Компактная корзина и связанные товары WooCommerce
tagline: Сделал корзину и подборки товаров компактнее. Длинные названия и
  служебные уточнения мешали выравниванию кнопок и занимали место, нужное для
  самой покупки.
year: "05.2022"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Cart UX
  - Cross-sells
  - Storefront layout
blocks:
  - type: text
    title: Задача и ограничения
    body: Сделал корзину и подборки товаров компактнее. Длинные названия и служебные
      уточнения мешали выравниванию кнопок и занимали место, нужное для самой
      покупки.
  - type: text
    title: Как устроено решение
    body: Показал изменения корзины, карточки и виджета мини-корзины в шапке. Для
      товарных рядов предложил сократить число колонок или выровнять длину
      названий, а сведения об упаковке и подарках вынести в краткое описание.
      Эти меры разобрал отдельно от уже выполненных правок.
  - type: text
    title: Результат и проверка
    body: Клиент принял работу и оставил редактуру названий за собой. Принудительное
      выравнивание всех кнопок, массовый копирайтинг и полный редизайн не
      входили в результат.
