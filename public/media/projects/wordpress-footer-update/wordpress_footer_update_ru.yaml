title: Обновление компонентов и восстановление футера
tagline: После обновлений на действующем сайте появились проблемы с подвалом и
  мобильным меню. Нужно было вернуть согласованный внешний вид и разобраться,
  какие компоненты влияют на результат.
year: "04.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Theme updates
  - ElementsKit
blocks:
  - type: text
    title: Задача и ограничения
    body: После обновлений на действующем сайте появились проблемы с подвалом и
      мобильным меню. Нужно было вернуть согласованный внешний вид и
      разобраться, какие компоненты влияют на результат.
  - type: text
    title: Как устроено решение
    body: Обновил доступные компоненты и переустановил обновлённую тему, не включая
      в обновление два неофициальных Pro-плагина. После проверки клиентом
      разобрал замечания по ElementsKit, уточнил нужные шаблоны и восстановил
      подвал.
  - type: text
    title: Результат и проверка
    body: Клиент отдельно подтвердил готовность подвала и принял заказ. Успешную
      проверку мобильного меню и полное восстановление ElementsKit отчёт не
      подтверждает.
