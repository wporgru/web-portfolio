title: Доработка YML-фида из Tilda для Яндекса
tagline: "Подготовил фид из Tilda для загрузки в Яндекс: товарные характеристики
  были в выгрузке, но не в той структуре, в которой их ожидал получатель."
year: "10.2023"
role: Веб-разработка и автоматизация
stack:
  - Tilda
  - YML
  - XML
  - Product feeds
blocks:
  - type: text
    title: Задача и ограничения
    body: "Подготовил фид из Tilda для загрузки в Яндекс: товарные характеристики
      были в выгрузке, но не в той структуре, в которой их ожидал получатель."
  - type: text
    title: Как устроено решение
    body: Нашёл характеристики в исходном файле и преобразовал их в элементы param.
      Разместил исправленный файл по доступной ссылке и передал клиенту для
      загрузки. Поле barcode не добавлял и обозначил это при сдаче.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил успешную загрузку и принял работу. Отображение карточек
      в поиске и рост трафика не проверялись.
