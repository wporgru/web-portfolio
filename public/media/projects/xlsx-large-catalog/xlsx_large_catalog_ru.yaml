title: Массовая загрузка более 15 тысяч позиций из XLSX
tagline: Нужно было перенести большой ассортимент и привязать фотографии без
  ручного заполнения тысяч карточек. Заказчик должен был понимать, как добавлять
  новые строки и какие поля нельзя произвольно менять.
year: "04.2025"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - XLSX
  - SKU
  - Product media
blocks:
  - type: text
    title: Задача и ограничения
    body: Нужно было перенести большой ассортимент и привязать фотографии без
      ручного заполнения тысяч карточек. Заказчик должен был понимать, как
      добавлять новые строки и какие поля нельзя произвольно менять.
  - type: text
    title: Как устроено решение
    body: Взял за основу две образцовые карточки и подготовил шаблон XLSX с
      согласованными SKU и массой. Выявил, что таблица указывает JPG, а в
      медиабиблиотеке используются PNG. Объяснил правила совпадения имён и
      расширений, дождался недостающих файлов, запустил импорт и проверил ход
      вместе с заказчиком.
  - type: text
    title: Результат и проверка
    body: Клиент проверил и принял импорт. В отзыве указал более 15 тысяч позиций.
      Это оценка из приёмки, а не новый пересчёт базы; публикация магазина и
      поиск по приблизительным размерам не подтверждены этим этапом.
