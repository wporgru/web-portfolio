title: Importing more than 15,000 WooCommerce items from XLSX
tagline: A large assortment needed to be imported with images without manually
  creating thousands of listings. The client also needed to know how to add rows
  and which fields had to remain stable.
year: "04.2025"
role: Web development and automation
stack:
  - WooCommerce
  - XLSX
  - SKU
  - Product media
blocks:
  - type: text
    title: Brief and constraints
    body: A large assortment needed to be imported with images without manually
      creating thousands of listings. The client also needed to know how to add
      rows and which fields had to remain stable.
  - type: text
    title: How it works
    body: Used two sample products to design the workbook, with agreed SKU and
      weight columns. Found that the sheet referenced JPG files while the media
      library used PNG. Explained exact filename matching, waited for missing
      assets and ran the import with the client able to follow its progress.
  - type: text
    title: Result and verification
    body: The client checked and accepted the import and cited more than 15,000
      items in the review. This is acceptance evidence, not a new database
      count. Public launch and approximate-size search were not established by
      this stage.
