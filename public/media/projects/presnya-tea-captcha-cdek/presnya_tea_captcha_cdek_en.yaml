title: "Presnya Tea: CAPTCHA and delivery setup"
tagline: Refined an existing tea storefront, extending protection beyond an
  already protected form and configuring the available CDEK delivery option.
year: "05.2022"
role: Web development and automation
stack:
  - WordPress
