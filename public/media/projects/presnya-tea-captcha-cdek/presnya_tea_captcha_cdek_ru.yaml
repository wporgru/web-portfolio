title: "Presnya Tea: защита форм и настройка доставки"
tagline: "Доработал действующий чайный магазин: расширил защиту за пределы
  существующей формы и настроил доступный вариант доставки СДЭК."
year: "05.2022"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - CAPTCHA
  - CDEK
blocks:
  - type: text
    title: Задача и ограничения
    body: "Доработал действующий чайный магазин: расширил защиту за пределы
      существующей формы и настроил доступный вариант доставки СДЭК."
  - type: text
    title: Как устроено решение
    body: Добавил CAPTCHA на вход, регистрацию и комментарии, не меняя уже
      защищённую форму. Настроил доставку со склада до двери. Когда ПВЗ и
      вариант «склад — склад» не заработали из-за истёкшей лицензии модуля,
      согласовал с владельцем ограниченный режим. Также поправил оформление и
      отступ после мобильной проверки.
  - type: text
    title: Результат и проверка
    body: Клиент принял этап с доступным способом доставки. Продление лицензии,
      подключение ПВЗ и снижение числа спамных сообщений не подтверждены.
