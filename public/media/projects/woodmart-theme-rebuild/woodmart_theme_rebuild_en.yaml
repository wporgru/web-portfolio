title: Updating WoodMart and rebuilding the header and footer
tagline: An old WoodMart version had accumulated errors, and some settings no
  longer worked after the update. The client needed a coherent storefront, not
  just newer theme files.
year: "04.2026"
role: Web development and automation
stack:
  - WordPress
  - WoodMart
  - Theme updates
blocks:
  - type: text
    title: Brief and constraints
    body: An old WoodMart version had accumulated errors, and some settings no
      longer worked after the update. The client needed a coherent storefront,
      not just newer theme files.
  - type: text
    title: How it works
    body: Updated the theme and rebuilt the header and sliders rather than carrying
      over incompatible settings. Added two slides and left out outdated
      material. After feedback about shifted columns and missing widgets, agreed
      on the footer content and presented a revised layout.
  - type: text
    title: Result and verification
    body: The client approved the footer and accepted the work. The handoff does not
      establish final alignment of every product card or availability of
      external widgets on every network.
