title: Обновление WoodMart с пересборкой шапки и футера
tagline: Старая версия WoodMart накопила ошибки, а часть прежних настроек
  перестала подходить после обновления. Клиенту нужно было вернуть целостный вид
  витрины, а не только заменить файлы темы.
year: "04.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WoodMart
  - Theme updates
blocks:
  - type: text
    title: Задача и ограничения
    body: Старая версия WoodMart накопила ошибки, а часть прежних настроек перестала
      подходить после обновления. Клиенту нужно было вернуть целостный вид
      витрины, а не только заменить файлы темы.
  - type: text
    title: Как устроено решение
    body: Обновил тему, пересобрал шапку и слайдеры вместо переноса несовместимых
      настроек. Подготовил два слайда, исключив устаревшие материалы. После
      замечаний по смещённым колонкам и пропавшим виджетам согласовал содержимое
      футера и показал исправленную компоновку.
  - type: text
    title: Результат и проверка
    body: Клиент одобрил вариант футера и принял заказ. Кейс не подтверждает
      окончательное выравнивание всех карточек или доступность внешних виджетов
      во всех сетях.
