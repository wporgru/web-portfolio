title: "Evko Store: настройка мебельной витрины Sober"
tagline: Настроить существующий магазин по выбранному демо, связать товарные
  категории в меню и на главной и подготовить витрину к самостоятельному
  наполнению.
role: Веб-разработка
year: "03.2018"
stack:
  - WordPress
  - WooCommerce
  - Sober theme
blocks:
  - type: text
    title: Задача
    body: Настроить существующий магазин по выбранному демо, связать товарные
      категории в меню и на главной и подготовить витрину к самостоятельному
      наполнению.
  - type: text
    title: Что сделано
    body: Согласовал Sober 06 и пять пунктов настройки, передал результат на
      проверку; заказчик принял этап и оставил положительный отзыв.
  - type: text
    title: Как решалась задача
    body: "После уточнения референса выбрали Sober 06 вместо первоначального
      варианта. В задание вошли выпадающее меню с четырьмя группами,
      соответствующие блоки категорий на главной, отдельные подборки хитов и
      распродажи и дополнительный слайдер категорий. Названия разделов могли
      оставаться временными: реальный ассортимент заказчик планировал добавлять
      сам. Результат передан на проверку и принят. Переписка не содержит
      подробного технического отчёта о каждом блоке, поэтому индивидуальную
      разработку кода и настройку карусели не приписываю."
