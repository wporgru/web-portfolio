title: "Bragutsa: письмо о новом заказе снова приходит менеджеру"
tagline: Менеджеру приходилось вручную открывать WordPress, чтобы узнать о новом
  заказе и посмотреть его состав. Отдельно была проблема с платным модулем Почты
  России. Почтовые уведомления и расчёт доставки требовали разной диагностики.
year: "04.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Order emails
  - Delivery diagnostics
blocks:
  - type: text
    title: Задача и ограничения
    body: Менеджеру приходилось вручную открывать WordPress, чтобы узнать о новом
      заказе и посмотреть его состав. Отдельно была проблема с платным модулем
      Почты России. Почтовые уведомления и расчёт доставки требовали разной
      диагностики.
  - type: text
    title: Как устроено решение
    body: Исправил уведомления и передал результат на проверку. Клиент оформил
      контрольный заказ и подтвердил поступление письма. По модулю доставки
      предложил проверить лицензию и версию и при необходимости обратиться в
      поддержку разработчика. Клиент отложил этот этап.
  - type: text
    title: Результат и проверка
    body: Клиент принял работу с подтверждённым письмом по контрольному заказу. Для
      Почты России результатом был план диагностики, а не проверенная
      тарификация, ремонт модуля или продление лицензии.
