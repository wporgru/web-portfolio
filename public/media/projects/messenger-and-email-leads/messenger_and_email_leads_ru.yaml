title: Новый виджет связи и восстановление формы заявки
tagline: "На сайте нужно было обновить способы связи и вернуть работоспособность
  формы заявки. Это два разных пути: переписка в мессенджере и отправка
  обращения на почту."
year: "05.2026"
role: Веб-разработка и автоматизация
stack:
  - Web widgets
  - Telegram
  - MAX
  - VK
  - Forms
blocks:
  - type: text
    title: Задача и ограничения
    body: "На сайте нужно было обновить способы связи и вернуть работоспособность
      формы заявки. Это два разных пути: переписка в мессенджере и отправка
      обращения на почту."
  - type: text
    title: Как устроено решение
    body: Вместо доработки чужого виджета согласовал замену готовым блоком и уточнил
      ссылки для MAX, Telegram и ВКонтакте. Установил виджет и передал его на
      проверку. Отдельно исправил форму и попросил проверить входящую заявку на
      электронной почте.
  - type: text
    title: Результат и проверка
    body: Заказчик принял работу. В архиве нет отдельного подтверждения получения
      тестового письма; кейс не выдаёт почтовую форму за интеграцию с Telegram
      Bot API.
