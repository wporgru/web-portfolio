title: Настройка WoodMart Marketplace под контент клиента
tagline: Нужна была готовая основа магазина, которую заказчик сможет наполнить
  своими товарами, баннерами и страницами без повторной сборки шаблонов.
year: "04.2025"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - WoodMart
  - WPBakery
blocks:
  - type: text
    title: Задача и ограничения
    body: Нужна была готовая основа магазина, которую заказчик сможет наполнить
      своими товарами, баннерами и страницами без повторной сборки шаблонов.
  - type: text
    title: Как устроено решение
    body: Настроил WoodMart Marketplace и перевёл видимые элементы интерфейса и
      названия страниц. Демоматериалы оставил как заменяемые примеры и объяснил,
      где менять изображения, тексты, ссылки и данные разделов о компании и
      контактах.
  - type: text
    title: Результат и проверка
    body: Клиент принял настроенную основу. Самостоятельное наполнение, полная
      локализация демонстрационных материалов и проверенное подключение оплаты
      не выдаются за часть этой сдачи.
