title: "Goodwin Shop: восстановление перехода на PHP 8.3"
tagline: Перевести магазин с PHP 7.4.33 на PHP 8.3 после прошлой попытки, при
  которой сайт перестал открываться и пришлось вернуть старую версию.
role: Веб-разработка
year: "10.2026"
stack:
  - WordPress
  - WooCommerce
  - PHP
  - Hosting
blocks:
  - type: text
    title: Задача
    body: Перевести магазин с PHP 7.4.33 на PHP 8.3 после прошлой попытки, при
      которой сайт перестал открываться и пришлось вернуть старую версию.
  - type: text
    title: Что сделано
    body: После получения корректного доступа к хостингу перевёл PHP на 8.3.
      Владелец проверил сайт, подтвердил, что версия изменилась и магазин
      работает, затем принял заказ. В переписке не зафиксированы конкретные
      правки PHP-кода или версии плагинов, поэтому не приписываю их этому этапу.
  - type: text
    title: Как решалась задача
    body: Клиент сообщил, что предыдущий переход с PHP 7.4.33 на 8.3 привёл к отказу
      сайта, после чего хостинг вернули на прежнюю версию. После уточнения
      доступа к панели я повторил переключение на PHP 8.3 и сообщил о
      завершении. Клиент самостоятельно проверил магазин, подтвердил работу на
      целевой версии и принял заказ. В архиве не перечислены точечные правки
      PHP-кода, конкретные версии темы и плагинов, резервная копия или полный
      тест корзины и оплаты, поэтому эти работы не заявляются. Позднее
      обсуждение PHP 8.5 не подтверждает, что версия 8.5 была установлена.
      Сохранённый снимок — публичный вид сайта на 30 октября 2026 года, а не
      доказательство серверной версии PHP или состояние до и после миграции.
    links:
