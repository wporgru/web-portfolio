title: Восстановление карточек товаров на WoodMart
tagline: "Карточки перестали открываться: каталог мог показывать ассортимент, но
  посетители не могли перейти к подробностям товара. Требовалось восстановить
  этот маршрут в действующей витрине."
year: "02.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - WoodMart
blocks:
  - type: text
    title: Задача и ограничения
    body: "Карточки перестали открываться: каталог мог показывать ассортимент, но
      посетители не могли перейти к подробностям товара. Требовалось
      восстановить этот маршрут в действующей витрине."
  - type: text
    title: Как устроено решение
    body: Проверил состояние обновлений и восстановил открытие карточек. Передал
      исправление заказчику для повторной проверки вместо того, чтобы
      ограничиться административным статусом. Точный патч в переписке не
      сохранился.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил открытие карточек и отметил более быструю загрузку. Это
      наблюдение клиента, а не инструментальный замер PageSpeed или Core Web
      Vitals.
