blocks:
  - type: text
    title: Задача и ограничения
    body: "Собрал и опубликовал компактную визитку производственного предприятия:
      название, промышленная фотография и текстовый блок без сложной CMS."
  - type: text
    title: Как устроено решение
    body: Вместо WordPress использовал конструктор REG Website Builder. По обратной
      связи переместил текст в верхний левый угол и обновил заголовок на полное
      название предприятия. Показал владельцу, как самостоятельно редактировать
      страницу.
  - type: text
    title: Результат и проверка
    body: Клиент принял сайт. Сохранившаяся карточка портфолио показывает
      согласованную композицию и отметку конструктора; это не снимок текущей
      версии домена.
