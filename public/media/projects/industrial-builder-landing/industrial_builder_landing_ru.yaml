title: Одностраничная визитка «Нефтехимик-Н»
tagline: Опубликовал короткую визитку производственного предприятия в REG Website Builder,
  сохранив решение простым и редактируемым без WordPress и дополнительной CMS.
year: "12.2022"
role: Разработка страницы и настройка конструктора
stack:
  - REG Website Builder
  - Одностраничный сайт
  - Редактирование контента
blocks:
  - type: text
    title: Минимальный сайт под конкретную задачу
    body: >-
      Клиенту была нужна компактная одностраничная визитка производственного
      предприятия с фоновой иллюстрацией и информационным блоком. Заказчик
      подтвердил, что на этом этапе не планирует дальнейшее развитие сайта, поэтому
      я не навязывал сложную CMS или функциональность, которой не было в задаче.
  - type: text
    title: REG Website Builder вместо WordPress
    body: >-
      Подготовил и опубликовал страницу на nh-n.ru в конструкторе REG Website
      Builder. Хотя кворк был посвящён WordPress, архивный снимок карточки Kwork
      показывает отметку REG Website Builder. Это пример выбора инструмента под
      согласованный простой формат, а не попытка любой ценой внедрить WordPress.
  - type: text
    title: Итерация по обратной связи
    body: >-
      После комментария заказчика перенёс текстовый блок в верхний левый угол и
      заменил заголовок на полное название «Производственное Предприятие ООО
      „Нефтехимик-Н“». Затем показал владельцу, как самостоятельно редактировать
      страницу. Клиент подтвердил вариант и принял заказ.
  - type: image
    src: /media/projects/industrial-builder-landing/historical-landing.webp
    alt: Историческая визитка «Нефтехимик-Н» с промышленным фоном; контакты и реквизиты скрыты
    caption: Историческая карточка портфолио Kwork показывает композицию, полное название предприятия и отметку REG Website Builder. Телефон, email, адрес и регистрационные сведения закрыты в публичной копии; оригинал сохранён в локальном архиве заказа.
  - type: text
    title: Что подтверждает кейс
    body: >-
      Архив подтверждает публикацию страницы в 2022 году и принятие заказа. Текущий
      домен nh-n.ru на дату последней проверки не разрешался в DNS; постоянное
      закрытие сайта не установлено. Историческая карточка портфолио не подтверждает
      сегодняшнюю доступность домена, актуальность сведений или наличие тестов во
      всех браузерах.
