title: Адаптивный португалоязычный сайт по образцу
tagline: Собрал португалоязычный сайт на временной площадке по визуальному
  образцу. Приоритетом была рабочая мобильная версия, а не копия экрана одним
  большим изображением.
year: "03.2024"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Responsive layout
  - Redirects
blocks:
  - type: text
    title: Задача и ограничения
    body: Собрал португалоязычный сайт на временной площадке по визуальному образцу.
      Приоритетом была рабочая мобильная версия, а не копия экрана одним большим
      изображением.
  - type: text
    title: Как устроено решение
    body: Разложил страницы на отдельные адаптивные блоки и согласовал упрощение
      части эффектов и каруселей. Настроил переходы через маршруты /go/,
      подготовил инструменты для редиректов и дальнейшей миграции. При сдаче
      отдельно обозначил отличия от образца и приложил лабораторную проверку
      мобильной страницы.
  - type: text
    title: Результат и проверка
    body: Клиент принял работу и оставил бонус. Подтверждена сборка на временной
      площадке; перенос на конечный домен отдельно не подтверждён.
