title: "«ЭКОПОЛ»: витрина напольных покрытий на WoodMart"
tagline: "Заказчику нужна была витрина напольных покрытий на готовой теме:
  сохранить понятный вход в каталог и оформить главную под свой бренд, не
  копируя магазин-пример целиком."
year: "01.2024"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - WoodMart
  - Storefront design
blocks:
  - type: text
    title: Задача и ограничения
    body: "Заказчику нужна была витрина напольных покрытий на готовой теме:
      сохранить понятный вход в каталог и оформить главную под свой бренд, не
      копируя магазин-пример целиком."
  - type: text
    title: Как устроено решение
    body: Подготовил витрину на базе WoodMart Megamarket. На архивной главной видны
      логотип «ЭКОПОЛ», навигация, баннеры и входы в категории напольных
      покрытий. Перед сдачей обсуждал с клиентом, как самостоятельно менять
      параметры товара и фотографии.
  - type: text
    title: Результат и проверка
    body: Клиент принял витрину. Архив подтверждает оформление первого экрана и
      подачу категорий. Итоговый домен, полнота импорта, работа чекаута и
      последующее обновление цен отдельно не подтверждены.
  - type: text
    title: Фрагмент витрины из архива проекта
    links:
      - label: Оригинал в портфолио Kwork
        url: https://kwork.ru/portfolio/11998730
  - type: image
    src: /media/projects/ecopol-woodmart-flooring-store/archive-storefront.webp
    alt: Первый экран магазина напольных покрытий «ЭКОПОЛ» на WoodMart
    caption: "Необрезанный оригинал архивного фрагмента 1400 × 514: логотип, баннеры
      и категории. Это первый экран, а не полная страница; показанные акции
      относятся к архивной версии."
