blocks:
  - type: text
    title: Brief and constraints
    body: "The client needed a flooring storefront on an existing theme: make the
      catalog easy to reach and apply their own brand without cloning the
      reference shop."
  - type: text
    title: How it works
    body: Prepared the storefront using WoodMart Megamarket. The archived homepage
      shows the Ecopol logo, navigation, banners and links into flooring
      categories. Before handoff, discussed how the client could edit product
      details and images independently.
  - type: text
    title: Result and verification
    body: The client accepted the storefront. The archive documents its first screen
      and category presentation. The final domain, complete import, checkout
      behavior and later price updates were not independently verified.
