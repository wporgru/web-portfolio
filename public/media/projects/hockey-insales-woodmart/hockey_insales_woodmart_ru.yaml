title: Перенос хоккейного каталога из InSales на WoodMart
tagline: "При смене платформы важно было сохранить параметры, по которым
  покупатель выбирает клюшку: бренд, хват, загиб, цвет, флекс и размер. Одна
  загрузка товаров без этих связей не решала задачу."
year: "02.2024"
role: Веб-разработка и автоматизация
stack:
  - InSales
  - WooCommerce
  - WoodMart
  - Product variants
blocks:
  - type: text
    title: Задача и ограничения
    body: "При смене платформы важно было сохранить параметры, по которым покупатель
      выбирает клюшку: бренд, хват, загиб, цвет, флекс и размер. Одна загрузка
      товаров без этих связей не решала задачу."
  - type: text
    title: Как устроено решение
    body: Настроил домен и тему, подготовил таблицу и загрузил каталог. По
      замечаниям перенастраивал связи полей и повторял импорт, несмотря на
      ошибки сервера. В финале были связаны бренд, хват, загиб, цвет и флекс;
      размеры создавались, но не связывались автоматически. Показал ручной
      пример для сотрудника заказчика.
  - type: text
    title: Результат и проверка
    body: Заказчик принял этап и перешёл к доработке витрины. Оставшуюся привязку
      размеров передал своему сотруднику. Оплату, SEO и полную автоматизацию
      вариаций в этот этап не включаю.
  - type: text
    title: Другой этап этого проекта
    links:
      - label: "Следующий этап: карточки и мобильная витрина"
        url: /showcase/hockey-storefront-ux/
