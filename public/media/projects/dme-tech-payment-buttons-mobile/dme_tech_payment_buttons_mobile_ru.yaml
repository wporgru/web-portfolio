title: "DME Tech: мобильная витрина и кнопки оплаты"
tagline: После настройки основной оплаты нужно было убрать неработающий
  карточный вариант PayPal и сделать магазин удобнее на телефоне. Заказ
  относился к действующей витрине, а не к повторной настройке всей платёжной
  системы.
year: "09.2020"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - PayPal
  - Responsive storefront
  - Search UX
blocks:
  - type: text
    title: Задача и ограничения
    body: После настройки основной оплаты нужно было убрать неработающий карточный
      вариант PayPal и сделать магазин удобнее на телефоне. Заказ относился к
      действующей витрине, а не к повторной настройке всей платёжной системы.
  - type: text
    title: Как устроено решение
    body: Скорректировал дополнительные кнопки PayPal в карточке и корзине. Уменьшил
      шрифт в результатах поиска, доработал мобильную страницу и убрал хлебные
      крошки в согласованном варианте.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил проверку правок и принял заказ. Мобильный вариант
      приняли как временный; отдельная успешная карточная транзакция не
      зафиксирована. Это не заявление о нынешней доступности PayPal или приёме
      всех зарубежных карт.
  - type: text
    title: Другой этап этого проекта
    links:
      - label: "Первый этап: HTTPS и подготовка оформления заказа"
