title: Исправление скидки WooCommerce для оплаты Prodamus
tagline: Кастомная скидка мешала согласованному сценарию оплаты. Нужно было
  поправить расчёт, сохранив назначение скидки и не распространив её на весь
  ассортимент.
year: "02.2024"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Prodamus
  - Checkout
blocks:
  - type: text
    title: Задача и ограничения
    body: Кастомная скидка мешала согласованному сценарию оплаты. Нужно было
      поправить расчёт, сохранив назначение скидки и не распространив её на весь
      ассортимент.
  - type: text
    title: Как устроено решение
    body: Нашёл скидку в коде и объяснил, почему простое удаление знака минус
      увеличивает сумму вместо исправления. После первой проверки клиент
      заметил, что скидка затронула все товары. Вернулся к настройке и передал
      исправленный сценарий на повторную проверку.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил нужное поведение и принял работу. Задача закрывала
      расчёт скидки; отдельного подтверждения банковского списания и всех
      комбинаций товаров нет.
