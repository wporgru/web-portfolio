title: "DME Repair Service: English website at dme.kz"
tagline: Built an English-language WordPress showcase for DME Repair Service, with 17 service
  cards, a separate news grid and two visual treatments.
year: "03.2021"
role: English-language web showcase
stack:
  - WordPress
  - Service architecture
  - English-language interface
blocks:
  - type: text
    title: What the published work shows
    body: The dme.kz homepage introduces the repair service and makes contact information and
      individual services easy to find. The navigation separates company information, blog,
      privacy and contact links from the service catalog.
  - type: text
    title: Service and news structure
    body: The archival view shows 17 illustrated service cards and a separate six-item news grid,
      with an Our Partners section between them. Those are visible interface elements, not
      verified partnerships or a count of all site pages.
  - type: text
    title: Two treatments of the same layout
    body: The light and dark versions retain the order of navigation, services and news. They are
      alternative visual treatments rather than before-and-after evidence. A visitor-facing
      theme switch was not verified.
  - type: text
    title: Source and scope
    body: The owner confirmed the card refers to dme.kz. March 2021 is the Kwork publication month,
      not a delivery date. No specific order is established, and this work is not merged with
      smd.kz. The card shows the interface, not verified form, payment or SEO outcomes.
  - type: text
    title: Historical variants on Kwork
    links:
      - label: View the light and dark variants
        url: https://kwork.ru/portfolio/4093977
  - type: text
    title: Separate SMD project
    body: The SMD project used a different site address and scope. It reused service and blog
      content from Wix; a move to dme.kz was not part of its handover.
    links:
      - label: The SMD service site on WordPress
        url: /showcase/smd-wix-wordpress-service-site/en/
