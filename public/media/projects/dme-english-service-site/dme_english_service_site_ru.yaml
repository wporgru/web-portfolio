title: "DME Repair Service: англоязычный сайт dme.kz"
tagline: "Разработал англоязычную витрину DME Repair Service на WordPress: 17 карточек услуг,
  отдельные новости и два варианта оформления."
year: "03.2021"
role: Англоязычная веб-витрина
stack:
  - WordPress
  - Архитектура услуг
