title: Англоязычный сайт сервисной компании DME
tagline: Сервисной компании нужен был англоязычный сайт, на котором посетитель
  может разобраться в услугах и найти контакты, не перелистывая длинную
  презентацию.
year: "03.2021"
role: Веб-разработка и автоматизация
stack:
  - Web design
  - Service website
  - English content
blocks:
  - type: text
    title: Задача и ограничения
    body: Сервисной компании нужен был англоязычный сайт, на котором посетитель
      может разобраться в услугах и найти контакты, не перелистывая длинную
      презентацию.
  - type: text
    title: Как устроено решение
    body: В опубликованной работе услуги собраны в сетку, а сведения о компании,
      блог, политика и контакты вынесены в навигацию. На главной предусмотрены
      отдельные блоки партнёров и новостей. Сохранённые светлый и тёмный
      варианты показывают одну и ту же структуру сайта в двух оформлениях.
  - type: text
    title: Результат и проверка
    body: Карточка портфолио подтверждает показанный интерфейс. Светлый и тёмный
      варианты не являются сравнением до и после. Формы, платежи и текущая
      доступность сайта здесь не оцениваются.
  - type: text
    title: Проект в портфолио Kwork
    body: Март 2021 года — дата публикации карточки; точная дата сдачи не
      установлена.
    links:
      - label: Посмотреть оригинальную карточку
        url: https://kwork.ru/portfolio/4093977
