blocks:
  - type: text
    title: Что показывает опубликованная работа
    body: На главной dme.kz посетитель видит профиль сервиса и контакты, затем может перейти к
      нужной услуге. Верхнее меню отделяет сведения о компании, блог, политику
      конфиденциальности и контакты от каталога услуг.
  - type: text
    title: Структура сервисной витрины
    body: На архивном снимке видно 17 карточек услуг с иллюстрациями и отдельную сетку из шести
      новостей. Между ними размещён блок Our Partners. Это элементы показанной страницы, а не
      заявление о проверенных партнёрствах или числе страниц сайта.
  - type: text
    title: Два оформления одной структуры
    body: Светлый и тёмный варианты сохраняют порядок навигации, услуг и новостей. Это
      альтернативные оформления, не сравнение до и после. Наличие переключателя темы для
      посетителя не подтверждено.
  - type: text
    title: Источник и границы
    body: Владелец подтвердил, что карточка относится к dme.kz. Март 2021 года — месяц публикации
      карточки Kwork, не дата сдачи. Конкретный заказ не установлен; работу не объединяю с
      smd.kz. Карточка показывает интерфейс, а не результаты тестов форм, платежей или SEO.
  - type: text
    title: Исторические варианты в карточке Kwork
    links:
