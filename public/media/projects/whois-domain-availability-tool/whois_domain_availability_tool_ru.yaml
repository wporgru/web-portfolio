title: Локальная утилита проверки статуса доменов по WHOIS
tagline: В Antigravity workspace обнаружен небольшой Windows-инструмент для
  пакетной проверки списка доменов. Нужно различать ответ регистра WHOIS,
  отсутствие записи и сетевую ошибку, а результаты сохранять локально для
  следующего просмотра. Список доменов и журналы остаются приватными и в
  портфолио не публикуются.
year: "07.2026"
role: Веб-разработка и автоматизация
stack:
  - Python
  - WHOIS
  - TCP sockets
  - Windows automation
blocks:
  - type: text
    title: Задача и ограничения
    body: В Antigravity workspace обнаружен небольшой Windows-инструмент для
      пакетной проверки списка доменов. Нужно различать ответ регистра WHOIS,
      отсутствие записи и сетевую ошибку, а результаты сохранять локально для
      следующего просмотра. Список доменов и журналы остаются приватными и в
      портфолио не публикуются.
  - type: text
    title: Как устроено решение
    body: "Реализовал запросы через стандартный Python socket с таймаутом.
      Разбираются ответы WHOIS: отсутствие записи, состояние домена, дата
      освобождения или окончания оплаты и регистратор. Скрипт отдельно помечает
      сетевые ошибки, добавляет полный результат в журнал с временной отметкой и
      перезаписывает компактный файл только свободных кандидатов. Для запуска на
      Windows предусмотрен BAT-файл; в коде также есть функция возврата окна
      терминала на передний план."
  - type: text
    title: Результат и проверка
    body: Синтаксис Python проверен командой py_compile. Это локальная утилита, а не
      постоянно работающий сервис; фактические статусы зависят от ответа WHOIS в
      момент запроса. Доступность, резервирование и право регистрации каждого
      домена отдельно не подтверждались. Проверочные входные данные и результаты
      не публикую.
