title: Local WHOIS domain status checker
tagline: A small Windows utility in the Antigravity workspace checks a batch of
  domain names. It distinguishes WHOIS registry responses, missing records and
  network errors, then stores results locally for later review. The domain list
  and logs are private and are not published in this case.
year: "07.2026"
role: Web development and automation
stack:
  - Python
  - WHOIS
  - TCP sockets
  - Windows automation
blocks:
  - type: text
    title: Brief and constraints
    body: A small Windows utility in the Antigravity workspace checks a batch of
      domain names. It distinguishes WHOIS registry responses, missing records
      and network errors, then stores results locally for later review. The
      domain list and logs are private and are not published in this case.
  - type: text
    title: How it works
    body: Implemented WHOIS queries using Python standard-library sockets with a
      timeout. The parser handles no-entry responses, domain state, release or
      paid-through dates and registrar. Network errors are classified
      separately; the utility appends a timestamped log and rewrites a compact
      list of available candidates. A BAT launcher is provided for Windows,
      along with a helper to bring the terminal window to the foreground.
  - type: text
    title: Result and verification
    body: Python syntax passed py_compile. This is a local utility, not a
      continuously running service; results depend on the WHOIS response at
      query time. Availability, reservation status and the right to register
      each domain were not independently verified. Input lists and result logs
      are not published.
