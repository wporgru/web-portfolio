title: Загрузка каталога сварочного оборудования в WooCommerce
tagline: На действующей витрине требовалось разместить новую линейку сварочного
  оборудования из готовых файлов. Клиенту важно было понимать, почему раздел в
  каталоге и пункт меню управляются по-разному.
year: "10.2025"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Catalog import
  - Navigation
blocks:
  - type: text
    title: Задача и ограничения
    body: На действующей витрине требовалось разместить новую линейку сварочного
      оборудования из готовых файлов. Клиенту важно было понимать, почему раздел
      в каталоге и пункт меню управляются по-разному.
  - type: text
    title: Как устроено решение
    body: Согласовал готовые источники и объяснил разницу между виджетом категорий и
      ручным меню. Импортировал ассортимент в существующий WooCommerce и передал
      ссылки на результат, чтобы проверка проходила на витрине, а не только по
      статусу импортёра.
  - type: text
    title: Результат и проверка
    body: После внутренней проверки клиент принял работу. Это наполнение работающего
      магазина; разработка всего сайта, парсинг сайта поставщика и регулярная
      синхронизация не входили в заказ.
