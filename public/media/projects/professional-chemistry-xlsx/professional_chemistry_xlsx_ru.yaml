title: "Каталог профессиональной химии: сбор и очистка данных"
tagline: Собрать данные о профессиональной химии с сайта-источника, отделить
  товары от служебных страниц и передать редактируемую таблицу для дальнейшего
  переноса.
role: Веб-разработка
year: "03.2018"
stack:
  - Data extraction
  - XLSX
  - Product data
blocks:
  - type: text
    title: Задача
    body: Собрать данные о профессиональной химии с сайта-источника, отделить товары
      от служебных страниц и передать редактируемую таблицу для дальнейшего
      переноса.
  - type: text
    title: Что сделано
    body: Из более чем 900 URL выделил 253 предварительные позиции, сверял повторы и
      прайс, передал очищенный XLSX. Итоговое число уникальных строк не
      установлено.
  - type: text
    title: Как решалась задача
    body: "Подготовка к переносу включала ручные решения: одинаковые названия нельзя
      было без проверки превращать в новые позиции, а несовпадения с прайсом и
      отсутствие фотографий — скрывать. Отметил пробелы, предложил группировку и
      атрибуты для будущих фильтров. Переданный XLSX клиент принял; число 253
      относится к выборке до очистки, не к итоговому каталогу. Импорт в CMS,
      дизайн и подбор изображений не входили в подтверждённый результат."
