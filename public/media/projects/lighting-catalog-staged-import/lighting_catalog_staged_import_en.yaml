title: Staged import of a large lighting catalog
tagline: Prepared a large lighting catalog for a staged import. The main
  constraint was not data extraction itself but long-running jobs stopping on
  the host.
year: "04.2024"
role: Web development and automation
stack:
  - WooCommerce
  - Web scraping
  - Cron
  - Hosting
blocks:
  - type: text
    title: Brief and constraints
    body: Prepared a large lighting catalog for a staged import. The main constraint
      was not data extraction itself but long-running jobs stopping on the host.
  - type: text
    title: How it works
    body: Split collection into five parts and prepared files for sequential import.
      Worked with hosting support to increase timeouts and temporarily disabled
      some extensions for troubleshooting. Handed over the collected data and
      configured scheduled continuation through cron.
  - type: text
    title: Result and verification
    body: The client accepted the stage early, around the midpoint of the third
      batch. The prepared files and continuation setup are documented, not
      completion of all five imports.
