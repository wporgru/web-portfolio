title: Поэтапный импорт большого каталога освещения
tagline: Подготовил каталог освещения к загрузке по частям. Главным ограничением
  было не извлечение данных само по себе, а прерывание длительных задач на
  хостинге.
year: "04.2024"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Web scraping
  - Cron
  - Hosting
blocks:
  - type: text
    title: Задача и ограничения
    body: Подготовил каталог освещения к загрузке по частям. Главным ограничением
      было не извлечение данных само по себе, а прерывание длительных задач на
      хостинге.
  - type: text
    title: Как устроено решение
    body: Разбил сбор на пять частей и подготовил файлы для последовательной
      загрузки. При остановках через поддержку увеличивали серверные таймауты, а
      для диагностики временно отключали часть расширений. К сдаче передал
      результаты сбора и настроил продолжение загрузки по cron.
  - type: text
    title: Результат и проверка
    body: Клиент досрочно принял этап, когда загрузка была примерно в середине
      третьей части. Подтверждены подготовленные файлы и продолжение процесса, а
      не завершение всех пяти загрузок.
  - type: text
    title: Другой этап этого проекта
    links:
      - label: "Связанный этап: навигация и фильтры витрины"
        url: /showcase/lighting-catalog-navigation/
