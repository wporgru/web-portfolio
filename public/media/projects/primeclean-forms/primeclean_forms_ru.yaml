title: Антиспам для форм WordPress
tagline: Сократить поток нежелательных заявок через формы компании.
role: Веб-разработка
year: "05.2026"
stack:
  - WordPress
  - Contact Form 7
blocks:
  - type: text
    title: Задача
    body: Сократить поток нежелательных заявок через формы компании.
  - type: text
    title: Что сделано
    body: Разобрал примеры спама и настроил защиту. После первичной правки клиент
      сообщил, что за выходные новых спам-заявок не было; это наблюдение, не
      результат длительного мониторинга.
  - type: text
    title: Как решалась задача
    body: Сначала разобрал примеры нежелательных обращений и уточнил, какие формы
      затронуты. Изменения обсуждались на действующих сайтах компании, поэтому
      не подменял задачу заменой форм или переделкой сайта. В сохранённой
      переписке не назван надёжно конкретный антиспам-механизм; не приписываю
      проекту CAPTCHA или другой инструмент без подтверждения.
