title: "PrimeClean: антиспам-защита форм Contact Form 7"
tagline: "Снизил поток нежелательных обращений через формы WordPress и
  проработал защиту для сайтов компании без подмены задачи редизайном."
year: "05.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Contact Form 7
  - Form anti-spam
  - Website maintenance
blocks:
  - type: text
    title: "Проблема: спам попадает в канал заявок"
    body: "В мае 2026 года компания обратилась из-за нежелательных сообщений,
      поступавших через формы Contact Form 7 на её WordPress-сайтах. Для бизнеса
      это не просто неудобная почта: спам скрывает настоящие обращения,
      увеличивает ручную работу и снижает доверие к форме как к каналу связи.
      Клиент попросил сначала разобрать примеры писем и настроить антиспам, а не
      менять интерфейс форм или перестраивать сайты."
  - type: text
    title: Анализ примеров и настройка защиты
    body: "Сначала изучил примеры спамных заявок и уточнил, какие формы и сайты
      затронуты. Работа шла на существующих проектах компании: важной частью
      решения было сохранить обычный путь отправки обращения для реального
      посетителя и не вводить лишние изменения в структуру сайта. После первичной
      доработки клиент сообщил, что за выходные новых спам-заявок не было. Затем
      в основной истории обсуждалась защита primeclean.ru и разрешение удалить
      неназванный компонент. Я сообщил о завершении настройки и предложил
      вернуться к проверке, если поток спама повторится. Конкретное название
      антиспам-плагина и точный механизм фильтрации в читаемой переписке не
      сохранились, поэтому не приписываю проекту CAPTCHA, reCAPTCHA или другой
      неподтверждённый инструмент."
  - type: text
    title: Результат и подтверждение клиента
    body: "Клиент принял заказ 12 мая 2026 года и оставил отзыв: «Спасибо за
      помощь с настройкой защиты». Раннее отсутствие спама за выходные — это
      клиентское наблюдение после первичной правки, а не длительная статистика
      или гарантия, что спам больше не появится. В заказе фигурировали три сайта,
      однако читаемая история надёжно подтверждает primeclean.ru и обсуждение
      welllandrussia.ru; полный список целевых доменов и независимая проверка
      каждой формы не сохранились. Поэтому кейс описывает согласованный объём и
      подтверждённые действия, а не обещает полный охват трёх сайтов или
      постоянную блокировку спама."
    links:
      - label: Исходный заказ и отзыв на Kwork
        url: https://kwork.ru/track?id=62217318
  - type: text
    title: Что проверять при защите контактных форм
    body: "Перед настройкой важно сохранить возможность для реального клиента
      отправить заявку и одновременно уменьшить автоматические нежелательные
      сообщения. Практический порядок — собрать образцы спама, определить
      затронутые формы и домены, внести ограниченные изменения, проверить
      обычную отправку и затем наблюдать за результатом. В этой истории
      сохранилось короткое наблюдение клиента после выходных, но нет долгого
      мониторинга — эту границу важно учитывать при оценке эффекта."
