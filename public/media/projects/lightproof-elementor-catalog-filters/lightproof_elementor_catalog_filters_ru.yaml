title: "Lightproof: настройка и ремонт фильтра Elementor"
tagline: Владелец сам собирал магазин на Elementor, но фильтрация по
  характеристикам не работала. Сначала нужна была рабочая выдача в общем
  каталоге, а когда появились отдельные шаблоны подкатегорий, требовалось
  восстановить фильтр внутри шаблона.
year: "07.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Elementor
  - Product attributes
  - Catalog filters
blocks:
  - type: text
    title: Задача и ограничения
    body: Владелец сам собирал магазин на Elementor, но фильтрация по
      характеристикам не работала. Сначала нужна была рабочая выдача в общем
      каталоге, а когда появились отдельные шаблоны подкатегорий, требовалось
      восстановить фильтр внутри шаблона.
  - type: text
    title: Как устроено решение
    body: "На первом этапе настроил фильтр, передал ссылку на каталог и записал
      пояснения: где выбирать атрибуты и как управлять общим фильтром. На втором
      этапе отделил проблему шаблона от запроса на оформление всего каталога,
      восстановил нужный сценарий и передал результат клиенту."
  - type: text
    title: Результат и проверка
    body: Клиент принял оба этапа, а после второго отметил продолжительное
      сотрудничество в отзыве. Архив не подтверждает замену конкретного плагина
      или полный прогон всех четырёх подкатегорий. Разработка всего магазина в
      работу не входила.
