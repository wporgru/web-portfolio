title: Доработка PDF-счёта WooCommerce для B2B
tagline: Доработал автоматически формируемый счёт по образцу клиента. Задача —
  сделать документ привычнее для работы с организациями, а не воспроизвести
  печатную форму 1С один в один.
year: "05.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - PDF invoices
  - B2B
  - Document templates
blocks:
  - type: text
    title: Задача и ограничения
    body: Доработал автоматически формируемый счёт по образцу клиента. Задача —
      сделать документ привычнее для работы с организациями, а не воспроизвести
      печатную форму 1С один в один.
  - type: text
    title: Как устроено решение
    body: "Добавил печать и подпись в шаблон. После обратной связи учёл запрос по
      единицам измерения и упаковкам и передал исправленный PDF на проверку.
      Отдельно зафиксировал границы: НДС и сумма прописью не входили в этот
      этап, а точное расположение количества отличалось от образца."
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил печать и подпись и принял результат. Работу QR отдельным
      тестом не подтвердили; клиентский счёт и персональные данные в кейс не
      включены.
