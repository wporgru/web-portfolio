title: "DME Tech: оплата и выдача файлов через WooCommerce"
tagline: Покупателю цифрового файла нужно было оформить заказ без обязательной
  регистрации, оплатить его и получить ссылку на скачивание. До этого готовили
  интерфейс и HTTPS; на этом этапе проверяли саму покупку.
year: "08.2020"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Yandex Checkout
  - Digital downloads
  - Checkout
blocks:
  - type: text
    title: Задача и ограничения
    body: Покупателю цифрового файла нужно было оформить заказ без обязательной
      регистрации, оплатить его и получить ссылку на скачивание. До этого
      готовили интерфейс и HTTPS; на этом этапе проверяли саму покупку.
  - type: text
    title: Как устроено решение
    body: Подключил Яндекс.Кассу, убрал конфликтующие настройки кеширования и
      заменил три тестовых файла материалами клиента. Сократил оформление до
      email и настроил переход без отдельного шага корзины. Контрольная покупка
      выявила, что сумма передавалась без пересчёта валюты. Согласовали один
      рублёвый режим вместо неустойчивой мультивалютной схемы.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил собственную проверку покупки и получение ссылки по
      почте, затем принял заказ. Это историческая проверка одного сценария, не
      доказательство выдачи каждого файла, защиты хранилища или автоматического
      скачивания при PayPal.
