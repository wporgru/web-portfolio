title: "Fish Spa: сайт услуг и инструкция владельцу"
tagline: Создать сайт услуг Fish Spa на WordPress по согласованному ориентиру и
  передать клиенту возможность самостоятельно менять материалы.
role: Веб-разработка
year: "02.2018"
stack:
  - WordPress
  - Responsive design
  - Client handover
blocks:
  - type: text
    title: Задача
    body: Создать сайт услуг Fish Spa на WordPress по согласованному ориентиру и
      передать клиенту возможность самостоятельно менять материалы.
  - type: text
    title: Что сделано
    body: Подготовил и переработал дизайн по обратной связи, установил модуль
      отзывов и передал иллюстрированную инструкцию; заказчик принял работу.
  - type: text
    title: Как решалась задача
    body: "Первый вариант содержал временные материалы: текстов и прайса ещё не
      хватало. После замечаний переработал оформление, сообщил об адаптации под
      смартфоны и планшеты, согласовал дальнейшее наполнение и установил Easy
      Testimonials. Передал иллюстрированную инструкцию по работе с видео и
      мобильным экраном. Заказчик остался доволен и принял этап. Полный перевод
      кнопок, наполнение всех внутренних страниц и работа видеоблока на каждой
      модели телефона не подтверждены. Рабочий поддомен не следует считать
      итоговым доменом проекта."
