title: Таблица файлов прошивок с горизонтальным фильтром
tagline: "Подготовил табличную витрину цифровых файлов: покупателю нужно было
  сравнивать строки и быстро сужать выдачу без перегруженной карточки."
year: "06.2020"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Digital products
  - Excel
  - Catalog filters
blocks:
  - type: text
    title: Задача и ограничения
    body: "Подготовил табличную витрину цифровых файлов: покупателю нужно было
      сравнивать строки и быстро сужать выдачу без перегруженной карточки."
  - type: text
    title: Как устроено решение
    body: Передал шаблон Excel для категорий, характеристик и цен, затем
      импортировал подготовленные данные. Настроил горизонтальный фильтр и по
      итогам мобильной проверки убрал лишние счётчики, сортировку и столбцы.
      Отдельно объяснил, что блокировка поля двигателя до выбора модели
      потребует дополнительной разработки.
  - type: text
    title: Результат и проверка
    body: Клиент принял витрину. Плановый объём не выдаю за число загруженных
      файлов; оплату и переезд домена проверяли не в этом этапе.
