title: Подключение ЮKassa с проверкой оплаты и чека
tagline: Подключить рабочий сценарий онлайн-оплаты к существующему магазину
  услуг. На сдаче требовалось убедиться, что покупатель не просто доходит до
  платёжного экрана, а может завершить оплату.
year: "03.2026"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - YooKassa
  - Payment QA
blocks:
  - type: text
    title: Задача и ограничения
    body: Подключить рабочий сценарий онлайн-оплаты к существующему магазину услуг.
      На сдаче требовалось убедиться, что покупатель не просто доходит до
      платёжного экрана, а может завершить оплату.
  - type: text
    title: Как устроено решение
    body: Уточнил данные компании и тип услуг, подключил ЮKassa и создал товар для
      проверки на 10 рублей. В рабочей переписке зафиксировал успешный платёж и
      получение письма заказа. По просьбе клиента прежний вариант оплаты Т-Банка
      убрали из сценария вместо того, чтобы обещать его ремонт в рамках новой
      интеграции.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил чек, провёл собственную проверку и принял заказ.
      Историческая транзакция не заменяет текущий тест оплаты, а перевод всех
      писем не входил в подтверждённый результат.
