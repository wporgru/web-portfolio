title: Подготовка WooCommerce к перезапуску каталога
tagline: Магазин предстояло наполнить ассортиментом новых поставщиков. До
  импорта нужно было освободить каталог от прежней структуры и разобраться с
  накопившимися расширениями.
year: "02.2026"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - WordPress
  - Database cleanup
blocks:
  - type: text
    title: Задача и ограничения
    body: Магазин предстояло наполнить ассортиментом новых поставщиков. До импорта
      нужно было освободить каталог от прежней структуры и разобраться с
      накопившимися расширениями.
  - type: text
    title: Как устроено решение
    body: Удалил прежние товары, категории, метки и атрибуты по согласованному
      объёму. Обновил расширения, убрал ненужные компоненты и очистил остаточные
      записи удалённых плагинов из базы. Добавил защиту и на время подготовки
      ограничил публичный доступ к пустой витрине и её индексацию.
  - type: text
    title: Результат и проверка
    body: "В отчёте о сдаче число плагинов сократилось с более чем 55 до 35. Клиент
      проверил этап и принял его: магазин был готов к следующей задаче —
      загрузке ассортимента, которая не входит в этот кейс."
