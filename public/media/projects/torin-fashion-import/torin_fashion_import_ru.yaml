title: "Torin Fashion: перенос ассортимента одежды"
tagline: Для нового магазина нужно было собрать ассортимент выбранного каталога
  и загрузить его на целевой сайт. Работа зависела не только от качества данных,
  но и от ресурсов хостинга.
year: "03.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Web scraping
  - Catalog import
blocks:
  - type: text
    title: Задача и ограничения
    body: Для нового магазина нужно было собрать ассортимент выбранного каталога и
      загрузить его на целевой сайт. Работа зависела не только от качества
      данных, но и от ресурсов хостинга.
  - type: text
    title: Как устроено решение
    body: Настроил сбор выбранного каталога и начал перенос. Когда загрузка
      остановилась примерно на половине, отделил ограничение текущего запуска от
      оценки всего ассортимента. После увеличения тарифа заказчиком продолжил
      импорт и передал готовую загрузку на проверку.
  - type: text
    title: Результат и проверка
    body: Клиент принял заказ на следующий день после сообщения о завершении. Около
      5 500 позиций фигурировали как оценка источника, а не как проверенный итог
      загрузки.
