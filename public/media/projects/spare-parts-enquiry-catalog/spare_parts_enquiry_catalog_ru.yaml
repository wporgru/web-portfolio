title: Каталог запчастей без онлайн-продажи
tagline: "Переработал существующий магазин запчастей в витрину для обращений:
  покупатель выбирает категорию и связывается с продавцом, а не оформляет заказ
  через корзину."
year: "05.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Catalog mode
  - Lead forms
  - CSS
blocks:
  - type: text
    title: Задача и ограничения
    body: "Переработал существующий магазин запчастей в витрину для обращений:
      покупатель выбирает категорию и связывается с продавцом, а не оформляет
      заказ через корзину."
  - type: text
    title: Как устроено решение
    body: Скрыл цены, счётчики и корзину. Вместо сценария немедленного звонка
      предложил форму для контактов покупателя. Исправил ссылку раздела
      «Запчасти», которая вела не туда, и выровнял карточки выбранным клиентом
      способом — увеличением высоты. Показал, где управлять оформлением.
  - type: text
    title: Результат и проверка
    body: Клиент одобрил вид и принял заказ. Отдельную мобильную кнопку и единый
      размер изображений подкатегорий оставили за рамками этапа.
