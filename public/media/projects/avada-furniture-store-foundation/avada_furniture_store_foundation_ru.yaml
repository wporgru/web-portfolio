title: Основа мебельного магазина на Avada
tagline: "Развернул основу мебельного магазина: готовая тема с визуальным
  редактором, WooCommerce и собственный домен с HTTPS."
year: "02.2020"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - Avada
  - TLS
blocks:
  - type: text
    title: Задача и ограничения
    body: "Развернул основу мебельного магазина: готовая тема с визуальным
      редактором, WooCommerce и собственный домен с HTTPS."
  - type: text
    title: Как устроено решение
    body: Использовал Avada Architecture, привязал домен к хостингу и подготовил
      установку. При подтверждённом поддержкой сбое дождался восстановления
      сервера и продолжил настройку. При сдаче сообщил об установке сертификата
      Let’s Encrypt и передал адрес на проверку.
  - type: text
    title: Результат и проверка
    body: Заказчик проверил и принял основу магазина. Разработка собственной темы,
      наполнение всего каталога и подключение оплаты не входили в подтверждённый
      объём.
