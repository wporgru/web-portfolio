title: Основа мебельного магазина на Avada
tagline: "Подготовил старт WordPress-магазина мебели на WooCommerce: развернул готовую тему, подключил домен и передал сайт с заявленным HTTPS."
year: "02.2020"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - Avada
  - TLS
blocks:
  - type: text
    title: Задача и ограничения
    body: "Заказчик хотел быстро запустить основу мебельного магазина на WordPress и WooCommerce, используя готовую тему Avada Architecture и визуальный редактор. В задании фигурировали шаблонная витрина, каталог, корзина, новости и поиск, а также привязка хостинга и собственного домена. Импорт товарной базы заказчик прямо исключил, поэтому задача не была обещанием наполненного магазина с полным ассортиментом."
  - type: text
    title: Как устроено решение
    body: "Выбрал готовую Avada Architecture вместо разработки темы с нуля и подготовил WordPress/WooCommerce-основу. Связал домен mebelindesign.dp.ua с хостингом. Когда провайдер подтвердил сбой сервера, дождался восстановления инфраструктуры и только затем продолжил настройку и передачу адреса заказчику. При сдаче сообщил об установке SSL-сертификата Let’s Encrypt. vito-palazzo.com в материалах выступает только как визуальный ориентир, не как выполненный проект."
  - type: text
    title: Результат и проверка
    body: "Клиент проверил результат, явно принял заказ и написал, что работа выполнена по заданию и в срок. Доказанный результат — принятая стартовая сборка на готовой теме с доменом и заявленным SSL. Индивидуальная тема, импорт из трёх донорских сайтов, полная товарная база, эквайринг и реальные продажи в этот объём не включены. Текущая доступность домена и точная работа всех разделов независимо не подтверждены; историческое принятие не заменяет свежий тест."
