blocks:
  - type: text
    title: Brief and constraints
    body: Set up a furniture store foundation with a visual editor, WooCommerce and
      HTTPS on its own domain.
  - type: text
    title: How it works
    body: Used Avada Architecture, connected the domain and prepared the
      installation. After hosting support confirmed an outage, waited for
      recovery before continuing. Reported installing a Let’s Encrypt
      certificate and shared the site for review.
  - type: text
    title: Result and verification
    body: The client reviewed and accepted the store foundation. A bespoke theme,
      full catalog population and payment integration were outside the verified
      scope.
