title: "YML для полуприцепов: исправление наборов в Вебмастере"
tagline: Вебмастер сообщал об ошибках связей товаров с наборами и изображений.
  Требовалось исправить действующую выгрузку так, чтобы товары распределялись по
  подходящим группам, а не переделывать сайт.
year: "03.2026"
role: Веб-разработка и автоматизация
stack:
  - PHP
  - YML
  - Product sets
  - Yandex Webmaster
blocks:
  - type: text
    title: Задача и ограничения
    body: Вебмастер сообщал об ошибках связей товаров с наборами и изображений.
      Требовалось исправить действующую выгрузку так, чтобы товары
      распределялись по подходящим группам, а не переделывать сайт.
  - type: text
    title: Как устроено решение
    body: Исправил ссылки наборов и вывод изображения в PHP-скрипте фида. Вместо
      одной основной категории учёл все подходящие категории и подключил бренды
      к формированию наборов. В историческом отчёте их число выросло с 10 до 27.
  - type: text
    title: Результат и проверка
    body: "Первоначальные технические ошибки перестали появляться при проверке,
      клиент принял работу. Ручную проверку Яндекса фид не прошёл: в отчёте
      отмечено ограничение объёма ассортимента. Публикация товарных предложений
      в поиске не подтверждена."
