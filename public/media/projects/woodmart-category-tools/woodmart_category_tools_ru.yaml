title: Настройка магазина инструментов и автоматизация категорий
tagline: "На готовой товарной выгрузке нужно было собрать удобную витрину
  магазина инструментов: настроить страницы, убрать лишние элементы интерфейса и
  сделать категории визуально понятными."
year: "02.2024"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - WoodMart
  - PHP
  - ChatGPT
blocks:
  - type: text
    title: Задача и ограничения
    body: "На готовой товарной выгрузке нужно было собрать удобную витрину магазина
      инструментов: настроить страницы, убрать лишние элементы интерфейса и
      сделать категории визуально понятными."
  - type: text
    title: Как устроено решение
    body: Установил WoodMart, согласовал текстовый логотип с иконкой и убрал
      регистрацию, профиль и кнопки публикации на мобильных и десктопных
      экранах. Настроил фильтры по доступным товарным атрибутам. Изображения для
      категорий назначил пакетно вспомогательным плагином, который ранее написал
      с помощью ChatGPT.
  - type: text
    title: Результат и проверка
    body: Заказчик получил настроенную витрину и пояснение, почему состав фильтров
      зависит от данных каждой категории. Плагин использовался как инструмент
      выполнения работ, а не как отдельный продукт, переданный клиенту.
