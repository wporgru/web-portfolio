title: Обновление старого WordPress и восстановление формы заявок
tagline: На старом сайте были заблокированы обновления, а форма в подвале
  требовала восстановления. Нужно было вернуть канал заявок и не активировать
  компоненты, которые уже вызывали ошибки.
year: "06.2025"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WPBakery
  - Forms
  - Maintenance
blocks:
  - type: text
    title: Задача и ограничения
    body: На старом сайте были заблокированы обновления, а форма в подвале требовала
      восстановления. Нужно было вернуть канал заявок и не активировать
      компоненты, которые уже вызывали ошибки.
  - type: text
    title: Как устроено решение
    body: Проверил наличие автоматических резервных копий, снял блокировку
      обновлений и определил, что сайт использует WPBakery. Обновил доступные
      компоненты в согласованных пределах. Заново настроил форму с отправкой
      адреса администратору и понятной пометкой запроса коммерческого
      предложения.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил работу формы и принял заказ. Полное восстановление
      мультиязычной версии, обновление WPBakery и тест всех каналов отправки не
      приписываю этому этапу.
