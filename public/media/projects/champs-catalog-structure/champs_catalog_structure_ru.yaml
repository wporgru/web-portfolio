title: Структура каталога, фильтры и адреса магазина Champs
tagline: После установки темы оставались демонстрационные страницы и вопросы к
  навигации. Нужно было привести каталог в порядок, сохранив согласованные метки
  и информационные разделы.
year: "10.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Filter Everything Pro
  - Technical SEO
blocks:
  - type: text
    title: Задача и ограничения
    body: После установки темы оставались демонстрационные страницы и вопросы к
      навигации. Нужно было привести каталог в порядок, сохранив согласованные
      метки и информационные разделы.
  - type: text
    title: Как устроено решение
    body: Убрал лишние демостраницы и настроил транслитерацию адресов. По замечаниям
      убрал сайдбар, создал отдельные страницы о доставке ковриков и отзывах,
      заполнил метаданные блога. В фильтрах доработал размер шрифта и конфликт
      регистра заголовков; объяснил разницу между архивами атрибутов WooCommerce
      и страницами Filter Everything Pro.
  - type: text
    title: Результат и проверка
    body: Заказ закрылся автоматически. Зафиксированы отдельные улучшения, но
      вопросы к длинным адресам и сворачиванию фильтра остались без
      подтверждённого решения.
