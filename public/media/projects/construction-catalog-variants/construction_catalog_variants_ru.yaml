title: "Строительный каталог: вариации, фильтры и поиск"
tagline: Из выбранного ассортимента поставщика нужно было собрать удобную
  витрину. Однотипные размеры следовало объединять в вариации, сохранив
  характеристики, по которым покупатель подбирает материал.
year: "06.2024"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Excel
  - Filters
  - Product variants
blocks:
  - type: text
    title: Задача и ограничения
    body: Из выбранного ассортимента поставщика нужно было собрать удобную витрину.
      Однотипные размеры следовало объединять в вариации, сохранив
      характеристики, по которым покупатель подбирает материал.
  - type: text
    title: Как устроено решение
    body: Обработал выбранный список, упорядочил атрибуты и сгруппировал размеры.
      После замечания о перепутанных характеристиках исправил сортировку Excel и
      повторил загрузку. Настроил фильтры групп бетона, доработал отдельные
      позиции поликарбоната и дюбелей, добавил ассортимент по дополнительной
      опции и заменил плагин поиска. На мобильном развёл кнопку фильтра и меню,
      чтобы они не перекрывались.
  - type: text
    title: Результат и проверка
    body: В отчёте парсинга — 1 963 позиции и до 26 атрибутов. Клиент принял работу;
      число родительских карточек после группировки не пересчитывалось, а правка
      мобильного интерфейса была обходным решением без ремонта самой темы.
