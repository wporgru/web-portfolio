title: "ANTA: importing a YML catalog with size variations"
tagline: A sports storefront needed more than one listing per feed row. It had
  to load categories, preserve their product relationships and represent
  available sizes as variations of the same model.
year: "03.2023"
role: Web development and automation
stack:
  - WooCommerce
  - WP All Import
  - YML
  - Product variants
blocks:
  - type: text
    title: Brief and constraints
    body: A sports storefront needed more than one listing per feed row. It had to
      load categories, preserve their product relationships and represent
      available sizes as variations of the same model.
  - type: text
    title: How it works
    body: "Split WP All Import into two passes: category records first, then
      products linked by ID. The import mapping covered sizes, images and
      attributes. After loading, explained to the client how IDs connect rows to
      categories and flagged remaining questions about category slugs and the
      source feed."
  - type: text
    title: Result and verification
    body: The client accepted the stage and confirmed the import worked. The
      archived screen shows products, prices, filtering and sorting, not the
      imported product count, correctness of every size or a scheduled feed
      refresh. Preorder imports from spreadsheets were a separate follow-up.
