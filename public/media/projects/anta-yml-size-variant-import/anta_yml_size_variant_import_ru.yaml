title: "ANTA: импорт каталога YML с размерами"
tagline: Для спортивного каталога недостаточно вывести по одной карточке на
  каждую строку выгрузки. Нужно было загрузить категории, сохранить связь с
  товарами и представить доступные размеры как вариации одной модели.
year: "03.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - WP All Import
  - YML
  - Product variants
blocks:
  - type: text
    title: Задача и ограничения
    body: Для спортивного каталога недостаточно вывести по одной карточке на каждую
      строку выгрузки. Нужно было загрузить категории, сохранить связь с
      товарами и представить доступные размеры как вариации одной модели.
  - type: text
    title: Как устроено решение
    body: "Разделил загрузку в WP All Import на два прохода: сначала справочник
      категорий, затем товары с привязкой по ID. Размеры, изображения и атрибуты
      были частью схемы импорта. После загрузки разобрал с заказчиком, как ID
      связывают строки с категориями, и отметил оставшиеся вопросы по адресным
      именам категорий и исходному фиду."
  - type: text
    title: Результат и проверка
    body: Заказчик принял этап и подтвердил работу импорта. В архиве сохранился
      экран с карточками, ценами, фильтром и сортировкой. Он показывает вид
      витрины, но не устанавливает количество загруженных товаров, корректность
      каждого размера или работу расписания. Позднее отдельно настраивал импорт
      предзаказа из таблиц.
  - type: text
    title: Другой этап этого проекта
    links:
      - label: "Следующий этап: импорт предзаказа из трёх таблиц"
        url: /showcase/anta-preorder-variant-import/
  - type: text
    title: Фрагмент витрины из архива проекта
    links:
      - label: Оригинал в портфолио Kwork
        url: https://kwork.ru/portfolio/9349165
  - type: image
    src: /media/projects/anta-yml-size-variant-import/archive-storefront.webp
    alt: Карточки баскетбольных кроссовок ANTA с фильтром и сортировкой
    caption: Оригинальный архивный фрагмент 1400 × 680. Показаны карточки каталога,
      цены и элементы фильтрации. Один экран не показывает полноту импорта и
      работу всех размерных вариаций.
