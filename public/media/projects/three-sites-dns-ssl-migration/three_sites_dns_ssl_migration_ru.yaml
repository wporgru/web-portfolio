title: "Координация переезда трёх сайтов: DNS и SSL"
tagline: Помог перенести три сайта с Hostland на Hostiman. Файлы переносила
  поддержка хостинга; моя зона ответственности — координация, диагностика DNS и
  выпуск сертификатов.
year: "10.2022"
role: Веб-разработка и автоматизация
stack:
  - DNS
  - TLS
  - Hosting migration
  - WordPress
blocks:
  - type: text
    title: Задача и ограничения
    body: Помог перенести три сайта с Hostland на Hostiman. Файлы переносила
      поддержка хостинга; моя зона ответственности — координация, диагностика
      DNS и выпуск сертификатов.
  - type: text
    title: Как устроено решение
    body: "Запросил перенос у поддержки и разобрал проблему одного домена: два
      DNS-сервера регистратора давали противоречивые ответы. Передал
      регистратору конкретные результаты проверки. После исправления подтвердил
      открытие домена и выпустил SSL для двух других площадок."
  - type: text
    title: Результат и проверка
    body: Клиент принял объединённый этап. Пробный поиск убрали по его просьбе;
      готовый поиск и все уровни меню не выдаю за результаты миграции.
