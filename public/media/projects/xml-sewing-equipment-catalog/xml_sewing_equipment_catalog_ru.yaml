title: Импорт швейного оборудования из XML поставщика
tagline: Действующую витрину требовалось дополнить ассортиментом из XML. После
  загрузки клиенту нужно было исключить конкретные товары, а не перестраивать
  каталог целиком.
year: "03.2026"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - XML
  - Supplier catalog
blocks:
  - type: text
    title: Задача и ограничения
    body: Действующую витрину требовалось дополнить ассортиментом из XML. После
      загрузки клиенту нужно было исключить конкретные товары, а не
      перестраивать каталог целиком.
  - type: text
    title: Как устроено решение
    body: Получил выгрузку, запустил импорт и передал результат после завершения. По
      просьбе клиента удалил две лишние позиции. Обсуждение будущего расписания
      вынес в отдельный вопрос, чтобы не смешивать разовую загрузку с регулярной
      синхронизацией.
  - type: text
    title: Результат и проверка
    body: Клиент принял заказ. Число карточек и полнота всех атрибутов не
      пересчитывались; автоматическое обновление не входило в подтверждённый
      результат.
