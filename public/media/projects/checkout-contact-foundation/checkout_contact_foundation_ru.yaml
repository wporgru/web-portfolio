title: Доработка оформления заказа и контактов WooCommerce
tagline: Действующему магазину требовались более понятное оформление покупки,
  рабочая контактная страница и предсказуемое поведение при доставке и
  самовывозе.
year: "03.2025"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Contact Form 7
  - Shipping
blocks:
  - type: text
    title: Задача и ограничения
    body: Действующему магазину требовались более понятное оформление покупки,
      рабочая контактная страница и предсказуемое поведение при доставке и
      самовывозе.
  - type: text
    title: Как устроено решение
    body: Подготовил оформление и контакты, объяснил размещение Contact Form 7 через
      шорткод и показал стандартный кабинет. После замечания вернул отображение
      цен, настроил доставку с фиксированной стоимостью и показал различия полей
      для доставки и самовывоза. При обновлении выявилась зависимость главной от
      родительской темы; клиент восстановил её из копии.
  - type: text
    title: Результат и проверка
    body: Клиент отдельно одобрил оформление заказа и страницу контактов. Полный
      перенос изменений в дочернюю тему, интеграция API перевозчика и банковская
      проверка оплаты не входят в подтверждённый результат.
