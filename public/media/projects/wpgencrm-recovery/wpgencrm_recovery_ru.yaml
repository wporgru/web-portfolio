title: Восстановление панели WPGenCRM на Streamlit
tagline: Внутренняя панель объединяла настройки поисковых API и рабочих
  подключений. При редактировании полей значения конфликтовали с состоянием
  виджетов, из-за чего интерфейс падал.
year: "2026"
role: Веб-разработка и автоматизация
stack:
  - Python
  - Streamlit
  - REST API
blocks:
  - type: text
    title: Задача и ограничения
    body: Внутренняя панель объединяла настройки поисковых API и рабочих
      подключений. При редактировании полей значения конфликтовали с состоянием
      виджетов, из-за чего интерфейс падал.
  - type: text
    title: Как устроено решение
    body: Восстановил модуль панели и разделил состояние редактируемых параметров и
      жизненный цикл виджетов. Сохранил сценарии настройки поисковых сервисов и
      проверки рабочих подключений. В качестве источника использован отчёт о
      выполненной работе из Antigravity, а не план внедрения.
  - type: text
    title: Результат и проверка
    body: В отчёте зафиксированы успешная проверка синтаксиса и 13 прошедших тестов.
      Кейс относится к восстановлению локального инструмента; конфигурация,
      экраны с настройками и доступы не публикуются.
