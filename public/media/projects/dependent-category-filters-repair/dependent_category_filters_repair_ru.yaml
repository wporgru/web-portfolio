title: Восстановление зависимых фильтров WooCommerce
tagline: "Исправил сбой зависимых фильтров: одинаковые названия подкатегорий в
  разных ветках приводили к неверным спискам и счётчикам."
year: "04.2021"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Taxonomy
  - Dependent filters
  - Mobile QA
blocks:
  - type: text
    title: Задача и ограничения
    body: "Исправил сбой зависимых фильтров: одинаковые названия подкатегорий в
      разных ветках приводили к неверным спискам и счётчикам."
  - type: text
    title: Как устроено решение
    body: Проверил разницу между выбором дочерней категории отдельно и выбором
      вместе с родителем. Обновил расширение, вернул автоприменение фильтра и
      последовательно исправил списки по примерам клиента. Отдельно восстановил
      подвал для мобильных посетителей.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил проверенные им выборки и подвал на телефоне, принял
      работу и оставил бонус. Проверка не охватывала все комбинации каталога.
