title: Восстановление зависимых фильтров WooCommerce
tagline: "Исправил сбой зависимых фильтров: одинаковые названия подкатегорий в
  разных ветках приводили к неверным спискам и счётчикам."
year: "04.2021"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Taxonomy
  - Dependent filters
  - Mobile QA
blocks:
  - type: text
    title: Задача и ограничения
    body: "В существующем WooCommerce-каталоге зависимые фильтры выдавали некорректные пункты и счётчики, когда одинаково названные подкатегории находились в разных ветках. Заказ включал не только фильтрацию: отдельно требовалось вернуть мобильный подвал. Домен и точный плагин в сохранённой истории не установлены, поэтому кейс описывает поведение и выполненную настройку без неподтверждённой привязки к сайту или конкретному расширению."
  - type: text
    title: Как устроено решение
    body: "Сопоставил два сценария — выбор дочерней категории отдельно и выбор той же категории в контексте родителя — чтобы локализовать неоднозначность веток. Обновил расширение, восстановил случайно отключённое автоприменение и итеративно корректировал выдаваемые значения по примерам заказчика. Когда клиент подтвердил исправление сначала на части выборок, затем на всех проверенных им вариантах, переключился на отдельную мобильную проблему: восстановил отображение нижнего блока сайта на телефоне."
  - type: text
    title: Результат и проверка
    body: Заказчик подтвердил проверенные выборки фильтров и работу нижнего блока на телефоне, принял заказ, добавил бонус и оставил положительный отзыв, отметив быстрое и профессиональное взаимодействие. Это подтверждает приёмку конкретных проверенных сценариев, но не полный перебор всех категорий, комбинаций и устройств. Количество товаров, название сайта, точное расширение фильтров и результаты нового импорта не подтверждены.
