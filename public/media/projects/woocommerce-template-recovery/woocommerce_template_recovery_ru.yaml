title: Ремонт категорий и меню WooCommerce после обновления
tagline: После обновлений две категории перестали открываться, а меню вело себя
  непредсказуемо. Нужно было восстановить маршруты каталога и понять, почему
  правки шапки не давали ожидаемого эффекта.
year: "06.2025"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - Elementor Pro
  - Permalinks
blocks:
  - type: text
    title: Задача и ограничения
    body: После обновлений две категории перестали открываться, а меню вело себя
      непредсказуемо. Нужно было восстановить маршруты каталога и понять, почему
      правки шапки не давали ожидаемого эффекта.
  - type: text
    title: Как устроено решение
    body: Проверил постоянные ссылки и исправил их настройки. Обновление Elementor
      Pro не устранило сбой само по себе, поэтому продолжил диагностику
      шаблонов. Нашёл несколько неверно настроенных шапок и подвалов, удалил
      лишние и сообщил о восстановлении меню. По просьбе клиента также убрал
      подпись In stock из карточки.
  - type: text
    title: Результат и проверка
    body: Сдал исправление конкретных категорий, меню и подписи. Это сопровождение
      существующей витрины, а не перенос хостинга или утверждение, что
      исправлены все ошибки сайта.
