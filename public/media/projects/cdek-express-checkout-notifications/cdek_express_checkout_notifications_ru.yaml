title: Экспресс-доставка СДЭК и письма заказа
tagline: Настроил расчёт доставки в оформлении WooCommerce и восстановил
  получение писем. Клиенту важно было видеть доступные способы и не терять
  сведения о новом заказе.
year: "06.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - CDEK
  - Express shipping
  - Transactional email
blocks:
  - type: text
    title: Задача и ограничения
    body: Настроил расчёт доставки в оформлении WooCommerce и восстановил получение
      писем. Клиенту важно было видеть доступные способы и не терять сведения о
      новом заказе.
  - type: text
    title: Как устроено решение
    body: Настроил тарифы «склад — склад» и «склад — дверь», затем добавил
      экспресс-варианты. Исправил оформление страницы WooCommerce и обновил
      навигацию по инструкции «Как купить». После обратной связи проверил
      получение писем с клиентом, не выдавая предположение о блокировке
      хостингом за установленную причину.
  - type: text
    title: Результат и проверка
    body: Клиент наблюдал автоматический расчёт, подтвердил письма и принял заказ.
      Все границы тарифов и реальные отправления отдельно не проверялись.
