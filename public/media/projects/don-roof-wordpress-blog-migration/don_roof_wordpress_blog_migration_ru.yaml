title: "«Кровельщик Дона»: перенос 22 статей WordPress"
tagline: Перевёл 22 материала из страниц в записи WordPress, распределил их по
  рубрикам и настроил 8 постоянных редиректов. Поздняя проверка показала, что
  прежняя карта адресов больше не работает как при сдаче.
year: "06.2026"
role: Миграция контента и техническое SEO
stack:
  - WordPress
  - PHP
  - 301 redirects
  - Antigravity
blocks:
  - type: text
    title: "Задача: собрать статьи в управляемом блоге"
    body: Материалы существовали как статические страницы WordPress. Нужно было
      перевести 22 статьи в записи и распределить по трём тематическим рубрикам,
      отдельно учтя страницы с родительским сегментом в URL.
  - type: text
    title: Сопоставление URL и смена типа записей
    body: Перед переносом составил таблицу старых и новых маршрутов и зафиксировал
      исходное состояние. Для 14 статей путь по карте не менялся; для восьми
      настроил постоянное перенаправление на новый адрес. Отдельно разрешил
      конфликт одинакового slug у статьи и медиафайла.
  - type: text
    title: "При сдаче: сверка 22 новых и восьми старых адресов"
    body: В отчёте Antigravity за июнь 2026 года зафиксированы 22 ответа HTTP 200 на
      целевых адресах и восемь 301 со старых путей. Это результат, записанный в
      отчёте на момент работ, а не гарантия его сохранения после следующих
      обновлений сайта.
  - type: text
    title: Повторная проверка 21 ноября 2026 года
    body: Из 22 целевых URL 21 ответил 404, один — 301. Все восемь старых путей
      ответили 404. Раздел блога открывался. Причина расхождения с отчётом не
      установлена; эту проверку нельзя выдавать за доказательство потери статей,
      изменения трафика или дальнейших работ.
  - type: text
    title: Что показала сверка карты записей
    body: 22 ноября сверил 22 целевых адреса из июньского отчёта с публичной XML-картой
      записей. Среди 87 адресов не было совпадений ни по полному пути, ни по его
      последнему сегменту. В карте не нашлись варианты, у которых поменялся только
      префикс. Это не исключает, что материалы опубликованы с другими адресами.
      Следующий шаг для восстановления — сопоставить статьи по заголовкам и содержанию,
      а не перенаправлять всё на блог.
