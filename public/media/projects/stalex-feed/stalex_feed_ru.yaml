title: Автоимпорт 719 товаров STALEX
tagline: Загрузить ассортимент из нестандартного фида, не потеряв характеристики
  и признак наличия.
role: Веб-разработка
year: "06.2026"
stack:
  - WooCommerce
  - XML
  - Data import
blocks:
  - type: text
    title: Задача
    body: Загрузить ассортимент из нестандартного фида, не потеряв характеристики и
      признак наличия.
  - type: text
    title: Что сделано
    body: Настроил категории и товары, разделил структурированные атрибуты и
      текстовые характеристики, исправил сопоставление наличия. В отчёте первой
      загрузки — 719 позиций.
  - type: text
    title: Как решалась задача
    body: Нестандартный фид содержал и структурированные поля, и отдельный текст с
      техническими характеристиками. Первые попали в атрибуты WooCommerce,
      второй остался в описании, чтобы не потерять полезные данные. После первой
      загрузки обнаружили проблему с остатками; исправил условие и повторил
      импорт. Клиент отдельно подтвердил исправление и в отзыве отметил перенос
      более 700 позиций.
  - type: image
    title: Публичный вид сайта
    src: /media/projects/stalex-feed/site.png
    alt: Публичная версия сайта проекта
    caption: Снимок на дату проверки. Он показывает публичную версию сайта, а не
      обязательно вид на момент сдачи.
