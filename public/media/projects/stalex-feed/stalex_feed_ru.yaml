title: Автоимпорт 719 товаров STALEX
tagline: Настроил импорт каталога из нестандартного фида и ежедневное обновление цен и наличия. В отчёте первичной загрузки — 719 товаров.
role: Интеграция WooCommerce и автоматизация каталога
year: "06.2026"
stack:
  - WordPress
  - WooCommerce
  - XML
