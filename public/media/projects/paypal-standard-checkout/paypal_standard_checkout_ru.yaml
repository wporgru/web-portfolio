title: Совместимость PayPal и товарный блок в чекауте
tagline: Кастомный редактор оформления конфликтовал с PayPal. Нужно было
  восстановить рабочую основу checkout и убрать дублирующие платёжные кнопки с
  других страниц.
year: "02.2024"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - PayPal
  - Checkout
blocks:
  - type: text
    title: Задача и ограничения
    body: Кастомный редактор оформления конфликтовал с PayPal. Нужно было
      восстановить рабочую основу checkout и убрать дублирующие платёжные кнопки
      с других страниц.
  - type: text
    title: Как устроено решение
    body: Разобрал несовместимость и предложил стандартное оформление. Отключил
      конфликтующий редактор, сохранил прежние стили для отдельного
      дизайн-этапа, добавил фото товара и оставил платёжные кнопки только в
      checkout, убрав их из корзины и карточки.
  - type: text
    title: Результат и проверка
    body: Клиент принял функциональный этап. Иконка корзины повторно фигурировала в
      замечаниях; реальный платёж и точное совпадение с будущим макетом не
      заявляются.
