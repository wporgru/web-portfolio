title: "«Фаэтон»: восстановление каталога аренды техники"
tagline: Страница аренды поломоечных машин открывалась, но каталог был пуст.
  Нужно было вернуть актуальные машины, месячные цены и возможность открыть
  форму заявки, не правя ассортимент и цены в базе вручную.
year: "10.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - GenerateBlocks
  - Contact Form 7
  - Playwright
blocks:
  - type: text
    title: Задача и ограничения
    body: Страница аренды поломоечных машин открывалась, но каталог был пуст. Нужно
      было вернуть актуальные машины, месячные цены и возможность открыть форму
      заявки, не правя ассортимент и цены в базе вручную.
  - type: text
    title: Как устроено решение
    body: "Нашёл причину в запросе GenerateBlocks: он одновременно искал шестёрку
      старых товаров продажи и требовал категорию аренды. Заменил этот список
      динамической выборкой опубликованных товаров категории и её подразделов.
      Пустая категория больше не приводит к показу всего магазина. Карточки
      берут цену, фото и ссылку у арендного товара, не выводят отсутствующие
      характеристики. Подключил к существующей форме заявки и карточки, и
      отдельные кнопки на странице."
  - type: text
    title: Результат и проверка
    body: После правки в браузере на 1366, 768 и 390 px отображались все пять
      арендных товаров. Все пять ссылок «Подробнее» ответили HTTP 200. На двух
      ширинах проверил 16 открытий формы и закрытие по Escape; заявку в
      продакшен не отправлял.
  - type: image
    src: /media/projects/faeton-rental-catalog-recovery/public-full.webp
    alt: Полная страница аренды машин «Фаэтон» с карточками техники
    caption: Публичная страница целиком, снимок без обрезки от 15 ноября 2026 года.
      Это вид после работ, а не тест отправки заявки.
  - type: text
    title: Действующий сайт
    links:
      - label: Открыть страницу проекта
        url: https://faetonclean.ru/arenda-polomoechnoy-mashiny/
