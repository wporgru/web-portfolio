title: Перенос шапки из Creatium в WordPress
tagline: Перенёс прототип первого экрана из Creatium в WordPress, чтобы
  продолжить развивать интерфейс в Elementor, не перенося весь каталог за один
  этап.
year: "12.2022"
role: Веб-разработка и автоматизация
stack:
  - Creatium
  - WordPress
  - Elementor
  - Responsive design
blocks:
  - type: text
    title: Задача и ограничения
    body: Перенёс прототип первого экрана из Creatium в WordPress, чтобы продолжить
      развивать интерфейс в Elementor, не перенося весь каталог за один этап.
  - type: text
    title: Как устроено решение
    body: "Согласовал границы переноса: шапка, меню, первый экран и контейнер
      страницы. Доработку товарных карточек отделил от этой сдачи, чтобы клиент
      мог принять основную компоновку независимо от каталога."
  - type: text
    title: Результат и проверка
    body: Клиент проверил изменения и принял этап. Это перенос интерфейса, а не
      подтверждённая миграция всех страниц и товаров.
