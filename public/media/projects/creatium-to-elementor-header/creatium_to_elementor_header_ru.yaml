title: Перенос шапки из Creatium в WordPress
tagline: >-
  Перенёс шапку, меню и первый экран магазина жалюзи из прототипа Creatium на тестовую WordPress-копию. Сохранил выпадающие разделы и адаптировал контейнер для небольших экранов.
year: "12.2022"
role: Веб-разработка и автоматизация
stack:
  - Creatium
  - WordPress
  - Elementor
  - Responsive design
blocks:
  - type: text
    title: Что переносили
    body: >-
      Заказчик уже подготовил первый экран в Creatium. Вместо миграции всего магазина выделили отдельный этап для шапки, навигации и компоновки первого экрана в Elementor.
  - type: text
    title: Два меню с разными задачами
    body: >-
      Обновил представление меню выбора жалюзи и сохранил существующую верхнюю навигацию с выпадающими разделами. Скорректировал ширину контейнера и адаптировал шапку для небольших экранов.
  - type: text
    title: Приёмка на тестовой копии
    body: >-
      Товарные карточки обсуждали, но вынесли из этого этапа. Заказчик проверил изменения и принял заказ. Выкладка на основной домен и перенос каталога этой приёмкой не подтверждаются.
