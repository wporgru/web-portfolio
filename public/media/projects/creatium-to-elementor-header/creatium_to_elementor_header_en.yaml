title: Rebuilding a Creatium header in WordPress
tagline: >-
  Moved a blinds store header, navigation and hero from a Creatium prototype to a WordPress staging copy, keeping dropdown navigation and adapting the layout for smaller screens.
year: "12.2022"
role: Web development and automation
stack:
  - Creatium
  - WordPress
  - Elementor
  - Responsive design
blocks:
  - type: text
    title: What moved to Elementor
    body: >-
      The client already had a Creatium hero prototype. We scoped a separate Elementor phase for the header, navigation and hero layout rather than migrating the entire store.
  - type: text
    title: Two menus serving different needs
    body: >-
      I updated the blinds-selection menu and kept the existing top navigation with its dropdown sections. I also adjusted the container width and adapted the header for smaller screens.
  - type: text
    title: Accepted on staging
    body: >-
      Product card work was discussed but left outside this phase. The client checked and accepted the changes. Acceptance did not establish a production cutover or catalog migration.
