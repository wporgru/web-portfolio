title: "HyperStroy: launching a tools and equipment store"
tagline: Built a WoodMart tools storefront and imported the agreed product
  selection so the client could launch using an existing export and maintain the
  layout independently.
year: "06.2024"
role: Web development and automation
stack:
  - WordPress
  - WooCommerce
  - WoodMart
