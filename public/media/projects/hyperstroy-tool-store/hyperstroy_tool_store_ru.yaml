title: "ГиперСтрой: запуск магазина инструментов"
tagline: Собрал витрину инструментов на WoodMart и загрузил согласованную
  выборку товаров. Клиенту нужно было запустить магазин на готовой выгрузке и
  затем самостоятельно поддерживать оформление.
year: "06.2024"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - WoodMart
  - Data import
blocks:
  - type: text
    title: Задача и ограничения
    body: Собрал витрину инструментов на WoodMart и загрузил согласованную выборку
      товаров. Клиенту нужно было запустить магазин на готовой выгрузке и затем
      самостоятельно поддерживать оформление.
  - type: text
    title: Как устроено решение
    body: Уточнил границу отбора и использовал согласованный источник. Прямой сбор с
      сайта поставщика давал некорректные данные из-за защиты, поэтому не
      подмешивал их в рабочую выгрузку. Доработал плотность сетки и размер фото,
      убрал ненужные действия с карточки, добавил отдельную кнопку заказа звонка
      и показал, как редактировать слайдер и подвал.
  - type: text
    title: Результат и проверка
    body: Клиент принял магазин. В отчёте указаны 4 554 подходящие позиции; снимок
      из портфолио показывает витрину, но не заменяет пересчёт опубликованных
      карточек или тест оплаты.
  - type: image
    src: /media/projects/hyperstroy-tool-store/historical-storefront.webp
    alt: "Главная магазина «ГиперСтрой»: категории и товары"
    caption: Исторический длинный снимок витрины из портфолио Kwork, июнь 2024.
      Сохранён без обрезки.
