title: "Форма обратного звонка на WordPress: кнопка и настройка"
tagline: На главной сайта нужна была заметная кнопка, которая открывает форму
  обратного звонка. Клиент также хотел сам редактировать форму и связывать её с
  другими кнопками.
year: "01.2018"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Callback forms
  - UI integration
  - Editor handoff
blocks:
  - type: text
    title: Задача и ограничения
    body: На главной сайта нужна была заметная кнопка, которая открывает форму
      обратного звонка. Клиент также хотел сам редактировать форму и связывать
      её с другими кнопками.
  - type: text
    title: Как устроено решение
    body: Разместил форму для контрольной проверки, добавил кнопку её вызова и
      показал, как создавать и редактировать формы и подключать их к новым
      кнопкам. Отдельно объяснил, что правку в файле темы может перезаписать
      обновление.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил работоспособность и принял заказ. Подтверждены настройка
      формы, кнопка и инструкция; отдельного полного протокола доставки писем и
      проверки сохранности после обновления нет.
