title: Карточки кофе с выбором фасовки в WooCommerce
tagline: "Доработал карточки каталога по макету: покупателю нужно было видеть
  актуальную цену при выборе фасовки, а кнопка должна была выглядеть одинаково у
  простых товаров и вариаций."
year: "05.2024"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Figma
  - Product variations
blocks:
  - type: text
    title: Задача и ограничения
    body: "Доработал карточки каталога по макету: покупателю нужно было видеть
      актуальную цену при выборе фасовки, а кнопка должна была выглядеть
      одинаково у простых товаров и вариаций."
  - type: text
    title: Как устроено решение
    body: "Выявил проблему исходного макета: цена внутри кнопки отображалась, но не
      обновлялась при смене веса или количества. Согласовал вынос цены в
      отдельный блок, чтобы дизайн не расходился с логикой магазина. После
      обратной связи привёл кнопку покупки к общему стилю каталога и вариативных
      карточек."
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил улучшение и принял работу. Поздний запрос добавления в
      корзину без перехода не выдаю за отдельно протестированный сценарий.
