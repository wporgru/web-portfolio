title: "Filament Store: восстановление витрины и SEO-шаблонов"
tagline: После обновления магазина сместились элементы каталога, шапки и
  навигации. Нужно было вернуть рабочую подачу на телефонах и восстановить
  видимость текстов, не пересоздавая магазин.
year: "03.2025"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Savoy
  - Yoast SEO
  - CSS
blocks:
  - type: text
    title: Задача и ограничения
    body: После обновления магазина сместились элементы каталога, шапки и навигации.
      Нужно было вернуть рабочую подачу на телефонах и восстановить видимость
      текстов, не пересоздавая магазин.
  - type: text
    title: Как устроено решение
    body: По замечаниям заказчика исправлял подвал, шапку с контактами и графиком,
      мобильный логотип, цены и кнопки. Убрал второй блок категорий, поправил
      отступы фильтра и нашёл нестандартный скрипт, скрывавший описания.
      Настроил шаблоны Title и Description в Yoast и карту меток, отдельно
      объяснив, где используются архивы тегов.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил шапку, подвал и отображение на другом телефоне, а после
      правки скрипта — видимость текста. Ручное наполнение части категорий и
      меток выполнял клиент; роста поискового трафика не измеряли.
