title: Замена темы магазина с восстановлением чекаута
tagline: Устаревшую тему требовалось заменить без потери знакомого покупателям
  оформления. Одновременно нужно было вернуть работающий выбор пункта выдачи,
  который зависал в чекауте.
year: "06.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Gutenberg
  - Spectra
  - WooCommerce
  - CDEK
blocks:
  - type: text
    title: Задача и ограничения
    body: Устаревшую тему требовалось заменить без потери знакомого покупателям
      оформления. Одновременно нужно было вернуть работающий выбор пункта
      выдачи, который зависал в чекауте.
  - type: text
    title: Как устроено решение
    body: На тестовой копии заново собрал главную на Gutenberg и Spectra, сохранив
      близкое оформление и исходное содержание. Доработал шапку, график работы и
      порядок категорий. Заменил произвольные ссылки меню на ссылки категорий,
      чтобы убрать переходы на старый домен. Согласовал смену модуля СДЭК и
      доработал адресные поля.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил работу выбора ПВЗ. После его разрешения перенёс
      обновлённую версию на основной сайт и по отчёту визуально проверил витрину
      и карты пунктов выдачи. Полный перечень финальных полей и плагинов не
      сохранился.
