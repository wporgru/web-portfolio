blocks:
  - type: text
    title: Задача и ограничения
    body: "Подготовил сайт ремонтной компании на Astra: перечень услуг, контакты и
      форму для заявки с описанием задачи."
  - type: text
    title: Как устроено решение
    body: Собрал настольный и мобильный варианты, показал логотип и перечень
      ремонтно-отделочных услуг. В форме предусмотрел имя, телефон, примерный
      объём и описание работ. Передал оба варианта на согласование.
  - type: text
    title: Результат и проверка
    body: Клиент согласовал вариант и принял заказ. Сохранившиеся материалы
      подтверждают оформление формы, но не отдельный тест доставки заявки или
      последние изменения фона.
