title: Сайт ремонтной компании «Поместье» на Astra
tagline: Адаптировал выбранную тему Astra Daycare-02 под сайт ремонтной компании,
  показав услуги, контакты и подробную форму заявки в настольной и мобильной версиях.
year: "10.2023"
role: Веб-разработка и адаптация шаблона
stack:
  - WordPress
  - Astra Daycare-02
  - Адаптивная компоновка
  - Формы заявок
blocks:
  - type: text
    title: Основа и задача
    body: >-
      Клиент выбрал готовую основу Astra Daycare-02 и разрешил подготовить вариант
      без фотографий. Я адаптировал её под компанию «Поместье», работающую с
      ремонтно-отделочными задачами. Это не разработка уникальной дизайн-системы с
      нуля, а настройка выбранной темы под конкретный бизнес и его сценарий заявки.
  - type: text
    title: Содержание первого экрана и услуги
    body: >-
      В макете собрал фирменный блок с логотипом «Поместье», перечень услуг по
      ремонту комнат, отдельным работам и капитальному или косметическому ремонту,
      а также контакты. Посетитель мог понять профиль компании и перейти к форме,
      не разбираясь в универсальном шаблонном наполнении.
  - type: text
    title: Форма для первичной оценки запроса
    body: >-
      Подготовил поля имени, телефона, примерного объёма работ и описания задачи.
      Такой набор позволяет заказчику сообщить не только способ связи, но и базовый
      контекст объекта и планируемых работ. Скриншоты подтверждают внешний вид полей
      и кнопку отправки; доставка заявки на почту или в CRM отдельно не тестировалась.
  - type: text
    title: Настольная и мобильная версии
    body: >-
      Представил два варианта композиции для согласования. На широком экране услуги
      и контакты расположены рядом с формой; на мобильном логотип, перечень работ и
      контактная часть предшествуют полям заявки. Клиент согласовал направление
      ответом «да, давайте так» и принял заказ. Последняя просьба изменить фон на
      серый и увеличить логотип с текстом не имеет отдельного подтверждения
      завершения в сохранённых материалах.
  - type: image
    title: Исторический настольный вариант
    src: /media/projects/estate-renovation-astra-site/pomesste-historical-desktop.webp
    alt: Настольный макет сайта «Поместье» по теме Astra, контакты скрыты в публичной копии
    caption: Историческое изображение из переписки Kwork. В публичной копии скрыты телефон и email; оригинал сохранён в архиве заказа; дата скриншота не установлена. Макет показывает дизайн формы, не тест её доставки.
  - type: image
    title: Мобильная компоновка сайта
    src: /media/projects/estate-renovation-astra-site/pomesste-historical-mobile.webp
    alt: Мобильный вариант сайта «Поместье» с услугами и формой, контакты скрыты в публичной копии
    caption: Историческое вложение заказа с видимым доменом pomesste.ru. Телефон и email закрыты в публичной копии; адрес страницы и контактные данные не являются целью этого кейса.
  - type: text
    title: Что подтверждено и что осталось за рамками
    body: >-
      Заказ подтверждает адаптацию выбранной темы, настольный и мобильный варианты
      и согласование макета. Текущая доступность pomesste.ru не подтверждена;
      исторические изображения не доказывают, что сайт был опубликован именно в
      таком виде. Отдельный тест отправки формы, окончательная перекраска фона и
      увеличение логотипа после последней просьбы также не подтверждены.
