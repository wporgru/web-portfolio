title: "EcoMeat: free shipping by order value and weight"
tagline: The store already used a minimum order value for free shipping, but an
  expensive lightweight order could qualify without covering courier costs. The
  owner wanted weight considered without raising the minimum for everyone.
year: "12.2023"
role: Web development and automation
stack:
  - WooCommerce
  - Shipping rules
  - Cart weight
  - Checkout
blocks:
  - type: text
    title: Brief and constraints
    body: The store already used a minimum order value for free shipping, but an
      expensive lightweight order could qualify without covering courier costs.
      The owner wanted weight considered without raising the minimum for
      everyone.
  - type: text
    title: How it works
    body: "Confirmed the business rule: free shipping requires both an order value
      of at least RUB 5,000 and weight of at least 10 kg. Increasing the price
      threshold alone would not distinguish heavy orders from light ones.
      Configured the extra condition and handed it over."
  - type: text
    title: Result and verification
    body: The client accepted the work and left positive feedback. The delivery was
      a two-condition rule, not a shipping system rebuild. The implementation
      details, boundary test results and impact on shipping costs were not
      preserved.
