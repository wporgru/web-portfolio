title: "ЭкоМясо: бесплатная доставка по сумме и весу"
tagline: У магазина уже действовал порог суммы для бесплатной доставки. Но
  дорогой лёгкий заказ мог пройти этот порог и не покрыть стоимость курьера.
  Владельцу нужно было учитывать ещё и вес, не поднимая порог для всех клиентов.
year: "12.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Shipping rules
  - Cart weight
  - Checkout
blocks:
  - type: text
    title: Задача и ограничения
    body: У магазина уже действовал порог суммы для бесплатной доставки. Но дорогой
      лёгкий заказ мог пройти этот порог и не покрыть стоимость курьера.
      Владельцу нужно было учитывать ещё и вес, не поднимая порог для всех
      клиентов.
  - type: text
    title: Как устроено решение
    body: "Уточнил коммерческое правило: бесплатная доставка доступна только при
      сумме от 5 000 ₽ и весе от 10 кг одновременно. Простое повышение суммы не
      решало задачу, так как не отличало тяжёлый заказ от лёгкого. Настроил
      дополнительное условие и передал результат заказчику."
  - type: text
    title: Результат и проверка
    body: Клиент принял работу и оставил положительный отзыв. Результат — правило
      для двух независимых условий, а не переделка системы доставки. Подробный
      протокол тестов на границах, точная реализация и влияние на расходы не
      сохранились.
