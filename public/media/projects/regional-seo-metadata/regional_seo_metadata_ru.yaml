title: Уникализация метаданных каталога и региональной сети
tagline: Магазин с региональными поддоменами получал повторяющиеся заголовки и
  описания. Требовалось отделить сбои шаблонов от дублей самих товаров и статей,
  чтобы не исправлять разные проблемы одним способом.
year: "03.2026"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Rank Math
  - Screaming Frog
  - Technical SEO
blocks:
  - type: text
    title: Задача и ограничения
    body: Магазин с региональными поддоменами получал повторяющиеся заголовки и
      описания. Требовалось отделить сбои шаблонов от дублей самих товаров и
      статей, чтобы не исправлять разные проблемы одним способом.
  - type: text
    title: Как устроено решение
    body: Разобрал категории, фильтры, товары и записи. Проверил, когда применяются
      шаблоны Rank Math, а когда их переопределяют вручную заполненные поля.
      После правок запустил повторный обход в Screaming Frog. Собрал оставшиеся
      совпадения, отдельно выделив копии товаров с суффиксом -2 и повторяющийся
      блог на поддоменах.
  - type: text
    title: Результат и проверка
    body: Заказчик сообщил, что проверил работу. Получил исправление шаблонных
      дублей и список URL, где требуется редакционное решение. Удаление копий и
      рост позиций в этот этап не входят.
