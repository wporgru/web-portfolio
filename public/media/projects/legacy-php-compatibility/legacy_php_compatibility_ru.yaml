title: Адаптация RT-Theme 19 и её расширения к PHP 8.5
tagline: После смены версии PHP у сайта на RT-Theme 19 возникли ошибки не только
  на витрине, но и в админке. Задача — сохранить действующий дизайн и
  восстановить рабочие экраны, не затевая смену темы.
year: "07.2026"
role: Веб-разработка и автоматизация
stack:
  - PHP
  - WordPress
  - Legacy code
blocks:
  - type: text
    title: Задача и ограничения
    body: После смены версии PHP у сайта на RT-Theme 19 возникли ошибки не только на
      витрине, но и в админке. Задача — сохранить действующий дизайн и
      восстановить рабочие экраны, не затевая смену темы.
  - type: text
    title: Как устроено решение
    body: Диагностировал несовместимости в двух связанных компонентах и изменил пять
      файлов темы и три файла её расширения. Правки охватили функции темы,
      подключение стилей, метабоксы, шорткоды и вывод отзывов. После исправлений
      проверил главную, страницу отзывов, редактор и настройщик внешнего вида.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил корректный вид и принял работу. Критические ошибки на
      проверенных экранах устранены по отчёту; некритичные предупреждения старых
      компонентов оставлены отдельно.
