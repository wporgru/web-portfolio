title: HTML-подпись и помощь с установкой в Outlook 2010
tagline: Сверстал редактируемую подпись по образцу и помог клиенту установить её
  в Outlook 2010, когда скрытая папка AppData мешала найти каталог подписей.
year: "11.2021"
role: Вёрстка почтовых интерфейсов
stack:
  - HTML
  - CSS
  - Outlook
blocks:
  - type: text
    title: Доработал оформление
    body: Собрал подпись с готовым логотипом и редактируемым текстом. Убрал рамку,
      уточнил цвет и длину разделителя, межстрочное расстояние и отступы.
  - type: text
    title: Помог с установкой
    body: Передал архив и инструкции по Microsoft Signatures. Когда установка в
      Outlook 2010 застопорилась, объяснил, как найти скрытую AppData и
      подставить имя текущего пользователя Windows вместо примера в пути.
  - type: text
    title: Приёмка
    body: Клиент подтвердил результат и принял заказ. Второй логотип относился к
      отдельному этапу; массовое внедрение и совместимость с другими почтовыми
      клиентами не проверялись.
