title: "Деловые Линии: диагностика доставки и корзины"
tagline: Разобрал, почему подключённая доставка не работала в привычном сценарии
  покупки. Проблему нужно было искать не только в тарифах, но и в том, как
  магазин выводил корзину.
year: "08.2022"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Shipping
  - Checkout
  - Plugin compatibility
blocks:
  - type: text
    title: Задача и ограничения
    body: Разобрал, почему подключённая доставка не работала в привычном сценарии
      покупки. Проблему нужно было искать не только в тарифах, но и в том, как
      магазин выводил корзину.
  - type: text
    title: Как устроено решение
    body: Выявил несовместимость с блочной корзиной и переключил магазин на обычную
      корзину WooCommerce. Клиент подтвердил, что новый вариант корректно
      отображается. Отдельно разобрал ошибки адресов, терминал отправления в
      Санкт-Петербурге и необходимость местных способов доставки для отдельных
      заказов.
  - type: text
    title: Результат и проверка
    body: Клиент принял этап диагностики и настроек. После последующих изменений
      полный повторный прогон заказа не состоялся; подключение банковской оплаты
      клиент выполнял сам.
