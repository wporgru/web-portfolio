title: Оплата билетов на конгресс через WooCommerce
tagline: Организатору конгресса нужен был быстрый путь от страницы мероприятия к
  покупке одного из трёх пакетов. Покупатель должен был выбрать количество
  билетов, а промокод — уменьшать цену базового пакета.
year: "03.2025"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - YooKassa
  - Event tickets
  - Coupons
blocks:
  - type: text
    title: Задача и ограничения
    body: Организатору конгресса нужен был быстрый путь от страницы мероприятия к
      покупке одного из трёх пакетов. Покупатель должен был выбрать количество
      билетов, а промокод — уменьшать цену базового пакета.
  - type: text
    title: Как устроено решение
    body: Подготовил кнопки пакетов и передал страницу на проверку. После неуспешной
      попытки с недействительной картой отчитался о контрольной оплате на 5 ₽ с
      временной ценой и тестовой скидкой. Передал чек и попросил сверить письмо
      и операцию в кабинете ЮKassa. Подключение платёжного модуля было отдельным
      этапом.
  - type: text
    title: Результат и проверка
    body: Клиент принял работу. Сумма 5 ₽ относится только к контрольной операции по
      отчёту, не к цене билета. Независимая сверка чека, восстановление цены и
      возврат тестовой суммы архивом не подтверждены.
