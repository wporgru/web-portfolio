title: Разные ставки НДС для товаров и доставки WooCommerce
tagline: Заказчику требовалось, чтобы стоимость товара и доставки правильно
  раскладывалась по налоговым ставкам при оформлении и передаче в платёжный
  сервис.
year: "01.2026"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - YooKassa
  - CDEK
blocks:
  - type: text
    title: Задача и ограничения
    body: Заказчику требовалось, чтобы стоимость товара и доставки правильно
      раскладывалась по налоговым ставкам при оформлении и передаче в платёжный
      сервис.
  - type: text
    title: Как устроено решение
    body: Проверил налоговые классы товаров и перенастроил общие расчёты. Разделил
      суммы для товара и доставки, применил согласованную ставку к платным
      методам СДЭК, не включая бесплатные. Обновил модуль доставки после ошибки
      оформления и восстановил переход к ЮKassa. Проблемный способ отправления
      вынес из рабочего сценария.
  - type: text
    title: Результат и проверка
    body: Заказчик сообщил об успешном чеке и возврате и принял заказ. Это
      подтверждение конкретного сценария, а не независимая проверка ОФД или всех
      комбинаций корзины.
