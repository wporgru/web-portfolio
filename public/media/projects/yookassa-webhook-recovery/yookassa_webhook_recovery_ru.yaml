title: Восстановление уведомлений об оплате ЮKassa
tagline: Восстановил связь существующего магазина с ЮKassa, когда статус оплаты
  и почтовое уведомление не отрабатывали как ожидается.
year: "10.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - YooKassa
  - Webhooks
  - Transactional email
blocks:
  - type: text
    title: Задача и ограничения
    body: Восстановил связь существующего магазина с ЮKassa, когда статус оплаты и
      почтовое уведомление не отрабатывали как ожидается.
  - type: text
    title: Как устроено решение
    body: Исправил неверную ссылку настроек и помог передать проблему в поддержку.
      По ответу поддержки выяснилось, что не была подключена подписка на
      вебхуки. После дальнейшей настройки проверил сценарий контрольной оплатой
      и попросил клиента сверить письмо.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил получение письма и принял результат. Это восстановление
      существующей связки, а не новый эквайринг с нуля.
