title: "ЮKassa + WooCommerce: восстановление статусов и писем об оплате"
tagline: "Нашёл, почему успешная оплата не завершала заказ в WooCommerce, и
  восстановил передачу событий в существующей связке магазина с ЮKassa."
year: "10.2023"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - YooKassa
  - Webhooks
  - Transactional email
blocks:
  - type: text
    title: Когда оплата прошла, а магазин её не увидел
    body: "В октябре 2023 года владелец sushi-panda15.ru столкнулся с разрывом
      между платёжной стороной и магазином. Деньги у ЮKassa проходили, но заказ
      в WooCommerce оставался в ожидании оплаты, а ожидаемое письмо покупателю
      не приходило. Для интернет-магазина это критичный участок: покупатель уже
      заплатил, но не получает подтверждения, а команда не видит корректный
      статус заказа. Требовалось восстановить существующую интеграцию, не
      подменяя работу заявлением о создании эквайринга с нуля."
  - type: text
    title: Диагностика цепочки событий
    body: "Начал с проверки доступных настроек и обнаружил неверную ссылку,
      которая затрудняла переход к параметрам платёжного шлюза. Исправил её и
      помог клиенту сформулировать обращение в поддержку ЮKassa, чтобы получить
      ответ по серверной регистрации уведомлений. Поддержка сообщила, что для
      магазина не была подключена подписка на вебхуки. Именно этот канал должен
      передавать событие об оплате обратно в WooCommerce: без него платёжный
      провайдер может завершить транзакцию, а заказ на сайте — не сменить
      состояние. После дальнейшей настройки я сообщил о контрольной оплате и
      попросил клиента проверить, пришло ли письмо с подтверждением. Точные
      шаги повторной авторизации и изменения конфигурации плагина в архиве не
      сохранились, поэтому технический сценарий здесь описан только в пределах
      подтверждённой переписки."
  - type: text
    title: Результат, подтверждение и ограничения
    body: "Клиент подтвердил получение уведомления, после контрольной оплаты
      магазин отправил письмо, а заказчик принял работу. Кейс показывает
      восстановление критичного сценария «оплата → событие вебхука → статус
      заказа → email» в уже подключённой связке. В архиве нет повторного
      независимого теста, выполненного сейчас, скриншотов точной конфигурации
      вебхуков или полного регрессионного прогона способов оплаты. Поэтому не
      заявляю новую интеграцию с нуля, безошибочную работу всех методов оплаты
      или гарантию доставки каждого письма."
    links:
      - label: Исходный заказ на Kwork
        url: https://kwork.ru/track?id=39057157
  - type: text
    title: Что проверять при сбое статуса оплаты
    body: "Если провайдер показывает успешную транзакцию, а WooCommerce продолжает
      ждать оплату, нужно проверять не только настройки письма. Важно проследить
      обратную цепочку уведомлений: зарегистрирован ли URL/тип события на стороне
      платёжного сервиса, получает ли сайт уведомление, обновляется ли статус
      заказа и запускается ли письмо. В этом проекте ответ поддержки указал на
      отсутствующую подписку вебхуков; это было конкретное объяснение сбоя,
      найденное для данного магазина, а не универсальный диагноз для любого
      отказа оплаты."
