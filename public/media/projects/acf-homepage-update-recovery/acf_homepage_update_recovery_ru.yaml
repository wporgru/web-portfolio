title: Восстановление главной WordPress с контентом ACF
tagline: Восстановил содержимое главной после обновления и помог вернуть доступ
  в админку, не пересобирая страницу с нуля.
year: "04.2024"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - ACF
  - Hosting
  - Incident recovery
blocks:
  - type: text
    title: Задача и ограничения
    body: Восстановил содержимое главной после обновления и помог вернуть доступ в
      админку, не пересобирая страницу с нуля.
  - type: text
    title: Как устроено решение
    body: "Определил, что содержимое хранится в полях ACF, и проверил
      несогласованность версий после обновления. После возврата контента
      продолжил разбор замечаний клиента: браузеры показывали страницу
      по-разному, а запрос обновления базы сопровождался проблемой входа.
      Показал, где находятся резервные копии у хостинга."
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил возвращение контента и доступ в админку, затем принял
      работу. Точная первопричина и полная браузерная регрессия архивом не
      подтверждены.
