title: Restoring a WordPress homepage backed by ACF
tagline: Restored homepage content after an update and helped recover admin
  access without rebuilding the page from scratch.
year: "04.2024"
role: Web development and automation
stack:
  - WordPress
  - ACF
  - Hosting
  - Incident recovery
blocks:
  - type: text
    title: Brief and constraints
    body: Restored homepage content after an update and helped recover admin access
      without rebuilding the page from scratch.
  - type: text
    title: How it works
    body: Identified ACF as the content storage layer and investigated version
      mismatches after the update. After the content returned, followed up on
      inconsistent browser rendering and a login issue after the database
      upgrade prompt. Showed the client where to find hosting backups.
  - type: text
    title: Result and verification
    body: The client confirmed the content and admin access were back, then accepted
      the work. The archive does not establish the root cause or a complete
      cross-browser regression test.
