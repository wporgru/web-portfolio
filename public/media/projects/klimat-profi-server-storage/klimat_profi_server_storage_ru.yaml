title: "Климат Профи: освобождение места на сервере"
tagline: На VPS магазина оставалось 8,3 ГБ свободного места. Нужно было вернуть
  запас для резервных копий и обслуживания магазина, при этом не удаляя
  изображения, которые используются в каталоге, шаблонах и на страницах услуг.
year: "11.2026"
role: Веб-разработка и автоматизация
stack:
  - Linux
  - WooCommerce
  - Python
  - Media optimization
  - VPS
blocks:
  - type: text
    title: Задача и ограничения
    body: На VPS магазина оставалось 8,3 ГБ свободного места. Нужно было вернуть
      запас для резервных копий и обслуживания магазина, при этом не удаляя
      изображения, которые используются в каталоге, шаблонах и на страницах
      услуг.
  - type: text
    title: Как устроено решение
    body: "Разделил работы на этапы. Вначале расчистил журналы, старые архивы и
      временные XML-файлы импорта. Затем обработал тяжёлые оригиналы фотографий
      отдельным скриптом. После настройки копирования провёл аудит зависимостей
      медиатеки: учёл служебные каталоги, логотипы, иконки и ресурсы
      конструктора. По отчёту удалил непривязанные файлы и записи вложений,
      оптимизировал затронутые таблицы и повторно проверил публичные страницы и
      их медиафайлы."
  - type: text
    title: Результат и проверка
    body: В отчёте первого этапа свободное место выросло с 8,3 до 83 ГБ. После
      отдельной очистки медиа проверка зафиксировала HTTP 200 у 17 страниц и 882
      медиафайлов; даже с полным бэкапом на диске оставалось 79 ГБ. Это
      результаты проверки доступности и места на диске, а не замер PageSpeed или
      визуальная проверка каждой карточки.
