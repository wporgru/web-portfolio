title: Импорт мебели и очистка атрибутов Eclect
tagline: Подготовил мебельный каталог к импорту. Одинаковые названия затрудняли
  различение позиций, а после загрузки требовалось привести характеристики к
  единому виду.
year: "02.2019"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Catalog import
  - Taxonomy
  - Product attributes
blocks:
  - type: text
    title: Задача и ограничения
    body: Подготовил мебельный каталог к импорту. Одинаковые названия затрудняли
      различение позиций, а после загрузки требовалось привести характеристики к
      единому виду.
  - type: text
    title: Как устроено решение
    body: "Собрал таблицу и разобрал совпадающие названия банкеток, используя бренд
      и артикул как отличительные признаки. По замечаниям заказчика после
      загрузки поправил дубли коллекций и стран и заполнил проблемные значения
      цвета каркаса. Вопрос возможного изменения URL коллекции оставил отдельно:
      надёжного подтверждения его закрытия нет."
  - type: text
    title: Результат и проверка
    body: Клиент принял заказ. Это импорт и доводка данных, а не доказательство, что
      все атрибуты и URL были проверены по всему каталогу.
