title: "GeekChoice: фильтры и сравнение электроники"
tagline: Упростить подбор устройств по характеристикам и доработать отображение
  цен и сравнения.
role: Веб-разработка
year: "09.2025"
stack:
  - WooCommerce
  - Blocksy
blocks:
  - type: text
    title: Задача
    body: Упростить подбор устройств по характеристикам и доработать отображение цен
      и сравнения.
  - type: text
    title: Что сделано
    body: Настроил числовые фильтры для памяти, аккумулятора, камер, зарядки и
      диагонали. Доработал карточки и экран сравнения, включая типографику,
      характеристики и отступы.
  - type: text
    title: Как решалась задача
    body: "Характеристики электроники требовали диапазонов, а не длинных списков
      отдельных значений. Добавил ползунки в стиле ценового фильтра и доработал
      подачу цены и условий оплаты. Экран сравнения менял итеративно: адаптация
      на два устройства, типографика и расстояния. Верхнюю цену в рамках
      согласованного этапа убрать не удалось, о чём сообщил клиенту."
  - type: image
    title: Публичный вид сайта
    src: /media/projects/geekchoice/site.png
    alt: Публичная версия сайта проекта
    caption: Снимок на дату проверки. Он показывает публичную версию сайта, а не
      обязательно вид на момент сдачи.
