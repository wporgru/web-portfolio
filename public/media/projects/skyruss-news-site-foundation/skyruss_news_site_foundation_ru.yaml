title: "Skyruss: переход с Bitrix24 на WordPress для новостного сайта"
tagline: Установил WordPress и Cream Magazine на домен Skyruss вместо прежнего
  сайта на Bitrix24, подготовив CMS-основу для последующей публикации новостей.
year: "12.2022"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Cream Magazine
  - News publishing
blocks:
  - type: text
    title: Задача и ограничения
    body: На домене skyruss.ru вместо сайта на Bitrix24 требовалось развернуть
      WordPress и бесплатную тему Cream Magazine. Цель этого этапа — установить
      подходящую основу для новостного формата; перенос архивных публикаций и
      настройка полного редакционного процесса в заказ не входили.
  - type: text
    title: Как устроено решение
    body: Согласовал CMS и тему, установил WordPress с Cream Magazine и передал
      результат заказчице. В сохранённом архиве нет безопасного полного списка
      конфигурации установки, поэтому кейс ограничен подтверждёнными действиями
      по развёртыванию CMS и темы.
  - type: text
    title: Результат и проверка
    body: "Заказчица приняла заказ и оставила отзыв «Заказ выполнен и очень
      быстро!». Перенос материалов из Bitrix24 и полноценная настройка
      редакционного портала не подтверждены. При проверке 25.10.2026 домен не
      разрешился в DNS текущей сети; это не доказывает постоянное отключение и
      не относится к историческому результату установки."
    links:
      - label: Открыть исходный заказ на Kwork
        url: https://kwork.ru/track?id=32272747
