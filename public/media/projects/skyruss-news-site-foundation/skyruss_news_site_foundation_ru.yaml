title: Новостная основа Skyruss на Cream Magazine
tagline: Установил основу новостного сайта на WordPress, чтобы заказчица могла
  продолжить публикацию в подходящей для медиа теме.
year: "12.2022"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Cream Magazine
  - News publishing
blocks:
  - type: text
    title: Задача и ограничения
    body: Установил основу новостного сайта на WordPress, чтобы заказчица могла
      продолжить публикацию в подходящей для медиа теме.
  - type: text
    title: Как устроено решение
    body: "Уточнил выбор CMS и темы, развернул WordPress с Cream Magazine и передал
      результат. Установка была самостоятельным этапом: перенос прежнего
      контента и построение всего редакционного процесса не включал в сдачу."
  - type: text
    title: Результат и проверка
    body: Заказчица приняла установку и оставила положительный отзыв. Полный перенос
      материалов из прежней системы не подтверждён.
