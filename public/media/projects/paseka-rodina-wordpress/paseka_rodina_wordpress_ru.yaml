title: "«Пасека Родина»: WordPress-сайт и передача управления"
tagline: Дать владельцу пасеки основу сайта о хозяйстве и продукции, которую
  можно самостоятельно наполнять фотографиями и публикациями.
role: Веб-разработка
year: "01.2018"
stack:
  - WordPress
  - Website handover
  - Responsive design
blocks:
  - type: text
    title: Задача
    body: Дать владельцу пасеки основу сайта о хозяйстве и продукции, которую можно
      самостоятельно наполнять фотографиями и публикациями.
  - type: text
    title: Что сделано
    body: Помог с доменом и размещением, согласовал структуру, настроил тему,
      доработал мобильную шапку и передал владельцу управление сайтом.
  - type: text
    title: Как решалась задача
    body: "Разделил информацию о хозяйстве, пчелопродукции, чае и травах и
      контактах, чтобы владелец мог наполнять эти направления постепенно. По
      обратной связи уменьшил надпись в шапке на мобильном и объяснил, как
      готовить фото 800 × 600; галерею отложили до появления материалов. Заказ
      принят. Позднейшие тексты и фотографии не приписываю себе: снимок октября
      2026 года иллюстрирует другую по времени версию. Настройка оплаты и
      окончательный выбор темы архивом не подтверждены."
  - type: image
    title: Публичный вид сайта
    src: /media/projects/paseka-rodina-wordpress/site.png
    alt: Публичная версия сайта проекта
    caption: Снимок на дату проверки. Он показывает публичную версию сайта, а не
      обязательно вид на момент сдачи.
