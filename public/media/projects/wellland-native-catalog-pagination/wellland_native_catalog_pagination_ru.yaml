title: "Wellland: мобильная пагинация каталога WooCommerce"
tagline: Освежил навигацию по страницам каталога, не заменяя штатную пагинацию
  собственным скриптом. На узком экране должны были оставаться заметны текущая
  страница и переход дальше, а кнопки — быть удобными для нажатия пальцем.
year: "10.2026"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - CSS
  - Responsive design
  - Pagination
  - Playwright
blocks:
  - type: text
    title: Задача и ограничения
    body: Освежил навигацию по страницам каталога, не заменяя штатную пагинацию
      собственным скриптом. На узком экране должны были оставаться заметны
      текущая страница и переход дальше, а кнопки — быть удобными для нажатия
      пальцем.
  - type: text
    title: Как устроено решение
    body: "Ограничил CSS архивом WooCommerce: сохранил нативные ссылки и состояния,
      оформил текущую страницу, стрелку, наведение и клавиатурный фокус. Задал
      высоту элементов не менее 44 px и адаптивные промежутки, чтобы сохранялась
      компактность. Логику выборки товаров, генерацию ссылок и базу не менял."
  - type: text
    title: Результат и проверка
    body: "Сверил размеры элементов и отсутствие горизонтального переполнения на
      1440, 390 и 320 px. Перешёл на вторую страницу: активным стал номер 2,
      каталог показал 16 карточек. Кейс фиксирует проверку интерфейса, не
      изменение позиций или конверсии."
  - type: image
    src: /media/projects/wellland-native-catalog-pagination/pagination-control.webp
    alt: Штатная пагинация WooCommerce на мобильном Wellland
    caption: Архивный снимок элемента интерфейса при ширине окна 390 px, 29 октября
      2026 года. Это не снимок всей страницы или текущей версии.
