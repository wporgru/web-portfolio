title: "DME Tech: восстановление карточек и корзины"
tagline: В действующем магазине цифровых файлов страницы товаров не открывались,
  а добавить позиции в корзину не получалось. Требовалось восстановить
  покупательский путь, не пересобирая магазин и не заменяя систему оплаты.
year: "01.2022"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - WooCommerce
  - Plugin conflict
  - Cart
blocks:
  - type: text
    title: Задача и ограничения
    body: В действующем магазине цифровых файлов страницы товаров не открывались, а
      добавить позиции в корзину не получалось. Требовалось восстановить
      покупательский путь, не пересобирая магазин и не заменяя систему оплаты.
  - type: text
    title: Как устроено решение
    body: Отделил сбой от оформления заказа и локализовал его до компонента защиты
      контента и правой кнопки мыши. После его отключения карточки снова
      открывались, а товар можно было добавить в корзину. Не выдаю предположение
      об обновлении плагина за установленную первопричину.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил восстановление и принял заказ с положительным отзывом.
      Проверки охватывали открытие товара и добавление в корзину; оплату и
      выдачу файла в этом этапе не проверяли.
  - type: text
    title: Другой этап этого проекта
    links:
      - label: "Ранний этап: настройка оплаты и выдачи файлов"
