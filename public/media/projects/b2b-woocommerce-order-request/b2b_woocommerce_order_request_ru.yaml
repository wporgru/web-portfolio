title: Оформление B2B-заявок через корзину WooCommerce
tagline: Упростил оформление для частных и корпоративных покупателей. Вместо
  обязательной онлайн-оплаты заказ передавался менеджеру на согласование.
year: "01.2020"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - B2B checkout
  - Shipping
  - Form fields
blocks:
  - type: text
    title: Задача и ограничения
    body: Упростил оформление для частных и корпоративных покупателей. Вместо
      обязательной онлайн-оплаты заказ передавался менеджеру на согласование.
  - type: text
    title: Как устроено решение
    body: Перевёл корзину из записи в отдельную страницу, настроил получение и
      проверил тестовый заказ. Сократил подписи и выровнял поля имени и ИНН,
      добавил страну для сценария доставки с геоопределением. Проверял
      оформление на телефоне и компьютере; дополнительное обновление WordPress
      оставил за рамками из-за серверного PHP.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил вид и принял работу. Тестовый заказ не был реальной
      оплатой или отгрузкой; автоматические счета и обмен с 1С не внедрялись.
