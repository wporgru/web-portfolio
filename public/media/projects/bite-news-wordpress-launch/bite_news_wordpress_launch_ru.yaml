title: "Bite News: запуск тёмного новостного сайта"
tagline: >-
  Развернул тёмный новостной сайт на Astra, Gutenberg и Spectra, настроил делегирование домена и передал инструкции по публикации и оформлению.
year: "05.2023"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Astra
  - Gutenberg
  - Spectra
  - DNS
blocks:
  - type: text
    title: От WordPress.com к сайту на своём хостинге
    body: >-
      Редакции нужна была тёмная новостная площадка, где можно самостоятельно выпускать материалы. Newspaper и TagDiv обсуждались, но для реализации согласовали Astra, Gutenberg и Spectra.
  - type: text
    title: Домен, оформление и демонстрационные записи
    body: >-
      Изменил NS на ps.kz и сообщил заказчику, что сайт открылся. Настроил тёмное оформление и записи, добавил тестовые материалы для дальнейшей замены редакцией.
  - type: text
    title: Передал инструкции редакции
    body: >-
      Объяснил, как публиковать записи и менять шапку, блог, подвал и стили. Клиент принял работу и оставил положительный отзыв.
  - type: text
    title: Что включала сдача
    body: >-
      Сдали рабочую основу для публикаций, а не полный перенос или перевод прежнего редакционного архива. Открытие индексации оставили до подготовки контента. Историческое изображение показывает первый экран, а не современную версию домена.
  - type: image
    src: /media/projects/bite-news-wordpress-launch/historical-first-screen.webp
    alt: Тёмный первый экран Bite News
    caption: Первый экран из исторической карточки Kwork. Это не снимок всего сайта.
