title: "Bite News: запуск тёмного новостного сайта"
tagline: Развернул основу новостного сайта после WordPress.com, чтобы редакция
  могла публиковать материалы и управлять оформлением на своём хостинге.
year: "05.2023"
role: Веб-разработка и автоматизация
stack:
  - WordPress
  - Astra
  - Gutenberg
  - Spectra
  - DNS
blocks:
  - type: text
    title: Задача и ограничения
    body: Развернул основу новостного сайта после WordPress.com, чтобы редакция
      могла публиковать материалы и управлять оформлением на своём хостинге.
  - type: text
    title: Как устроено решение
    body: Вместо Newspaper и TagDiv согласовали Astra, Gutenberg и Spectra.
      Перенастроил делегирование домена, установил тёмное оформление, подготовил
      записи и демонстрационные материалы. Передал инструкции по публикации,
      редактированию шапки, блога, подвала и стилей.
  - type: text
    title: Результат и проверка
    body: Клиент принял основу сайта. Тестовые записи не выдаю за перенос полного
      редакционного архива; открытие индексации оставили до подготовки контента.
  - type: image
    src: /media/projects/bite-news-wordpress-launch/historical-first-screen.webp
    alt: Тёмный первый экран Bite News
    caption: Первый экран из исторической карточки Kwork. Это не снимок всего сайта.
