title: "Bite News: launching a dark news website"
tagline: >-
  Launched a dark news site with Astra, Gutenberg and Spectra, updated domain delegation and handed over publishing and styling instructions.
year: "05.2023"
role: Web development and automation
stack:
  - WordPress
  - Astra
  - Gutenberg
  - Spectra
  - DNS
blocks:
  - type: text
    title: From WordPress.com to self-hosting
    body: >-
      The editorial team needed a dark news site where it could publish independently. Newspaper and TagDiv were considered, but Astra, Gutenberg and Spectra were agreed for implementation.
  - type: text
    title: Domain, styling and demo posts
    body: >-
      I changed the nameservers to ps.kz and reported that the site had opened. I configured dark styling and posts and added demo material for the editors to replace.
  - type: text
    title: Handover for editors
    body: >-
      I explained how to publish posts and update the header, blog, footer and styles. The client accepted the work and left positive feedback.
  - type: text
    title: Scope of the handover
    body: >-
      The handover covered a working publishing foundation, not a complete migration or translation of the old archive. Indexing was left until content preparation. The historical image shows the first screen, not the current domain.
  - type: image
    src: /media/projects/bite-news-wordpress-launch/historical-first-screen.webp
    alt: Dark Bite News homepage hero
    caption: Homepage hero from the historical Kwork entry, not a full-page capture.
