title: Восстановление настроек и навигации магазина RamaYoga
tagline: Магазину нужна была готовая структура витрины с коллекциями и
  категориями, но часть настроек темы не срабатывала.
year: "01.2024"
role: Веб-разработка и автоматизация
stack:
  - WooCommerce
  - Storefront
  - Plugin troubleshooting
blocks:
  - type: text
    title: Задача и ограничения
    body: Магазину нужна была готовая структура витрины с коллекциями и категориями,
      но часть настроек темы не срабатывала.
  - type: text
    title: Как устроено решение
    body: Загрузил демонстрационное оформление и адаптировал меню под действующие
      страницы, коллекции, коврики и аксессуары. Показал, где менять баннеры и
      товарные подборки, как скрывать пустые категории и менять их порядок.
      Проверил конфликт настроек и отключил лишние плагины, после чего параметры
      темы снова стали применяться.
  - type: text
    title: Результат и проверка
    body: Клиент подтвердил, что настройки снова работают. Замена логотипа и полное
      пересоздание ассортимента не относятся к результату.
